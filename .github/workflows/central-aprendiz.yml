# Modo aprendiz da Central de Ajuda "Plataforma" (#614).
#
# A cada push no main, compara o registro da plataforma com o de ANTES desse push. Se algo
# relevante mudou — tela nova sem artigo, tela removida, evidência que sumiu (em arquivo
# alterado neste push) ou valor de i18n citado que saiu de vez —, abre UM Pull Request com
# o rascunho. Nada vai ao ar sem o merge desse PR.
#
# Sem filtro de `paths`: ao contrário da trava (que só roda quando o diff toca um caminho
# específico), o aprendiz decide sozinho, no script, se há algo relevante — porque ele
# também precisa reagir a mudança de i18n e de código-fonte citado em evidência, que não
# têm um conjunto fixo de caminhos como o das rotas.
name: Central - modo aprendiz

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      antes:
        description: Commit de ANTES deste push, para comparar o registro
        required: true

jobs:
  rascunho:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # O registro de antes deste push é lido do histórico.
          fetch-depth: 0

      - id: ramo
        name: O ramo deste push já existe no remoto?
        run: |
          curto="${GITHUB_SHA::7}"
          ramo="central/aprendiz-${curto}"
          echo "ramo=$ramo" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$ramo" > /dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - id: pr_do_ramo
        name: Esse ramo já tem PR aberto?
        if: steps.ramo.outputs.existe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numero=$(gh pr list --head "${{ steps.ramo.outputs.ramo }}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$numero" ]; then
            echo "aberto=true" >> "$GITHUB_OUTPUT"
          else
            echo "aberto=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ramo.outputs.existe == 'false'
        uses: pnpm/action-setup@v4
      - if: steps.ramo.outputs.existe == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.ramo.outputs.existe == 'false'
        run: pnpm install --frozen-lockfile

      - id: aprendiz
        name: Comparar o registro e escrever o rascunho
        if: steps.ramo.outputs.existe == 'false'
        run: node scripts/central-de-ajuda/aprendiz.mjs
        env:
          ANTES: ${{ inputs.antes || github.event.before }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CORPO_DO_PR: ${{ runner.temp }}/corpo-do-pr-central.md

      - name: Criar o ramo e abrir o Pull Request do rascunho
        if: steps.ramo.outputs.existe == 'false' && steps.aprendiz.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RAMO: ${{ steps.ramo.outputs.ramo }}
          CORPO_DO_PR: ${{ runner.temp }}/corpo-do-pr-central.md
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$RAMO"
          git add lib/central_de_ajuda docs/central-de-ajuda/mapa-de-artigos.json
          git commit -m "docs(central): rascunho do modo aprendiz para ${GITHUB_SHA::7}"
          git push origin "$RAMO"
          gh pr create --base main --head "$RAMO" \
            --title "Central: rascunho do que mudou na plataforma (${GITHUB_SHA::7})" \
            --body-file "$CORPO_DO_PR"

      # Ramo órfão: já existe (uma execução anterior escreveu e enviou o ramo) mas não tem
      # PR aberto — alguém fechou sem merge, ou o passo de abrir o PR falhou depois do
      # push. O conteúdo do ramo já está certo; só falta o PR.
      - name: Abrir o Pull Request de um ramo órfão
        if: steps.ramo.outputs.existe == 'true' && steps.pr_do_ramo.outputs.aberto == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RAMO: ${{ steps.ramo.outputs.ramo }}
        run: |
          gh pr create --base main --head "$RAMO" \
            --title "Central: rascunho do que mudou na plataforma (${GITHUB_SHA::7})" \
            --body "Rascunho do ramo \`$RAMO\`, aberto de novo automaticamente: o PR anterior deste ramo foi fechado sem merge, ou não chegou a ser criado da primeira vez."
