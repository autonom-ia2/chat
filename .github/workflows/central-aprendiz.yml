# Modo aprendiz da Central de Ajuda "Plataforma" (#614, etapa C).
#
# A cada push no main, compara o registro da plataforma com o do deploy anterior. Se algo
# relevante mudou — tela nova sem artigo, tela removida, valor de i18n trocado ou saído,
# evidência que sumiu ou mudou de linha —, abre UM Pull Request com o rascunho. Nada vai
# ao ar sem o merge desse PR.
#
# Sem filtro de `paths`: ao contrário da trava (que só roda quando o diff toca um caminho
# específico), o aprendiz decide sozinho, no script, se há algo relevante — porque ele
# também precisa reagir a mudança de i18n e de código-fonte citado em evidência, que não
# têm um conjunto fixo de caminhos como o das rotas.
name: Central - modo aprendiz

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      antes:
        description: Commit do deploy anterior, para comparar o registro
        required: true

# Dois pushes seguidos não podem abrir dois rascunhos da mesma mudança.
concurrency:
  group: central-aprendiz
  cancel-in-progress: false

jobs:
  rascunho:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # O registro do deploy anterior é lido do histórico.
          fetch-depth: 0

      - id: ramo
        name: O ramo deste deploy já tem um PR aberto?
        env:
          ANTES: ${{ inputs.antes || github.event.before }}
        run: |
          curto="${GITHUB_SHA::7}"
          ramo="central/aprendiz-${curto}"
          echo "ramo=$ramo" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$ramo" > /dev/null 2>&1; then
            echo "pula=true" >> "$GITHUB_OUTPUT"
            echo "O ramo $ramo já existe no remoto: nada a fazer."
          else
            echo "pula=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ramo.outputs.pula == 'false'
        uses: pnpm/action-setup@v4
      - if: steps.ramo.outputs.pula == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.ramo.outputs.pula == 'false'
        run: pnpm install --frozen-lockfile

      - id: aprendiz
        name: Comparar o registro e escrever o rascunho
        if: steps.ramo.outputs.pula == 'false'
        run: node scripts/central-de-ajuda/aprendiz.mjs
        env:
          ANTES: ${{ inputs.antes || github.event.before }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CORPO_DO_PR: ${{ runner.temp }}/corpo-do-pr-central.md

      - name: Abrir o Pull Request do rascunho
        if: steps.ramo.outputs.pula == 'false' && steps.aprendiz.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RAMO: ${{ steps.ramo.outputs.ramo }}
          CORPO_DO_PR: ${{ runner.temp }}/corpo-do-pr-central.md
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$RAMO"
          git add lib/central_de_ajuda docs/central-de-ajuda/mapa-de-artigos.json
          git commit -m "docs(central): rascunho do modo aprendiz para ${GITHUB_SHA::7}"
          git push origin "$RAMO"
          gh pr create --base main --head "$RAMO" \
            --title "Central: rascunho do que mudou na plataforma (${GITHUB_SHA::7})" \
            --body-file "$CORPO_DO_PR"
