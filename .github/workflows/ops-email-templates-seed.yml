name: Ops - E-mail Template Library Seed

# One-purpose ops tool (#1082): runs the rake email_campaign_templates:seed
# in the web container of the active instance of each selected prod stack via
# SSM (.github/scripts/ops_ssm_rake.sh). Publishes the shared e-mail gallery
# (global templates only) with images pointing at the stack's FRONTEND_URL.
# DRY-RUN by default (reports create/update/retire, writes nothing). mode=apply
# adds APPLY=1 and needs confirm_production=true. Aborts unless the running
# image is expected_sha. Never touches account templates; idempotent.
# Runs only from main, in the production environment, never during a
# blue-green deploy of the same stack. Runbook: docs/runbooks/email-biblioteca-modelos.md

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Which stack(s) to run on.
        required: true
        default: both
        type: choice
        options:
          - both
          - autonomia
          - hub2you
      mode:
        description: dry_run only reports; apply publishes the library.
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - apply
      expected_sha:
        description: Exact deployed application commit (40 chars), not a branch name.
        required: true
        type: string
      confirm_production:
        description: Required (true) for mode=apply.
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  seed:
    name: Seed library ${{ matrix.name }}
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-${{ matrix.name }}-blue-green
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: autonomia
            role_arn: arn:aws:iam::140023375763:role/chatwoot-autonomia-prod-github-actions-deploy
          - name: hub2you
            role_arn: arn:aws:iam::354307071110:role/chatwoot-autonomia-prod-github-actions-deploy
    env:
      AWS_REGION: us-east-1
      AWS_PAGER: ''
      CURRENT_INSTANCE_PARAMETER: /chatwoot/prod/blue-green/current-instance-id
      STACK_INPUT: ${{ inputs.stack }}
    steps:
      - name: Skip when stack not selected
        id: gate
        run: |
          if [ "$STACK_INPUT" = "both" ] || [ "$STACK_INPUT" = "${{ matrix.name }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Stack ${{ matrix.name }} not selected; skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        if: steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run library seed on active instance
        if: steps.gate.outputs.run == 'true'
        env:
          OPS_TASK: email_campaign_templates:seed
          OPS_MODE: ${{ inputs.mode }}
          OPS_CONFIRM: ${{ inputs.confirm_production }}
          OPS_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: .github/scripts/ops_ssm_rake.sh
