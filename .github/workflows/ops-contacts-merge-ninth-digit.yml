name: Ops - Merge Ninth Digit Duplicate Contacts

# One-purpose ops tool (#990): runs the rake contacts:merge_ninth_digit_duplicates
# inside the running web container on the active (current) instance of ONE prod
# stack via SSM, for ONE account.
# DRY-RUN by default (prints pairs, writes nothing). mode=apply adds APPLY=1.
# Keeps the contact WITH the ninth digit; merges via Chatwoot's ContactMergeAction;
# skips ambiguous groups and e-mail/company/shared-campaign conflicts; idempotent.
# Output has ids and counts only. The command is hardcoded; account_id must be
# digits only and travels as an env var, never interpolated into the command.

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Which stack to run on (one at a time — account ids differ per stack).
        required: true
        type: choice
        options:
          - hub2you
          - autonomia
      account_id:
        description: Account id (digits only) inside that stack.
        required: true
        type: number
      mode:
        description: dry_run only reports; apply merges.
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - apply

permissions:
  id-token: write
  contents: read

jobs:
  merge:
    name: Merge on ${{ github.event.inputs.stack }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      CURRENT_INSTANCE_PARAMETER: /chatwoot/prod/blue-green/current-instance-id
      STACK_INPUT: ${{ github.event.inputs.stack }}
      ACCOUNT_ID_INPUT: ${{ github.event.inputs.account_id }}
      MODE_INPUT: ${{ github.event.inputs.mode }}
    steps:
      - name: Validate inputs
        id: inputs
        run: |
          set -euo pipefail

          case "$STACK_INPUT" in
            autonomia) echo "role_arn=arn:aws:iam::140023375763:role/chatwoot-autonomia-prod-github-actions-deploy" >> "$GITHUB_OUTPUT" ;;
            hub2you) echo "role_arn=arn:aws:iam::354307071110:role/chatwoot-autonomia-prod-github-actions-deploy" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::stack must be hub2you or autonomia"; exit 1 ;;
          esac

          case "$ACCOUNT_ID_INPUT" in
            ''|*[!0-9]*) echo "::error::account_id must be digits only"; exit 1 ;;
          esac

          case "$MODE_INPUT" in
            dry_run|apply) ;;
            *) echo "::error::mode must be dry_run or apply"; exit 1 ;;
          esac
          echo "Stack: $STACK_INPUT | account: $ACCOUNT_ID_INPUT | mode: $MODE_INPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.inputs.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run ninth digit merge on active instance
        run: |
          set -euo pipefail

          # ACCOUNT_ID_INPUT was checked as digits only in the previous step.
          if [ "$MODE_INPUT" = "apply" ]; then
            CMD="docker exec -e ACCOUNT_ID=$ACCOUNT_ID_INPUT -e APPLY=1 chatwoot-web bundle exec rails contacts:merge_ninth_digit_duplicates"
          else
            CMD="docker exec -e ACCOUNT_ID=$ACCOUNT_ID_INPUT chatwoot-web bundle exec rails contacts:merge_ninth_digit_duplicates"
          fi

          INSTANCE_ID="$(aws ssm get-parameter \
            --name "$CURRENT_INSTANCE_PARAMETER" \
            --query 'Parameter.Value' --output text)"
          echo "Active instance: $INSTANCE_ID"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name 'AWS-RunShellScript' \
            --comment "Merge ninth digit duplicates ($MODE_INPUT)" \
            --parameters "commands=[$(printf '%s' "$CMD" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')]" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)"
          echo "Status: $STATUS"

          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command did not succeed (status=$STATUS)"
            exit 1
          fi
