# Trava do Guia da Plataforma no Pull Request (issue #535).
#
# PR que cria tela nova sem explicação no porques.md não passa. A IA escreve o
# rascunho de cada bloco num comentário do próprio PR, e a trava libera quando
# uma pessoa põe a explicação no arquivo — ou declara a tela fora do Guia, ou
# dispensa com o rótulo `guia-nao-se-aplica` e o motivo no corpo do PR.
#
# Roda em TODO PR, de propósito. Para a trava barrar de verdade, este check
# precisa ser obrigatório nas regras do `main`; e check obrigatório que não roda
# deixa o PR preso em "aguardando status" para sempre. Então ele sempre roda, e
# responde em segundos quando o PR não mexe em rotas nem no Guia.
name: Guia - trava

on:
  pull_request:
    # `labeled`, `unlabeled` e `edited`: pôr o rótulo de dispensa ou escrever o
    # motivo no corpo do PR tem que reavaliar a trava sem precisar de push.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

# Um push novo no mesmo PR torna a avaliação anterior inútil.
concurrency:
  group: guia-trava-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trava:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # O mapa da base do PR é lido do histórico.
          fetch-depth: 0

      - id: escopo
        name: O PR mexe em rotas ou no Guia?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mexe=false
          while IFS= read -r arquivo; do
            case "$arquivo" in
              app/javascript/dashboard/routes/*|lib/operator_guide/*|app/javascript/dashboard/helper/guideRouteRegistry.js)
                mexe=true ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          echo "mexe=$mexe" >> "$GITHUB_OUTPUT"
          [ "$mexe" = true ] || echo 'O PR não mexe em rotas nem no Guia: nada a conferir.'

      - if: steps.escopo.outputs.mexe == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.escopo.outputs.mexe == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.escopo.outputs.mexe == 'true'
        run: pnpm install --frozen-lockfile

      - name: O mapa do Guia está em dia com o roteador?
        if: steps.escopo.outputs.mexe == 'true'
        run: node scripts/guide-map/check.mjs

      - id: trava
        name: Toda tela nova tem explicação?
        if: steps.escopo.outputs.mexe == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Texto de quem abriu o PR: entra como variável, nunca dentro do script.
          PR_BODY: ${{ github.event.pull_request.body }}
          ROTULOS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          COMENTARIO: ${{ runner.temp }}/comentario-da-trava.md
        run: node scripts/guide-map/trava.mjs

      # O comentário é AJUDA; quem barra é o último passo. Em PR vindo de fork o
      # GitHub não deixa o workflow comentar — sem `continue-on-error`, um PR que
      # a trava decidiu liberar ficaria vermelho por causa do comentário.
      - name: Comentar no PR
        if: steps.trava.outputs.comentario == 'novo' || steps.trava.outputs.comentario == 'resolvido'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMENTARIO: ${{ runner.temp }}/comentario-da-trava.md
          SITUACAO: ${{ steps.trava.outputs.comentario }}
        run: |
          # Só o comentário do PRÓPRIO bot: uma pessoa que cite a marca num
          # comentário dela não pode ter o texto sobrescrito.
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- guia-trava -->"))) | .id' \
               | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$COMENTARIO" > /dev/null
          elif [ "$SITUACAO" = novo ]; then
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$COMENTARIO" > /dev/null
          fi

      - name: Barrar o merge
        if: steps.trava.outputs.bloqueia == 'true'
        run: |
          echo 'Tela nova sem explicação no Guia. O que fazer está no comentário deste PR.'
          exit 1

  # Trava da Central de Ajuda "Plataforma" (#614). Roda `central:check`
  # (scripts/central-de-ajuda/conferir.mjs) contra o PR: se falhar, barra o merge e
  # comenta o que fazer — escrever o artigo que falta, ou declarar a tela fora do produto
  # em `mapa.fora`. Sem dispensa por rótulo: rótulo sem motivo escrito não deixa rastro de
  # por que a tela ficou fora. Job separado do `trava` acima: não mexe nele, e os dois
  # sempre rodam, pelo mesmo motivo do comentário no topo deste arquivo (check obrigatório
  # não pode ficar esperando um `if` de PR que nunca dispara o job).
  central:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # O registro da base do PR é lido do histórico.
          fetch-depth: 0

      - id: escopo
        name: O PR mexe na Central, no mapa dela ou nas rotas?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mexe=false
          while IFS= read -r arquivo; do
            case "$arquivo" in
              app/javascript/dashboard/routes/*|app/javascript/dashboard/helper/guideRouteRegistry.js|lib/central_de_ajuda/*|docs/central-de-ajuda/mapa-de-artigos.json)
                mexe=true ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          echo "mexe=$mexe" >> "$GITHUB_OUTPUT"
          [ "$mexe" = true ] || echo 'O PR não mexe na Central nem nas rotas: nada a conferir.'

      - if: steps.escopo.outputs.mexe == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.escopo.outputs.mexe == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.escopo.outputs.mexe == 'true'
        run: pnpm install --frozen-lockfile

      - id: central
        name: A Central está em dia com o Guia? (central:check)
        if: steps.escopo.outputs.mexe == 'true'
        env:
          COMENTARIO: ${{ runner.temp }}/comentario-da-trava-central.md
        run: node scripts/central-de-ajuda/trava.mjs

      # Mesma razão do job do Guia: o comentário é ajuda, quem barra é o último passo.
      - name: Comentar no PR
        if: steps.central.outputs.comentario == 'novo' || steps.central.outputs.comentario == 'resolvido'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMENTARIO: ${{ runner.temp }}/comentario-da-trava-central.md
          SITUACAO: ${{ steps.central.outputs.comentario }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- central-trava -->"))) | .id' \
               | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$COMENTARIO" > /dev/null
          elif [ "$SITUACAO" = novo ]; then
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$COMENTARIO" > /dev/null
          fi

      - name: Barrar o merge
        if: steps.central.outputs.bloqueia == 'true'
        run: |
          echo 'A Central de Ajuda está fora de dia. O que fazer está no comentário deste PR.'
          exit 1
