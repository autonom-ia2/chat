name: Deploy Autonomia Chatwoot Blue Green

on:
  # Deploy automatico em push na main religado apos as duas stacks chegarem a
  # 4.17.1 (Refs #274). Um merge que so toca workflow ou docs nao dispara deploy,
  # para nao consumir a janela de rollback (a instancia N-2 e terminada 5 min
  # apos cada deploy). Excecao: o conteudo do Guia da Plataforma e da trilha de
  # onboarding e lido em runtime, entao .md dessas pastas dispara deploy (#486).
  # Os padroes sao avaliados em ordem; o ultimo que casa decide. '.*' e '.*/**'
  # garantem arquivos e pastas com ponto na raiz (a doc nao garante que '**' os pegue).
  # Politica documentada em docs/production-deploy-gates.md.
  push:
    branches:
      - main
    paths:
      - '**'
      - '.*'
      - '.*/**'
      - '!.github/**'
      - '!docs/**'
      - '!*.md'
      - '!**/*.md'
      # #995: fontes exclusivas do manager VPS e seus testes têm publicação própria.
      # Publisher Ruby, wrappers SSH e módulos compartilhados continuam disparando AWS.
      - '!scripts/instagram_testers/session-manager.mjs'
      - '!scripts/instagram_testers/browser-operations.mjs'
      # #1180: ferramenta de release da VPS; roda só no Mac do operador, nunca na imagem AWS.
      - '!scripts/instagram_testers/runtime/vps/release/**'
      - '!tests/instagram_testers/**'
      - '!tests/qa/instagram-automation/**'
      # .md que o app lê em produção (manuais dos agentes, por exemplo
      # app/services/autonomia/insurance/quote_agent/instrucoes/) disparam deploy (docs/processo-de-release.md).
      - 'app/**/*.md'
      - 'lib/operator_guide/**'
      - 'lib/central_de_ajuda/**'
      - 'config/onboarding/**'
  workflow_dispatch:
    inputs:
      action:
        description: Deploy a new green instance or roll back to the previous target group.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      green_instance_type:
        description: EC2 instance type for the new green instance.
        required: false
        # t3.medium (4 GB) desde 04/10 (#978): no t3.small, web + worker deixavam ~95 MB livres e um pico derrubou o web.
        default: t3.medium
        type: string
      confirm_production:
        description: Confirm that this operation may change production.
        required: true
        default: false
        type: boolean
      descongelar:
        description: Deploy manual que solta a produção congelada por um rollback, depois de subir (#1979).
        required: false
        default: false
        type: boolean
      blue_sha:
        description: Deploy - SHA completo do commit da blue, só quando a tag Name não diz (anterior ao que sobe). Não pula a conferência do schema (#2024).
        required: false
        default: ''
        type: string
      esperado_sha:
        description: Rollback - SHA (7+ caracteres) do commit que estava no ar antes do deploy a desfazer.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: '140023375763'
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::140023375763:role/chatwoot-autonomia-prod-github-actions-deploy
  ALB_NAME: chatwoot-autonomia-prod-ec2
  DOMAIN_NAME: agents.autonomia.site
  EC2_ALB_DNS_NAME: chatwoot-autonomia-prod-ec2-1353010243.us-east-1.elb.amazonaws.com
  ECR_REPOSITORY: chatwoot-autonomia-prod
  ENV_PARAMETER: /chatwoot/prod/env
  RUNTIME_IMAGE_PARAMETER: /chatwoot/prod/runtime-image
  STABLE_IMAGE_TAG: autonomia-custom-image-port-ee
  PREVIOUS_TG_PARAMETER: /chatwoot/prod/blue-green/previous-target-group-arn
  CURRENT_TG_PARAMETER: /chatwoot/prod/blue-green/current-target-group-arn
  CURRENT_INSTANCE_PARAMETER: /chatwoot/prod/blue-green/current-instance-id
  PREVIOUS_INSTANCE_PARAMETER: /chatwoot/prod/blue-green/previous-instance-id
  # #1979: pedido de congelamento (só o rollback grava) e liberação (só o deploy com descongelar=true grava).
  DEPLOY_FREEZE_PARAMETER: /chatwoot/prod/blue-green/deploy-freeze
  DEPLOY_FREEZE_RELEASED_PARAMETER: /chatwoot/prod/blue-green/deploy-freeze-released
  ROOT_VOLUME_SIZE_GB: '30'

jobs:
  # #1979: deploy contínuo. Cada push na main pede a trava do deploy na hora, sem esperar a fila de merge. A trava do
  # GitHub guarda um deploy rodando e um esperando; o pedido mais novo toma o lugar do que esperava, que sai cancelado.
  # Quem sobe depois leva a main inteira, então merges seguidos viram no máximo dois deploys e a produção nunca fica
  # parada atrás da fila (20/10: seis deploys seguidos pularam e a produção ficou duas horas para trás).
  # O rollback congela a produção (SSM DEPLOY_FREEZE_PARAMETER) e usa a mesma trava. Este job lê o congelamento fora
  # da trava: congelada, o deploy nem pede a vez e não toma o lugar de um rollback que espera.
  gate:
    name: Conferir o congelamento
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production == true && inputs.action == 'deploy'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      congelado: ${{ steps.congelamento.outputs.congelado }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read production freeze
        id: congelamento
        env:
          DESCONGELAR: ${{ github.event_name == 'workflow_dispatch' && inputs.descongelar == true }}
        run: |
          source scripts/deploy/blue-green-recovery.sh
          read_deploy_freeze
          if [ "$DEPLOY_FREEZE" = on ] && [ "$DESCONGELAR" != true ]; then
            echo "::warning::Produção congelada por um rollback (#1979): este deploy não pede a vez. Para soltar, deploy manual (action=deploy) com descongelar=true."
            echo "congelado=true" >> "$GITHUB_OUTPUT"
          else
            echo "congelado=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy Green
    needs: gate
    # Mesma trava do rollback: os dois nunca mexem no tráfego ao mesmo tempo.
    concurrency:
      group: deploy-autonomia-blue-green
      cancel-in-progress: false
    if: needs.gate.outputs.congelado == 'false'
    permissions:
      contents: read
      id-token: write
      # Só para o passo que pede um deploy novo quando o push mais novo perdeu a vez.
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    # Lidos pelo job desligar-blue. Só saem preenchidos quando o deploy chega ao fim com o tráfego na green.
    outputs:
      traffic_shift_done: ${{ steps.hand-off.outputs.traffic_shift_done }}
      listener_arn: ${{ steps.hand-off.outputs.listener_arn }}
      blue_instance_id: ${{ steps.hand-off.outputs.blue_instance_id }}
      blue_tg_arn: ${{ steps.hand-off.outputs.blue_tg_arn }}
      green_instance_id: ${{ steps.hand-off.outputs.green_instance_id }}
      green_tg_arn: ${{ steps.hand-off.outputs.green_tg_arn }}
      old_previous_instance_id: ${{ steps.hand-off.outputs.old_previous_instance_id }}
      old_previous_tg_arn: ${{ steps.hand-off.outputs.old_previous_tg_arn }}
      # Lido pelo job avisar-descongelar: o passo tem continue-on-error para não pular a entrega da blue.
      unfreeze_outcome: ${{ steps.unfreeze.outcome }}
      # #2004: horários da green para o job Tempos do deploy. Lidos pelo passo de diagnóstico, que só lê.
      green_launch_time: ${{ steps.diagnostico.outputs.green_launch_time }}
      green_boot_done: ${{ steps.diagnostico.outputs.green_boot_done }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # O .git entra no contexto do build (git rev-parse no Dockerfile); sem credencial persistida, nenhum token
          # vai para uma camada da imagem ou do cache.
          persist-credentials: false

      - name: Log deployment trigger context
        run: |
          echo "Autonomia blue/green deploy triggered by: $GITHUB_EVENT_NAME"
          echo "Deploying SHA: $GITHUB_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # #1979: relido já com a trava na mão, porque o congelamento pode ter mudado enquanto este deploy esperava a vez.
      - name: Check production freeze and stale rerun
        env:
          GH_TOKEN: ${{ github.token }}
          DESCONGELAR: ${{ github.event_name == 'workflow_dispatch' && inputs.descongelar == true }}
        run: |
          source scripts/deploy/blue-green-recovery.sh
          if [ "$DESCONGELAR" = true ]; then
            # O descongelar no fim libera só este pedido, nunca um que um rollback faça depois.
            read_deploy_freeze
            if [ "$DEPLOY_FREEZE" = on ]; then
              echo "FREEZE_AT_START=$DEPLOY_FREEZE_VALUE" >> "$GITHUB_ENV"
            fi
          else
            abort_if_frozen
          fi
          abort_if_older_than_published "$GITHUB_SHA"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare Chatwoot image
        run: |
          # Keep the versioned Dockerfile as the source of the base-image registry.
          # The isolated Linux runtime gate builds the same Ruby/Node digests from docker.io.
          echo 'ENV CW_EDITION="ee"' >> docker/Dockerfile

      # Fase 3 (#974): a instância green liga antes do build. Enquanto a imagem é montada, ela instala o Docker e
      # lê o env; o user data espera a imagem chegar ao ECR. Se o build falhar, a limpeza no fim desliga a green.
      # Mesmo padrao do step de flags do stack Hub2You: le o env parameter,
      # garante as flags exigidas preservando todas as demais linhas, regrava.
      - name: Ensure Autonomia runtime flags
        run: |
          aws ssm get-parameter \
            --name "$ENV_PARAMETER" \
            --with-decryption \
            --query Parameter.Value \
            --output text > "$RUNNER_TEMP/chatwoot.env"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "chatwoot.env"
          required = {
              "DEFAULT_LOCALE": "pt_BR",
              "EMAIL_REPUTATION_PROVIDER_MONITOR": "true",
              "EMAIL_REPUTATION_AWS_ACCOUNT_ID": "140023375763",
              "EMAIL_REPUTATION_PROVIDER_UNKNOWN_ACTION": "block",
              # Widget "Copiloto Autonom.ia" (agentes internos) — o plano V2
              # previa a flag em prod, mas ela so foi setada na VPS legada.
              "CRM_COPILOT_ENABLED": "true",
              # Coexistence: importa historico do WhatsApp Business App nos
              # proximos embedded signups (PR #168; topic fields ja habilitados
              # no painel Meta).
              "WHATSAPP_HISTORY_SYNC_ENABLED": "true",
              # Branding do menu lateral da instalacao Autonomia. Hub2You nao
              # define esta variavel para manter a cor atual.
              "SIDEBAR_BACKGROUND_COLOR": "#0b1e3f",
              # WhatsApp Hibrido (#1067): aba "WhatsApp API" nas caixas WhatsApp Oficial.
              # Liberado para todas as contas (Rodrigo, 07/10/2026). Restringir = ids separados por virgula.
              "WHATSAPP_HYBRID_ACCOUNT_IDS": "*",
          }

          lines = path.read_text().splitlines()
          seen = set()
          next_lines = []

          for line in lines:
              key = line.split("=", 1)[0] if "=" in line else None
              if key in required:
                  next_lines.append(f"{key}={required[key]}")
                  seen.add(key)
              else:
                  next_lines.append(line)

          for key, value in required.items():
              if key not in seen:
                  next_lines.append(f"{key}={value}")

          path.write_text("\n".join(next_lines) + "\n")
          PY

          aws ssm put-parameter \
            --name "$ENV_PARAMETER" \
            --type SecureString \
            --value "file://$RUNNER_TEMP/chatwoot.env" \
            --overwrite

          rm -f "$RUNNER_TEMP/chatwoot.env"

      - name: Discover current infrastructure
        run: |
          lb_arn=$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text)
          listener_arn=$(aws elbv2 describe-listeners \
            --load-balancer-arn "$lb_arn" \
            --query 'Listeners[?Port==`443`].ListenerArn | [0]' \
            --output text)
          vpc_id=$(aws elbv2 describe-load-balancers \
            --load-balancer-arns "$lb_arn" \
            --query 'LoadBalancers[0].VpcId' \
            --output text)
          current_tg_arn=$(aws elbv2 describe-listeners \
            --listener-arns "$listener_arn" \
            --query 'Listeners[0].DefaultActions[0].TargetGroupArn' \
            --output text)
          current_instance_id=$(aws elbv2 describe-target-health \
            --target-group-arn "$current_tg_arn" \
            --query 'TargetHealthDescriptions[0].Target.Id' \
            --output text)
          current_instance=$(aws ec2 describe-instances \
            --instance-ids "$current_instance_id" \
            --query 'Reservations[0].Instances[0]' \
            --output json)
          subnet_id=$(printf '%s' "$current_instance" | jq -r '.SubnetId')
          security_group_ids=$(printf '%s' "$current_instance" | jq -r '[.SecurityGroups[].GroupId] | join(" ")')
          iam_profile_arn=$(printf '%s' "$current_instance" | jq -r '.IamInstanceProfile.Arn')
          iam_profile_name=${iam_profile_arn##*/}
          ami_id=$(aws ec2 describe-images \
            --owners amazon \
            --filters 'Name=name,Values=al2023-ami-2023*-x86_64' 'Name=architecture,Values=x86_64' 'Name=virtualization-type,Values=hvm' \
            --query 'sort_by(Images,&CreationDate)[-1].ImageId' \
            --output text)
          root_device_name=$(aws ec2 describe-images \
            --image-ids "$ami_id" \
            --query 'Images[0].RootDeviceName' \
            --output text)
          old_previous_instance_id=$(aws ssm get-parameter \
            --name "$PREVIOUS_INSTANCE_PARAMETER" \
            --query Parameter.Value \
            --output text 2>/dev/null || true)
          old_previous_tg_arn=$(aws ssm get-parameter \
            --name "$PREVIOUS_TG_PARAMETER" \
            --query Parameter.Value \
            --output text 2>/dev/null || true)

          if [ "$old_previous_instance_id" = "None" ]; then
            old_previous_instance_id=""
          fi
          if [ "$old_previous_tg_arn" = "None" ]; then
            old_previous_tg_arn=""
          fi

          # #2032: repositório público. IDs e ARNs vão para um arquivo que o BASH_ENV carrega em todo passo bash, e não
          # para o GITHUB_ENV, que o runner reimprime no cabeçalho de cada passo seguinte. Lá ficam só o BASH_ENV e as marcas.
          deploy_state="$RUNNER_TEMP/deploy-estado.sh"
          (umask 077 && : > "$deploy_state")
          {
            printf 'export LB_ARN=%q\n' "$lb_arn"
            printf 'export LISTENER_ARN=%q\n' "$listener_arn"
            printf 'export VPC_ID=%q\n' "$vpc_id"
            printf 'export BLUE_TG_ARN=%q\n' "$current_tg_arn"
            printf 'export BLUE_INSTANCE_ID=%q\n' "$current_instance_id"
            printf 'export OLD_PREVIOUS_INSTANCE_ID=%q\n' "$old_previous_instance_id"
            printf 'export OLD_PREVIOUS_TG_ARN=%q\n' "$old_previous_tg_arn"
            printf 'export SUBNET_ID=%q\n' "$subnet_id"
            printf 'export SECURITY_GROUP_IDS=%q\n' "$security_group_ids"
            printf 'export IAM_PROFILE_NAME=%q\n' "$iam_profile_name"
            printf 'export AMI_ID=%q\n' "$ami_id"
            printf 'export ROOT_DEVICE_NAME=%q\n' "$root_device_name"
          } >> "$deploy_state"
          {
            echo "BASH_ENV=$deploy_state"
            echo "TRAFFIC_SHIFT_DONE=false"
            echo "GREEN_WORKER_START_ATTEMPTED=false"
            echo "PREVIOUS_WRITE_ATTEMPTED=false"
            echo "GREEN_IMAGE_PUBLISHED=false"
          } >> "$GITHUB_ENV"

      # #2024: a CI compara as migrations com a main, mas a blue pode estar vários PRs atrás. Antes de existir green,
      # o schema.rb deste commit é comparado com o da blue (e o db/retiradas.yml dela): remoção que a blue não
      # anunciou para o deploy aqui. Ruby puro (Prism), sem bundle.
      # Fixado no SHA (v1.331.0, o v1 em 21/10/2026): este job roda com credencial de produção.
      - name: Set up Ruby for the schema check
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8
        with:
          bundler: none

      - name: Check the schema against the blue
        env:
          GH_TOKEN: ${{ github.token }}
          BLUE_SHA_INFORMADO: ${{ github.event_name == 'workflow_dispatch' && inputs.blue_sha || '' }}
        run: bash scripts/deploy/schema-contra-a-blue.sh

      # #2024: snapshot do RDS pedido aqui, quando o deploy traz migration que a blue não tem, e esperado antes de lançar
      # a green (é ela quem roda o db:migrate). Desligado enquanto o secret estiver vazio. Secret, não variável: o
      # valor de uma variável sai no log público.
      - name: Request RDS snapshot before migrations
        env:
          RDS_SNAPSHOT_DB_INSTANCE: ${{ secrets.RDS_SNAPSHOT_DB_INSTANCE_AUTONOMIA }}
        run: bash scripts/deploy/rds-snapshot-antes-da-migration.sh criar

      - name: Create green user data
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          cat > "$RUNNER_TEMP/green-user-data.sh" <<'USERDATA'
          #!/bin/bash
          PS4='+ $(date -u +%T) '
          set -euxo pipefail

          AWS_REGION="__AWS_REGION__"
          ECR_REGISTRY="__ECR_REGISTRY__"
          ENV_PARAMETER="__ENV_PARAMETER__"
          IMAGE_URI="__IMAGE_URI__"
          APP_DIR="/opt/chatwoot"

          dnf update -y
          dnf install -y docker awscli openssh-clients python3 iproute
          # Logs dos containers no CloudWatch (#2103); `docker logs` segue pelo cache local do Docker 25.
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json <<EOF
          {"log-driver":"awslogs","log-opts":{"awslogs-region":"$AWS_REGION","awslogs-group":"/chatwoot/prod/app","tag":"{{.Name}}/{{.ID}}","mode":"non-blocking","max-buffer-size":"4m"}}
          EOF
          systemctl enable --now docker

          mkdir -p "$APP_DIR"

          aws ssm get-parameter \
            --region "$AWS_REGION" \
            --name "$ENV_PARAMETER" \
            --with-decryption \
            --query Parameter.Value \
            --output text > "$APP_DIR/.env"
          chmod 600 "$APP_DIR/.env"

          cat > "$APP_DIR/runtime.env" <<EOF
          IMAGE_URI=$IMAGE_URI
          AWS_REGION=$AWS_REGION
          ECR_REGISTRY=$ECR_REGISTRY
          START_WORKER_AFTER_DEPLOY=false
          EOF

          cat > "$APP_DIR/deploy.sh" <<'EOF'
          #!/bin/bash
          PS4='+ $(date -u +%T) '
          set -euxo pipefail

          APP_DIR="/opt/chatwoot"
          source "$APP_DIR/runtime.env"
          START_WORKER_AFTER_DEPLOY="${START_WORKER_AFTER_DEPLOY:-true}"

          prepare_instagram_tester_env() {
            local stage_dir type_file value_file error_file
            stage_dir="$(mktemp -d /run/instagram-tester-env.XXXXXX)"
            type_file="$stage_dir/type"
            value_file="$stage_dir/value"
            error_file="$stage_dir/error"

            rm -f "$APP_DIR/instagram-tester.env"
            : > "$APP_DIR/instagram-tester.env"
            chmod 600 "$APP_DIR/instagram-tester.env"

            if ! aws ssm get-parameter \
              --region "$AWS_REGION" \
              --name "/chatwoot/prod/instagram-tester-env" \
              --with-decryption \
              --query 'Parameter.Type' \
              --output text > "$type_file" 2> "$error_file"; then
              if grep -q 'ParameterNotFound' "$error_file"; then
                rm -rf "$stage_dir"
                return 0
              fi
              rm -rf "$stage_dir"
              echo "instagram_tester_env_fetch_failed" >&2
              return 1
            fi

            if [ "$(cat "$type_file")" != "SecureString" ]; then
              rm -rf "$stage_dir"
              echo "instagram_tester_env_type_invalid" >&2
              return 1
            fi

            if ! aws ssm get-parameter \
              --region "$AWS_REGION" \
              --name "/chatwoot/prod/instagram-tester-env" \
              --with-decryption \
              --query 'Parameter.Value' \
              --output text > "$value_file" 2> "$error_file"; then
              rm -rf "$stage_dir"
              echo "instagram_tester_env_fetch_failed" >&2
              return 1
            fi

            if ! awk '
              BEGIN {
                allowed["INSTAGRAM_TESTER_AUTOMATION_ENABLED"] = 1
                allowed["INSTAGRAM_TESTER_BROWSER_OPERATIONS_ENABLED"] = 1
                allowed["INSTAGRAM_TESTER_ALLOWED_ACCOUNT_IDS"] = 1
                allowed["INSTAGRAM_META_DEVELOPER_APP_ID"] = 1
                allowed["INSTAGRAM_META_BUSINESS_ID"] = 1
                allowed["INSTAGRAM_TESTER_APP_NAME"] = 1
                allowed["INSTAGRAM_TESTER_ROLES_DOC_ID"] = 1
                allowed["INSTAGRAM_TESTER_SESSION_SOURCE"] = 1
                allowed["INSTAGRAM_TESTER_SESSION_NAMESPACE"] = 1
                allowed["INSTAGRAM_TESTER_RUNTIME_STACK"] = 1
                allowed["INSTAGRAM_TESTER_OPERATOR_BROWSER_URL"] = 1
                allowed["INSTAGRAM_TESTER_OPERATOR_BROWSER_SIGNING_KEY"] = 1
                allowed["INSTAGRAM_TESTER_ADMIN_USER_ID"] = 1
                allowed["INSTAGRAM_TESTER_PROXY_AUTH_MODE"] = 1
                allowed["INSTAGRAM_TESTER_PROXY_HOST"] = 1
                allowed["INSTAGRAM_TESTER_PROXY_PORT"] = 1
                allowed["INSTAGRAM_TESTER_COORDINATION_REDIS_URL"] = 1
                allowed["INSTAGRAM_TESTER_COORDINATION_EPOCH"] = 1
                allowed["INSTAGRAM_TESTER_COORDINATION_REDIS_CA_FILE"] = 1
                allowed["INSTAGRAM_TESTER_PROXY_IDENTITY"] = 1
              }
              /^[[:space:]]*$/ || /^[[:space:]]*#/ { next }
              {
                separator = index($0, "=")
                key = separator > 1 ? substr($0, 1, separator - 1) : ""
                if (!(key in allowed) || (key in seen)) invalid = 1
                seen[key] = 1
              }
              END { exit invalid }
            ' "$value_file"; then
              rm -rf "$stage_dir"
              echo "instagram_tester_env_keys_invalid" >&2
              return 1
            fi

            install -m 600 "$value_file" "$APP_DIR/instagram-tester.env"
            rm -rf "$stage_dir"
          }

          rm -f "$APP_DIR/instagram-assisted-suspended"
          prepare_instagram_tester_env

          install_instagram_tester_publisher() {
            local stage_dir source_container tester_enabled
            tester_enabled=false
            if grep -Eq '^INSTAGRAM_TESTER_AUTOMATION_ENABLED=true$' "$APP_DIR/instagram-tester.env"; then
              tester_enabled=true
            fi
            stage_dir="$(mktemp -d /run/instagram-tester-publisher.XXXXXX)"
            source_container="instagram-tester-publisher-source-$$"

            cleanup_instagram_tester_publisher() {
              docker rm -f "$source_container" >/dev/null 2>&1 || true
              rm -rf "$stage_dir"
            }

            if ! docker create \
              --name "$source_container" \
              --entrypoint /bin/sh \
              "$IMAGE_URI" \
              -c 'exit 0' >/dev/null; then
              cleanup_instagram_tester_publisher
              echo "instagram_tester_publisher_setup_failed" >&2
              return 1
            fi

            if ! aws ssm get-parameter \
              --region "$AWS_REGION" \
              --name "/chatwoot/prod/instagram-tester-publisher-public-key" \
              --query 'Parameter.Type' \
              --output text > "$stage_dir/parameter-type" 2> "$stage_dir/parameter-error"; then
              cleanup_instagram_tester_publisher
              if [ "$tester_enabled" = "true" ]; then
                echo "instagram_tester_publisher_key_unavailable" >&2
                return 1
              fi
              return 0
            fi

            if [ "$(cat "$stage_dir/parameter-type")" != "String" ]; then
              cleanup_instagram_tester_publisher
              if [ "$tester_enabled" = "true" ]; then
                echo "instagram_tester_publisher_key_type_invalid" >&2
                return 1
              fi
              return 0
            fi

            if ! aws ssm get-parameter \
              --region "$AWS_REGION" \
              --name "/chatwoot/prod/instagram-tester-publisher-public-key" \
              --query 'Parameter.Value' \
              --output text > "$stage_dir/public-key" 2> "$stage_dir/parameter-error"; then
              cleanup_instagram_tester_publisher
              if [ "$tester_enabled" = "true" ]; then
                echo "instagram_tester_publisher_key_unavailable" >&2
                return 1
              fi
              return 0
            fi

            if [ ! -s "$stage_dir/public-key" ]; then
              cleanup_instagram_tester_publisher
              if [ "$tester_enabled" = "true" ]; then
                echo "instagram_tester_publisher_key_unavailable" >&2
                return 1
              fi
              return 0
            fi

            if ! (
              docker cp \
                "$source_container:/app/scripts/instagram_testers/runtime/forced-publisher.sh" \
                "$stage_dir/forced-publisher.sh" &&
              docker cp \
                "$source_container:/app/scripts/instagram_testers/runtime/install-remote-publisher.sh" \
                "$stage_dir/install-remote-publisher.sh" &&
              test ! -L "$stage_dir/forced-publisher.sh" &&
              test ! -L "$stage_dir/install-remote-publisher.sh" &&
              test -s "$stage_dir/forced-publisher.sh" &&
              test -s "$stage_dir/install-remote-publisher.sh" &&
              chmod 700 "$stage_dir" &&
              chmod 700 "$stage_dir/forced-publisher.sh" "$stage_dir/install-remote-publisher.sh" &&
              /bin/sh "$stage_dir/install-remote-publisher.sh" < "$stage_dir/public-key" &&
              test -x /usr/local/libexec/instagram-tester-publisher-root &&
              test -x /usr/sbin/sshd &&
              /usr/sbin/sshd -t &&
              systemctl is-active --quiet sshd
            ); then
              cleanup_instagram_tester_publisher
              echo "instagram_tester_publisher_setup_failed" >&2
              return 1
            fi

            cleanup_instagram_tester_publisher
          }

          if [ "$#" -gt 0 ] && [ -n "$1" ]; then
            IMAGE_URI="$1"
            {
              echo "IMAGE_URI=$IMAGE_URI"
              echo "AWS_REGION=$AWS_REGION"
              echo "ECR_REGISTRY=$ECR_REGISTRY"
              echo "START_WORKER_AFTER_DEPLOY=$START_WORKER_AFTER_DEPLOY"
            } > "$APP_DIR/runtime.env"
          fi

          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker pull "$IMAGE_URI"
          install_instagram_tester_publisher
          # Copy runtime installers from the exact application image, never remote code.
          # A failed copy is the image's/host's failure, not Instagram's: fatal like any boot step.
          stage_instagram_coordination() (
            set -euo pipefail
            set +x
            umask 077
            source_container="instagram-coordination-source-$$"
            trap 'docker rm -f "$source_container" >/dev/null 2>&1 || true' EXIT
            docker create --name "$source_container" --entrypoint /bin/sh "$IMAGE_URI" -c 'exit 0' >/dev/null
            for filename in install-coordination-tunnel.sh validate-coordination-env.py coordination-preflight.sh; do
              docker cp "$source_container:/app/scripts/instagram_testers/runtime/$filename" "$1/$filename"
              test ! -L "$1/$filename"
              test -s "$1/$filename"
            done
          )
          # Code of a failed check.sh: needs its sentinel (any line: sudo may print first) and an
          # Instagram verdict line; check.sh's INSTAGRAM_STEPS decides which codes those are. A host
          # verdict or no verdict at all is not Instagram's failure.
          instagram_preflight_verdict() {
            local line ran='' step=''
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                instagram_coordination_preflight_ran) ran=1 ;;
                "instagram_coordination_preflight_failed step="*) [ -n "$step" ] || step="${line#*step=}" ;;
              esac
            done
            [ -n "$ran" ] || return 1
            case "$step" in ''|*[!a-z_]*) return 1 ;; esac
            echo "$step"
          }
          # #1540: Instagram assisted never aborts the boot. On a failed tunnel or preflight the
          # green comes up with it suspended (same effect as suspend-instagram-assisted.py);
          # every other boot failure stays fatal.
          suspend_instagram_assisted_here() {
            local staged
            staged="$(mktemp "$APP_DIR/.instagram-suspend.XXXXXX")"
            awk 'index($0, "INSTAGRAM_TESTER_AUTOMATION_ENABLED=") != 1' "$APP_DIR/instagram-tester.env" > "$staged"
            echo "INSTAGRAM_TESTER_AUTOMATION_ENABLED=false" >> "$staged"
            mv -f "$staged" "$APP_DIR/instagram-tester.env"
            # web and worker read these files; a failed install leaves them missing.
            install -d -m 700 "$APP_DIR/igcoord"
            [ -e "$APP_DIR/igcoord/redis.env" ] || install -m 600 /dev/null "$APP_DIR/igcoord/redis.env"
            [ -e "$APP_DIR/igcoord/ca.crt" ] || install -m 644 /dev/null "$APP_DIR/igcoord/ca.crt"
            echo "INSTAGRAM_ASSISTED_SUSPENDED step=$1" | tee "$APP_DIR/instagram-assisted-suspended" >&2
          }
          instagram_preflight_or_suspend() {
            local stage install_log check_log step='' checked=''
            stage="$(mktemp -d /run/instagram-coordination-install.XXXXXX)"
            stage_instagram_coordination "$stage"
            install_log="$(mktemp)"
            check_log="$(mktemp)"
            if ! /bin/bash "$stage/install-coordination-tunnel.sh" install "$AWS_REGION" "$APP_DIR" 2>"$install_log"; then
              step=tunnel_install_failed
            elif ! "$APP_DIR/igcoord/check.sh" 2>"$check_log"; then
              checked=1
            fi
            rm -rf "$stage"
            cat "$install_log" "$check_log" >&2
            if [ -n "$checked" ] && ! step="$(instagram_preflight_verdict < "$check_log")"; then
              rm -f "$install_log" "$check_log"
              echo instagram_preflight_failed_without_verdict >&2
              return 1
            fi
            rm -f "$install_log" "$check_log"
            if [ -n "$step" ]; then
              suspend_instagram_assisted_here "$step"
            fi
          }
          instagram_preflight_or_suspend
          docker run --rm --env-file "$APP_DIR/.env" --env-file "$APP_DIR/instagram-tester.env" --env-file "$APP_DIR/igcoord/redis.env" --add-host ig-coord.internal:host-gateway --add-host ig-proxy.internal:host-gateway -v "$APP_DIR/igcoord/ca.crt:/run/igcoord/ca.crt:ro" "$IMAGE_URI" bundle exec rails db:chatwoot_prepare
          docker run --rm --env-file "$APP_DIR/.env" --env-file "$APP_DIR/instagram-tester.env" --env-file "$APP_DIR/igcoord/redis.env" --add-host ig-coord.internal:host-gateway --add-host ig-proxy.internal:host-gateway -v "$APP_DIR/igcoord/ca.crt:/run/igcoord/ca.crt:ro" "$IMAGE_URI" bundle exec rails runner 'EmailCampaigns::Reputation::ProviderMonitor.new.call; abort("SES provider preflight failed") if EmailCampaigns::Reputation::ProviderGate.protection.present?'
          systemctl restart chatwoot-web.service
          if [ "$START_WORKER_AFTER_DEPLOY" = "true" ]; then
            systemctl restart chatwoot-worker.service
          else
            systemctl stop chatwoot-worker.service || true
          fi
          docker image prune -f
          EOF
          chmod +x "$APP_DIR/deploy.sh"

          cat > /etc/systemd/system/chatwoot-web.service <<'EOF'
          [Unit]
          Description=Chatwoot web
          After=docker.service network-online.target instagram-coordination-tunnel.service
          Wants=instagram-coordination-tunnel.service
          Requires=docker.service

          [Service]
          Restart=always
          RestartSec=10
          EnvironmentFile=/opt/chatwoot/runtime.env
          ExecStartPre=-/usr/bin/docker rm -f chatwoot-web
          ExecStart=/usr/bin/docker run --rm --name chatwoot-web --env-file /opt/chatwoot/.env --env-file /opt/chatwoot/instagram-tester.env --env-file /opt/chatwoot/igcoord/redis.env --add-host ig-coord.internal:host-gateway --add-host ig-proxy.internal:host-gateway -v /opt/chatwoot/igcoord/ca.crt:/run/igcoord/ca.crt:ro -p 3000:3000 $IMAGE_URI bundle exec rails s -p 3000 -b 0.0.0.0
          ExecStop=/usr/bin/docker stop chatwoot-web

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > /etc/systemd/system/chatwoot-worker.service <<'EOF'
          [Unit]
          Description=Chatwoot worker
          After=docker.service network-online.target instagram-coordination-tunnel.service
          Wants=instagram-coordination-tunnel.service
          Requires=docker.service

          [Service]
          Restart=always
          RestartSec=10
          EnvironmentFile=/opt/chatwoot/runtime.env
          ExecStartPre=-/usr/bin/docker rm -f chatwoot-worker
          ExecStart=/usr/bin/docker run --rm --name chatwoot-worker --env-file /opt/chatwoot/.env --env-file /opt/chatwoot/instagram-tester.env --env-file /opt/chatwoot/igcoord/redis.env --add-host ig-coord.internal:host-gateway --add-host ig-proxy.internal:host-gateway -v /opt/chatwoot/igcoord/ca.crt:/run/igcoord/ca.crt:ro $IMAGE_URI bundle exec sidekiq -C config/sidekiq.yml
          ExecStop=/usr/bin/docker stop chatwoot-worker

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable chatwoot-web.service

          # A green liga junto com o build (#974): espera a imagem chegar ao ECR, por até 45 min (um build sem cache
          # leva ~24). Só repete enquanto a imagem não existe; qualquer outro erro (permissão, rede) falha na hora.
          wait_for_image() {
            local repo_tag repository tag error_file attempt
            repo_tag="${IMAGE_URI#*/}"
            repository="${repo_tag%:*}"
            tag="${repo_tag##*:}"
            error_file="$(mktemp)"
            for attempt in $(seq 1 540); do
              if aws ecr describe-images --region "$AWS_REGION" --repository-name "$repository" \
                --image-ids "imageTag=$tag" >/dev/null 2>"$error_file"; then
                rm -f "$error_file"
                return 0
              fi
              if ! grep -qF ImageNotFoundException "$error_file"; then
                cat "$error_file" >&2
                rm -f "$error_file"
                return 1
              fi
              echo "Imagem ainda nao publicada ($attempt)"
              sleep 5
            done
            rm -f "$error_file"
            return 1
          }
          # wait_for_image fica fora do deploy.sh: a limpeza do workflow só preserva a green enquanto o marcador abaixo existe,
          # e esperando a imagem não há migration para proteger (#972).
          wait_for_image

          # Marcador enquanto o deploy.sh (migrations) roda; some ao sair, com sucesso ou erro (#972).
          touch /run/chatwoot-deploy.running
          trap 'rm -f /run/chatwoot-deploy.running' EXIT
          "$APP_DIR/deploy.sh"
          USERDATA

          sed -i "s|__AWS_REGION__|$AWS_REGION|g" "$RUNNER_TEMP/green-user-data.sh"
          sed -i "s|__ECR_REGISTRY__|$ECR_REGISTRY|g" "$RUNNER_TEMP/green-user-data.sh"
          sed -i "s|__ENV_PARAMETER__|$ENV_PARAMETER|g" "$RUNNER_TEMP/green-user-data.sh"
          sed -i "s|__IMAGE_URI__|$IMAGE_URI|g" "$RUNNER_TEMP/green-user-data.sh"

      # #1350: green ligada há mais de 2 h que não é a atual nem o rollback (a previous) é esquecida, como a que ficou
      # dois dias ligada depois de um build falho. Aqui só avisa: quem termina é uma pessoa, depois de conferir.
      # Toda instância do stack nasce com BlueGreenRole=green, então a blue e a previous também aparecem no filtro e
      # são puladas pelo id. Falha de leitura não segura o deploy.
      - name: Warn about forgotten green instances
        continue-on-error: true
        run: |
          current_instance=$(aws ssm get-parameter \
            --name "$CURRENT_INSTANCE_PARAMETER" \
            --query Parameter.Value \
            --output text)
          previous_instance=$(aws ssm get-parameter \
            --name "$PREVIOUS_INSTANCE_PARAMETER" \
            --query Parameter.Value \
            --output text)
          limit=$(date -u -d '2 hours ago' +%s)
          aws ec2 describe-instances \
            --filters "Name=tag:BlueGreenRole,Values=green" "Name=tag:Project,Values=chatwoot-autonomia" \
              "Name=tag:Environment,Values=prod" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].[InstanceId,LaunchTime,Tags[?Key=='Name'].Value | [0]]" \
            --output text > "$RUNNER_TEMP/running-greens.txt"
          forgotten=0
          while IFS=$'\t' read -r instance_id launch_time instance_name; do
            if [ -z "$instance_id" ]; then
              continue
            fi
            case "$instance_id" in
              "$current_instance"|"$previous_instance"|"$BLUE_INSTANCE_ID") continue ;;
            esac
            if [ "$(date -u -d "$launch_time" +%s)" -lt "$limit" ]; then
              echo "::warning::Green esquecida: Name=$instance_name, LaunchTime=$launch_time. Não é a atual nem a previous; conferir e terminar à mão."
              forgotten=$((forgotten + 1))
            fi
          done < "$RUNNER_TEMP/running-greens.txt"
          rm -f "$RUNNER_TEMP/running-greens.txt"
          echo "Greens esquecidas: $forgotten"

      # Uma limpeza que pega a green rodando o deploy.sh (migrations) não a termina (#972): ela se desliga sozinha quando o
      # deploy.sh acaba e fica parada com a tag DeployCleanup=pending. Aqui essas greens são terminadas. Uma que ainda
      # esteja de pé segura o deploy por até 30 min, porque duas migrations juntas esbarram no lock do Rails; passado
      # isso, é terminada mesmo assim, para um deploy interrompido nunca travar os seguintes.
      - name: Retire greens left by an interrupted deploy
        run: |
          leftover=""
          for attempt in $(seq 1 300); do
            leftover=$(aws ec2 describe-instances \
              --filters "Name=tag:DeployCleanup,Values=pending" "Name=instance-state-name,Values=pending,running,stopping,shutting-down" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text)
            if [ -z "$leftover" ]; then
              break
            fi
            echo "Esperando a green que sobrou terminar o boot e parar ($attempt)"
            sleep 5
          done
          if [ -n "$leftover" ]; then
            echo "A green que sobrou continua de pé depois de 30 min; terminando para seguir com o deploy."
            # shellcheck disable=SC2086 # uma ou mais IDs separadas por espaço
            aws ec2 terminate-instances --instance-ids $leftover >/dev/null
          fi

          stopped=$(aws ec2 describe-instances \
            --filters "Name=tag:DeployCleanup,Values=pending" "Name=instance-state-name,Values=stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          if [ -n "$stopped" ]; then
            echo "Terminando as greens paradas por um deploy interrompido."
            # shellcheck disable=SC2086 # uma ou mais IDs separadas por espaço
            aws ec2 terminate-instances --instance-ids $stopped >/dev/null
          fi

      # A espera acima pode levar 30 min e o login dura 1 h (#972).
      - name: Refresh AWS credentials after leftover check
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # #2024: antes de a green existir. Ela roda o db:migrate assim que acha a imagem deste commit no ECR, e num rerun
      # a imagem já está lá.
      - name: Wait for RDS snapshot before the green
        run: bash scripts/deploy/rds-snapshot-antes-da-migration.sh esperar

      # A espera do snapshot pode passar do login de 1 h.
      - name: Refresh AWS credentials after the RDS snapshot
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Launch green EC2 instance
        run: |
          green_instance_id=$(aws ec2 run-instances \
            --image-id "$AMI_ID" \
            --instance-type "${{ github.event.inputs.green_instance_type || 't3.medium' }}" \
            --subnet-id "$SUBNET_ID" \
            --security-group-ids $SECURITY_GROUP_IDS \
            --iam-instance-profile "Name=$IAM_PROFILE_NAME" \
            --user-data "file://$RUNNER_TEMP/green-user-data.sh" \
            --block-device-mappings "[{\"DeviceName\":\"$ROOT_DEVICE_NAME\",\"Ebs\":{\"VolumeSize\":${ROOT_VOLUME_SIZE_GB},\"VolumeType\":\"gp3\",\"Encrypted\":true,\"DeleteOnTermination\":true}}]" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=chatwoot-autonomia-prod-ec2-green-${GITHUB_RUN_ID}},{Key=Project,Value=chatwoot-autonomia},{Key=Environment,Value=prod},{Key=ManagedBy,Value=github-actions},{Key=BlueGreenRole,Value=green}]" "ResourceType=volume,Tags=[{Key=Name,Value=chatwoot-autonomia-prod-ec2-green-${GITHUB_RUN_ID}-root},{Key=Project,Value=chatwoot-autonomia},{Key=Environment,Value=prod},{Key=ManagedBy,Value=github-actions},{Key=BlueGreenRole,Value=green}]" \
            --query 'Instances[0].InstanceId' \
            --output text)

          printf 'export GREEN_INSTANCE_ID=%q\n' "$green_instance_id" >> "$BASH_ENV"
          # Lida no if: do diagnóstico, que não enxerga o BASH_ENV.
          [ -z "$green_instance_id" ] || echo "GREEN_INSTANCE_LAUNCHED=true" >> "$GITHUB_ENV"

      # #1979: um rollback que congelou durante o boot para o deploy aqui, antes do build. Sem imagem a green não roda o
      # deploy.sh nem migration, e a limpeza só a termina, sem tocar na blue.
      - name: Abort if production was frozen
        env:
          DESCONGELAR: ${{ github.event_name == 'workflow_dispatch' && inputs.descongelar == true }}
        run: |
          source scripts/deploy/blue-green-recovery.sh
          if [ "$DESCONGELAR" != true ] && ! abort_if_frozen; then
            # A limpeza lê isto: até aqui o deploy não tocou em tráfego, worker nem Instagram da blue.
            echo "FREEZE_ABORTED=true" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.STABLE_IMAGE_TAG }}
          # Cache das camadas no próprio ECR de cada stack (tag buildcache), em mode=max: guarda também a etapa
          # pre-builder, cujo bundle install levava ~19 dos ~24 min do build (medido em 25/09). No ECR não há o limite
          # de 10 GB do cache do GitHub (já estourado), cada conta AWS fica com o seu, e PR de fork não lê.
          # ignore-error mantém o deploy de pé se a gravação do cache falhar.
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Publish runtime image parameter
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          # O build acima terminou: a imagem deste commit está no ECR e a green pode começar o deploy.sh a qualquer
          # momento. Daqui em diante a limpeza segue a regra do #972; antes disso, termina a green sempre (#1350).
          echo "GREEN_IMAGE_PUBLISHED=true" >> "$GITHUB_ENV"
          aws ssm put-parameter \
            --name "$RUNTIME_IMAGE_PARAMETER" \
            --type String \
            --value "$IMAGE_URI" \
            --overwrite

      - name: Wait for green SSM and local health
        run: |
          # A green liga antes do build; se ela morreu no lançamento (capacidade, EBS), falha aqui em vez de esperar o SSM.
          green_state=$(aws ec2 describe-instances --instance-ids "$GREEN_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "Estado da green: $green_state"
          case "$green_state" in
            shutting-down|terminated|stopping|stopped) exit 1 ;;
          esac

          for attempt in $(seq 1 180); do
            ping_status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$GREEN_INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)
            if [ "$ping_status" = "Online" ]; then
              break
            fi
            echo "Waiting for SSM on green, attempt $attempt"
            sleep 5
          done

          # Saúde do green, em ordem: espera o cloud-init; se ele deu erro e o serviço web nem ficou ativo (o
          # deploy.sh morreu antes de subir o web), falha na hora (antes esperava 15 min); com o serviço ativo, segue
          # para a checagem de sempre, só avisando. Depois espera o web
          # (checagem a cada 2 s, mesmo limite de 15 min), mostra o horário de cada etapa do boot e confere que a
          # imagem que subiu é deste commit. Tudo aqui acontece antes da troca de tráfego.
          health_params=$(jq -nc --arg sha "$GITHUB_SHA" '{commands: [
            "cloud-init status --wait >/dev/null 2>&1 || true",
            "if cloud-init status 2>/dev/null | grep -qF \"status: error\"; then if systemctl is-active --quiet chatwoot-web.service; then echo \"AVISO: cloud-init com erro, mas o servico web esta ativo; segue para a checagem\"; else echo \"cloud-init com erro e o servico web nem ficou ativo\"; journalctl -u chatwoot-web.service --no-pager -n 160; tail -200 /var/log/cloud-init-output.log; exit 1; fi; fi",
            "ok=0; for i in $(seq 1 450); do if curl -fs --max-time 5 http://127.0.0.1:3000/ >/dev/null; then ok=1; break; fi; sleep 2; done; if [ \"$ok\" -ne 1 ]; then journalctl -u chatwoot-web.service --no-pager -n 160; tail -160 /var/log/cloud-init-output.log; exit 1; fi",
            "echo \"Horarios do boot:\"; grep -F -e \" dnf \" -e \"docker pull\" -e \"docker run\" -e \"systemctl\" -e \"chatwoot_prepare\" /var/log/cloud-init-output.log | head -80 || true",
            ("imagem=$(docker exec chatwoot-web cat /app/.git_sha 2>/dev/null || true); if [ \"$imagem\" != \"" + $sha + "\" ]; then echo \"Imagem errada no green: commit $imagem, esperado " + $sha + "\"; exit 1; fi; echo \"Imagem confere: $imagem\"")
          ]}')
          command_id=$(aws ssm send-command \
            --instance-ids "$GREEN_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$health_params" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 240); do
            command_status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$GREEN_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$command_status" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$GREEN_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
              *)
                echo "Waiting for green local health command, attempt $attempt, status=${command_status:-unknown}"
                sleep 5
                ;;
            esac
          done

          if [ "${command_status:-}" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$GREEN_INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$GREEN_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

      # Build sem cache e boot podem passar de uma hora desde o último login (#972).
      - name: Refresh AWS credentials before traffic steps
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # #1979: último ponto antes do tráfego. Um rollback que congelou durante o build ou o boot para aqui; a green
      # nunca entra no balanceador.
      - name: Abort if production was frozen before traffic
        env:
          DESCONGELAR: ${{ github.event_name == 'workflow_dispatch' && inputs.descongelar == true }}
        run: |
          source scripts/deploy/blue-green-recovery.sh
          if [ "$DESCONGELAR" != true ] && ! abort_if_frozen; then
            # A limpeza lê isto: até aqui o deploy não tocou em tráfego, worker nem Instagram da blue.
            echo "FREEZE_ABORTED=true" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Register green target group
        run: |
          green_tg_name="cw-auto-green-${GITHUB_RUN_NUMBER}"
          green_tg_arn=$(aws elbv2 create-target-group \
            --name "$green_tg_name" \
            --protocol HTTP \
            --port 3000 \
            --vpc-id "$VPC_ID" \
            --target-type instance \
            --health-check-enabled \
            --health-check-path "/" \
            --health-check-interval-seconds 30 \
            --health-check-timeout-seconds 5 \
            --healthy-threshold-count 2 \
            --unhealthy-threshold-count 5 \
            --matcher HttpCode=200-399 \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)

          printf 'export GREEN_TG_ARN=%q\n' "$green_tg_arn" >> "$BASH_ENV"

          aws elbv2 register-targets \
            --target-group-arn "$green_tg_arn" \
            --targets "Id=$GREEN_INSTANCE_ID,Port=3000"

          # Marca antes da chamada: se o job cair durante ela, a limpeza devolve o listener ao blue (idempotente).
          echo "GREEN_TG_ATTACHED=true" >> "$GITHUB_ENV"

          aws elbv2 modify-listener \
            --listener-arn "$LISTENER_ARN" \
            --default-actions "Type=forward,ForwardConfig={TargetGroups=[{TargetGroupArn=$BLUE_TG_ARN,Weight=100},{TargetGroupArn=$green_tg_arn,Weight=0}]}" \
            >/dev/null

          aws elbv2 wait target-in-service \
            --target-group-arn "$green_tg_arn" \
            --targets "Id=$GREEN_INSTANCE_ID,Port=3000"

      # Passo próprio para a marca chegar ao GITHUB_ENV mesmo se o próximo for cancelado no meio. A limpeza só religa o
      # worker do blue com ela; religar um worker que nem chegou a parar não muda nada.
      - name: Mark blue worker stop
        run: echo "BLUE_WORKER_STOPPED=true" >> "$GITHUB_ENV"

      - name: Switch Sidekiq workers to green
        run: |
          source scripts/deploy/blue-green-recovery.sh
          # #1540: a failing Instagram preflight suspends Instagram assisted on the green, it does not stop the deploy.
          check_green_instagram_or_suspend "$GREEN_INSTANCE_ID"

          blue_command_id=$(aws ssm send-command \
            --instance-ids "$BLUE_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["set -eu","sudo systemctl stop chatwoot-worker.service"]' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$blue_command_id" \
            --instance-id "$BLUE_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$blue_command_id" \
            --instance-id "$BLUE_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          echo "GREEN_WORKER_START_ATTEMPTED=true" >> "$GITHUB_ENV"
          green_command_id=$(aws ssm send-command \
            --instance-ids "$GREEN_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["set -eu","sudo sed -i /^START_WORKER_AFTER_DEPLOY=/d /opt/chatwoot/runtime.env","echo START_WORKER_AFTER_DEPLOY=true | sudo tee -a /opt/chatwoot/runtime.env","sudo systemctl enable chatwoot-worker.service","sudo systemctl start chatwoot-worker.service","sudo systemctl is-active --quiet chatwoot-worker.service"]' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$green_command_id" \
            --instance-id "$GREEN_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$green_command_id" \
            --instance-id "$GREEN_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

      - name: Shift HTTPS listener to green
        run: |
          source scripts/deploy/blue-green-recovery.sh
          # #1540: a failing Instagram preflight suspends Instagram assisted on the green, it does not stop the deploy.
          check_green_instagram_or_suspend "$GREEN_INSTANCE_ID"
          # Sem Instagram, o web da green pode ter acabado de reiniciar: tráfego só com o alvo saudável.
          if [ "$INSTAGRAM_GREEN_SUSPENDED" = "true" ]; then
            aws elbv2 wait target-in-service \
              --target-group-arn "$GREEN_TG_ARN" \
              --targets "Id=$GREEN_INSTANCE_ID,Port=3000"
          fi

          switch_listener_destination "$LISTENER_ARN" "$GREEN_TG_ARN" "$GREEN_INSTANCE_ID"
          if [ "$LISTENER_SWITCH_STATUS" -ne 0 ]; then
            exit "$LISTENER_SWITCH_STATUS"
          fi

          # Record PREVIOUS only after the listener and CURRENT confirm green.
          echo "PREVIOUS_WRITE_ATTEMPTED=true" >> "$GITHUB_ENV"
          record_previous_destination "$BLUE_TG_ARN" "$BLUE_INSTANCE_ID"

          echo "TRAFFIC_SHIFT_DONE=true" >> "$GITHUB_ENV"

      - name: Verify public SSO redirect
        run: |
          for attempt in $(seq 1 18); do
            headers=$(curl -k -sS -I --max-time 10 \
              --connect-to "${DOMAIN_NAME}:443:${EC2_ALB_DNS_NAME}:443" \
              "https://${DOMAIN_NAME}/auth/autonomia" || true)
            status=$(printf '%s\n' "$headers" | awk 'NR == 1 {print $2}')
            location=$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {print $2}' | tr -d '\r')

            if [ -n "$location" ] \
              && printf '%s\n' "$location" | grep -F 'client_id=talkai' \
              && printf '%s\n' "$location" | grep -F 'redirect_uri=https%3A%2F%2Fagents.autonomia.site%2Fauth%2Fautonomia%2Fcallback'; then
              echo "$location"
              exit 0
            fi

            echo "Attempt $attempt: status=${status:-none} location=${location:-none}"
            sleep 10
          done

          echo "SSO redirect smoke test failed"
          exit 1

      # #1979: o deploy de descongelar só solta a produção depois de subir de verdade (tráfego e SSO conferidos), e só o
      # pedido que ele viu na largada: um rollback disparado enquanto ele subia tem outro valor e continua valendo.
      # Falhar aqui (SSM) não pode pular a entrega da blue ao desligar-blue: o tráfego já está na green. O pior caso é a
      # produção seguir congelada, com o aviso no run; outro deploy manual com descongelar=true solta.
      - name: Unfreeze production
        id: unfreeze
        if: github.event_name == 'workflow_dispatch' && inputs.descongelar == true
        continue-on-error: true
        run: |
          source scripts/deploy/blue-green-recovery.sh
          if [ -z "${FREEZE_AT_START:-}" ]; then
            echo "A produção não estava congelada na largada: nada a liberar."
            exit 0
          fi
          release_deploy_freeze "$FREEZE_AT_START"
          read_deploy_freeze
          if [ "$DEPLOY_FREEZE" = on ]; then
            echo "::warning::Liberado $FREEZE_AT_START, mas um rollback congelou depois ($DEPLOY_FREEZE_VALUE): a produção segue congelada."
          else
            echo "::notice::Produção descongelada por este deploy manual."
          fi

      # Tráfego e workers já estão na green. Parar a blue e terminar o rollback mais antigo agora é do job desligar-blue,
      # fora da trava do deploy: os ~5,5 min dessa etapa deixam de segurar o próximo deploy.
      - name: Hand off blue shutdown
        id: hand-off
        run: |
          {
            echo "traffic_shift_done=$TRAFFIC_SHIFT_DONE"
            echo "listener_arn=$LISTENER_ARN"
            echo "blue_instance_id=$BLUE_INSTANCE_ID"
            echo "blue_tg_arn=$BLUE_TG_ARN"
            echo "green_instance_id=$GREEN_INSTANCE_ID"
            echo "green_tg_arn=$GREEN_TG_ARN"
            echo "old_previous_instance_id=$OLD_PREVIOUS_INSTANCE_ID"
            echo "old_previous_tg_arn=$OLD_PREVIOUS_TG_ARN"
          } >> "$GITHUB_OUTPUT"

      # #1979: a trava do GitHub não garante que sobre o pedido do push mais novo. Se ele perdeu a vez (saiu cancelado) e
      # traz commit que este deploy não tem, pede um deploy novo da main atual. Falhar aqui não derruba o deploy.
      - name: Deploy the newest main if its push lost the turn
        # Também quando este deploy falhou (rerun velho recusado, build quebrado): o push mais novo não pode ficar sem vez.
        if: always()
        continue-on-error: true
        # API lenta nunca atrasa a limpeza que vem depois, no caminho de falha.
        timeout-minutes: 2
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { workflow_id } = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId })).data;
            const runs = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, branch: 'main', per_page: 30 })).data.workflow_runs
              .filter((r) => r.id !== context.runId);
            for (const r of runs.filter((x) => x.status !== 'completed')) {
              const jobs = (await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: r.id })).data.jobs;
              if (jobs.some((j) => ['Conferir o congelamento', 'Deploy Green'].includes(j.name) && j.status !== 'completed')) {
                core.info(`O run ${r.id} ainda pode deployar e leva a main.`);
                return;
              }
            }
            const push = runs.find((r) => r.event === 'push');
            if (!push || push.conclusion !== 'cancelled' || push.head_sha === context.sha) return;
            const { status } = (await github.rest.repos.compareCommits({ owner, repo, base: context.sha, head: push.head_sha })).data;
            if (status !== 'ahead') return;
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref: 'main', inputs: { action: 'deploy', confirm_production: 'true' } });
            core.notice(`O push de ${push.head_sha.slice(0, 10)} perdeu a vez na trava: deploy novo da main disparado.`);

      # O primeiro login dura 1 h e o job pode chegar a 120 min (#972): renova a credencial antes da limpeza.
      - name: Refresh AWS credentials for cleanup
        if: (failure() || cancelled()) && env.TRAFFIC_SHIFT_DONE != 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # #2004: só leitura. Horários da green sempre; quando um passo crítico falhou ou demorou, pacote só estrutural
      # (target health, status checks, docker ps, código HTTP do health local, df, free). O repositório é público:
      # logs do web, do worker e do cloud-init vão num send-command cuja saída o workflow não lê (fica no SSM da
      # conta; o resumo dá o CommandId). Fica antes da limpeza, que termina a green. Não roda no cancelamento, para
      # não tomar o tempo da limpeza, e falhar aqui não muda nada no deploy.
      - name: Collect green diagnostics
        id: diagnostico
        if: ${{ !cancelled() && env.GREEN_INSTANCE_LAUNCHED == 'true' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          bash scripts/deploy/green-diagnostics.sh

      - name: Cleanup failed green resources before traffic shift
        # Também no cancelamento (manual ou timeout): cancelar entre parar o worker azul e ligar o verde deixava a
        # plataforma sem Sidekiq. Os comandos daqui já toleram falha parcial e podem rodar mais de uma vez.
        if: (failure() || cancelled()) && env.TRAFFIC_SHIFT_DONE != 'true'
        run: |
          source scripts/deploy/blue-green-recovery.sh
          recovery_switch_status=0
          # #1350: green que não recebeu a imagem (build falho ou cancelado antes do "Publish runtime image parameter")
          # não rodou o deploy.sh nem recebeu tráfego ou worker. Ela é terminada sempre, na saída deste passo, mesmo
          # quando a recuperação da blue abaixo falha; essa falha continua falhando o job com o erro original. O ECR
          # confirma: só sem a imagem deste commit a green não pode ter começado migration (#972).
          green_without_image=false
          if [ -n "${GREEN_INSTANCE_ID:-}" ] && [ "${GREEN_IMAGE_PUBLISHED:-false}" != "true" ] \
            && [ -z "${GREEN_TG_ARN:-}" ] && [ "${GREEN_WORKER_START_ATTEMPTED:-false}" != "true" ] \
            && green_image_absent "$ECR_REPOSITORY" "$GITHUB_SHA"; then
            green_without_image=true
            trap 'terminate_green_without_image "$?"' EXIT
          fi
          if [ -n "${BLUE_INSTANCE_ID:-}${BLUE_TG_ARN:-}${GREEN_INSTANCE_ID:-}${GREEN_TG_ARN:-}" ]; then
            # A known, unique blue binding is required before any mutation.
            if [ -z "${LISTENER_ARN:-}" ] || [ -z "${BLUE_TG_ARN:-}" ] || [ -z "${BLUE_INSTANCE_ID:-}" ]; then
              echo "blue_green_recovery_destination_missing" >&2
              exit 1
            fi
            if [ "${PREVIOUS_WRITE_ATTEMPTED:-false}" = "true" ]; then
              record_previous_destination "$BLUE_TG_ARN" "$BLUE_INSTANCE_ID"
            else
              validate_target_pair "$BLUE_TG_ARN" "$BLUE_INSTANCE_ID"
            fi
          fi
          # #1979: tráfego, worker e Instagram seguem na blue quando a green nunca recebeu a imagem (não rodou o app) ou
          # quando o deploy parou de propósito pelo congelamento antes do balanceador (a green rodou o boot, como em todo
          # deploy, sem tocar na blue). Suspender o Instagram, reiniciar o web da blue ou regravar listener e CURRENT aí
          # só mexeria na produção à toa; basta conferir, só lendo, que o listener está na blue.
          blue_untouched=false
          if { [ -z "${GREEN_INSTANCE_ID:-}" ] || [ "$green_without_image" = "true" ] || [ "${FREEZE_ABORTED:-false}" = "true" ]; } \
            && [ -z "${GREEN_TG_ARN:-}" ] && [ "${BLUE_WORKER_STOPPED:-false}" != "true" ] \
            && [ "${GREEN_WORKER_START_ATTEMPTED:-false}" != "true" ]; then
            blue_untouched=true
          fi
          if [ -n "${BLUE_INSTANCE_ID:-}" ] && [ "$blue_untouched" != "true" ]; then
            suspend_instagram_assisted "$BLUE_INSTANCE_ID"
            blue_web_command_id=$(aws ssm send-command \
              --instance-ids "$BLUE_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["set -eu","sudo systemctl restart chatwoot-web.service","for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ && exit 0; sleep 5; done; journalctl -u chatwoot-web.service --no-pager -n 120; exit 1"]' \
              --query 'Command.CommandId' --output text)
            aws ssm wait command-executed --command-id "$blue_web_command_id" --instance-id "$BLUE_INSTANCE_ID"
          fi
          if [ "${GREEN_WORKER_START_ATTEMPTED:-false}" = "true" ]; then
            green_stop_command_id=$(aws ssm send-command \
              --instance-ids "$GREEN_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["set -eu","sudo sed -i /^START_WORKER_AFTER_DEPLOY=/d /opt/chatwoot/runtime.env","echo START_WORKER_AFTER_DEPLOY=false | sudo tee -a /opt/chatwoot/runtime.env","sudo systemctl stop chatwoot-worker.service"]' \
              --query 'Command.CommandId' \
              --output text)
            aws ssm wait command-executed \
              --command-id "$green_stop_command_id" \
              --instance-id "$GREEN_INSTANCE_ID"
          fi

          # Even a failed switch may have reached AWS. Confirm blue before writing
          # pointers or removing green; failed recovery retains green for inspection.
          if [ "$blue_untouched" = "true" ] && [ -n "${LISTENER_ARN:-}" ] && [ -n "${BLUE_TG_ARN:-}" ]; then
            read_listener_destination "$LISTENER_ARN"
            if [ "$ACTIVE_TG_ARN" != "$BLUE_TG_ARN" ] || [ "$ACTIVE_INSTANCE_ID" != "$BLUE_INSTANCE_ID" ]; then
              echo "blue_green_destination_mismatch" >&2
              exit 1
            fi
          elif [ -n "${LISTENER_ARN:-}" ] && [ -n "${BLUE_TG_ARN:-}" ] && [ -n "${BLUE_INSTANCE_ID:-}" ]; then
            switch_listener_destination "$LISTENER_ARN" "$BLUE_TG_ARN" "$BLUE_INSTANCE_ID"
            recovery_switch_status="$LISTENER_SWITCH_STATUS"
          fi

          if [ "${BLUE_WORKER_STOPPED:-false}" = "true" ] && [ -n "${BLUE_INSTANCE_ID:-}" ]; then
            blue_restore_command_id=$(aws ssm send-command \
              --instance-ids "$BLUE_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["set -eu","sudo sed -i /^START_WORKER_AFTER_DEPLOY=/d /opt/chatwoot/runtime.env","echo START_WORKER_AFTER_DEPLOY=true | sudo tee -a /opt/chatwoot/runtime.env","sudo systemctl enable chatwoot-worker.service","sudo systemctl restart chatwoot-worker.service","sudo systemctl is-active --quiet chatwoot-worker.service"]' \
              --query 'Command.CommandId' \
              --output text)
            aws ssm wait command-executed \
              --command-id "$blue_restore_command_id" \
              --instance-id "$BLUE_INSTANCE_ID"
          fi

          # Complete worker recovery even after a confirmed switch response error;
          # keep resources and return that original error instead of success.
          if [ "$recovery_switch_status" -ne 0 ]; then
            exit "$recovery_switch_status"
          fi
          if [ "$green_without_image" = "true" ]; then
            terminate_green_without_image 0
          fi
          if [ -n "${GREEN_INSTANCE_ID:-}" ]; then
            sleep "$PUBLISHER_TRANSPORT_DRAIN_SECONDS"
          fi

          if [ -n "${GREEN_TG_ARN:-}" ]; then
            aws elbv2 deregister-targets \
              --target-group-arn "$GREEN_TG_ARN" \
              --targets "Id=$GREEN_INSTANCE_ID,Port=3000"
            aws elbv2 wait target-deregistered \
              --target-group-arn "$GREEN_TG_ARN" \
              --targets "Id=$GREEN_INSTANCE_ID,Port=3000"
            aws elbv2 delete-target-group \
              --target-group-arn "$GREEN_TG_ARN"
          fi

          if [ -n "${GREEN_INSTANCE_ID:-}" ]; then
            # Green rodando o deploy.sh pode estar no meio das migrations (#972): em vez de terminar, ela se desliga sozinha
            # quando ele acaba, e o próximo deploy a termina. Esperando a imagem, ou com o boot já terminado, não há
            # migration: termina na hora, como em qualquer falha deste caminho.
            ssm_output() {
              local command_id=$1 output=""
              for _ in $(seq 1 6); do
                sleep 5
                output=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$GREEN_INSTANCE_ID" \
                  --query '[Status,StandardOutputContent]' --output text 2>/dev/null || true)
                case "$output" in Success*|Failed*|Cancelled*|TimedOut*|Undeliverable*|Terminated*) break ;; esac
              done
              printf '%s' "$output"
            }

            retired=false
            status_params=$(jq -nc '{commands: ["if [ -e /run/chatwoot-deploy.running ]; then echo DEPLOY_RUNNING; else echo DEPLOY_IDLE; fi"]}')
            status_id=$(aws ssm send-command --instance-ids "$GREEN_INSTANCE_ID" --document-name AWS-RunShellScript \
              --parameters "$status_params" --query 'Command.CommandId' --output text 2>/dev/null || true)
            deploy_status=""
            if [ -n "$status_id" ] && [ "$status_id" != "None" ]; then
              deploy_status=$(ssm_output "$status_id")
            fi
            case "$deploy_status" in
              $'Success\tDEPLOY_RUNNING'|$'Success\tDEPLOY_IDLE') ;;
              *)
                echo "blue_green_deploy_status_unknown" >&2
                exit 1
                ;;
            esac
            echo "Green: ${deploy_status:-sem resposta do SSM}"
            if [ "${deploy_status#*DEPLOY_RUNNING}" != "$deploy_status" ] \
              && aws ec2 create-tags --resources "$GREEN_INSTANCE_ID" --tags Key=DeployCleanup,Value=pending; then
              retire_params=$(jq -nc '{commands: ["systemd-run --unit=green-retire --no-block sh -c \"while [ -e /run/chatwoot-deploy.running ]; do sleep 5; done; shutdown -h now\""]}')
              retire_id=$(aws ssm send-command --instance-ids "$GREEN_INSTANCE_ID" --document-name AWS-RunShellScript \
                --parameters "$retire_params" --query 'Command.CommandId' --output text 2>/dev/null || true)
              if [ -n "$retire_id" ] && [ "$retire_id" != "None" ]; then
                case "$(ssm_output "$retire_id")" in Success*) retired=true ;; esac
              fi
            fi

            if [ "$retired" = "true" ]; then
              echo "Green rodando o deploy.sh: desliga sozinha quando ele acabar; o próximo deploy a remove."
            elif [ "${deploy_status#*DEPLOY_RUNNING}" != "$deploy_status" ]; then
              echo "blue_green_deferred_shutdown_failed" >&2
              exit 1
            else
              echo "Terminando a green agora."
              aws ec2 terminate-instances \
                --instance-ids "$GREEN_INSTANCE_ID" >/dev/null
            fi
          fi

      # #2004: sobe o pacote do passo de diagnóstico (já sanitizado). Depois da limpeza: nunca a atrasa.
      - name: Upload green diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostico-autonomia-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-diagnostico
          if-no-files-found: ignore
          retention-days: 30

  # Fora do caminho crítico: a janela de 5 min com a blue ligada (rollback rápido), a parada da blue e a terminação
  # do rollback mais antigo rodavam no fim do job deploy e seguravam a trava do próximo deploy por ~5,5 min. Mesma
  # política: fica só a imediatamente anterior (parada); a mais antiga, registrada antes deste deploy, é terminada.
  #
  # Corrida com o próximo deploy e com o rollback, que agora podem rodar durante a janela:
  # - O próximo deploy lê a atual pelo listener (a green deste) e a previous pelo SSM (a blue deste). Este job nunca
  #   mexe na green deste deploy, e parar a blue é o esperado para a previous: o rollback liga a previous parada. A
  #   OLD_PREVIOUS do próximo deploy é a blue deste; quem a termina é o desligar-blue dele, que espera este acabar
  #   (mesma trava por stack).
  # - Antes de agir, este job lê AGORA o listener e os parâmetros current/previous-instance-id do SSM. A blue não é
  #   parada se voltou a ser a atual (rollback na janela). A mais antiga só é terminada se não for a atual, nem a
  #   previous, nem o destino do listener. Instância já parando, parada ou terminada por um deploy mais novo não
  #   falha o job: ele só registra e segue.
  # - Rollback em andamento: o job espera ele acabar antes de parar a blue. Sobra a janela de segundos entre essa
  #   leitura e o stop. Na maior parte dela, o rollback que começa ali espera a blue parar e a liga de novo, ou falha
  #   ao falar com ela parando, com o tráfego ainda na green (é só disparar de novo). Risco residual aceito: um
  #   rollback que já passou da saúde da blue e troca o listener nesses segundos deixa o tráfego numa blue parada; o
  #   rollback de novo a liga. Não usamos a trava do deploy aqui porque o GitHub cancela o pendente mais antigo do
  #   grupo, e um desligamento na fila cancelaria um deploy esperando a vez.
  # - Cancelar este job (ou o GitHub descartar um pendente desta trava) deixa a blue ligada; o próximo deploy a tem
  #   como OLD_PREVIOUS e a termina.
  desligar-blue:
    name: Desligar a blue
    needs: deploy
    if: >-
      !cancelled() && needs.deploy.result == 'success' && needs.deploy.outputs.traffic_shift_done == 'true'
    # Trava própria, sem cancel-in-progress: não entra na fila do deploy e não cancela o desligamento anterior.
    concurrency:
      group: desligar-blue-autonomia
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
      # #2032: os IDs e ARNs aparecem só no cabeçalho deste passo; os outros os leem do arquivo do BASH_ENV.
      - name: Load deploy hand-off
        env:
          LISTENER_ARN: ${{ needs.deploy.outputs.listener_arn }}
          BLUE_INSTANCE_ID: ${{ needs.deploy.outputs.blue_instance_id }}
          BLUE_TG_ARN: ${{ needs.deploy.outputs.blue_tg_arn }}
          GREEN_INSTANCE_ID: ${{ needs.deploy.outputs.green_instance_id }}
          GREEN_TG_ARN: ${{ needs.deploy.outputs.green_tg_arn }}
          OLD_PREVIOUS_INSTANCE_ID: ${{ needs.deploy.outputs.old_previous_instance_id }}
          OLD_PREVIOUS_TG_ARN: ${{ needs.deploy.outputs.old_previous_tg_arn }}
        run: |
          deploy_state="$RUNNER_TEMP/deploy-estado.sh"
          (umask 077 && : > "$deploy_state")
          for name in LISTENER_ARN BLUE_INSTANCE_ID BLUE_TG_ARN GREEN_INSTANCE_ID GREEN_TG_ARN OLD_PREVIOUS_INSTANCE_ID OLD_PREVIOUS_TG_ARN; do
            printf 'export %s=%q\n' "$name" "${!name}" >> "$deploy_state"
          done
          echo "BASH_ENV=$deploy_state" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Keep blue online for fast rollback
        run: |
          echo "A blue fica ligada por 5 minutos antes de parar (janela de rollback rápido)."
          sleep 300

      - name: Wait for a running rollback
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { workflow_id } = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId })).data;
            const TETO_MS = 25 * 60 * 1000;
            const inicio = Date.now();
            const rollbackVivo = async () => {
              const runs = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, event: 'workflow_dispatch', per_page: 20 })).data.workflow_runs
                .filter((r) => r.status !== 'completed');
              for (const r of runs) {
                const jobs = (await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: r.id })).data.jobs;
                if (jobs.some((j) => ['Congelar a produção', 'Rollback To Previous Target Group'].includes(j.name) && j.status !== 'completed')) return r;
              }
              return null;
            };
            let vivo = await rollbackVivo();
            while (vivo && Date.now() - inicio < TETO_MS) {
              core.info(`Rollback em andamento (run ${vivo.id}); a blue só para depois dele.`);
              await new Promise((ok) => setTimeout(ok, 15000));
              vivo = await rollbackVivo();
            }
            if (vivo) core.setFailed(`Rollback (run ${vivo.id}) ainda em andamento depois de 25 min: a blue não foi parada.`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop blue instance and remove older rollback
        run: |
          source scripts/deploy/blue-green-recovery.sh
          # #1979: com a produção congelada por um rollback, nada é parado nem terminado: o rollback precisa ter para
          # onde voltar. O primeiro deploy depois de descongelar termina o que sobrar.
          read_deploy_freeze
          if [ "$DEPLOY_FREEZE" = on ]; then
            echo "::warning::Produção congelada por um rollback (#1979): a blue e a mais antiga ficam como estão."
            exit 0
          fi
          echo "Rollback policy: keep only this immediately previous instance; terminate any older rollback instance recorded before this deploy."

          # Quem está no ar e quem é o rollback AGORA: um deploy ou um rollback pode ter rodado durante a janela.
          read_listener_destination "$LISTENER_ARN"
          current_instance=$(aws ssm get-parameter --name "$CURRENT_INSTANCE_PARAMETER" --query Parameter.Value --output text)
          previous_instance=$(aws ssm get-parameter --name "$PREVIOUS_INSTANCE_PARAMETER" --query Parameter.Value --output text)
          current_tg=$(aws ssm get-parameter --name "$CURRENT_TG_PARAMETER" --query Parameter.Value --output text)
          previous_tg=$(aws ssm get-parameter --name "$PREVIOUS_TG_PARAMETER" --query Parameter.Value --output text)
          # Papel no lugar do ID (repositório público, #2032).
          papel() {
            case "$1" in
              "") echo nenhuma ;;
              "$BLUE_INSTANCE_ID") echo blue ;;
              "$GREEN_INSTANCE_ID") echo green ;;
              "${OLD_PREVIOUS_INSTANCE_ID:-}") echo mais-antiga ;;
              *) echo outra ;;
            esac
          }
          echo "Agora: listener -> $(papel "$ACTIVE_INSTANCE_ID"); current=$(papel "$current_instance"); previous=$(papel "$previous_instance")"

          if [ "$BLUE_INSTANCE_ID" = "$ACTIVE_INSTANCE_ID" ] || [ "$BLUE_INSTANCE_ID" = "$current_instance" ]; then
            echo "::warning::A blue voltou a ser a atual (rollback durante a janela): continua ligada."
          else
            instance_state "$BLUE_INSTANCE_ID"
            case "$INSTANCE_STATE" in
              pending|running)
                aws ec2 stop-instances --instance-ids "$BLUE_INSTANCE_ID" >/dev/null
                aws ec2 wait instance-stopped --instance-ids "$BLUE_INSTANCE_ID"
                ;;
              stopping)
                aws ec2 wait instance-stopped --instance-ids "$BLUE_INSTANCE_ID"
                ;;
              stopped)
                echo "A blue já está parada."
                ;;
              shutting-down|terminated)
                echo "A blue já foi terminada por um deploy mais novo."
                ;;
              *)
                echo "blue_green_instance_state_unknown:blue:$INSTANCE_STATE" >&2
                exit 1
                ;;
            esac
          fi

          # Relido antes de terminar a mais antiga: um rollback pode ter congelado durante a parada da blue.
          read_deploy_freeze
          if [ "$DEPLOY_FREEZE" = on ]; then
            echo "::warning::Produção congelada por um rollback durante a parada (#1979): a mais antiga fica."
            exit 0
          fi

          if [ -n "${OLD_PREVIOUS_INSTANCE_ID:-}" ]; then
            case "$OLD_PREVIOUS_INSTANCE_ID" in
              "$BLUE_INSTANCE_ID"|"$GREEN_INSTANCE_ID"|"$ACTIVE_INSTANCE_ID"|"$current_instance"|"$previous_instance")
                echo "A mais antiga está em uso agora: fica."
                ;;
              *)
                instance_state "$OLD_PREVIOUS_INSTANCE_ID"
                case "$INSTANCE_STATE" in
                  shutting-down|terminated|None)
                    echo "A mais antiga já foi terminada."
                    ;;
                  *)
                    echo "Terminating older rollback instance (state=$INSTANCE_STATE)."
                    aws ec2 terminate-instances --instance-ids "$OLD_PREVIOUS_INSTANCE_ID" >/dev/null
                    ;;
                esac
                ;;
            esac
          fi

          if [ -n "${OLD_PREVIOUS_TG_ARN:-}" ]; then
            case "$OLD_PREVIOUS_TG_ARN" in
              "$BLUE_TG_ARN"|"$GREEN_TG_ARN"|"$ACTIVE_TG_ARN"|"$current_tg"|"$previous_tg")
                echo "O target group mais antigo está em uso agora: fica."
                ;;
              *)
                echo "Deleting older rollback target group."
                if ! aws elbv2 delete-target-group --target-group-arn "$OLD_PREVIOUS_TG_ARN"; then
                  echo "::warning::Não deu para apagar o target group mais antigo (pode já ter sido apagado)."
                fi
                ;;
            esac
          fi

  # #2004: tempo de cada fase do deploy (build, boot da green, saúde local, registro no target group, workers,
  # listener e desligamento da blue) no Step Summary e num artifact JSON, para comparar um deploy com outro. Só lê a
  # API do GitHub e os horários que o Deploy Green já coletou; não fala com a AWS e não decide nada.
  tempos:
    name: Tempos do deploy
    needs: [deploy, desligar-blue]
    if: always() && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    # Falha aqui (checkout, API) nunca pinta de vermelho um deploy que deu certo.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Summarize deploy phase durations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STACK: autonomia
          GREEN_LAUNCH_TIME: ${{ needs.deploy.outputs.green_launch_time }}
          GREEN_BOOT_DONE: ${{ needs.deploy.outputs.green_boot_done }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-tempos"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > "$RUNNER_TEMP/deploy-jobs.json"; then
            echo "::warning::API do GitHub indisponível: a tabela de tempos sai sem os passos."
            : > "$RUNNER_TEMP/deploy-jobs.json"
          fi
          python3 scripts/deploy/deploy-telemetry.py phases "$RUNNER_TEMP/deploy-jobs.json" \
            "$RUNNER_TEMP/deploy-tempos/tempos.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deploy phase durations
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: deploy-tempos-autonomia-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deploy-tempos
          if-no-files-found: ignore
          retention-days: 90

  # #1979: rollback em dois jobs. "Congelar a produção" roda fora da trava: confere o SHA esperado antes de qualquer
  # mudança, congela (deploy novo nem pede a vez) e cancela o deploy que ainda não chegou ao tráfego. O rollback pede
  # a mesma trava do deploy: espera o deploy que já está no tráfego terminar, confere o SHA de novo e só então troca.
  # A produção fica congelada até um deploy manual com descongelar=true, para o merge seguinte não subir de novo o que
  # foi desfeito.
  congelar:
    name: Congelar a produção
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm_production == true && inputs.action == 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check the version to restore
        env:
          GH_TOKEN: ${{ github.token }}
          ESPERADO_SHA: ${{ inputs.esperado_sha }}
        run: bash scripts/deploy/check-rollback-target.sh

      - name: Freeze production
        run: |
          source scripts/deploy/blue-green-recovery.sh
          write_deploy_freeze "on:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:pedido"
          echo "::notice::Produção congelada: nenhum deploy sobe até um deploy manual com descongelar=true."

      - name: Cancel deploys before traffic
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // Uma falha isolada da API não pode derrubar o rollback.
            const tentar = async (pedido) => {
              for (let vez = 1; ; vez += 1) {
                try {
                  return await pedido();
                } catch (e) {
                  if (vez >= 4) throw e;
                  core.warning(`API do GitHub falhou (${e.status || e.message}); tentando de novo.`);
                  await new Promise((ok) => setTimeout(ok, 5000 * vez));
                }
              }
            };
            const { workflow_id } = (await tentar(() => github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId }))).data;
            const vivos = async () => {
              const runs = [];
              for (const status of ['in_progress', 'queued', 'waiting', 'pending', 'requested']) {
                const pagina = (await tentar(() => github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id, status, per_page: 100 }))).data.workflow_runs;
                runs.push(...pagina.filter((r) => r.id !== context.runId));
              }
              return runs;
            };
            // No tráfego = o passo Register já começou. Qualquer outro estado (pending, queued, sem passos) conta como antes.
            const noTrafego = (job) => (job.steps || []).some((s) => s.name === 'Register green target group' &&
              ['in_progress', 'completed'].includes(s.status));
            // Cancela todo run vivo que ainda pode trocar o tráfego antes do rollback: o gate rodando, o gate já concluído
            // com o Deploy Green ainda por nascer (job que espera um needs não aparece na API) e o deploy que não chegou ao
            // tráfego. Fica o run de outro rollback, o deploy que já terminou (resta o desligar-blue) e o que está no
            // tráfego, que o rollback espera na mesma trava. Três varreduras, 20 s entre elas.
            const cancelados = new Set();
            const varrer = async () => {
              for (let volta = 1; volta <= 3; volta += 1) {
                for (const run of await vivos()) {
                  if (cancelados.has(run.id)) continue;
                  const { jobs } = (await tentar(() => github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id }))).data;
                  // Job pulado pelo if: também aparece na lista (completed/skipped), em todo run de push: só conta o de verdade.
                  if (jobs.some((j) => j.name === 'Congelar a produção' && j.conclusion !== 'skipped')) continue;
                  const deploy = jobs.find((j) => j.name === 'Deploy Green');
                  if (deploy && deploy.status === 'completed') continue;
                  if (deploy && noTrafego(deploy)) {
                    core.info(`Deploy ${run.head_sha.slice(0, 10)} (run ${run.id}) já está no tráfego: o rollback espera ele terminar, na mesma trava.`);
                    continue;
                  }
                  await tentar(() => github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id }));
                  cancelados.add(run.id);
                  core.notice(`Deploy ${run.head_sha.slice(0, 10)} (run ${run.id}) cancelado antes do tráfego.`);
                }
                if (volta < 3) await new Promise((ok) => setTimeout(ok, 20000));
              }
            };
            await varrer();

  rollback:
    name: Rollback To Previous Target Group
    needs: congelar
    concurrency:
      group: deploy-autonomia-blue-green
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm_production == true && inputs.action == 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
      # check-rollback-target.sh lê o run que criou a instância anterior.
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Já dentro da trava: um deploy de descongelar que subiu enquanto este esperava a vez não solta o rollback. O
      # sufixo difere do pedido acima: se aquele valor já foi liberado, repeti-lo deixaria a produção descongelada.
      - name: Freeze production
        run: |
          source scripts/deploy/blue-green-recovery.sh
          write_deploy_freeze "on:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:trava"
          echo "::notice::Produção congelada: nenhum deploy sobe até um deploy manual com descongelar=true."

      # De novo, agora com o deploy que estava no tráfego já terminado: ele pode ter mudado a anterior.
      - name: Check the version to restore
        env:
          GH_TOKEN: ${{ github.token }}
          ESPERADO_SHA: ${{ inputs.esperado_sha }}
        run: bash scripts/deploy/check-rollback-target.sh

      - name: Restore previous target group
        run: |
          source scripts/deploy/blue-green-recovery.sh
          lb_arn=$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text)
          listener_arn=$(aws elbv2 describe-listeners \
            --load-balancer-arn "$lb_arn" \
            --query 'Listeners[?Port==`443`].ListenerArn | [0]' \
            --output text)
          read_listener_destination "$listener_arn"
          current_instance_id="$ACTIVE_INSTANCE_ID"

          previous_tg_arn=$(aws ssm get-parameter \
            --name "$PREVIOUS_TG_PARAMETER" \
            --query Parameter.Value \
            --output text)
          previous_instance_id=$(aws ssm get-parameter \
            --name "$PREVIOUS_INSTANCE_PARAMETER" \
            --query Parameter.Value \
            --output text)

          validate_target_pair "$previous_tg_arn" "$previous_instance_id"

          previous_state=$(aws ec2 describe-instances \
            --instance-ids "$previous_instance_id" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          # An online target can be suspended before stopping the last worker.
          # A stopped target must boot after the current worker stops (no overlap).
          if [ "$previous_state" = "running" ]; then
            suspend_instagram_assisted "$previous_instance_id"
          fi

          # The enabled worker unit can autostart at EC2 boot; stop and wait first.
          if [ "$current_instance_id" != "$previous_instance_id" ]; then
            current_command_id=$(aws ssm send-command \
              --instance-ids "$current_instance_id" \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["set -eu","sudo sed -i /^START_WORKER_AFTER_DEPLOY=/d /opt/chatwoot/runtime.env","echo START_WORKER_AFTER_DEPLOY=false | sudo tee -a /opt/chatwoot/runtime.env","sudo systemctl stop chatwoot-worker.service"]' \
              --query 'Command.CommandId' \
              --output text)

            aws ssm wait command-executed \
              --command-id "$current_command_id" \
              --instance-id "$current_instance_id"
          fi

          if [ "$previous_state" = "stopped" ] || [ "$previous_state" = "stopping" ]; then
            # O job desligar-blue pode estar parando a previous; a AWS só liga uma instância já parada.
            if [ "$previous_state" = "stopping" ]; then
              aws ec2 wait instance-stopped \
                --instance-ids "$previous_instance_id"
            fi
            aws ec2 start-instances \
              --instance-ids "$previous_instance_id" >/dev/null
            aws ec2 wait instance-running \
              --instance-ids "$previous_instance_id"
          fi

          for attempt in $(seq 1 60); do
            ping_status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$previous_instance_id" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)
            if [ "$ping_status" = "Online" ]; then
              break
            fi
            echo "Waiting for SSM on previous instance, attempt $attempt"
            sleep 15
          done

          if [ "$previous_state" != "running" ]; then
            suspend_instagram_assisted "$previous_instance_id"
          fi

          previous_web_command_id=$(aws ssm send-command \
            --instance-ids "$previous_instance_id" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["set -eu","sudo systemctl restart chatwoot-web.service","for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ && exit 0; sleep 5; done; journalctl -u chatwoot-web.service --no-pager -n 120; exit 1"]' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$previous_web_command_id" \
            --instance-id "$previous_instance_id"

          switch_listener_destination "$listener_arn" "$previous_tg_arn" "$previous_instance_id"
          recovery_switch_status="$LISTENER_SWITCH_STATUS"

          previous_command_id=$(aws ssm send-command \
            --instance-ids "$previous_instance_id" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["set -eu","sudo sed -i /^START_WORKER_AFTER_DEPLOY=/d /opt/chatwoot/runtime.env","echo START_WORKER_AFTER_DEPLOY=true | sudo tee -a /opt/chatwoot/runtime.env","sudo systemctl enable chatwoot-worker.service","sudo systemctl restart chatwoot-worker.service","sudo systemctl is-active --quiet chatwoot-worker.service"]' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$previous_command_id" \
            --instance-id "$previous_instance_id"

          exit "$recovery_switch_status"

      - name: Verify public SSO redirect after rollback
        run: |
          for attempt in $(seq 1 12); do
            headers=$(curl -k -sS -I --max-time 10 \
              --connect-to "${DOMAIN_NAME}:443:${EC2_ALB_DNS_NAME}:443" \
              "https://${DOMAIN_NAME}/auth/autonomia" || true)
            location=$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {print $2}' | tr -d '\r')

            if [ -n "$location" ] && printf '%s\n' "$location" | grep -F 'client_id=talkai'; then
              echo "$location"
              exit 0
            fi

            echo "Attempt $attempt: location=${location:-none}"
            sleep 10
          done

          echo "Rollback smoke test failed"
          exit 1

  avisar-descongelar:
    name: Avisar descongelar que falhou
    needs: deploy
    if: always() && needs.deploy.outputs.unfreeze_outcome == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Unfreeze failed
        run: |
          echo "::error::O deploy subiu, mas não conseguiu descongelar a produção (SSM). Ela segue congelada: dispare de novo o deploy manual com descongelar=true."
          exit 1

  avisar-rollback-cancelado:
    name: Avisar rollback cancelado
    needs: [congelar, rollback]
    if: always() && needs.congelar.result == 'success' && needs.rollback.result == 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Rollback cancelled before switching traffic
        run: |
          echo "::error::O rollback foi cancelado antes de trocar o tráfego (outro pedido tomou a vez dele na trava, ou o run foi cancelado). A produção segue congelada: dispare o rollback de novo."
          exit 1
