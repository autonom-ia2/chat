name: Ops - Campaign Audience Backfill

# One-purpose ops tool (#1005 F1 / #990): runs the existing rake
# campaign_journey:backfill_audience_links inside the running web container on
# the active (current) instance of each prod stack via SSM.
# DRY-RUN by default (only counts). mode=apply adds APPLY=1 and writes.
# Only completed campaigns, only the base label, ambiguous campaigns skipped,
# idempotent (already linked campaigns are not touched).
# The command is hardcoded — the only inputs are two fixed choices.

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Which stack(s) to run on.
        required: true
        default: both
        type: choice
        options:
          - both
          - autonomia
          - hub2you
      mode:
        description: dry_run only counts; apply writes the links.
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - apply

permissions:
  id-token: write
  contents: read

jobs:
  backfill:
    name: Backfill ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: autonomia
            role_arn: arn:aws:iam::140023375763:role/chatwoot-autonomia-prod-github-actions-deploy
          - name: hub2you
            role_arn: arn:aws:iam::354307071110:role/chatwoot-autonomia-prod-github-actions-deploy
    env:
      AWS_REGION: us-east-1
      CURRENT_INSTANCE_PARAMETER: /chatwoot/prod/blue-green/current-instance-id
      STACK_INPUT: ${{ github.event.inputs.stack }}
      MODE_INPUT: ${{ github.event.inputs.mode }}
    steps:
      - name: Skip when stack not selected
        id: gate
        run: |
          if [ "$STACK_INPUT" = "both" ] || [ "$STACK_INPUT" = "${{ matrix.name }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Stack ${{ matrix.name }} not selected; skipping."
          fi

      - name: Configure AWS credentials
        if: steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ matrix.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run audience backfill on active instance
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail

          case "$MODE_INPUT" in
            dry_run) CMD='docker exec chatwoot-web bundle exec rails campaign_journey:backfill_audience_links' ;;
            apply) CMD='docker exec -e APPLY=1 chatwoot-web bundle exec rails campaign_journey:backfill_audience_links' ;;
            *) echo "::error::mode must be dry_run or apply"; exit 1 ;;
          esac
          echo "Mode: $MODE_INPUT"

          INSTANCE_ID="$(aws ssm get-parameter \
            --name "$CURRENT_INSTANCE_PARAMETER" \
            --query 'Parameter.Value' --output text)"
          echo "Active instance: $INSTANCE_ID"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name 'AWS-RunShellScript' \
            --comment "Campaign audience backfill ($MODE_INPUT)" \
            --parameters "commands=[$(printf '%s' "$CMD" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')]" \
            --query 'Command.CommandId' --output text)"
          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)"
          echo "Status: $STATUS"

          echo "----- stdout -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command did not succeed (status=$STATUS)"
            exit 1
          fi
