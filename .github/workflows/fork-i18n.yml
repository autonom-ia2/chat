name: Fork translations
on:
  pull_request:
  # Check obrigatório da fila de merge. O push da main sai junto com o do testes.yml,
  # depois que o ruleset da fila estiver ativo.
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  fork-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm i18n:fork:check
        env:
          CROWDIN_SYNC: >-
            ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'chore: Update translations') }}
          # A proteção do Crowdin só roda no PR do Crowdin; na fila CROWDIN_SYNC é sempre falso.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
