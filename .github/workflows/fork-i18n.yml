name: Fork translations
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fork-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm i18n:fork:check
        env:
          CROWDIN_SYNC: >-
            ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'chore: Update translations') }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
