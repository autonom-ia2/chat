name: Testes do fork

# CI de testes do chat2you (fork enterprise do Chatwoot). Baseado no
# run_foss_spec.yml do upstream, com duas diferencas deliberadas:
#   - NAO remove a pasta enterprise/: o fork roda em modo Enterprise em producao,
#     entao spec/enterprise faz parte do gate.
#   - matriz de 12 nos de RSpec e 2 de Vitest (#2025). A org tem 60 jobs simultaneos (GitHub
#     Team, desde 21/10/2026; eram 20), divididos com a fila de merge, os PRs abertos e os deploys
#     das duas stacks. Medido em 21/10: a soma dos exemplos e ~69 min e cada no paga 1,5-2 min de
#     setup (4 min quando compila o Vite). De 8 para 12 nos a parte mais lenta cai ~3 min; de 12
#     para 16, ~1,5 min, e os 4 grupos que a fila constroi juntos passam de 60 maquinas ao mesmo
#     tempo (4 x (16 + 2) = 72): os nos esperam maquina e a fila fica mais lenta, nao mais rapida.
#     Com 12: 4 x (12 + 2) = 56. O plano e os agregadores rodam antes ou depois dos nos, por segundos.
#     Os arquivos sao divididos pelo tempo real de cada um (job rspec-plan), nao em ordem alfabetica.
#   - roda no PR e na fila de merge (merge_group). Nao roda no push da main: com o
#     ruleset da fila ativo (desde 04/10/2026, #969), a main so recebe o commit que a
#     fila ja testou; rodar de novo nao testaria nada novo.
#   - a divisao por tempo muda os grupos de specs entre rodadas: spec que vaza estado
#     para a vizinha pode aparecer como falha intermitente. O plan.json de cada rodada
#     (artefato rspec-plan) reproduz o grupo exato do no que falhou.
#   - checks obrigatorios estaveis: `RSpec` e `Vitest` (jobs agregados), que nao mudam de
#     nome quando o numero de nos muda.
# Refs #274 (epico upgrade Chatwoot 4.17.1) — este workflow e pre-requisito do
# PR de merge para termos gate de regressao.

permissions:
  contents: read

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      shards:
        description: 'Numero de nos do RSpec, 1 a 20 (diagnostico: outra divisao expoe spec que depende de ordem)'
        required: false
        default: '12'

# Nao e trava de capacidade: um push novo no PR torna a rodada anterior inutil, entao ela e
# cancelada. Na fila nunca cancela, porque check obrigatorio cancelado tira o PR da fila
# (cada grupo da fila tem ref propria, entao os 4 grupos rodam em paralelo).
concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Rubocop, Brakeman e ESLint sao informativos (continue-on-error): na fila nao
  # barram nada e o resultado ja saiu no PR.
  lint-backend:
    name: Rubocop
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Rubocop
        # Informativo por enquanto: a main de 2026-09-02 tem 220 ofensas pre-existentes
        # (81 autocorrigiveis) em codigo do fork. Limpeza em issue propria; depois vira gate.
        continue-on-error: true
        run: bundle exec rubocop --parallel

  security-scan:
    name: Brakeman e bundle-audit
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Brakeman
        # Nao bloqueia ainda: o upstream tambem mantem Brakeman informativo
        # (35 achados pre-existentes sem triagem). Vira gate depois da triagem.
        continue-on-error: true
        run: bundle exec brakeman -q --no-pager
      - name: bundle-audit
        # Informativo ate o merge da 4.17.1: o Gemfile.lock atual (4.15.1) carrega
        # CVEs que o upstream ja corrigiu (ex.: crass 1.0.7). Vira gate no PR de merge.
        continue-on-error: true
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check

  lint-frontend:
    name: ESLint
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # A versao do pnpm vem do campo packageManager do package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: ESLint
        # Informativo por enquanto: a main de 2026-09-02 tem 13 erros e ~7.200 warnings
        # pre-existentes (quase todos vue-i18n/no-missing-keys). Limpeza na issue #276.
        continue-on-error: true
        run: pnpm run eslint

  # Vitest em 2 nos (#2025): num no so levava 7-11 min (1.201 arquivos) e virava o caminho
  # critico assim que o RSpec cai para ~9 min. O `--shard` do Vitest divide os arquivos de forma
  # deterministica; cada arquivo roda isolado, como antes. O check obrigatorio e o job `Vitest`
  # agregado abaixo, que nao muda de nome se o numero de nos mudar.
  frontend-tests:
    name: Vitest (${{ matrix.parte }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2]
    steps:
      - uses: actions/checkout@v4
      # A versao do pnpm vem do campo packageManager do package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Vitest
        env:
          PARTE: ${{ matrix.parte }}
        run: pnpm run test --shard="$PARTE/2"

  # Check obrigatorio da fila de merge. `if: always()`: um check obrigatorio pulado conta
  # como verde, e sem ele uma parte que falhou faria este job ser pulado.
  vitest:
    name: Vitest
    needs: frontend-tests
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Todas as partes do Vitest passaram?
        env:
          PARTES: ${{ needs.frontend-tests.result }}
        run: |
          echo "partes=$PARTES"
          [ "$PARTES" = success ]

  # Divide as specs pelo tempo real de cada arquivo (artefatos da ultima main verde) e
  # confere que toda spec entra em exatamente um no. Sem tempos, cai no round-robin.
  rspec-plan:
    name: RSpec - plano
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plano.outputs.matrix }}
      total: ${{ steps.plano.outputs.total }}
      digest: ${{ steps.plano.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Testar o planejador
        run: python3 .github/scripts/test_rspec_plan.py

      - name: Baixar os tempos da ultima main verde
        # Sem tempos o plano so fica menos equilibrado; nunca deixa spec de fora.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$REPO/actions/workflows/testes.yml/runs?status=success&event=merge_group&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/$REPO/actions/workflows/testes.yml/runs?status=success&event=push&branch=main&per_page=1" --jq '.workflow_runs[0].id // empty')
          fi
          if [ -z "$run_id" ]; then echo "Sem rodada verde da main: plano round-robin."; exit 0; fi
          echo "Tempos da rodada $run_id"
          gh run download "$run_id" -R "$REPO" -p 'rspec-results-*' -D "$RUNNER_TEMP/tempos"

      - name: Montar o plano
        id: plano
        env:
          SHARDS: ${{ inputs.shards || '12' }}
        # Teto 20: disparo manual e diagnostico raro. Se a org passar de 60 jobs, os nos esperam
        # maquina (nao falham); o padrao do PR e da fila continua 12.
        run: |
          set -euo pipefail
          case "$SHARDS" in ''|*[!0-9]*) echo "shards invalido: $SHARDS"; exit 1 ;; esac
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 20 ]; then echo "shards fora de 1..20: $SHARDS"; exit 1; fi
          LC_ALL=C find spec -name '*_spec.rb' -type f | LC_ALL=C sort > "$RUNNER_TEMP/specs.txt"
          python3 .github/scripts/rspec_plan.py --shards "$SHARDS" --specs "$RUNNER_TEMP/specs.txt" \
            --tempos "$RUNNER_TEMP/tempos" --saida plan.json | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "total=$SHARDS"
            echo "matrix=$(jq -cn --argjson n "$SHARDS" '[range(0; $n)]')"
            echo "digest=$(sha256sum plan.json | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rspec-plan
          path: plan.json
          if-no-files-found: error

  backend-tests:
    name: RSpec (${{ matrix.ci_node_index }}/${{ needs.rspec-plan.outputs.total }})
    needs: rspec-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ci_node_index: ${{ fromJSON(needs.rspec-plan.outputs.matrix) }}

    services:
      postgres:
        # pgvector: o schema do fork habilita a extensao vector (base de conhecimento dos agentes).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --entrypoint redis-server
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ''
      REDIS_URL: redis://localhost:6379
      # O autoBuild do Vite (primeiro spec que renderiza pagina) roda neste job. Sem teto explicito o Node usa o
      # padrao do runner (~3,3 GB), no limite do build atual: falta de memoria vira 500 nas telas renderizadas.
      # Mesmo orcamento do build de producao (docker/Dockerfile, NODE_OPTIONS) (#1118).
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # A versao do pnpm vem do campo packageManager do package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias JS
        run: pnpm install --frozen-lockfile

      # O primeiro spec que renderiza pagina compila os assets do Vite (autoBuild no teste): ~85 s em cada no.
      # O vite_ruby so reaproveita o build se o digest de app/javascript, configs e lockfiles bater, e a chave
      # cobre esses arquivos e mais theme/, vite.shared.* e .browserslistrc, que o vite_ruby NAO observa (importados
      # pelo vite.config.ts e pelo tailwind): fora da chave, um build velho seria restaurado e aceito.
      # So le: quem salva e o vite-test-cache.yml, na ref da main, que todo PR e toda rodada da fila conseguem
      # ler. Salvo aqui, o cache ficava na ref do PR/fila, ninguem mais lia, e acumulava copias (#1176).
      # A chave tem de ser igual a do vite-test-cache.yml.
      - name: Cache do build do Vite (teste)
        id: vite-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            public/vite-test
            tmp/cache/vite
          key: vite-test-${{ runner.os }}-${{ hashFiles('app/javascript/**', 'config/vite.json', 'package.json', 'pnpm-lock.yaml', 'postcss.config.js', 'tailwind.config.js', 'theme/**', 'vite.config.*', 'vite.shared.*', '.browserslistrc') }}

      # Sem cache (PR que muda o frontend), o build acontecia dentro do primeiro request que renderiza pagina e
      # estourava o heap (~3,3 GB, 7018 modulos): o spec recebia 500 conforme o no em que caia (#1226). Aqui o build
      # roda antes do RSpec, fora de request, com teto de memoria explicito; o autoBuild encontra o build pronto pelo
      # digest do last-build-test.json e nao compila de novo.
      - name: Compilar o Vite de teste (fora do request)
        if: steps.vite-cache.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          bin/vite build
          jq -e '.success == true' tmp/cache/vite/last-build-test.json

      # Conversores nativos que a imagem de producao (docker/Dockerfile) ja traz.
      # As previas de empresa (Relationships::PreviewRenderer) chamam ffmpeg,
      # pdftoppm e libvips de verdade; sem eles os specs falham com ENOENT/LoadError.
      # Mesma lista do workflow relationships.yml.
      # Com teto de tempo e nova tentativa: mirror lento travava este passo 30-40 min (#1131).
      - name: Instalar conversores nativos
        timeout-minutes: 15
        run: .github/scripts/apt-install.sh libvips42 poppler-utils ffmpeg

      - name: Criar banco e carregar schema
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load

      # Exercise the actual MCP migration against the preceding schema, not
      # just the manually committed dump. One shard suffices; RSpec aggregates it.
      - name: Validar migração MCP e schema regenerado
        if: matrix.ci_node_index == 0
        run: |
          set -euo pipefail
          bundle exec rake db:migrate:down VERSION=20261010110000
          bundle exec rake db:migrate:up VERSION=20261010110000
          bundle exec rake db:schema:dump
          git diff --exit-code -- db/schema.rb

      - name: Publicar schema regenerado em falha
        if: failure() && matrix.ci_node_index == 0
        uses: actions/upload-artifact@v4
        with:
          name: mcp-schema-verification
          path: db/schema.rb

      - name: Baixar o plano do RSpec
        uses: actions/download-artifact@v4
        with:
          name: rspec-plan
          path: tmp/rspec-plan

      - name: RSpec (fatiado por no, pelo plano)
        env:
          IDX: ${{ matrix.ci_node_index }}
          DIGEST: ${{ needs.rspec-plan.outputs.digest }}
        run: |
          set -euo pipefail
          # O plano baixado tem de ser o mesmo que o job de plano conferiu.
          echo "$DIGEST  tmp/rspec-plan/plan.json" | sha256sum -c -
          mapfile -t TESTS < <(jq -r --argjson i "$IDX" '.shards[$i][]' tmp/rspec-plan/plan.json)
          if [ "${#TESTS[@]}" -eq 0 ]; then echo "No $IDX sem specs no plano."; exit 1; fi
          for spec in "${TESTS[@]}"; do
            test -f "$spec" || { echo "Spec do plano nao existe: $spec"; exit 1; }
          done
          echo "No $IDX: ${#TESTS[@]} arquivos de spec"
          bundle exec rspec --profile=10 --format progress --format json --out tmp/rspec_results.json "${TESTS[@]}"

      # Keep the failed spec as the gate; only produce diagnostic files after it.
      # This lets developers without the Rails runtime recover the official dump.
      - name: Regenerar formatos do Guia para diagnóstico de falha
        if: failure()
        run: bundle exec rails autonomia:guia:formatos

      - name: Publicar formatos gerados em falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guide-generated-${{ matrix.ci_node_index }}
          path: |
            lib/operator_guide/formatos-das-acoes.json
            lib/operator_guide/formatos-das-acoes-cobertura.md
            lib/operator_guide/parametros-das-leituras.json

      - name: Publicar resultado do RSpec
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspec-results-${{ matrix.ci_node_index }}
          path: tmp/rspec_results.json
          if-no-files-found: ignore

      - name: Publicar log do Rails em falha
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rails-log-${{ matrix.ci_node_index }}
          path: log

  # #2024: o RSpec carrega o schema.rb e nunca roda migration. Este job parte do schema.rb da base (a main de antes do
  # PR, ou a base da rodada da fila, que junta as migrations de todos os PRs do lote), roda as migrations novas pelo
  # caminho do db:migrate da green (com o strong_migrations) e confere: o código anterior aguenta o schema novo, o
  # down de cada uma volta à base, o up de novo chega ao mesmo lugar e o schema.rb é o que as migrations produzem.
  # Versão repetida entre PRs do lote também para aqui. Regras: docs/migrations-em-lote.md.
  migrations:
    name: Migrations do lote
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Mesma major da produção (18.3 nas duas stacks). O RSpec acima segue no 16. A imagem 18 guarda os dados em
        # /var/lib/postgresql/18/docker e recusa montagem em /var/lib/postgresql/data: o tmpfs vai na pasta de cima.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --entrypoint redis-server
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ''
      # Banco só deste job: o teste apaga e recria o banco várias vezes.
      POSTGRES_DATABASE: chatwoot_migrations_lote
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          # No PR o checkout é o merge com a main: o primeiro pai é a base.
          fetch-depth: 2
          persist-credentials: false

      - name: Descobrir a base e se o lote mexe no banco
        id: base
        env:
          EVENTO: ${{ github.event_name }}
          BASE_DA_FILA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "$EVENTO" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            merge_group)
              base="$BASE_DA_FILA"
              git fetch --no-tags --depth=1 origin "$base"
              ;;
            *)
              echo "Sem base para comparar ($EVENTO): nada a testar."
              echo "tem=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # Migration que já está na main rodou em produção: editar, apagar ou renomear não muda o banco de ninguém e
          # só faz o código divergir do que rodou. Correção vai numa migration nova.
          alteradas=$(git diff --name-only --diff-filter=MDR "$base" HEAD -- db/migrate)
          if [ -n "$alteradas" ]; then
            printf '::error::Migration que já está na main foi alterada, apagada ou renomeada:\n%s\n' "$alteradas"
            exit 1
          fi
          # O próprio verificador também dispara o teste (sem migration nova, ele confere o schema.rb).
          mudou=$(git diff --name-only "$base" HEAD -- db/migrate db/schema.rb lib/migrations_seguras \
            lib/tasks/migrations_seguras.rake config/initializers/strong_migrations.rb)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -z "$mudou" ]; then
            echo "O lote não mexe em db/migrate nem no schema.rb."
            echo "tem=false" >> "$GITHUB_OUTPUT"
          else
            printf 'Arquivos do banco no lote:\n%s\n' "$mudou"
            echo "tem=true" >> "$GITHUB_OUTPUT"
          fi

      # Fixado no SHA (v1.331.0), como no passo do deploy que confere o schema contra a blue.
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8
        if: steps.base.outputs.tem == 'true'
        with:
          bundler-cache: true

      - name: Testar as migrations do lote
        if: steps.base.outputs.tem == 'true'
        env:
          BASE: ${{ steps.base.outputs.base }}
          MIGRATIONS_SEGURAS_BANCO: chatwoot_migrations_lote
          MIGRATIONS_SEGURAS_BASE_SCHEMA: tmp/migrations-lote/base_schema.rb
          MIGRATIONS_SEGURAS_BASE_MIGRATIONS: tmp/migrations-lote/base_migrations.txt
          MIGRATIONS_SEGURAS_BASE_RETIRADAS: tmp/migrations-lote/base_retiradas.yml
          MIGRATIONS_SEGURAS_RELATORIO: tmp/migrations-lote/relatorio.md
        run: |
          set -euo pipefail
          mkdir -p tmp/migrations-lote
          git show "$BASE:db/schema.rb" > "$MIGRATIONS_SEGURAS_BASE_SCHEMA"
          git ls-tree --name-only "$BASE" db/migrate/ > "$MIGRATIONS_SEGURAS_BASE_MIGRATIONS"
          # O anúncio de remoção vale como estava na base: nunca no mesmo lote que a remoção.
          if [ -n "$(git ls-tree --name-only "$BASE" -- db/retiradas.yml)" ]; then
            git show "$BASE:db/retiradas.yml" > "$MIGRATIONS_SEGURAS_BASE_RETIRADAS"
          fi
          bundle exec rake db:create
          bundle exec rake migrations_seguras:verificar

      - name: Relatório no resumo do job
        if: always() && steps.base.outputs.tem == 'true'
        run: |
          if [ -f tmp/migrations-lote/relatorio.md ]; then
            cat tmp/migrations-lote/relatorio.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # Check obrigatorio da fila de merge. `if: always()` e indispensavel: um check
  # obrigatorio pulado conta como verde, e sem ele uma parte que falhou faria este job
  # ser pulado. O job de migrations entra aqui para virar obrigatorio sem mexer no ruleset (#2024).
  rspec:
    name: RSpec
    needs: [rspec-plan, backend-tests, migrations]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Todas as partes do RSpec passaram?
        env:
          PLANO: ${{ needs.rspec-plan.result }}
          PARTES: ${{ needs.backend-tests.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
        run: |
          echo "plano=$PLANO partes=$PARTES migrations=$MIGRATIONS"
          [ "$PLANO" = success ] && [ "$PARTES" = success ] && [ "$MIGRATIONS" = success ]
