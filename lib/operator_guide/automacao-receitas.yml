# As receitas prontas da Automação livre (#2498, PR 3 da F5 do #2414): uma automação já montada, que a porta da nova
# abre no editor, desligada. Ela só vira automação quando a pessoa salva.
#
# `receita` está no formato da receita salva. O spec spec/services/autonomia/automacao/catalogo_receitas_spec.rb falha
# quando uma receita não passa no esquema ou na Receita (com as flags ligadas), quando o gatilho não existe no catálogo
# ou quando falta o título, o texto ou o nome em pt_BR e en (automacaoLivre.json, RECEITAS.<chave>).
# O texto da mensagem fica em português: vira o texto da automação da pessoa, que ela muda no editor. Sem valor do
# contato: contato sem nome faria o passo pular, e no WhatsApp o nome às vezes é o número. Quem quiser o nome põe depois.
#
# Quais entram (D-R1, Rodrigo 03/11): só as que o motor de hoje monta. Rodízio espera a #2502, Fora do horário a #2503.
# Reclamação e Orçamento (#2523) usam o "decidir" da IA: a IA lê a mensagem e escolhe o caminho; não há lista de
# palavras. A etiqueta vai por nome: a conta que ainda não a tem recebe a etiqueta sem cor (o editor avisa). Cada uma só
# começa na conversa que ainda não tem a etiqueta, então a IA não lê de novo a cada mensagem e a equipe é avisada uma vez.
# Boas-vindas (#2526) começa na mensagem, não no conversa.criada: a conversa que a equipe abre (Nova conversa, modelo,
# campanha, agendamento, follow-up, comentário) também é criada, e o cliente receberia "já vamos te responder" sem ter
# escrito. Ela só segue na primeira mensagem da conversa, vinda do cliente, numa conversa que o cliente começou.
#
# O ícone e a cor da porta ficam no LivrePortas.vue (o Tailwind só enxerga as classes escritas nos .vue). A flag que a
# receita pede sai dos passos (`requer` em automacao-passos.yml).

BOAS_VINDAS:
  receita:
    gatilho:
      tipo: mensagem.criada
      filtros:
        - { campo: { $valor: mensagem.tipo }, op: igual, valor: recebida }
        - { campo: { $valor: mensagem.primeira }, op: igual, valor: true }
        - { campo: { $valor: conversa.iniciada_por }, op: igual, valor: cliente }
    passos:
      - id: p1
        tipo: mensagem
        texto: ['Olá! Recebemos sua mensagem e já vamos te responder.']

AGRADECER:
  receita:
    gatilho: { tipo: conversa.resolvida }
    passos:
      - id: p1
        tipo: mensagem
        texto: ['Obrigado pelo contato! Se precisar, é só chamar.']

RECLAMACAO:
  receita:
    gatilho:
      tipo: mensagem.criada
      filtros:
        - { campo: { $valor: mensagem.tipo }, op: igual, valor: recebida }
        - { campo: { $valor: conversa.etiquetas }, op: nao_contem, valor: reclamacao }
    passos:
      - id: p1
        tipo: decidir
        le: [mensagens_recentes]
        pergunta: 'O cliente está reclamando de alguma coisa?'
        caminhos:
          - nome: Reclamação
            chave: reclamacao
            descricao: 'O cliente reclama de um problema: atraso, defeito, cobrança errada, atendimento ruim ou promessa não cumprida.'
            passos:
              - id: p2
                tipo: acao
                acao: PATCH conversations/:conversation_id/labels/alterar
                descricao: Pôr a etiqueta reclamacao
                caminho: { conversation_id: { $valor: conversa.id } }
                corpo: { por: [reclamacao] }
              - id: p3
                tipo: avisar
                texto: ['Chegou uma reclamação nesta conversa. Vale responder logo.']
                para: { responsavel: true }
          - nome: Outro assunto
            chave: outro_assunto
            descricao: 'Dúvida, pedido, elogio ou qualquer mensagem que não é reclamação.'
            passos: []

ORCAMENTO:
  receita:
    gatilho:
      tipo: mensagem.criada
      filtros:
        - { campo: { $valor: mensagem.tipo }, op: igual, valor: recebida }
        - { campo: { $valor: conversa.etiquetas }, op: nao_contem, valor: orcamento }
    passos:
      - id: p1
        tipo: decidir
        le: [mensagens_recentes]
        pergunta: 'O cliente está pedindo orçamento, preço ou cotação?'
        caminhos:
          - nome: Orçamento
            chave: orcamento
            descricao: 'O cliente quer saber quanto custa, pede um orçamento, uma cotação ou uma proposta.'
            passos:
              - id: p2
                tipo: acao
                acao: PATCH conversations/:conversation_id/labels/alterar
                descricao: Pôr a etiqueta orcamento
                caminho: { conversation_id: { $valor: conversa.id } }
                corpo: { por: [orcamento] }
              - id: p3
                tipo: avisar
                texto: ['Pediram orçamento nesta conversa.']
                para: { responsavel: true }
          - nome: Outro assunto
            chave: outro_assunto
            descricao: 'Dúvida, reclamação, elogio ou qualquer mensagem que não pede preço.'
            passos: []
