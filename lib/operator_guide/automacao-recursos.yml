# O que a Automação livre pode fazer como passo "ação da plataforma" (#2414 F3, ADR-001 2.1, D3 e D13).
#
# Cada recurso do catálogo do Guia (o controller de cada ação em formatos-das-acoes.json) está aqui, em `passo` ou
# em `fora`, com o motivo. "Fora" é o padrão: em `passo`, só as ações listadas viram passo; as outras do mesmo recurso
# continuam fora. O spec spec/services/autonomia/automacao/acoes_permitidas_spec.rb falha quando um recurso novo
# aparece sem classificação, quando uma ação liberada some ou fica com formato incompleto, quando ela não tem
# desfazer (Acoes::SEM_DESFAZER) ou é só da tela, e quando é apagar estrutura (F3.11).
#
# DELETE (#2660 D1): entra só o de item simples que o desfazer do Guia alcança (apaga ou arquiva o registro dentro da
# requisição, pelo model), nunca o de estrutura (AcoesPermitidas::ESTRUTURA) nem o que apaga em lote ou num job. O spec
# guarda a lista dos DELETE liberados: um DELETE novo aqui só passa entrando lá, com a leitura do controller.
#
# `exige`: campos que a receita tem de preencher além do que a plataforma pede. Etiqueta e atributo criados pela
# automação levam descrição (F3.10).
# `fixos`: campo que a receita manda sempre com este valor (o atributo da conversa sem `merge` apagaria os outros).
# `proibe`: campo que a receita não pode mandar; o ponto entra no campo de dentro (`objeto.campo`).
# `um_de`: campo que a receita tem de mandar, com um destes valores, mesmo quando a plataforma aceita mais (fechar o
# card: só ganho ou perdido; reabrir desfaz um desfecho sem ninguém olhando).
#
# Liberar uma ação vale pelo que ela faz quando uma pessoa clica: resolver a conversa dispara a pesquisa de satisfação
# da caixa e as regras da conta; mover o card dispara as automações da etapa. É a cascata da D6, contada na cadeia
# comum (F1), não um passo escondido.
#
# Liberar uma ação nova: ler o controller, conferir que o desfazer do Guia a alcança e que ela não fala com o cliente
# nem sai da plataforma (isso é passo nativo, F4/F8), e só então pôr aqui.

passo:
  labels:
    motivo: Criar e alterar etiqueta da conta (D13). Apagar fica só no Guia (F3.11).
    acoes:
      POST labels: { exige: [description] }
      PATCH labels/:id: {}
      PUT labels/:id: {}
  conversations/alterar_etiquetas:
    motivo: Pôr e tirar etiqueta da conversa uma a uma, sem trocar a lista inteira (#2202).
    acoes:
      PATCH conversations/:conversation_id/labels/alterar: {}
  contacts/alterar_etiquetas:
    motivo: Pôr e tirar etiqueta do contato uma a uma, sem trocar a lista inteira (#2461).
    acoes:
      PATCH contacts/:contact_id/labels/alterar: {}
  contacts/notes:
    motivo: >-
      Deixar, mudar e apagar uma nota no contato, como a pessoa faz na tela de notas (G19, #2636; mudar e apagar pela
      D1 do #2660, escolha do Rodrigo). A nota sai no nome de quem ligou a automação, como as outras ações, e quem muda
      a nota passa a ser o autor dela, como na tela; qual automação fez fica no registro dela e na auditoria. Apagar
      tira só a nota, pelo model, e o desfazer a põe de volta.
    acoes:
      POST contacts/:contact_id/notes: {}
      PATCH contacts/:contact_id/notes/:id: {}
      PUT contacts/:contact_id/notes/:id: {}
      DELETE contacts/:contact_id/notes/:id: {}
  custom_attribute_definitions:
    motivo: >-
      Criar e alterar atributo de conversa, contato, empresa ou card (D13). Trocar a chave ou o modelo deixaria os
      valores já gravados órfãos, então fica fora. Apagar fica só no Guia (F3.11).
    acoes:
      POST custom_attribute_definitions: { exige: [attribute_description] }
      PATCH custom_attribute_definitions/:id: { proibe: [custom_attribute_definition.attribute_key, custom_attribute_definition.attribute_model] }
      PUT custom_attribute_definitions/:id: { proibe: [custom_attribute_definition.attribute_key, custom_attribute_definition.attribute_model] }
  contacts:
    motivo: >-
      Criar e alterar o contato e os atributos dele (criar: G17, #2660 lote B). A foto fica de fora (a plataforma
      buscaria uma URL de fora), e bloquear também: corta a conversa com o cliente. No criar, o `source_id` também:
      solto, ele toma a identidade de outro contato na caixa.
    acoes:
      POST contacts: { proibe: [avatar, avatar_url, blocked, source_id] }
      PATCH contacts/:id: { proibe: [avatar, avatar_url, blocked] }
      PUT contacts/:id: { proibe: [avatar, avatar_url, blocked] }
  contacts/customers:
    motivo: >-
      Marcar o contato como cliente (#2660 lote B) e voltar a lead (D1): o DELETE só troca o tipo do contato, sem
      apagar nada.
    acoes:
      POST contacts/:contact_id/customer: {}
      DELETE contacts/:contact_id/customer: {}
  companies:
    motivo: >-
      Criar e alterar a empresa e os atributos dela (criar: #2660 lote B). A foto fica de fora (a plataforma buscaria
      uma URL de fora).
    acoes:
      POST companies: { proibe: [avatar] }
      PATCH companies/:id: { proibe: [avatar] }
      PUT companies/:id: { proibe: [avatar] }
  companies/contacts:
    motivo: >-
      Pôr o contato na empresa (#2660 lote B) e tirar (D1): o DELETE só desliga o contato da empresa, sem apagar
      nenhum dos dois.
    acoes:
      POST companies/:company_id/contacts: {}
      DELETE companies/:company_id/contacts/:id: {}
  conversations:
    motivo: Atributo, prioridade e status da conversa.
    acoes:
      POST conversations/:id/custom_attributes: { fixos: { merge: true } }
      POST conversations/:id/toggle_priority: {}
      POST conversations/:id/toggle_status: {}
  conversations/assignments:
    motivo: Atribuir a conversa a uma pessoa ou a um time (D13). Para a agente de IA, só o passo ia_assumir, pela Atribuição (G15).
    acoes:
      POST conversations/:conversation_id/assignments: { proibe: [assignee_type] }
  crm/cards:
    motivo: >-
      Alterar o card, movê-lo de etapa, fechá-lo como ganho ou perdido (G25, #2650) pela mesma porta da tela
      (Crm::Cards::Closer), ligar e desligar o contato e a conversa dele, e restaurar o arquivado (#2660 lote B).
      Reabrir fica fora. O `force` do fechar e do restaurar também: no restaurar, ele restaura mesmo com outro card
      aberto do cliente e duplica.
    acoes:
      PATCH crm/cards/:id: {}
      PUT crm/cards/:id: {}
      POST crm/cards/:id/move: {}
      POST crm/cards/:id/close: { um_de: { result: [won, lost] }, proibe: [force] }
      POST crm/cards/:id/link_contact: {}
      POST crm/cards/:id/unlink_contact: {}
      POST crm/cards/:id/link_conversation: {}
      POST crm/cards/:id/unlink_conversation: {}
      POST crm/cards/:id/restore: { proibe: [force] }
  crm/cards/restores:
    motivo: Restaurar cards arquivados pelos ids (#2660 lote B). O `force` fica fora, como no restaurar de um card só.
    acoes:
      POST crm/cards/restore: { proibe: [force] }
  crm/cards/contacts:
    motivo: >-
      Criar um contato e ligá-lo ao card (#2660 lote B). A rota pede a chave `Idempotency-Key`; o motor manda uma por
      execução e pedido (AcoesDoMotor), e a repetição do passo devolve o mesmo contato em vez de criar outro.
    acoes:
      POST crm/cards/:card_id/contact: {}
  crm/memoria_fatos:
    motivo: >-
      Aceitar a sugestão, destravar e marcar "não vale mais" num fato da memória do card (#2660 lote B). Pela automação,
      aceitar e destravar dispensam a conferência da pessoa (destravar desfaz a trava que alguém pôs): quem monta a
      automação é quem decide isso. Criar o fato fica fora: `valor` e `item_ref` vão crus para Crm::Memoria::Correcao,
      e o formato não diz o tipo.
    acoes:
      POST crm/memoria/cards/:card_id/fatos/:id/aceitar: {}
      POST crm/memoria/cards/:card_id/fatos/:id/destravar: {}
      POST crm/memoria/cards/:card_id/fatos/:id/nao_vale_mais: {}
  crm/stages:
    motivo: >-
      Criar e alterar etapa do funil (D13; formato completo desde o #2460). Reordenar fica fora, inclusive a posição
      de uma etapa só, no criar e no alterar: ela muda a ordem do funil. A etapa criada vai para o fim. Apagar fica
      só no Guia (F3.11).
    acoes:
      POST crm/pipelines/:pipeline_id/stages: { proibe: [position] }
      PATCH crm/stages/:id: { proibe: [position] }
      PUT crm/stages/:id: { proibe: [position] }
  inbox_members:
    motivo: Pôr agente na caixa (D13). O PATCH troca a lista inteira e pode tirar gente; fica fora.
    acoes:
      POST inbox_members: {}
  # #2660 lote A: retorno e agenda. As rotas de crm/ pedem também a chave de funis (AcoesPermitidas.de_funil?), além
  # da chave de cada tela, que o endpoint confere com a função de quem ligou.
  crm/follow_ups:
    motivo: >-
      Alterar, concluir, cancelar, remarcar e dispensar o lembrete de um retorno que já existe (#2660 lote A). Criar é o
      passo nativo `retorno` (G3, D2), que confere o envio automático; a rota crua fica fora. Pelo mesmo motivo, o
      modo (`automation_mode`) e o `metadata`, onde mora o texto e o modelo do envio automático, ficam fora: pela rota
      crua, trocariam a mensagem ao cliente por fora da regra do passo (só modelo UTILITY).
    acoes:
      PATCH crm/follow_ups/:id: { proibe: [automation_mode, metadata] }
      PUT crm/follow_ups/:id: { proibe: [automation_mode, metadata] }
      POST crm/follow_ups/:id/complete: {}
      POST crm/follow_ups/:id/cancel: {}
      POST crm/follow_ups/:id/reschedule: {}
      POST crm/follow_ups/:id/dismiss_reminder: {}
      # D1: o DELETE do retorno só cancela (FollowUpsController#destroy chama o cancel); nada é apagado.
      DELETE crm/follow_ups/:id: {}
  crm/follow_up_series:
    motivo: >-
      Mudar "esta e as próximas", pausar, retomar e encerrar a série de um retorno que repete (#2660 lote A). As vezes
      da série nascem só como lembrete para a equipe (Crm::FollowUps::SeriesMaterializer), sem mensagem ao cliente.
    acoes:
      PATCH crm/follow_up_series/:id: {}
      PUT crm/follow_up_series/:id: {}
      POST crm/follow_up_series/:id/pause: {}
      POST crm/follow_up_series/:id/resume: {}
      POST crm/follow_up_series/:id/end: {}
  crm/meetings:
    motivo: >-
      Registrar se a reunião aconteceu, como o "Aconteceu" e o "Não compareceu" da tela (#2660 lote A). O primeiro
      "Aconteceu" pode mover o card pela regra da página e dispara o gatilho "reunião atendida": cascata da D6. Criar,
      alterar e apagar a reunião mexem na agenda do Google ou da Microsoft e avisam o cliente; sincronizar, resumir,
      convidar e sugerir horário chamam fora ou gastam IA paga. Ficam fora.
    acoes:
      POST crm/meetings/:id/record_outcome: {}
  crm/booking_pages:
    motivo: >-
      Criar a página de agendamento (nasce desligada), alterar, publicar e pausar (#2660 lote A), com a chave
      `agendamento_manage` de quem ligou. Os textos que vão ao cliente sozinhos (convite e avisos de reunião marcada,
      véspera e uma hora antes) ficam fora, como o layout de e-mail (D5): mudam o que todo cliente recebe. A caixa da
      agenda e a dos avisos o formato recusa (o pedido não as declara). Passar reuniões fica fora: troca a pessoa do
      lembrete com update_columns, que o desfazer não alcança. Apagar é estrutura (D1); logo, foto, identidade e
      convite de teste são arquivo, credencial ou mensagem.
    acoes:
      POST crm/booking_pages: {}
      PATCH crm/booking_pages/:id:
        proibe: [invite_text, notice_templates, notice_texts, booking_page.invite_text, booking_page.notice_templates, booking_page.notice_texts]
      PUT crm/booking_pages/:id:
        proibe: [invite_text, notice_templates, notice_texts, booking_page.invite_text, booking_page.notice_templates, booking_page.notice_texts]
      POST crm/booking_pages/:id/publish: {}
      POST crm/booking_pages/:id/pause: {}
  crm/my_booking_hours:
    motivo: >-
      Ajustar os dias e horas em que quem ligou aceita reuniões, ou pausar a agenda dele (#2660 lote A). A rota só mexe
      na agenda de quem chama: não há parâmetro de pessoa.
    acoes:
      PUT crm/my_booking_hours: {}
  crm/booking_invites:
    motivo: >-
      Gerar o link de agendamento do cliente, sem mandar (#2660 lote A). Mandar na conversa é o passo mensagem com o
      link da agenda; "copiado" é gesto da tela. Cancelar o link (D1) grava a data do cancelamento, sem apagar.
    acoes:
      POST crm/booking_invites: {}
      DELETE crm/booking_invites/:id: {}

