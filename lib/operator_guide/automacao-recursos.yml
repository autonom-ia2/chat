  - motivo: Grava em lote fora da requisição, onde o desfazer não chega (Acoes::SEM_DESFAZER).
    recursos:
      - bulk_actions
      - crm/cards/bulk
      - data_imports
      - contact_imports
      - campaign_imports
      - campaign_import_audiences
      - brand_kit_imports
      - actions/contact_merges
      - autonomia/tarefas
  - motivo: >-
      Ação em grupo da Lista de Relacionamentos (#2894): grava em muitas pessoas de uma vez, e a pessoa confirma antes
      (Acoes::SEM_DESFAZER). A automação cria card e põe etiqueta uma pessoa por vez, pelos passos dela.
    recursos:
      - relacionamentos/cards
      - relacionamentos/etiqueta
  - motivo: >-
      Trazer minha lista (#2896): a pessoa envia a planilha, confere o que foi lido e traz pela tela. Enviar e trazer
      gravam em lote, num job; colunas, respostas e linhas só valem dentro dessa conferência. Desfazer uma lista
      trazida apaga pessoas e esvazia campos em lote, também num job. No Guia, as dez escritas pedem confirmação e não
      têm desfazer (Relacionamentos::Trazer::Trazer::SEM_DESFAZER_DO_GUIA).
    recursos:
      - relacionamentos/trazer/leituras
      - relacionamentos/trazer/colunas
      - relacionamentos/trazer/linhas
      - relacionamentos/trazer/listas
  - motivo: >-
      Carteira de seguros (#2897): corrigir um seguro, marcar como cancelado e voltar a ativo mudam o dado de um cliente
      que a corretora confere com a apólice na mão; nesta entrega é ação de pessoa, na gaveta do seguro, não passo de
      automação. Guardar e tirar o PDF nem chegam ao catálogo: só se fazem na tela (Acoes::SO_NA_TELA).
    recursos:
      - relacionamentos/seguros
  - motivo: Mexe nas próprias automações e vigias. Automação que monta automação é laço de montagem, não uso.
    recursos:
      - automation_rules
      - autonomia/automacoes
      - autonomia/automacoes_ia
      - autonomia/automacoes_webhook
      # #2931: responder o pedido de aprovação é da pessoa que a automação escolheu, nunca de outra automação.
      - autonomia/aprovacoes
      - crm/stage_automations
      - crm/stage_automation_steps
      - crm/cards/automacoes
      - autonomia/vigias
  - motivo: >-
