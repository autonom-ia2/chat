# Como o editor da Automação livre mostra cada passo (#2414 F5, ADR-001 2.2).
#
# O formato de cada campo (tipo, obrigatório, opções, limites) não mora aqui: sai do código, pelo catálogo do Guia
# (formatos-das-acoes.json) e pelo esquema da receita (automacao-receita.schema.json). Aqui fica só o que o código
# não sabe dizer: o nome do passo, o grupo do seletor, de onde vem cada parâmetro do caminho e qual peça da tela mostra
# cada campo. `rake autonomia:guia:automacao` junta tudo em automacao-passos.json, que o editor e o Guia leem.
#
# O spec spec/services/autonomia/automacao/catalogo_spec.rb falha quando:
# - uma ação liberada em automacao-recursos.yml não está em `acoes` nem em `so_guia`;
# - um campo da ação não está em `campos` nem em `escondidos` (os proibidos e os fixos ficam de fora sozinhos);
# - a peça da tela não serve para o tipo do campo, ou o parâmetro do caminho não tem de onde vir;
# - falta a frase em pt_BR ou en (automacaoLivre*.json);
# - um passo nativo do esquema não está em `nativos` nem em `nativos_fora_do_editor`.
#
# `caminho`: o parâmetro vem de um valor do alvo (`conversa.id`, ver Valores) ou de uma escolha na tela (`escolher:`).
# `campos`: nome do campo (o ponto entra no campo de dentro) => peça da tela. As peças estão em Catalogo::PECAS.
# `escondidos`: campos que a ação aceita e a tela não mostra, com o motivo no comentário.
# `so_guia`: ação liberada no motor que o editor não mostra, com o motivo. O Guia continua montando com ela.

grupos: [IA, MENSAGEM, CONVERSA, FUNIL, CONTATO, ETIQUETA, ATRIBUTO, EQUIPE, OUTRO_SISTEMA, CONTROLE]

nativos:
  esperar: { grupo: CONTROLE }
  esperar_ate: { grupo: CONTROLE }
  se: { grupo: CONTROLE }
  parar: { grupo: CONTROLE }
  # `requer`: a flag da conta sem a qual o seletor não oferece o passo. Quem recusa de verdade é a Receita, ao salvar
  # (passo_desligado), e o executor, ao rodar (mensagens_desligadas).
  mensagem: { grupo: MENSAGEM, requer: automacao_mensagens }
  avisar: { grupo: MENSAGEM, requer: automacao_mensagens }
  # G14 (#2630): disparar campanha e marcar "não recebe". `peca`: o passo inteiro numa peça só (LivreCampanha.vue).
  campanha: { grupo: MENSAGEM, requer: automacao_mensagens, peca: campanha }
  # G2: e-mail ao contato pela caixa de e-mail da conta. `rotulos`: a caixa de e-mail tem rótulo próprio (o "caixa_id" da
  # campanha é a caixa do WhatsApp).
  email: { grupo: MENSAGEM, requer: automacao_mensagens, rotulos: { caixa_id: caixa_id_email } }
  # F7: os passos de IA, na chave da própria conta. Quem recusa de verdade é a Receita, ao salvar (ia_desligada).
  decidir: { grupo: IA, requer: automacao_ia }
  extrair: { grupo: IA, requer: automacao_ia }
  escrever: { grupo: IA, requer: automacao_ia }
  # G41: `rotulos` troca o rótulo de um campo só neste passo (a instrução do resumo é opcional e diz o que mais trazer).
  resumir: { grupo: IA, requer: automacao_ia, rotulos: { instrucao: instrucao_do_resumo } }
  # G24 (#2771): um card por item de uma lista que a IA acha na conversa. Cria card, então pede também a flag dos
  # gatilhos de card e a chave de funis (`funil`), como o "criar card"; quem recusa de verdade é a Receita, ao salvar e ao
  # ligar. `peca`: o passo inteiro numa peça só (LivreParaCada.vue).
  para_cada: { grupo: IA, requer: automacao_ia, funil: true, peca: para_cada }
  # G15: passar a conversa à agente de IA, pela Atribuição. Sem flag própria: o painel diz quando a conta não tem agente
  # que receba conversa, e o motor pula com o motivo.
  ia_assumir: { grupo: EQUIPE }
  # G3 (#2629): o retorno para a equipe. A mensagem ao cliente na hora pede a flag da F4; quem recusa é a Receita.
  # `rotulos`: o título da tarefa tem rótulo próprio (o "titulo" da campanha é o nome dela).
  retorno: { grupo: EQUIPE, rotulos: { titulo: titulo_do_retorno } }
  # G18 (#2671): os passos de dentro rodam no contato guardado num campo ou nos outros cards do contato. Os cards pedem a
  # chave de funis: o painel só os oferece a quem pode mexer no funil, e quem recusa de verdade é a Receita.
  em_outro_registro: { grupo: CONTROLE }
  # G13 (#2670): mandar os dados para outro sistema e gravar a resposta. Quem recusa é a Receita (webhook_desligado).
  # `chave`: a permissão sem a qual o seletor não oferece o passo (mandar dados para fora é integração, #2027).
  # `rotulos`: a descrição do webhook tem rótulo próprio (o "descricao" do "para cada item" é outro).
  webhook: { grupo: OUTRO_SISTEMA, requer: automacao_gatilhos, chave: integration_manage, rotulos: { descricao: descricao_do_webhook } }
  # G4: criar card numa etapa, com a flag dos gatilhos de card (F6). `funil`: só para quem pode mexer no funil
  # (RegraDoFunil.chave?: crm_manage_pipelines ou crm_admin), como o gatilho de card; quem recusa de verdade é a API,
  # ao salvar e ao ligar.
  card: { grupo: FUNIL, requer: automacao_gatilhos, funil: true }
  # G52: pôr o contato na lista de e-mail; a campanha de e-mail com a lista vai para quem está nela na hora do envio.
  # Sem flag de conta: as campanhas de e-mail ligam pela instalação, e quem recusa de verdade é a Receita, ao salvar.
  # `peca`: a escolha da lista, carregada das listas da conta.
  lista_de_email: { grupo: CONTATO, peca: lista_de_email }
  # G66 (#2843, decisão 14): passar a conversa para o responsável do card, depois da troca do dono. Só com gatilho de
  # card (a Receita recusa nos outros), que já pede a chave de funis: por isso `funil` e a flag dos gatilhos de card.
  conversa_ao_responsavel: { grupo: EQUIPE, requer: automacao_gatilhos, funil: true }
  # G21 (#2706): buscar empresas na Prospecção e marcar a recusa do lead. Sem flag própria: quem recusa é a Receita
  # (Prospecção desligada, sem a chave dela). `peca`: o passo inteiro numa peça só (LivreProspeccao.vue).
  prospeccao: { grupo: FUNIL, peca: prospeccao }

# Passos nativos do esquema que o editor ainda não mostra, com o motivo e a Issue que os leva para a tela. A receita
# aceita e o motor roda; a tela só os mostra quando tiver as peças.
nativos_fora_do_editor: {}

# Os valores da mensagem que disparou o gatilho (#2496, Valores::MENSAGEM). Só existem no "Só se" do gatilho dela; o
# editor não os oferece em outro gatilho nem nos passos (a Receita recusa: mensagem_so_no_gatilho). As opções e os
# operadores vêm de Valores::FECHADOS, com a frase em VALOR_DA_MENSAGEM e OPERADOR_DA_MENSAGEM. `mensagem.campanha` (#2681)
# não é fechado: o valor é o nome da campanha, escrito.
valores_do_gatilho: [mensagem.tipo, mensagem.primeira, mensagem.tem_anexo, mensagem.campanha]

# Valor da mensagem que o editor não oferece para escolher, com o motivo. O Guia continua montando com ele, e o editor o
# reconhece: mostra a frase e o tira do "Só se" quando o gatilho muda.
valores_so_guia:
  mensagem.privada: o mesmo que "Tipo da mensagem é nota interna"; duas formas de dizer a mesma coisa confundem

# A condição que já entra no "Só se" quando a pessoa escolhe o gatilho. Dá para trocar ou tirar depois.
filtro_sugerido:
  mensagem.criada: { campo: { $valor: mensagem.tipo }, op: igual, valor: recebida }

acoes:
  conversa_etiquetas:
    acao: PATCH conversations/:conversation_id/labels/alterar
    grupo: CONVERSA
    caminho: { conversation_id: conversa.id }
    campos: { por: etiquetas, tirar: etiquetas }
  conversa_status:
    acao: POST conversations/:id/toggle_status
    grupo: CONVERSA
    caminho: { id: conversa.id }
    campos: { status: escolha, snoozed_until: data_hora }
  conversa_prioridade:
    acao: POST conversations/:id/toggle_priority
    grupo: CONVERSA
    caminho: { id: conversa.id }
    campos: { priority: escolha }
    # A política de SLA não é liberada como passo (automacao-recursos.yml, sla_policies).
    escondidos: [sla_policy_id]
  conversa_atributos:
    acao: POST conversations/:id/custom_attributes
    grupo: CONVERSA
    caminho: { id: conversa.id }
    campos: { custom_attributes: atributos_da_conversa }
  conversa_atribuir:
    acao: POST conversations/:conversation_id/assignments
    grupo: EQUIPE
    caminho: { conversation_id: conversa.id }
    campos: { assignee_id: pessoa, team_id: time }
  caixa_pessoas:
    acao: POST inbox_members
    grupo: EQUIPE
    campos: { inbox_id: caixa, user_ids: pessoas }
  contato_etiquetas:
    acao: PATCH contacts/:contact_id/labels/alterar
    grupo: CONTATO
    caminho: { contact_id: contato.id }
    campos: { por: etiquetas, tirar: etiquetas }
  contato_nota:
    acao: POST contacts/:contact_id/notes
    grupo: CONTATO
    caminho: { contact_id: contato.id }
    campos: { content: texto }
  contato_alterar:
    acao: PATCH contacts/:id
    grupo: CONTATO
    caminho: { id: contato.id }
    campos:
      name: texto
      email: texto
      phone_number: texto
      company_id: empresa
      custom_attributes: atributos_do_contato
    # Dados técnicos do canal e da integração; a pessoa não os reconhece. O Guia continua alcançando.
    escondidos: [additional_attributes, identifier, include_contact_inboxes]
  empresa_alterar:
    acao: PATCH companies/:id
    grupo: CONTATO
    caminho: { id: contato.empresa_id }
    campos:
      name: texto
      description: texto
      domain: texto
      custom_attributes: atributos_da_empresa
    escondidos: [additional_attributes]
  # #2660 lote B (G17): criar contato e empresa, marcar cliente e criar o contato do card (ex. 8 e 11). O que o passo cria
  # não vira alvo da execução; agir no registro novo é a G18.
  contato_criar:
    acao: POST contacts
    grupo: CONTATO
    campos:
      name: texto
      email: texto
      phone_number: texto
      company_id: empresa
      custom_attributes: atributos_do_contato
    # Dados técnicos do canal e da integração, como no "Atualizar o contato", e a caixa (`inbox_id`), que a peça da
    # caixa não aceita pelo tipo. O Guia continua alcançando.
    escondidos: [additional_attributes, identifier, inbox_id]
  empresa_criar:
    acao: POST companies
    grupo: CONTATO
    campos:
      name: texto
      description: texto
      domain: texto
      custom_attributes: atributos_da_empresa
    escondidos: [additional_attributes]
  contato_cliente:
    acao: POST contacts/:contact_id/customer
    grupo: CONTATO
    caminho: { contact_id: contato.id }
    campos: {}
  card_contato_criar:
    acao: POST crm/cards/:card_id/contact
    grupo: FUNIL
    caminho: { card_id: card.id }
    campos:
      name: texto
      email: texto
      phone_number: texto
      custom_attributes: atributos_do_contato
    # Cidade e país: o catálogo tipa como lista, mas o campo é objeto (#2663).
    escondidos: [additional_attributes.city, additional_attributes.country]
  etiqueta_criar:
    acao: POST labels
    grupo: ETIQUETA
    campos: { title: texto, description: texto, color: cor, show_on_sidebar: sim_nao }
  etiqueta_alterar:
    acao: PATCH labels/:id
    grupo: ETIQUETA
    caminho: { id: { escolher: etiqueta } }
    campos: { title: texto, description: texto, color: cor, show_on_sidebar: sim_nao }
  atributo_criar:
    acao: POST custom_attribute_definitions
    grupo: ATRIBUTO
    campos:
      attribute_display_name: texto
      attribute_key: texto
      attribute_model: escolha
      attribute_display_type: escolha
      attribute_description: texto
      attribute_values: lista_de_textos
    # Conferência do valor por padrão de texto: é configuração de quem programa, não de quem monta a automação.
    escondidos: [regex_cue, regex_pattern]
  atributo_alterar:
    acao: PATCH custom_attribute_definitions/:id
    grupo: ATRIBUTO
    caminho: { id: { escolher: atributo } }
    campos:
      custom_attribute_definition.attribute_display_name: texto
      custom_attribute_definition.attribute_description: texto
      custom_attribute_definition.attribute_values: lista_de_textos
    # attribute_model e filter_type de fora do envelope só filtram a resposta; regex é como no criar. Trocar o tipo de
    # um atributo que já tem valores gravados confunde esses valores; o Guia alcança, com a pessoa olhando.
    escondidos:
      - attribute_model
      - filter_type
      - custom_attribute_definition.attribute_display_type
      - custom_attribute_definition.regex_cue
      - custom_attribute_definition.regex_pattern
  # G25 (#2650): fechar o card como ganho ou perdido, como na tela. Só com os gatilhos de card (F6), que dão o card ao
  # passo, e só para quem pode mexer no funil (`funil`, como o passo "card" da G4); quem recusa de verdade é a API.
  card_fechar:
    acao: POST crm/cards/:id/close
    grupo: FUNIL
    requer: automacao_gatilhos
    funil: true
    caminho: { id: card.id }
    campos: { result: escolha, lost_reason: texto }
    # O ganho fica com o valor do card: o Closer só troca o valor (e a moeda) quando eles vêm.
    escondidos: [value_cents, currency]

so_guia:
  PUT labels/:id: Faz o mesmo que o PATCH, que o editor já mostra.
  PUT custom_attribute_definitions/:id: Faz o mesmo que o PATCH, que o editor já mostra.
  PUT contacts/:id: Faz o mesmo que o PATCH, que o editor já mostra.
  PUT companies/:id: Faz o mesmo que o PATCH, que o editor já mostra.
  PATCH crm/cards/:id: O card só vira alvo com os gatilhos de card (F6); na F5 os gatilhos são de conversa.
  PUT crm/cards/:id: O card só vira alvo com os gatilhos de card (F6); na F5 os gatilhos são de conversa.
  POST crm/cards/:id/move: O card só vira alvo com os gatilhos de card (F6); na F5 os gatilhos são de conversa.
  POST crm/pipelines/:pipeline_id/stages: Etapa é estrutura do funil; entra no editor com os passos de funil (F6), quando a tela filtrar por crm_manage_pipelines.
  PATCH crm/stages/:id: Etapa é estrutura do funil; entra no editor com os passos de funil (F6), quando a tela filtrar por crm_manage_pipelines.
  PUT crm/stages/:id: Etapa é estrutura do funil; entra no editor com os passos de funil (F6), quando a tela filtrar por crm_manage_pipelines.
  # #2660 lote B: liberadas no motor, fora do editor. Nenhum dos 20 exemplos usa; são ajuste e manutenção de registro.
  POST companies/:company_id/contacts: Pôr o contato na empresa; o editor já faz pelo "Atualizar o contato", no campo Empresa.
  POST crm/cards/:id/link_contact: Ligar outro contato ao card é ajuste de cadastro; nenhum dos 20 exemplos usa.
  POST crm/cards/:id/unlink_contact: Desligar o contato do card é ajuste de cadastro; nenhum dos 20 exemplos usa.
  POST crm/cards/:id/link_conversation: Ligar outra conversa ao card é ajuste de cadastro; nenhum dos 20 exemplos usa.
  POST crm/cards/:id/unlink_conversation: Desligar a conversa do card é ajuste de cadastro; nenhum dos 20 exemplos usa.
  POST crm/cards/:id/restore: Restaurar card arquivado é manutenção; nenhum dos 20 exemplos usa.
  POST crm/cards/restore: Restaurar cards arquivados em lote é manutenção; nenhum dos 20 exemplos usa.
  POST crm/memoria/cards/:card_id/fatos/:id/aceitar: O fato da memória é escolhido pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  POST crm/memoria/cards/:card_id/fatos/:id/destravar: O fato da memória é escolhido pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  POST crm/memoria/cards/:card_id/fatos/:id/nao_vale_mais: O fato da memória é escolhido pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  # #2660 lote A: retorno e agenda, liberados no motor e fora do editor. O retorno, a série, a reunião e a página são
  # escolhidos pelo id, que nenhum valor do alvo traz e a tela não oferece; nenhum dos 20 exemplos usa.
  PATCH crm/follow_ups/:id: O retorno é escolhido pelo id, que a tela não oferece; criar é o passo "retorno".
  PUT crm/follow_ups/:id: Faz o mesmo que o PATCH; o retorno é escolhido pelo id, que a tela não oferece.
  POST crm/follow_ups/:id/complete: O retorno é escolhido pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  POST crm/follow_ups/:id/cancel: O retorno é escolhido pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  POST crm/follow_ups/:id/reschedule: O retorno é escolhido pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  POST crm/follow_ups/:id/dismiss_reminder: O retorno é escolhido pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  PATCH crm/follow_up_series/:id: A série é escolhida pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  PUT crm/follow_up_series/:id: Faz o mesmo que o PATCH; a série é escolhida pelo id, que a tela não oferece.
  POST crm/follow_up_series/:id/pause: A série é escolhida pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  POST crm/follow_up_series/:id/resume: A série é escolhida pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  POST crm/follow_up_series/:id/end: A série é escolhida pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  POST crm/meetings/:id/record_outcome: A reunião é escolhida pelo id, que nenhum valor do alvo traz; nenhum dos 20 exemplos usa.
  POST crm/booking_pages: Criar página de agendamento é configuração da agenda; nenhum dos 20 exemplos usa.
  PATCH crm/booking_pages/:id: A página é escolhida pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  PUT crm/booking_pages/:id: Faz o mesmo que o PATCH; a página é escolhida pelo id, que a tela não oferece.
  POST crm/booking_pages/:id/publish: A página é escolhida pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  POST crm/booking_pages/:id/pause: A página é escolhida pelo id, que a tela não oferece; nenhum dos 20 exemplos usa.
  PUT crm/my_booking_hours: Os horários pedem uma grade de dias e horas que o editor não tem; nenhum dos 20 exemplos usa.
  POST crm/booking_invites: Gerar o link sem mandar só serve com o passo mensagem, que já leva o link da agenda.
  # #2660 D1: o DELETE de item simples entra no motor; o editor não mostra DELETE (catalogo_spec).
  PATCH contacts/:contact_id/notes/:id: A nota é escolhida pelo id, que a tela não oferece; deixar a nota é o "Deixar uma nota".
  PUT contacts/:contact_id/notes/:id: Faz o mesmo que o PATCH; a nota é escolhida pelo id, que a tela não oferece.
  DELETE contacts/:contact_id/notes/:id: Apagar fica no Guia e no motor; o editor não mostra DELETE.
  DELETE contacts/:contact_id/customer: Voltar a lead fica no Guia e no motor; o editor não mostra DELETE.
  DELETE companies/:company_id/contacts/:id: Tirar da empresa fica no Guia e no motor; o editor não mostra DELETE.
  DELETE crm/follow_ups/:id: Cancelar o retorno fica no Guia e no motor; o editor não mostra DELETE.
  DELETE crm/booking_invites/:id: Cancelar o link fica no Guia e no motor; o editor não mostra DELETE.
  # #2660 lote D: configuração do atendimento, liberada no motor e fora do editor. Nenhum dos 20 exemplos usa; é ajuste
  # de configuração, que o Guia monta com a pessoa olhando.
  POST teams: Criar time é configuração do atendimento; nenhum dos 20 exemplos usa.
  PATCH teams/:id: O time é escolhido pelo id, e alterar time é configuração; nenhum dos 20 exemplos usa.
  PUT teams/:id: Faz o mesmo que o PATCH; alterar time é configuração.
  POST teams/:team_id/team_members: Pôr gente no time é configuração da equipe; nenhum dos 20 exemplos usa.
  DELETE teams/:team_id/team_members: Tirar do time fica no Guia e no motor; o editor não mostra DELETE.
  POST canned_responses: Resposta pronta é configuração do atendimento; nenhum dos 20 exemplos usa.
  PATCH canned_responses/:id: A resposta pronta é escolhida pelo id, que a tela não oferece.
  PUT canned_responses/:id: Faz o mesmo que o PATCH; a resposta pronta é escolhida pelo id.
  DELETE canned_responses/:id: Apagar fica no Guia e no motor; o editor não mostra DELETE.
  POST custom_filters: Filtro salvo é preferência de tela de quem ligou; nenhum dos 20 exemplos usa.
  PATCH custom_filters/:id: O filtro é escolhido pelo id, que a tela não oferece.
  PUT custom_filters/:id: Faz o mesmo que o PATCH; o filtro é escolhido pelo id.
  DELETE custom_filters/:id: Apagar fica no Guia e no motor; o editor não mostra DELETE.
  POST crm/saved_views: Visão salva é preferência de tela do funil; nenhum dos 20 exemplos usa.
  PATCH crm/saved_views/:id: A visão é escolhida pelo id, que a tela não oferece.
  PUT crm/saved_views/:id: Faz o mesmo que o PATCH; a visão é escolhida pelo id.
  DELETE crm/saved_views/:id: Apagar fica no Guia e no motor; o editor não mostra DELETE.
  POST sla_policies: Política de SLA é configuração do atendimento; nenhum dos 20 exemplos usa.
  PATCH sla_policies/:id: A política é escolhida pelo id, que a tela não oferece.
  PUT sla_policies/:id: Faz o mesmo que o PATCH; a política é escolhida pelo id.
  POST assignment_policies: Política de distribuição é configuração do atendimento; nenhum dos 20 exemplos usa.
  PATCH assignment_policies/:id: A política é escolhida pelo id, que a tela não oferece.
  PUT assignment_policies/:id: Faz o mesmo que o PATCH; a política é escolhida pelo id.
