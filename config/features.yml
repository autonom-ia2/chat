- name: crm_numeros_lentes
  display_name: CRM › Números por papel (visão "Só eu")
  enabled: true
  column: feature_flags_ext_1

# Contato pelo e-mail recebido (#1813, parte do #1701): quando chega um e-mail escrito pelo próprio contato (From é
