  display_name: CRM › Números · De onde vieram os clientes
  enabled: false
  column: feature_flags_ext_2

# Lista de conversas "Quem está esperando" (#2202, PR1). Ligada: o item da lista vira o CardDaConversa (2 ou 3 linhas:
