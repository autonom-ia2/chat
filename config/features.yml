# Horário único da caixa (#1619, flag #1649). A posição na lista é o bit: entra no FIM, e a Orquestração confere a
# posição na main antes de ligar. Ligada: o fuso da caixa (`inbox.timezone`) é o fuso da conta (`reporting_timezone`)
# e a IA (`EngagementGate`) e o SLA (`Sla::ScheduleResolver`) deixam de ler o calendário de caixa do CRM
# (`Crm::ServiceSchedule` com dono Inbox): valem o horário do Chatwoot (`working_hours`) e o calendário da pessoa.
# Desligada (padrão até 19/10/2026): tudo como antes, com a coluna `inboxes.timezone` e o calendário de caixa do CRM. Sem migration;
# nasce ligada nas contas 1, 16 e 18 da Hub2You pela Orquestração. Voltar = desligar a flag.
- name: horario_unico_caixa
