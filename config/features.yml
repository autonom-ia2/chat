- name: contato_relacao
  display_name: Contatos › este contato é interessado, parceiro ou não é negócio
  enabled: false
  column: feature_flags_ext_2

# CRM › Números › "De onde vieram os clientes" (#2001, F6 do #1871). Ligada: a visão "Equipe" de Números ganha o
