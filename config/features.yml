# Conversa aberta na campanha (#1335, épico #1320): na campanha do WhatsApp oficial, quem falou com a caixa nas últimas
# 24 horas recebe uma mensagem escrita (sem modelo), com a ajuda para escrever; a janela é conferida de novo em cada envio.
# Nasce ligada em todas as contas (decisão do Rodrigo; migration 20261024100001). Desligada numa conta: a campanha manda
# o modelo para todos e a API campaign_journey/conversa_aberta responde 404.
- name: campaign_open_window_text
  display_name: Campanha com mensagem escrita para quem falou nas últimas 24 h
  enabled: true
  column: feature_flags_ext_1

# "Criar com IA" e "Melhorar com IA" nos Modelos do WhatsApp (#1333). Bit 19 (524288), confirmado pela Orquestração:
# fica LOGO ABAIXO de `campaign_open_window_text` (#1448, bit 18). Desligada (padrão): os botões não aparecem, e o
# endpoint e o job de sugestão respondem 404, também sem `whatsapp_templates_journey`. Piloto na conta 16, ligada pela
# Orquestração depois do deploy (sem migration). Liberar para todas: Refs #1450.
- name: whatsapp_templates_ai
  display_name: Modelos do WhatsApp com IA (criar e melhorar)
  enabled: false
  column: feature_flags_ext_1

# Tela nova de "Nova conversa / Enviar mensagem" (#1459): gaveta no padrão da casa (para quem, por onde, a mensagem e a
# prévia de como a pessoa recebe). Bit 20 (1048576), confirmado pela Orquestração: fica LOGO ABAIXO de
# `whatsapp_templates_ai` (#1333, bit 19). Desligada numa conta: o lápis do menu e o botão "Enviar mensagem"
# abrem o popover antigo do Chatwoot. Nasce ligada em todas as contas (decisão do Rodrigo; migration 20261026100000).
# Refs #1459.
- name: nova_conversa_tela
  display_name: Nova conversa em gaveta (para quem, por onde, mensagem e prévia)
  enabled: true
  column: feature_flags_ext_1

# Follow-up de IA com dados reais (#1336, épico #1320). Bit 21 (2097152), LOGO ABAIXO de `nova_conversa_tela`
# (#1459, bit 20). Fora das 24 h, a variável do modelo que o perfil (`WhatsappTemplateProfile#fields`) liga a uma chave
# do catálogo (`negocio.valor`, `negocio.prazo`, `negocio.responsavel`, `cliente.*`…) vai com o dado do card, e o
# modelo cujo campo ligado não tem dado no card não é oferecido à IA. Desligada (padrão): a IA preenche tudo, como antes.
- name: followup_template_real_values
  display_name: Follow-up de IA com dados reais do card nos modelos
  enabled: false
  column: feature_flags_ext_1

# Lembretes novos do CRM (#1460 repetir, #1461 sem card, #1462 quem recebe). Bit 22 (4194304), reservado pela
# Orquestração: fica LOGO ABAIXO de `followup_template_real_values` (#1336, bit 21).
# Desligada (padrão): o "Novo lembrete" do calendário abre a janela antiga e o card, o Relacionamento e o calendário
# não mostram repetir nem quem recebe; a API (#1537) continua, sem uso. Ligar: #1527.
- name: crm_lembretes_v2
  display_name: Lembretes que repetem, sem card e com quem recebe
  enabled: false
  column: feature_flags_ext_1
