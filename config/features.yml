# cabe); se outra flag entrar antes na main, esta vai para o fim e o bit sobe (ajustar o spec/models/account_spec.rb).
# Desligada (padrão até 19/10/2026): o envio é o de antes (tudo como texto, motor padrão; o "Reagir" e o "Editar" do #1709 só com ela).
# A reação pela pele (`conversa_cara_do_canal`) existe sem ela, pelo PUT /api/reaction do motor padrão. Com as duas
# desligadas, o webhook da caixa WAHA recebe todo `message_updated`; com a pele ligada e esta desligada, o
# Waha::RichNative::SilentUpdate silencia as marcas da pele (reação, lida, prévia, áudio ouvido...). O que vale
# mesmo sem ela: as chaves do contrato com o conector não são aceitas pela API pública (ContractGuard e
# ForgeryGuard); do conector, o voto de enquete nativa, a resposta a evento nativo e o aviso de visualização única
# viram atividade escondida, e o cabeçalho de álbum guarda `waha_album`; a conversa ganha `whatsapp_api_group` e a
# mensagem, `c2y_revocable` (false sem ela). Sem migration; ligar é com a Orquestração.
- name: whatsapp_rich_native
  display_name: Mensagens ricas nativas pelo WhatsApp API (Híbrido e WAHA)
  enabled: true
  column: feature_flags_ext_1

# Tela inicial da caixa de conversas (#1801): sem conversa aberta, o painel da direita mostra o resumo do dia —
# esperam você, sem responsável, fora do prazo (só com SLA), a próxima conversa e, para quem tem report_manage, a
# linha da equipe — contados no servidor (GET tela_inicial/resumo). Posição 36 na feature_flags_ext_1, bit 35
# (34359738368), logo depois de `whatsapp_rich_native` (tabela da Orquestração, 19/10). Desligada (padrão até 19/10/2026): o aviso
# "selecione uma conversa" de sempre. Sem migration. Nasce ligada nas contas 1, 16 e 18 da stack Hub2You
# (Orquestração, depois do deploy).
- name: tela_inicial_resumo
  display_name: Tela inicial com o resumo do dia
  enabled: true
  column: feature_flags_ext_1

# Quem escreveu cada e-mail, para as IAs (#1807, Refs #1601). Ligada: e-mail que chega de um endereço que não é do
# cliente (alguém em cópia, a equipe, resposta automática) vai às IAs com o aviso "escrito por outra pessoa"; vale para o
# pedido, mas não vira dado pessoal do cliente na memória e não bloqueia o contato (opt-out). E toda IA lê só o que foi
# escrito naquele e-mail, sem o histórico citado (Crm::Email::Autoria). Posição 37 na feature_flags_ext_1, bit 36
# (68719476736), logo depois de `tela_inicial_resumo` (tabela da Orquestração, 19/10). Desligada: tudo como antes.
# Padrão das contas novas: ligada desde o #1913 (migration 20261108180000), pedido do Rodrigo em 19/10/2026. Antes, só
# nas contas 1, 16 e 18 da stack Hub2You.
- name: email_autoria
  display_name: Quem escreveu cada e-mail, para as IAs
  enabled: true
  column: feature_flags_ext_1

# Conversa de e-mail com a cara do Gmail (#1786, #1809, épico #1701): na caixa de e-mail a conversa vira uma sequência
# de cartões (foto, remetente real, para/cc, data, corpo limpo, citação em "…", anexos), com o assunto no topo e
# Responder / Responder a todos / Encaminhar no fim. Separada da `conversa_cara_do_canal` para não ligar sozinha onde
# o WhatsApp já está ligado. Posição 38 na feature_flags_ext_1, bit 37 (137438953472), logo depois de `email_autoria`
# (tabela da Orquestração, 19/10). Desligada: a conversa de e-mail de sempre. Padrão das contas novas: ligada desde o
# #1913 (migration 20261108180000), pedido do Rodrigo em 19/10/2026. Antes, só nas contas 1, 16 e 18 da stack Hub2You
# e na conta 1 da stack Autonom.ia.
- name: conversa_email_nova
  display_name: Conversa de e-mail com a cara do Gmail
  enabled: true
  column: feature_flags_ext_1

# Contato salvo na agenda do aparelho antes de enviar pelo WhatsApp API e lida ao responder (#1865). Ligada: antes do
# envio pelo WAHA (Híbrido e caixa WAHA comum, inclusive campanha WhatsApp API), o contato é consultado e salvo na
# agenda do celular, sem sobrescrever nome que o dono salvou (Waha::AgendaDoContato); e a resposta ao cliente (atendente,
# robô, follow-up, automação; não campanha) marca a conversa como lida antes de sair (ConversaCanal::LeituraAoResponder,
# que usa a lida do #1702 e depende também de `conversa_cara_do_canal`). Posição 39 na feature_flags_ext_1, bit 38
# (274877906944), logo depois de `conversa_email_nova` (tabela da Orquestração, 19/10): a posição na lista é o bit; se
# outra flag entrar antes na main, esta vai para o fim e o bit sobe (ajustar o spec/models/account_spec.rb). Desligada
# (padrão): tudo como antes.
# Sem migration. Nasce ligada nas contas 1, 16 e 18 da stack Hub2You (Orquestração, depois do deploy).
- name: whatsapp_agenda_do_contato
  display_name: Contato na agenda do aparelho e lida ao responder (WhatsApp API)
  enabled: false
  column: feature_flags_ext_1

# "Lido" do e-mail sincronizado com o servidor do cliente (#1870): na caixa de e-mail com IMAP (Gmail e Microsoft por
# OAuth, ou senha), abrir a conversa no painel marca os e-mails dela como lidos no servidor, "marcar como não lida" tira
# o lido do último lá, e a conversa vira lida aqui quando o cliente leu no servidor o último e-mail recebido (janela de
# 2 dias). Caixa só com encaminhamento não sincroniza. Posição 40 na feature_flags_ext_1, bit 39 (549755813888), logo
# depois de `whatsapp_agenda_do_contato` (tabela da Orquestração, 19/10). Tabela própria
# conversa_canal_email_lidos (migration). Desligada: tudo como antes. Padrão das contas novas: ligada desde o #1913
# (migration 20261108180000), pedido do Rodrigo em 19/10/2026. Antes, só nas contas 1, 16 e 18 da stack Hub2You e na
# conta 1 da stack Autonom.ia.
- name: email_lido_sincronizado
  display_name: Lido do e-mail sincronizado com o servidor
  enabled: true
  column: feature_flags_ext_1

# CRM › Números por papel, visão "Só eu" (#1897, F3 do épico #1871). Ligada: CRM › Números abre a visão de quem abre
# (quem vende, quem atende, quem vende e atende; o papel vem do tipo do funil), com o seletor "Só eu · Equipe" para quem
