# administrador, "Excluir de vez" (card, vários, funil e os cards ao excluir um contato). Também só com ela ligada
# (decisão do Rodrigo, 23/10): tirar um agente da conta solta os cards dele (Agents::DestroyJob, #2097) e excluir um contato
# anonimiza os cards e cancela as reuniões futuras. Desligada: as telas e o servidor de sempre, como na main; as rotas
# novas das Partes B e C respondem nos dois casos. Posição 58 na feature_flags_ext_1 (1 << 57), confirmada pela
# Orquestração (23/10). Ligada nas contas existentes das duas stacks. Padrão das contas novas: ligada desde o #2159
# (Rodrigo, 24/10; migration 20261108380000).
- name: crm_arquivados
  display_name: CRM › Arquivados, restaurar e excluir de vez
  enabled: true
  column: feature_flags_ext_1

# Painel do contato enxuto na conversa (#2138). Ligada: o painel da direita vira "Sobre este contato" (nome, quem
# cuida, o combinado, de onde veio e "Mais" só com conteúdo; tela inteira no celular) e o ⋯ do topo da conversa ganha
# "Mudar time ou prioridade" e "Acompanhar esta conversa". Desligada: o painel e o ⋯ de sempre. Só frontend.
# Posição 59 na feature_flags_ext_1 (1 << 58), depois da 58 do crm_arquivados #2097 (Orquestração, 23/10).
# Piloto 1, 16 e 18 por psql. Conta nova nasce ligada pela migration 20261108370000 (Rodrigo, 24/10).
- name: painel_contato_enxuto
  display_name: Painel do contato enxuto na conversa
  enabled: true
  column: feature_flags_ext_1

# O agente só informa; a IA de Atribuição passa a conversa (#2154, regra do Rodrigo de 24/10). Ligada: quando a instrução
# do agente de IA manda passar (`should_handoff`), ele responde o que a instrução diz e continua atendendo; não chama mais
# o `bot_handoff!` (Autonomia::Agents::Operate::Responder). Depois que a fala sai (no último pedaço, na entrega em pedaços),
# a IA de Atribuição do CRM avalia o card em foco (gatilho `fala_do_agente`) e, se decidir passar, entrega pelo
# Crm::Entrega com as regras de sempre, mesmo com o agente no nome (Crm::Ai::HandoffExecutor). O evento da cotação
# (ResponderAoEvento) não muda. Desligada: tudo como antes. Sem migration, sem tela. Posição 60 na feature_flags_ext_1
# (1 << 59), PROVISÓRIA da Orquestração (24/10); definitiva na vez do PR. Piloto 1, 16 e 18 da hub por psql, pela
# Orquestração, depois do NO AR. Padrão das contas novas: ligada desde o #2228 (migration 20261108510000), junto com
# a Fase 2 dos Agentes e o "Agente de IA" por caixa (internal_attributes, Autonomia::AccountProvisioningDefaults).
- name: agente_so_informa
  display_name: Agentes IA › o agente avisa, a Atribuição passa a conversa
  enabled: true
  column: feature_flags_ext_1

# Anúncios da Meta: gestão mínima do anúncio (#2161). Ligada: o detalhe do anúncio mostra se ele está ativo ou
# pausado, com o botão para pausar ou ativar (quem tem meta_ads_manage), e o post da Página por trás do anúncio; a
# Conexão mostra a Página. Desligada: o painel de sempre. Posição 61 na feature_flags_ext_1 (1 << 60), depois da 60
# do agente_so_informa #2166 (Orquestração, 25/10). Ligada em todas as contas existentes das duas stacks por decisão
# do Rodrigo (25/10). Padrão das contas novas: ligada desde o #2191 (migration 20261108440000).
- name: meta_ads_gestao
  display_name: Anúncios da Meta - pausar anúncio e post da Página
  enabled: true
  column: feature_flags_ext_1

# IA de assunto: nome genérico refinado uma vez (#2163). Ligada: o modelo maior diz se o nome que deu ao pedido é
# genérico por falta de informação ("Nova cotação"); o card guarda essa marca. Quando o detalhe chega no mesmo pedido,
# o nome é trocado UMA vez pelo específico, no mesmo card, sem criar outro. Nome dado ou editado por pessoa nunca é
# trocado. O card sem nome que já carregava um pedido (houve "o mesmo assunto" nele) ganha nome pelo mesmo assunto, e o
# pedido novo no mesmo funil vira card novo em vez de apagar o primeiro. Desligada: prompt, schema e comportamento iguais
# aos de antes. Sem migration. Posição 62 na feature_flags_ext_1 (1 << 61), definitiva da Orquestração (25/10), depois
# da 61 do meta_ads_gestao #2164. Piloto 1, 16 e 18 da hub por psql, depois do NO AR.
- name: crm_ia_nome_provisorio
  display_name: CRM › IA refina o nome genérico do pedido
  enabled: false
  column: feature_flags_ext_1

# IA de assunto: dúvida com sinal de pedido novo vira sugestão (#2162). Ligada: quando a IA de assunto fica em dúvida e
# alguém (o Jev ou o modelo maior) viu um pedido novo, a equipe vê a sugestão "Parece um pedido novo: criar card?" no
# painel Assuntos da conversa, em Sugerir e em Automática, e aceita ou ignora. Nada é criado sozinho. Sugestão ignorada
# não volta por 24 h (#1260). Dúvida sem sinal de pedido novo fica como antes. Desligada: a dúvida não muda nada, como
# antes. Sem migration. Posição 63 na feature_flags_ext_1 (1 << 62), definitiva da Orquestração (25/10), depois da 62
# do crm_ia_nome_provisorio #2163; é a última posição da coluna. Piloto 1, 16 e 18 da hub por psql, depois do NO AR.
- name: crm_ia_duvida_vira_sugestao
  display_name: CRM › Dúvida da IA de assunto vira sugestão
  enabled: false
  column: feature_flags_ext_1

# Este contato é (#2084/#2085): interessado (o padrão), parceiro do mercado ou não é negócio, na coluna contacts.relacao.
