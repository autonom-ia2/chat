# Pacote de tradução por conta (#1550). Só folhas que existem em config/locales/pt_BR.yml; veja docs/segmentos/README.md.
pt_BR:
  crm:
    # Critério da IA da etapa antiga "perdido" (#1554): aparece para quem configura o funil.
    stage_criteria:
      legado:
        perdido: 'Lead encerrado sem fechar: o cliente recusou com clareza, pediu para não ser contatado, disse que fechou com outra empresa, o número é inválido, não respondeu depois das tentativas definidas pelo funil, ou o atendente encerrou a conversa sem fechar. Não usar para quem ainda está negociando ou só disse "vou pensar".'
    export:
      columns:
        closed_at: 'Terminou em'
        lost_reason: 'Por que não fechou'
      statuses:
        won: 'Seguro ativo'
        lost: 'Não fechou'
  # Relatório baixado de Anúncios (#1960): a situação de quem veio do anúncio e o que cada palavra quer dizer.
  meta_ads_report:
    glossary: 'Conversa: alguém chamou no WhatsApp depois de tocar num anúncio. Proposta: o card chegou a uma etapa de oportunidade ou negociação. Venda: o card foi marcado como seguro fechado.'
    situation:
      lost: 'Não fechou'
