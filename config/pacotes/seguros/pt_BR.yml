# Pacote de tradução por conta (#1550). Só folhas que existem em config/locales/pt_BR.yml; veja docs/segmentos/README.md.
pt_BR:
  crm:
    # Critério da IA da etapa antiga "perdido" (#1554): aparece para quem configura o funil.
    stage_criteria:
      legado:
        perdido: 'Lead encerrado sem fechar: o cliente recusou com clareza, pediu para não ser contatado, disse que fechou com outra empresa, o número é inválido, não respondeu depois das tentativas definidas pelo funil, ou o atendente encerrou a conversa sem fechar. Não usar para quem ainda está negociando ou só disse "vou pensar".'
    export:
      columns:
        closed_at: 'Terminou em'
        lost_reason: 'Por que não fechou'
      statuses:
        won: 'Seguro ativo'
        lost: 'Não fechou'
    # Vocabulário nas mensagens que a IA escreve ao cliente (#2034). Seguradora, insurtech e corretora herdam esta linha;
    # a corretora e a saúde têm a sua.
    ai:
      vocabulario: 'Fale de seguro, apólice e sinistro; chame de cliente só quem já contratou e de segurado só quem tem apólice.'
  # Relatório baixado de Números › "De onde vieram os clientes" (#2001, F6): a situação do cliente do mês.
  numeros_origens_report:
    situation:
      lost: 'Não fechou'
  # Relatório baixado de Anúncios (#1960): a situação de quem veio do anúncio e o que cada palavra quer dizer.
  meta_ads_report:
    glossary: 'Conversa: alguém chamou no WhatsApp depois de tocar num anúncio. Proposta: o card chegou a uma etapa de oportunidade ou negociação. Venda: o card foi marcado como seguro fechado.'
    situation:
      lost: 'Não fechou'
  # Ramo da conta para a IA de e-mail (#2037). Seguradora e insurtech herdam esta linha.
  email_campaigns:
    ai:
      vocabulario: 'Ramo da conta: seguros. Fale de seguro, apólice, cobertura e renovação em linguagem simples; segurado só para quem já tem apólice; cliente só para quem já comprou.'
  # Painel de desempenho do agente (#2226): o PDF e a planilha dizem "não fechou", nunca "perda".
  autonomia:
    desempenho2:
      c:
        kpi:
          perdas_evitaveis: 'Não fecharam por causa corrigível'
        secoes:
          perdas: 'o que não fechou'
        indice:
          perdas: 'Não fecharam'
        perdas:
          titulo: 'Não fecharam por causa corrigível'
          por_que_descricao: 'Cada procura que não fechou, pela causa principal.'
        tabelas:
          tabela_perdas:
            titulo: 'Não fecharam por causa corrigível'
        planilha:
          procura:
            perda: 'Não fechou, dava para evitar'
