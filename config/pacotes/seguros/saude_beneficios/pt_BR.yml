# Pacote de tradução por conta (#1550). Só folhas que existem em config/locales/pt_BR.yml; veja docs/segmentos/README.md.
pt_BR:
  crm:
    export:
      statuses:
        won: 'Implantado'
    # #2083: a "Venda de plano" é o modelo Vendas com as etapas da saúde (Novo, Cotação, Proposta, Na operadora,
    # Implantado). A recusa da operadora não é perda: o card fica em "Na operadora" até a proposta voltar.
    stage_criteria:
      vendas:
        e1: 'O cliente chegou agora e quer um plano. Ainda não disse quantas vidas são nem mandou as idades para cotar.'
        e2: 'O cliente está mandando os dados para cotar (quantas vidas, idades, cidade, CNPJ se for empresa), ou a equipe disse que está cotando. Ainda não mandou as opções.'
        e3: 'A equipe mandou as opções da cotação, ou pediu a documentação e a declaração de saúde para fazer a proposta. A proposta ainda não foi para a operadora.'
        e4: 'A equipe disse ao cliente que mandou a proposta para a operadora e está esperando a resposta. Pendência da operadora também fica aqui.'
        e5: 'A equipe contou ao cliente que a operadora aprovou e o plano foi implantado: mandou a carteirinha, o número do contrato ou a data de início.'
  # Ramo da conta para a IA de e-mail (#2037).
  email_campaigns:
    ai:
      vocabulario: 'Ramo da conta: planos de saúde e benefícios. Diga plano, vidas, titular e dependentes, operadora e boleto. Não fale em apólice, segurado nem sinistro. Não prometa cobertura, carência, rede nem reajuste.'
