# Pacote de tradução por conta (#1550). Só folhas que existem em config/locales/en.yml; veja docs/segmentos/README.md.
en:
  crm:
    export:
      statuses:
        won: 'Active plan'
    # Vocabulary in the messages the AI writes to the customer (#2034).
    ai:
      vocabulario: 'Talk about plan, member and reimbursement; call someone a client only after they sign up and never say insured.'
  # Line of business for the e-mail AI (#2037).
  email_campaigns:
    ai:
      vocabulario: 'Line of business: health plans and benefits. Say plan and beneficiary. Do not talk about policy, policyholder or claim.'
