# Pacote de tradução por conta (#1550). Só folhas que existem em config/locales/en.yml; veja docs/segmentos/README.md.
en:
  crm:
    # AI criterion of the legacy "perdido" stage (#1554): shown to whoever sets up the pipeline.
    stage_criteria:
      legado:
        perdido: 'Lead ended without closing: the customer clearly refused, asked not to be contacted, said they closed with another company, the number is invalid, there was no reply after the attempts set by the pipeline, or the agent ended the conversation without closing. Do not use for leads still negotiating or who only said "I will think about it".'
    export:
      columns:
        closed_at: 'Ended at'
        lost_reason: 'Why it did not close'
      statuses:
        won: 'Active policy'
        lost: 'Not closed'
  # Downloaded Ads report (#1960): the situation of who came from the ad and what each word means.
  meta_ads_report:
    glossary: 'Conversation: someone messaged on WhatsApp after tapping an ad. Quote: the card reached an opportunity or negotiation stage. Sale: the card was marked as policy closed.'
    situation:
      lost: 'Not closed'
