# https://github.com/ondrejbartas/sidekiq-cron
# use https://crontab.guru/ to validate
# validations for this file exist in /spec/configs/schedule_spec.rb

# executed daily at 0000 UTC
# schedules daily deferred jobs at stable times for each installation
internal_check_new_versions_job:
  cron: '0 0 * * *'
  class: 'Internal::TriggerDailyScheduledItemsJob'
  queue: scheduled_jobs
# # executed At every 5th minute..
trigger_scheduled_items_job:
  cron: '*/5 * * * *'
  class: 'TriggerScheduledItemsJob'
  queue: scheduled_jobs

# #1005: closes audience campaigns stuck in processing (fork job)
campaign_journey_stalled_campaigns_job:
  cron: '*/30 * * * *'
  class: 'CampaignJourney::StalledCampaignsJob'
  queue: scheduled_jobs

# executed hourly for scheduled jobs that do not need minute-level cadence
trigger_hourly_scheduled_items_job:
  cron: '0 * * * *'
  class: 'Internal::TriggerHourlyScheduledItemsJob'
  queue: scheduled_jobs

# executed At every minute..
trigger_imap_email_inboxes_job:
  cron: '*/1 * * * *'
  class: 'Inboxes::FetchImapEmailInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_contact_inboxes_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleContactInboxesJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# which is our lowest traffic time
remove_stale_redis_keys_job.rb:
  cron: '30 22 * * *'
  class: 'Internal::RemoveStaleRedisKeysJob'
  queue: scheduled_jobs

# DISABLED: investigating if this job is the source of orphan conversations
# #executed daily at 0430 UTC
# # which will be IST 10:00 AM
# process_stale_contacts_job:
#   cron: '30 04 * * *'
#   class: 'Internal::ProcessStaleContactsJob'
#   queue: housekeeping

# executed daily at 0100 UTC
# to delete accounts marked for deletion
delete_accounts_job:
  cron: '0 1 * * *'
  class: 'Internal::DeleteAccountsJob'
  queue: scheduled_jobs

# executed every 30 minutes for assignment_v2
periodic_assignment_job:
  cron: '*/30 * * * *'
  class: 'AutoAssignment::PeriodicAssignmentJob'
  queue: scheduled_jobs

# executed daily at 2230 UTC
# removes old notifications (>1 month) and trims to 300 per user
remove_old_notification_job:
  cron: '30 22 * * *'
  class: 'Notification::RemoveOldNotificationJob'
  queue: purgable

# executed every 12 hours
# to remove orphan conversations without contact
remove_orphan_conversations_job:
  cron: '0 */12 * * *'
  class: 'Internal::RemoveOrphanConversationsJob'
  queue: housekeeping

# executed daily at 2315 UTC
purge_expired_campaign_import_files_job:
  cron: '15 23 * * *'
  class: 'CampaignImports::PurgeExpiredFilesJob'
  queue: scheduled_jobs

# executed every minute; feature flag checked inside the job
crm_follow_up_due_job:
  cron: '*/1 * * * *'
  class: 'Crm::FollowUpDueJob'
  queue: scheduled_jobs

# executed every 6 hours; feature flags checked inside the job
crm_ai_stale_cards_job:
  cron: '0 */6 * * *'
  class: 'Crm::Ai::StaleCardsJob'
  queue: scheduled_jobs

# executed every 3 hours; recalcula o decaimento do score a partir dos sinais já gravados,
# sem chamar o modelo. Sem ele, card pontuado alto nunca esfria enquanto não houver mensagem nova.
crm_ai_score_decay_job:
  cron: '30 */3 * * *'
  class: 'Crm::Ai::ScoreDecayJob'
  queue: scheduled_jobs

# executed every 2 minutes; assigns R2 held cards once an agent comes online
crm_ai_handoff_drain_job:
  cron: '*/2 * * * *'
  class: 'Crm::Ai::HandoffDrainJob'
  queue: scheduled_jobs

# executed every 15 minutes; marks stale R3 invite cycles as expired
crm_ai_handoff_expiry_job:
  cron: '*/15 * * * *'
  class: 'Crm::Ai::HandoffExpiryJob'
  queue: scheduled_jobs

# executed hourly; wipes personal data (form, Meta signals) of website clicks that
# expired unattributed or were attributed long ago (#1011, LGPD minimization).
ctwa_tracked_link_clicks_retention_job:
  cron: '35 * * * *'
  class: 'Ctwa::TrackedLinkClicksRetentionJob'
  queue: scheduled_jobs

# executed hourly; prunes idempotency keys past their 24h TTL
crm_idempotency_keys_cleanup_job:
  cron: '15 * * * *'
  class: 'Crm::IdempotencyKeysCleanupJob'
  queue: scheduled_jobs

# executed every 15 minutes; 2-way sync sweep — reconciles imminent meetings with
# the provider calendar (cancel/reschedule made directly in Google/Outlook).
# Meetings flag + CRM_CALENDAR_SYNC_ENABLED checked inside the job.
crm_meeting_sync_sweep_job:
  cron: '*/15 * * * *'
  class: 'Crm::Meetings::SyncSweepJob'
  queue: scheduled_jobs

# executed every 6 hours; (re)creates/renews calendar push subscriptions (S7-B).
# Gated OFF by default (CRM_CALENDAR_WEBHOOKS_ENABLED) — needs domain verification.
crm_calendar_subscription_renewal_job:
  cron: '0 */6 * * *'
  class: 'Crm::Calendar::SubscriptionRenewalJob'
  queue: scheduled_jobs

# executed every 15 minutes; AI auto follow-up planner, flags checked inside the job
crm_ai_auto_followup_scan_job:
  cron: '*/15 * * * *'
  class: 'Crm::Ai::AutoFollowupScanJob'
  queue: scheduled_jobs

# executed every 5 minutes; escalates expired CRM AI handoff invites.
crm_ai_handoff_escalation_job:
  cron: '*/5 * * * *'
  class: 'Crm::Ai::HandoffEscalationJob'
  queue: scheduled_jobs

# executed hourly; refreshes cached USD->BRL rate for CRM AI usage reporting.
crm_ai_exchange_rate_refresh_job:
  cron: '5 * * * *'
  class: 'Crm::Ai::ExchangeRateRefreshJob'
  queue: scheduled_jobs

# executed daily; refreshes Instagram Business Login tokens expiring within 10 days.
instagram_refresh_tokens_job:
  cron: '20 4 * * *'
  class: 'Instagram::RefreshTokensJob'
  queue: scheduled_jobs

# executed every 5 minutes; re-polls SES for pending domain verifications.
# feature flag checked inside the job.
email_campaign_poll_pending_identities_job:
  cron: '*/5 * * * *'
  class: 'EmailCampaigns::PollPendingIdentitiesJob'
  queue: scheduled_jobs

# executed every 5 minutes; enqueues delivery for due scheduled email campaigns.
# feature flag checked inside the job.
email_campaign_schedule_due_campaigns_job:
  cron: '*/5 * * * *'
  class: 'EmailCampaigns::ScheduleDueCampaignsJob'
  queue: scheduled_jobs

# executed every 5 minutes; re-enqueues delivery for sending campaigns with retryable
# (transient-failed) pending recipients past the backoff. Flag checked inside the job.
email_campaign_retry_sweep_job:
  cron: '*/5 * * * *'
  class: 'EmailCampaigns::RetrySweepJob'
  queue: scheduled_jobs

# executed every 10 minutes; pauses tenants over bounce/complaint limits. Flag checked inside the job.
email_campaign_guardrail_sweep_job:
  cron: '*/10 * * * *'
  class: 'EmailCampaigns::GuardrailSweepJob'
  queue: scheduled_jobs

# executed every 6 hours; reaps orphan guided builder drafts (draft + disabled, no activity for 48h).
# window tunable via AUTONOMIA_DRAFT_REAP_HOURS.
autonomia_reap_stale_drafts_job:
  cron: '0 */6 * * *'
  class: 'Autonomia::Agents::ReapStaleDraftsJob'
  queue: scheduled_jobs

# executed every 10 minutes; closes async tool runs whose job chain broke (worker killed mid-deploy,
# enqueue lost). Never resumes the run — it would re-quote at the insurer.
# executed every 30 minutes; pings each configured insurance connection so "Última verificação" is
# minutes old instead of hours. Reuses the stored session, so it never interrupts a running quote.
autonomia_insurance_healthcheck_job:
  cron: '*/30 * * * *'
  class: 'Autonomia::Insurance::Connections::HealthcheckJob'
  queue: scheduled_jobs

autonomia_reap_stale_tool_runs_job:
  cron: '*/10 * * * *'
  class: 'Autonomia::Agents::Tools::ReapStaleRunsJob'
  queue: scheduled_jobs

email_campaign_recipient_import_maintenance_job:
  cron: '*/5 * * * *'
  class: 'EmailCampaigns::RecipientImportMaintenanceJob'
  queue: housekeeping

# Read-only, disabled unless EMAIL_REPUTATION_PROVIDER_MONITOR=true.
email_campaign_provider_monitor_job:
  cron: '*/5 * * * *'
  class: 'EmailCampaigns::ProviderMonitorJob'
  queue: scheduled_jobs

# Recovers only existing maintenance outboxes/expired leases; never creates a run.
# Apply remains separately gated by EMAIL_CAMPAIGN_PROTECTION_BACKFILL_ENABLED.
email_campaign_protection_backfill_reconcile_job:
  cron: '* * * * *'
  class: 'EmailCampaigns::ProtectionBackfillReconcileJob'
  queue: housekeeping

# executed every 5 minutes; Prospecção (#678): lead preso em "em andamento" (enriquecimento ou WhatsApp na fila)
# há mais de 15 minutos volta a um estado retomável. O worker que morre no meio não deixa o lead travado.
autonomia_prospecting_reaper_job:
  cron: '*/5 * * * *'
  class: 'Autonomia::Prospecting::ReaperJob'
  queue: scheduled_jobs

# executed every day at 04:30; apaga o que o Guia fez há mais de 5 dias, quando o
# desfazer já venceu (#855). As mudanças saem junto, pela chave estrangeira.
autonomia_guide_limpar_execucoes_job:
  cron: '30 4 * * *'
  class: 'Autonomia::Guide::LimparExecucoesJob'
  queue: scheduled_jobs

# executed every 5 minutes; retoma a tarefa longa do Guia que ficou sem batimento (#936).
autonomia_guide_tarefas_vigia_job:
  cron: '*/5 * * * *'
  class: 'Autonomia::Guide::TarefasVigiaJob'
  queue: scheduled_jobs

# executed every day at 04:40; apaga os arquivos anexados na conversa com o Guia depois que o link
# deles venceu (1 dia), quando nenhuma pergunta consegue mais lê-los (#857).
autonomia_guide_limpar_arquivos_job:
  cron: '40 4 * * *'
  class: 'Autonomia::Guide::LimparArquivosJob'
  queue: scheduled_jobs

# executed every 15 minutes; o Guia mede as vigias das contas e avisa só o que cruzou o gatilho (#935).
# Espalha um job por conta na fila low; sem nada cruzado, nenhuma chamada a modelo.
autonomia_guide_pulso_job:
  cron: '*/15 * * * *'
  class: 'Autonomia::Guide::PulsoJob'
  queue: scheduled_jobs

# executed every day at 04:50; apaga os avisos do Guia com mais de 30 dias (#935).
autonomia_guide_limpar_avisos_job:
  cron: '50 4 * * *'
  class: 'Autonomia::Guide::LimparAvisosJob'
  queue: scheduled_jobs

# Anúncios da Meta (#1073): gasto de hoje de cada conexão, a cada 30 minutos.
crm_meta_ads_insights_today_job:
  cron: '*/30 * * * *'
  class: 'Crm::MetaAds::InsightsScheduleJob'
  queue: scheduled_jobs
  args: ['today']

# Anúncios da Meta (#1073): relê os 3 dias anteriores, com posicionamento, às 4h de Brasília (07:00 UTC).
# A Meta corrige números recentes. Conexão sem a carga de 90 dias recebe a carga no lugar.
crm_meta_ads_insights_recent_job:
  cron: '0 7 * * *'
  class: 'Crm::MetaAds::InsightsScheduleJob'
  queue: scheduled_jobs
  args: ['recent']

# Anúncios da Meta F4b (#1100): resumo de ontem no WhatsApp do dono às 8h de Brasília (11:00 UTC). Vem desligado;
# só conexões que ligaram o resumo. No máximo um por dia (trava no DeliverJob).
crm_meta_ads_whatsapp_summary_job:
  cron: '0 11 * * *'
  class: 'Crm::MetaAds::WhatsappReport::ScheduleJob'
  queue: scheduled_jobs
  args: ['summary']

# Anúncios da Meta F4b (#1100): alerta de anúncio que gastou hoje sem trazer conversa, às 16h30 de Brasília
# (19:30 UTC). Só conexões que ligaram o alerta; no máximo um por dia.
crm_meta_ads_whatsapp_alert_job:
  cron: '30 19 * * *'
  class: 'Crm::MetaAds::WhatsappReport::ScheduleJob'
  queue: scheduled_jobs
  args: ['alert']

# Anúncios da Meta F5 (#1110): apaga análises do consultor com mais de 90 dias, ações com mais de 400 e janelas de
# frequência com mais de 35, às 5h30 de Brasília (08:30 UTC), depois da leitura das 4h.
crm_meta_ads_advisor_prune_job:
  cron: '30 8 * * *'
  class: 'Crm::MetaAds::Advisor::PruneJob'
  queue: low
