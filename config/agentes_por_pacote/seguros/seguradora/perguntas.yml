# As 3 perguntas do antes e depois de "Atualizar com a nova base" (#1429, F3): o agente responde cada uma com a base de
# hoje e com a nova. Curtas, como quem escreve no WhatsApp, sem dado pessoal: um termo do ramo, um caso de sinistro ou
# evento, e um limite de quem decide. pt_BR e en com o mesmo número de perguntas, na mesma ordem.
pt_BR:
  - "O que é regulação de sinistro?"
  - "Meu carro foi roubado. O que eu faço agora?"
  - "Sou corretor. A proposta que eu mandei vai ser aceita?"
en:
  - "What is claims adjustment?"
  - "My car was stolen. What do I do now?"
  - "I'm a broker. Will the proposal I sent be accepted?"
