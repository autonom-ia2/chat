chave: seguro_condominio
tipo: sdr
nome_padrao: "Assistente de Seguro de Condomínio"
ramo: "Seguro de condomínio"
seguradoras_sugeridas: "Mapfre, Allianz e Bradesco"
blocos:
  - nome: "O pedido"
    perguntas:
      - texto: "É um seguro novo ou a renovação de um que já existe?"
        ligada: true
      - texto: "Qual é a seguradora?"
        se: "já tiver seguro"
        segue: true
      - texto: "Qual o número da apólice atual?"
        se: "já tiver seguro"
        segue: true
      - texto: "Em que dia o seguro atual vence?"
        se: "já tiver seguro"
        segue: true
      - texto: "Há uma classe de bônus, a indicação do histórico do seguro, na apólice?"
        se: "já tiver seguro"
        segue: true
      - texto: "A partir de que dia vocês querem o seguro?"
      - texto: "Até que dia querem que o seguro valha?"
  - nome: "Quem é e contato"
    perguntas:
      - texto: "Qual o CNPJ do próprio condomínio?"
        ligada: true
      - texto: "Qual o nome do condomínio?"
        se: "o nome ainda não estiver na ficha"
        segue: true
        ligada: true
      - texto: "Qual seu nome?"
        ligada: true
      - texto: "Você é o síndico ou cuida disso pela administradora?"
      - texto: "Qual o CPF de quem vai tratar do seguro, para o cadastro de contato?"
      - texto: "Quer deixar outro número ou e-mail para contato?"
      - texto: "Qual é o outro número?"
        se: "quiser contato em outro número"
        segue: true
      - texto: "Qual e-mail a equipe pode usar?"
        se: "quiser contato por e-mail"
        segue: true
      - texto: "O condomínio tem telefone ou e-mail próprio, diferente dos que você já passou?"
      - texto: "Qual o telefone do condomínio?"
        se: "o condomínio tiver telefone próprio"
        segue: true
      - texto: "Qual o e-mail do condomínio?"
        se: "o condomínio tiver e-mail próprio"
        segue: true
  - nome: "Endereço"
    perguntas:
      - texto: "Qual o CEP do condomínio?"
        ligada: true
      - texto: "Qual o endereço do condomínio?"
        se: "não souber o CEP"
        segue: true
        ligada: true
      - texto: "Qual o número do condomínio no endereço?"
        ligada: true
      - texto: "Tem complemento no endereço do condomínio?"
  - nome: "O prédio"
    perguntas:
      - texto: "Em que ano o condomínio foi fundado?"
        ligada: true
      - texto: "Em que ano o prédio foi construído?"
        se: "a construção for de outro ano"
        segue: true
      - texto: "É de prédios ou de casas?"
        ligada: true
      - texto: "Quantos andares tem cada bloco, contando térreo e subsolos?"
        se: "for de prédios"
        segue: true
        ligada: true
      - texto: "Quantas unidades há em cada andar?"
        se: "for de prédios"
        segue: true
      - texto: "Qual a altura do prédio, se souber?"
        se: "for de prédios"
        segue: true
      - texto: "O condomínio é residencial, de escritórios, consultórios, lojas, flat, shopping ou tem mais de um uso?"
        ligada: true
      - texto: "O local tem indústria, logística, galpões, armazéns ou garagem comercial?"
        se: "o uso não tiver ficado claro"
        segue: true
      - texto: "O condomínio já está formalmente constituído, por exemplo com a ata de constituição registrada?"
        se: "isso ainda não tiver sido dito"
      - texto: "A construção é de tijolos ou blocos, de madeira ou mistura dos dois?"
      - texto: "Quantos blocos são ao todo?"
      - texto: "Quantos blocos vocês querem incluir na cotação?"
        se: "houver mais de um bloco"
        segue: true
      - texto: "Quantas unidades são ao todo?"
      - texto: "Quantos elevadores existem no condomínio?"
      - texto: "Quantos elevadores há em cada bloco?"
        se: "houver elevadores e mais de um bloco"
        segue: true
      - texto: "Qual a marca dos elevadores?"
        se: "houver elevadores"
        segue: true
      - texto: "Qual a área construída em metros quadrados?"
        ligada: true
      - texto: "Qual a área total do condomínio em metros quadrados?"
      - texto: "Qual a área comum em metros quadrados?"
      - texto: "Quantas vagas de garagem existem?"
      - texto: "Alguma parte do condomínio é tombada ou preservada pelo patrimônio histórico?"
      - texto: "Quais equipamentos e áreas de lazer o condomínio tem?"
      - texto: "Houve reforma importante no prédio?"
      - texto: "Quando foi essa reforma?"
        se: "houve reforma importante"
        segue: true
  - nome: "Funcionários"
    perguntas:
      - texto: "Quantos funcionários o condomínio tem?"
      - texto: "Os funcionários são do condomínio, terceirizados ou dos dois?"
        se: "houver funcionários"
        segue: true
      - texto: "Quantos empregados são registrados pelo condomínio?"
        se: "houver funcionários"
        segue: true
      - texto: "Os funcionários têm treinamento para incêndio?"
        se: "houver funcionários"
        segue: true
  - nome: "Segurança e incêndio"
    perguntas:
      - texto: "Que itens de segurança o condomínio tem, como câmeras, cerca elétrica ou porteiro eletrônico?"
      - texto: "O condomínio tem extintores?"
      - texto: "Tem hidrantes?"
      - texto: "Tem chuveiros automáticos de incêndio, os sprinklers?"
      - texto: "Tem detectores de fumaça?"
      - texto: "Tem alarme de incêndio?"
      - texto: "Algum alarme é monitorado por uma empresa?"
        se: "houver alarme"
        segue: true
      - texto: "O alarme se comunica pela rede de celular, chamada GPRS, ou por linha telefônica?"
        se: "o alarme for monitorado"
        segue: true
      - texto: "Tem brigada de incêndio, uma equipe preparada para agir em caso de fogo?"
      - texto: "Tem para-raios?"
      - texto: "A vigilância é armada, desarmada ou não há vigilância?"
      - texto: "A vigilância funciona 24 horas?"
        se: "houver vigilância"
        segue: true
      - texto: "Tem botão de pânico?"
      - texto: "Tem central telefônica?"
      - texto: "O AVCB, documento dos bombeiros sobre a segurança contra incêndio, está em dia?"
  - nome: "Valores"
    perguntas:
      - texto: "Vocês têm uma estimativa do custo para reconstruir o prédio, sem o terreno?"
      - texto: "Qual o valor dos bens e equipamentos das áreas comuns, se tiverem esse levantamento?"
      - texto: "Vocês têm um balancete ou comprovante de despesas disponível? Ajuda a equipe a cotar."
  - nome: "Histórico de danos"
    perguntas:
      - texto: "Nos últimos 12 meses, houve algum dano no condomínio, como incêndio, vazamento ou roubo?"
      - texto: "E nos últimos três anos, houve outra ocorrência?"
      - texto: "Em que data aconteceu cada uma?"
        se: "houve ocorrência"
      - texto: "O que aconteceu em cada uma?"
        se: "houve ocorrência"
      - texto: "Qual cobertura foi acionada em cada caso?"
        se: "houve ocorrência e usaram o seguro"
      - texto: "Quanto foi indenizado em cada caso, se souber?"
        se: "houve ocorrência e usaram o seguro"
      - texto: "Vocês têm registro de ocorrências e de uso do seguro de quantos anos para trás?"
      - texto: "Qual o índice de sinistralidade dos últimos três anos, que compara indenizações com o custo do seguro?"
        se: "houver relatório da seguradora"
  - nome: "Proteções"
