documentos:
  - "Identificação do condomínio/CNPJ, se os dados ainda não estiverem reunidos."
  - "Convenção do condomínio e última ata de eleição do síndico."
  - "AVCB disponível, o documento dos bombeiros sobre segurança contra incêndio, com sua situação. A equipe confere a necessidade no caso."
  - "Balancete ou comprovantes de despesas, se tiverem; a equipe confirma se a seguradora vai pedir."
  - "Apólice atual, se já houver seguro, especialmente na renovação."
  - "Laudo ou memorial com o custo de reconstrução, se houver."
  - "Histórico de sinistros, se houver ocorrências e o documento estiver disponível."
  - "Comprovantes de origem dos equipamentos, como notas fiscais: não peça na cotação; só se a equipe pedir depois."
  - "Registro dos manobristas, se houver manobristas e a equipe confirmar a necessidade no produto escolhido."
  - "Planta original, se houver fachada de vidro; a equipe confere a necessidade no produto escolhido."
  - "Convenção coletiva de trabalho, se houver interesse em vida ou acidentes pessoais dos funcionários."
  - "Ata de constituição registrada, se o condomínio não tiver CNPJ e o documento existir; a equipe avalia como seguir, sem garantia de contratação."
ja_vem:
  - fonte: cnpj
    usar_quando: "Use com o CNPJ do próprio condomínio para completar nome, situação e cadastro. Resultado, falha ou ausência ficam só para a equipe, sem recitar nem pedir confirmação. Se indicar administradora, outra empresa ou situação não ativa, anote a divergência para a equipe e siga a coleta, sem concluir aceitação. Endereço cadastral não prova o local segurado; atividade cadastral não prova o uso do prédio."
  - fonte: cep
    usar_quando: "Use com o CEP do condomínio ou da inspeção para completar rua, bairro, cidade e UF; ou com endereço, cidade e UF para buscar o CEP. Anote os dados para a equipe, sem dizer o resultado nem pedir confirmação. Número e complemento vêm do cliente. Se houver ambiguidade, peça só o detalhe que falta, sem recitar resultados. Falha ou ausência de resultado fica para a equipe."
  - fonte: cpf
    usar_quando: "Use com o CPF do representante para conferir apenas a validade do número. Anote para a equipe, sem recitar o resultado ao cliente nem pedir confirmação de dados encontrados. Se o número for inválido, peça que confira a digitação, sem repeti-lo. Não identifica nome ou nascimento e não substitui o CNPJ do condomínio. Se a consulta falhar ou não achar, anote para a equipe, sem anunciar ao cliente."
tambem:
  - fonte: cidades
    usar_quando: "Use com a cidade informada quando cidade e UF ainda não tiverem sido resolvidas pelo CEP. Anote a forma padronizada para a equipe, sem dizer o resultado ao cliente nem pedir confirmação. Se a consulta falhar ou não achar, anote a pendência para a equipe, sem anunciar ao cliente."
  - fonte: localizacao
    usar_quando: "Use quando a pessoa enviar a localização do imóvel para descobrir somente a cidade. Anote para a equipe, sem dizer o resultado ao cliente nem pedir confirmação. A consulta não informa número, área ou características do prédio. Falha ou ausência de resultado fica anotada para a equipe, sem anunciar ao cliente."
  - fonte: feriados
    usar_quando: "Use com a data de vencimento e o local para contar os dias úteis restantes e anotar para a equipe. Não diga o resultado ao cliente nem peça confirmação. Não transforme a contagem em promessa de emissão, aceitação ou início de proteção. Se falhar ou não achar, anote a pendência para a equipe, sem anunciar ao cliente."
