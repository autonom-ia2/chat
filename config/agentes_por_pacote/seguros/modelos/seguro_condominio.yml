        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer avaliar proteção para portões e cancelas automáticos?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer avaliar proteção pela responsabilidade na guarda de veículos na garagem?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer avaliar proteção para incêndio nos bens dos moradores?"
        se: "a pessoa quiser escolher"
        segue: true
