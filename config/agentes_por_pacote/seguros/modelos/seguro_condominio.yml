        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer avaliar proteção para tumultos e greves?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer avaliar proteção para roubo ou furto de bens do condomínio?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer avaliar proteção para roubo ou furto de bens dos moradores?"
        se: "a pessoa quiser escolher"
        segue: true
