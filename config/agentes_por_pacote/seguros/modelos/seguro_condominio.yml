        segue: true
      - texto: "Quer avaliar proteção para alagamento e inundação?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer avaliar proteção para desmoronamento?"
        se: "a pessoa quiser escolher"
        segue: true
