chave: seguro_residencial
tipo: sdr
nome_padrao: "Assistente de Seguro Residencial"
ramo: "Seguro residencial"
seguradoras_sugeridas: "Porto, Bradesco e Tokio Marine"
blocos:
  - nome: "Quem contrata"
    perguntas:
      - texto: "Qual o CPF de quem vai contratar o seguro, ou o CNPJ se for em nome de empresa?"
        ligada: true
      - texto: "Qual o nome completo de quem contrata, como está no documento?"
        ligada: true
  - nome: "Endereço"
    perguntas:
      - texto: "Qual o CEP do imóvel que quer segurar?"
        ligada: true
      - texto: "Qual a rua do imóvel?"
        se: "o CEP for válido mas a consulta não trouxer a rua"
        segue: true
        ligada: true
      - texto: "Qual o bairro do imóvel?"
        se: "o CEP for válido mas a consulta não trouxer o bairro"
        segue: true
        ligada: true
      - texto: "Qual o número do imóvel?"
        ligada: true
  - nome: "O imóvel"
    perguntas:
      - texto: "É casa, casa em condomínio fechado ou apartamento?"
        ligada: true
      - texto: "Qual o número do apartamento?"
        se: "for apartamento"
        segue: true
        ligada: true
      - texto: "Qual o bloco do apartamento?"
        se: "for apartamento"
        segue: true
        ligada: true
      - texto: "O apartamento fica no térreo, na cobertura ou em outro andar?"
        se: "for apartamento"
        segue: true
      - texto: "Quantos metros quadrados tem a construção?"
      - texto: "Como é o teto do imóvel: laje de concreto, forro com travessas de madeira ou outro?"
      - texto: "Do que o imóvel é feito?"
        se: "a pessoa tocar no material da construção"
      - texto: "Quanto das paredes de fora do imóvel é de madeira?"
        se: "a pessoa citar madeira na construção"
        segue: true
      - texto: "O imóvel é moradia o ano todo, de veraneio ou está desocupado?"
        se: "a pessoa tocar no uso ou na ocupação do imóvel"
      - texto: "O imóvel é tombado, protegido pelo patrimônio histórico?"
        se: "a pessoa tocar no assunto"
      - texto: "O imóvel está em obra ou reforma agora?"
      - texto: "O imóvel tem placa de energia solar?"
      - texto: "Alguém trabalha ou tem negócio dentro do imóvel?"
      - texto: "Qual a atividade do trabalho ou negócio feito dentro do imóvel?"
        se: "houver trabalho ou negócio no imóvel"
        segue: true
      - texto: "O imóvel fica em zona rural?"
        se: "o CEP ou a conversa indicar sítio ou estrada e a consulta não tiver respondido"
      - texto: "O imóvel fica perto de rio ou em encosta?"
        se: "o CEP ou a conversa indicar sítio ou estrada e a consulta do endereço não tiver respondido"
      - texto: "Você é dono do imóvel ou inquilino?"
        se: "a pessoa tocar em quem é o dono"
      - texto: "Que proteção o imóvel tem, como alarme, alarme monitorado, cerca elétrica, câmeras, grades, porteiro eletrônico ou vigilância 24 horas?"
        se: "a pessoa tocar na segurança"
  - nome: "O que segurar"
    perguntas:
      - texto: "Quanto você quer segurar, em reais?"
        ligada: true
      - texto: "Quer incluir no seguro a construção, as coisas de dentro do imóvel ou os dois?"
        se: "a pessoa tocar no que quer proteger"
      - texto: "Quais são as principais coisas de dentro do imóvel que quer proteger?"
        se: "a pessoa for incluir as coisas de dentro"
        segue: true
  - nome: "Novo ou renovação"
    perguntas:
      - texto: "É um seguro novo ou a renovação de um que você já tem?"
        ligada: true
      - texto: "Qual a seguradora de hoje, a que está na apólice, o documento do seguro?"
        se: "for renovação"
        segue: true
      - texto: "Qual o número do bônus na apólice atual, ligado ao histórico de uso do seguro?"
        se: "for renovação"
        segue: true
      - texto: "Houve algum sinistro, uma ocorrência de dano ou prejuízo, no seguro atual?"
        se: "for renovação"
        segue: true
      - texto: "Em que dia o seguro atual vence?"
        se: "for renovação"
        segue: true
      - texto: "Qual o número da apólice atual?"
        se: "for renovação"
        segue: true
  - nome: "Proteções"
    perguntas:
      - texto: "Quer escolher as proteções ou prefere que a equipe sugira?"
      - texto: "Quer pedir proteção contra danos elétricos, como aparelho que queima por pico de energia?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir proteção contra roubo?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir proteção para equipamentos eletrônicos, como notebook, TV e celular?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir proteção contra vendaval, granizo e tornado?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir proteção contra batida de veículo no imóvel?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir proteção contra vazamento de tanques e canos?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir ajuda com o aluguel de outro lugar se precisar sair do imóvel por causa de um estrago?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir proteção para o aluguel que deixar de receber por causa de um estrago no imóvel?"
        se: "a pessoa quiser escolher e alugar o imóvel a outra pessoa"
        segue: true
      - texto: "Quer pedir proteção contra desmoronamento, quando parte da construção cai?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir proteção contra alagamento?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir ajuda com o custo de tirar documentos de novo se perder num incêndio ou roubo?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir proteção para danos que você ou sua família causarem a outras pessoas, chamada responsabilidade civil?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir proteção para indenizações por danos morais, como ofensa à honra de outra pessoa?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir proteção para vidros, espelhos e mármores?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir assistência 24 horas, como chaveiro, encanador, eletricista e vidraceiro?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "De quais serviços da assistência 24 horas você precisa?"
        se: "a pessoa quiser escolher e quiser assistência"
        segue: true
      - texto: "Quer pedir proteção para bicicleta?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir proteção contra estrago causado por tumulto, como confusão na rua?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Quer pedir a opção de considerar o preço de um bem novo no lugar do usado?"
        se: "a pessoa quiser escolher"
        segue: true
      - texto: "Qual valor em reais quer para cada proteção que pediu?"
        se: "a pessoa quiser escolher e pedir para definir os valores de cada proteção"
        segue: true
  - nome: "Cadastro"
    perguntas:
      - texto: "Prefere informar o valor aproximado dos seus bens ou uma faixa de renda? É pedido no cadastro."
        se: "for pessoa física"
      - texto: "Qual é o valor aproximado dos seus bens ou a sua faixa de renda?"
        se: "for pessoa física"
        segue: true
      - texto: "Qual o seu estado civil?"
        se: "for pessoa física"
      - texto: "Qual a sua profissão?"
        se: "for pessoa física"
      - texto: "Você ocupa ou ocupou cargo ou função pública importante, ou é parente próximo de quem ocupa? É pedido no cadastro."
        se: "for pessoa física"
      - texto: "Qual a razão social, o nome oficial da empresa?"
        se: "for empresa e a consulta do CNPJ não tiver trazido"
      - texto: "Qual a atividade principal da empresa?"
        se: "for empresa e a consulta do CNPJ não tiver trazido"
      - texto: "Como está a situação financeira da empresa hoje: com as contas em dia ou com alguma dificuldade? É pedido no cadastro."
        se: "for empresa"
  - nome: "Contato"
    perguntas:
      - texto: "Como prefere que a equipe fale com você: por aqui no WhatsApp, por e-mail ou por ligação?"
      - texto: "Quer que liguem para este número ou para outro?"
        se: "preferir ligação"
        segue: true
      - texto: "Qual é o outro número para a equipe ligar?"
        se: "quiser outro número"
        segue: true
      - texto: "Qual é o seu e-mail?"
        se: "preferir e-mail"
        segue: true
documentos:
  - "Apólice atual, se for renovação e ainda não tiver sido enviada."
  - "Contrato de aluguel, se o dono quiser incluir os bens dele no imóvel alugado; a equipe confirma a necessidade."
ja_vem:
  - fonte: cep
    usar_quando: "Use o CEP do imóvel para completar rua, bairro, cidade e estado na ficha. Se o cliente só souber o endereço, busque o CEP com os dados que ele forneceu. CEP válido sem rua ou bairro: pergunte só o dado ausente, um por vez. Se falhar ou não achar, anote a pendência e passe para a equipe sem dizer ao cliente que não achou. Não recite resultados nem peça confirmação."
  - fonte: cpf
    usar_quando: "Use o CPF informado para validar apenas o número; não busca nome. Se o resultado indicar CPF inválido, peça para conferir o número. Falha ou ausência de resultado não é CPF inválido: registre a pendência e passe para a equipe, sem anunciar a falha. Não recite resultados nem peça confirmação de dado consultado."
tambem:
  - fonte: cnpj
    usar_quando: "Use o CNPJ de quem contrata para obter razão social, atividade e situação cadastral na Receita. Anote para a equipe e pule razão social e atividade se respondidas; situação cadastral não responde à pergunta financeira. Não recite resultados nem peça confirmação. Se falhar ou não achar, registre e passe para a equipe sem anunciar ao cliente."
  - fonte: cidades
    usar_quando: "Use quando o cliente fornecer a cidade do imóvel e for necessário identificar cidade e estado. Se o nome for ambíguo, peça só o estado que falta. Anote para a equipe, sem recitar resultado nem pedir confirmação. Se falhar ou não achar, registre e passe para a equipe sem anunciar ao cliente."
  - fonte: localizacao
    usar_quando: "Use a localização enviada no WhatsApp para obter cidade e estado do imóvel e anotar para a equipe. Isso não fornece rua nem número. Peça só os dados que ainda faltam; CEP pode vir da consulta pelo endereço informado. Não recite resultados nem peça confirmação. Se falhar ou não achar, registre e passe para a equipe sem anunciar ao cliente."
  - fonte: corretor_susep
    usar_quando: "Use quando o cliente citar outro corretor e fornecer os dados disponíveis para a consulta, conforme ela aceitar. Anote o resultado somente para a equipe; não recite nem peça confirmação. Se falhar ou não achar, registre a pendência e passe para a equipe sem anunciar ao cliente. Registro e CNPJ da própria corretora vêm do ESCOPO, não desta consulta."
  - fonte: chuva
    usar_quando: "Use local e data já informados no aviso de enchente, alagamento ou temporal para anotar a chuva do dia para a equipe. Não use para decidir cobertura, não atrase socorro nem passagem para a equipe e não peça dados extras só para consultar. Não recite resultados nem peça confirmação. Se falhar ou não achar, registre e encaminhe sem anunciar ao cliente."
  - fonte: queimadas
    usar_quando: "Use o local já informado de imóvel rural, sítio ou chácara para anotar registros de queimadas na região para a equipe. Não decide aceitação ou cobertura. Não recite resultados nem peça confirmação. Se falhar ou não achar, registre e passe para a equipe sem anunciar ao cliente."
premium:
  - risco_endereco
  - imovel_rural
teste:
  - "Quanto custa o seguro da minha casa?"
  - "É um apartamento; quero segurar as coisas de dentro e prefiro sugestões da equipe."
  - "Cobre alagamento com certeza? Pode fechar."
