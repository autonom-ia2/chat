# Critério de IA padrão das etapas do CRM (#1548). Lido por Crm::Ai::DefaultStageCriteria.
# <modelo>.e<n>: a etapa n do modelo de funil (metadata.template, #1498). O pacote de textos por tipo de conta (#1545)
# sobrescreve estas chaves. legado: nomes de funis antigos, sem modelo.
pt_BR:
  crm:
    stage_criteria:
      vendas:
        e1: 'O cliente acabou de chegar: mandou a primeira mensagem ou fez a primeira pergunta. Ainda não sabemos do que ele precisa.'
        e2: 'Estamos entendendo o que o cliente precisa: tirando dúvidas, pegando dados ou marcando horário. Ainda não mandamos preço.'
        e3: 'O cliente já recebeu o preço, o orçamento ou a proposta e está pensando. Ainda não disse sim nem não.'
        e4: 'O cliente quer fechar, mas ainda está acertando detalhes: preço, prazo, forma de pagamento ou desconto.'
        e5: 'O cliente disse sim: aceitou a proposta, pagou, assinou ou pediu o próximo passo para começar.'
      atendimento:
        e1: 'O cliente acabou de pedir ajuda: contou um problema ou fez uma pergunta. Ninguém começou a resolver ainda.'
        e2: 'Alguém da equipe já está cuidando do pedido: entendendo o problema, pedindo dados ou resolvendo. Ainda não está resolvido.'
        e3: 'Pedimos algo ao cliente, como uma foto, um dado ou uma resposta, e estamos esperando ele mandar.'
        e4: 'O pedido do cliente foi resolvido: ele confirmou que deu certo ou não precisa de mais nada.'
      pos_venda:
        e1: 'O cliente acabou de comprar. Ainda não falamos com ele depois da compra.'
        e2: 'Estamos acompanhando a entrega, a instalação ou o começo do uso, e tirando as dúvidas do cliente.'
        e3: 'Pedimos algo ao cliente, como uma foto, um dado ou uma resposta, e estamos esperando ele mandar.'
        e4: 'O cliente recebeu, está usando e disse que está tudo certo.'
      cobranca:
        e1: 'O cliente tem um pagamento que ainda não venceu.'
        e2: 'O vencimento passou e o cliente ainda não pagou nem disse quando vai pagar.'
        e3: 'O cliente disse o dia em que vai pagar. Estamos esperando esse dia.'
        e4: 'O cliente pagou ou mandou o comprovante.'
      agendamentos:
        e1: 'O cliente quer marcar um horário e ainda não escolheu o dia.'
        e2: 'O cliente escolheu dia e hora e o horário ficou marcado. O atendimento ainda não aconteceu.'
        e3: 'O cliente não pôde vir ou pediu outro dia. Falta escolher o novo horário.'
        e4: 'O cliente veio no horário marcado e foi atendido.'
      # #1802: modelos da corretora (camada seguros/corretora). O texto mora aqui, no catálogo base.
      renovacao:
        e1: 'Falamos com o cliente da renovação do seguro que vai vencer, mas ainda não começamos a cotar.'
        e2: 'A equipe disse ao cliente que está cotando a renovação. Ainda não mandou as opções.'
        e3: 'A equipe mandou as opções da renovação e o cliente ainda não escolheu.'
        e4: 'O cliente quer renovar, mas está acertando detalhes: desconto, cobertura ou forma de pagamento.'
        e5: 'O cliente disse que aceita a renovação: escolheu a opção, mandou os dados para pagar ou pediu para emitir.'
      sinistro:
        e1: 'O cliente contou que teve um sinistro (batida, roubo ou dano) e a equipe ainda não disse que abriu o aviso.'
        e2: 'A equipe disse ao cliente que abriu o sinistro (deu protocolo ou número) e a seguradora está analisando. A vez é da seguradora.'
        e3: 'A equipe pediu ao cliente um documento, foto ou boletim de ocorrência e ele ainda não mandou.'
        e4: 'A equipe contou ao cliente a resposta da seguradora sobre o sinistro.'
      endosso:
        e1: 'O cliente pediu um endosso (mudança na apólice) e a equipe ainda não disse que pediu à seguradora.'
        e2: 'A equipe avisou o cliente que pediu a mudança à seguradora e está esperando a resposta dela.'
        e3: 'A equipe pediu ao cliente um documento ou um dado e ele ainda não mandou.'
        e4: 'A equipe avisou o cliente que a mudança foi feita ou mandou a apólice nova.'
      # #2083: modelo da saúde (camada seguros/saude_beneficios). O texto mora aqui, no catálogo base.
      carteira:
        e1: 'O plano do cliente acabou de ser implantado e a equipe está dando as boas-vindas: carteirinha, aplicativo ou como usar a rede.'
        e2: 'O cliente já usa o plano e fala com a equipe por dúvida, boleto, segunda via, inclusão de dependente ou pedido de autorização.'
        e3: 'O contrato do cliente está perto do aniversário e a equipe falou com ele do reajuste ou da renovação.'
        e4: 'O cliente disse que segue com o plano depois do aniversário do contrato, ou trocou de plano com a equipe.'
      legado:
        novo: 'Primeiro contato ou lead recém-criado. Cliente demonstrou interesse inicial, fez primeira pergunta ou respondeu pela primeira vez. Ainda não há diagnóstico de necessidade nem proposta enviada.'
        em_atendimento: 'Conversa ativa com qualificação em andamento: agente ou IA está entendendo necessidade, coletando dados, tirando dúvidas ou agendando. Ainda não houve envio formal de proposta, orçamento ou condições comerciais.'
        proposta: 'Proposta, orçamento, plano ou condições comerciais já foram apresentados. Cliente está avaliando, negociando valores, prazos ou comparando opções. Ainda não confirmou fechamento nem recusa definitiva.'
        fechamento: 'Cliente confirmou intenção de compra, aceitou proposta, solicitou link de pagamento, assinatura ou próximo passo operacional de contratação. Conversa indica conversão iminente ou concluída.'
        perdido: 'Lead encerrado sem conversão: cliente recusou explicitamente, pediu para não ser contatado, informou que fechou com concorrente, número inválido ou sem resposta após tentativas definidas pelo funil, ou conversa foi encerrada pelo agente como perdida. Não usar para leads ainda em negociação ativa ou que apenas disseram "vou pensar".'
        nao_veio: 'O cliente tinha horário marcado e não apareceu, nem avisou antes.'
        novo_atender: 'O cliente acabou de pedir ajuda ou mandou a primeira mensagem. Ninguém começou a resolver ainda.'
