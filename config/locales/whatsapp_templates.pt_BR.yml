    # Autorização do dono para o sistema criar modelos (#1586). O texto de ligar/desligar é o que a tela mostra na
    # confirmação e o que o registro grava: mudou o texto, suba a VERSAO em Whatsapp::Templates::AvisoDeConsentimento.
    consent:
      formato_da_data: "%d/%m/%Y"
      separador_decimal: ","
      separador_milhar: "."
      ligar:
        utility: "Você autoriza o %{marca} a criar modelos de Aviso de serviço por conta própria e a enviá-los aos seus clientes, como o lembrete de pagamento. Os modelos que você já tem continuam como estão. A Meta cobra cada mensagem entregue, mesmo com a conversa aberta: %{preco} por Aviso de serviço (tabela da Meta para o Brasil, em vigor desde %{vigencia}). Exemplo: %{envios} avisos custam %{exemplo}."
        marketing: "Você autoriza também o %{marca} a criar e enviar modelos de Divulgação: ofertas, promoções e convites para o cliente voltar a comprar. A Meta cobra %{preco} por mensagem de Divulgação entregue (tabela da Meta para o Brasil, em vigor desde %{vigencia}) e limita quantas divulgações cada pessoa recebe: algumas podem não ser entregues."
      desligar:
        utility: "O %{marca} para de criar modelos sozinho, de Aviso de serviço e de Divulgação. Os modelos que você já tem continuam como estão."
        marketing: "O %{marca} para de criar e enviar modelos de Divulgação. O Aviso de serviço continua ligado."
      errors:
        acao_invalida: "Escolha ligar ou desligar."
        marca_invalida: "Escolha Aviso de serviço ou Divulgação."
        aviso_mudou: "Os preços da Meta mudaram enquanto você lia. Confira o aviso de novo e confirme."
        utility_desligada: "A Divulgação só liga com o Aviso de serviço ligado."
        somente_administrador: "Só quem administra a conta, ou tem Financeiro em Editar na função, pode mudar."
    # Reenvio do mesmo modelo para outra conversa (#1767, Whatsapp::Templates::ReenvioDoModelo): por que não foi.
    reenvio:
      motivos:
        conta_diferente: "Esta conversa é de outra conta."
        caixa_nao_oficial: "Esta conversa não está numa caixa do WhatsApp oficial, a única que envia modelos."
        nao_e_modelo: "Esta mensagem não é um modelo do WhatsApp, então não dá para reenviá-la como modelo."
        sem_parametros: "Não achamos os dados deste envio da campanha para remontar a mensagem."
        modelo_indisponivel: "Este modelo não está mais aprovado na caixa desta conversa."
        modelo_mudou: "Este modelo foi editado depois do envio e os valores de antes não cabem mais nele."
        oferta_vencida: "A validade desta oferta já passou."
        produto_indisponivel: "Um produto deste modelo esgotou ou saiu do catálogo."
        formato_nao_suportado: "Este modelo usa um formato que ainda não conseguimos enviar."
        midia_indisponivel: "O arquivo deste modelo (topo ou cartão) não está mais disponível."
        produtos_desligados: "Modelos com produtos do catálogo não estão ligados nesta conta."
        nao_aceito_pela_meta: "O WhatsApp não aceita modelo de autenticação para este contato, que não tem número de telefone."
        erro: "Não deu para enviar agora. Tente de novo em instantes."
