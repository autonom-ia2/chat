# Insurance portfolio (#1240): the texts the server writes. Its own file, so it does not compete for en.yml with the
# other fronts.
en:
  carteira:
    renovacao:
      card:
        titulo: 'Renewal · %{seguradora}'
    palavras:
      oi: 'Hi, %{nome}!'
      oi_sem_nome: 'Hi!'
      vale: 'What is written in your policy is what counts.'
    cotacao:
      o_que_mudou: 'What changed? Tell us here in a message, and our team will update your renewal.'
      nota_da_proposta: 'Renewal proposal from the quote. It goes to the client only by the template, with the proposal attached.'
      avisos:
        algo_mudou_nao_saiu: 'The "Did anything change?" message to %{nome} was not sent.'
        mudou: '%{nome} said something changed in the policy. The renewal was not quoted: ask what changed.'
        cliente_respondeu: '%{nome} replied about what changed in the policy.'
        faltou_dado: 'The renewal of %{nome} was not quoted because data is missing.'
        conferencia_caiu: 'The renewal of %{nome} was not quoted: the quote check did not answer after 3 tries.'
        proposta_nao_saiu: 'The renewal proposal of %{nome} did not go out.'
        sem_preco: 'The renewal quote of %{nome} came back with no price.'
        proposta_incerta: 'We do not know if the renewal proposal of %{nome} arrived. Check the conversation.'
        caixa_distribui: 'The renewal WhatsApp of %{nome} hands every new conversation to someone on the team, so %{agente} does not reply. Turn off automatic assignment for that WhatsApp or choose "The team" in Adjust renewals.'
        faltam: 'Missing: %{campos}.'
        motivos:
          contato_recusou: 'The client refused messages or is blocked.'
          sem_caixa: 'No official WhatsApp inbox was chosen in the renewal settings.'
          sem_modelo: 'The renewal template is not approved in the chosen inbox.'
          sem_telefone: 'The client has no phone number.'
          campo_vazio: 'The client has no name to fill the template.'
          sem_card: 'The renewal card no longer exists.'
          sem_conexao: 'The connection to the quote portal is not ready.'
          sem_agente: 'The account has no Quote Agent.'
          cotacao_falhou: 'The quote did not finish in the portal.'
          sem_pdf: 'The proposal PDF did not come.'
          erro: 'Something went wrong in the sending.'
      campos:
        produto: 'insurance line'
        quotation_previousInsurerCode: 'previous insurer'
        quotation_previousPolicyNumber: 'policy number'
        quotation_previousPolicyEndDate: 'policy end date'
        quotation_bonusClass: 'bonus class'
        insured_name: 'insured name'
        insured_document: 'insured CPF or CNPJ'
        insured_birthDate: 'insured birth date'
        insured_gender: 'insured sex'
        address_zipCode: 'ZIP code'
        vehicle_plate: 'vehicle plate'
        renovacao_seguradoraAnterior: 'previous insurer'
        renovacao_numeroApolice: 'policy number'
        renovacao_fimVigencia: 'policy end date'
        renovacao_bonus: 'bonus class'
        segurado_cpfCnpj: 'insured CPF or CNPJ'
  notifications:
    notification_title:
      carteira_renovacao: 'Insurance policies entered renewal'
    carteira_renovacao:
      entraram:
        one: '1 insurance policy entered renewal today'
        other: '%{count} insurance policies entered renewal today'
