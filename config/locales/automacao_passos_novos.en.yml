          sem_permissao: 'Step %{passo}: only an administrator, or a role allowed to manage integrations, can fetch data from other systems.'
          integracao_desconhecida: 'Step %{passo}: choose "Another address". Connected integrations are not available for this step yet.'
          consulta_so_https: 'Step %{passo}: the address must start with https://.'
          consulta_sem_senha_no_endereco: 'Step %{passo}: the address cannot carry a user or password.'
          consulta_endereco_interno: 'Step %{passo}: this address points to an internal network and cannot be used.'
          nome_sem_letra: 'Step %{passo}: the name "%{nome}" needs at least one letter or number.'
          nome_repetido: 'Step %{passo}: two saved items have the same name (%{chave}). Give each one its own name.'
          caminho_invalido: 'Step %{passo}: the place "%{caminho}" in the answer is not valid.'
      editor:
        bloco_em_uso: 'This block is used by automations that are on: %{nomes}. Change them first.'
        bloco_desligado: 'Blocks are not available on this account.'
      ensaio:
        dado_buscado: '[%{nome}, fetched from the other system]'
