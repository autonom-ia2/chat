        campanha_so_sem_alvo: 'Passo %{passo}: mandar campanha só vale numa automação recorrente (por data). Num gatilho de conversa, card ou contato que muda, cada execução mandaria a mesma campanha de novo.'
        campanha_variavel_fixa: 'Passo %{passo}: a campanha vai para muita gente de uma vez, então cada variável do modelo precisa ser texto fixo.'
        campanha_sem_permissao: 'Passo %{passo}: para usar este passo você precisa da permissão de enviar campanhas.'
        campanha_desligada: 'Passo %{passo}: as campanhas de WhatsApp estão desligadas nesta conta.'
