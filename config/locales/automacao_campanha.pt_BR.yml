# Automação livre, passo "campanha" (#2414 G14, #2630). Arquivo próprio para não disputar o pt_BR.yml com as outras frentes.
pt_BR:
  autonomia:
    automacao:
      motivos:
        campanha_so_sem_alvo: 'Esta automação roda a cada conversa, card ou contato que muda, então mandaria a mesma campanha de novo a cada vez. Mandar campanha só vale numa automação recorrente (por data). Nada foi mandado.'
        campanha_da_vez_ja_saiu: 'A campanha desta vez já tinha saído quando este card ou contato chegou aqui. Ele não recebeu esta campanha.'
        campanha_da_vez_aguardando: 'Entrou na campanha desta vez. Ela sai quando nenhum card ou contato desta vez estiver mais a caminho deste passo.'
        campanha_da_vez_saiu: 'A campanha desta vez saiu para todos com as etiquetas. %{chegaram} chegaram a este passo e %{sairam} terminaram por outro caminho.'
        campanha_da_vez_saiu_pela_rede: 'A campanha desta vez saiu com quem chegou, porque parte da vez ficou parada mais de %{horas} horas. %{chegaram} chegaram a este passo, %{sairam} terminaram por outro caminho, %{fora} ficaram de fora por estarem travados, %{esperaram} ficaram de fora por ainda estarem esperando depois de %{dias} dias e %{lotes_fora} lotes de cards não rodaram.'
        campanha_da_vez_saiu_sem_contar_lotes: 'A campanha desta vez saiu com quem chegou depois de %{horas} horas, porque a busca dos cards desta vez não registrou quantos lotes tinha (ela começou durante uma atualização da plataforma ou parou no meio). %{chegaram} chegaram a este passo, %{sairam} terminaram por outro caminho e %{fora} ficaram de fora por estarem travados.'
        campanha_da_vez_nao_saiu: 'A campanha desta vez não saiu. %{por}'
