        campanha_da_vez_falhou: 'A campanha desta vez não saiu por um erro. A plataforma tenta de novo em alguns minutos.'
        campanha_da_vez_desistiu: 'A campanha desta vez não saiu: deu erro em %{tentativas} tentativas seguidas, e a plataforma parou de tentar. Nada foi mandado nesta vez.'
        sem_chegada: 'Nenhum card ou contato desta vez chegou ao passo da campanha.'
        quem_ligou_sem_permissao_campanha: 'Quem ligou a automação não pode mais enviar campanhas. Assuma e religue.'
        campanha_sem_caixa: 'A caixa escolhida não existe mais ou não é do WhatsApp oficial. A campanha não foi criada.'
        campanha_desligada: 'As campanhas de WhatsApp estão desligadas nesta conta. A campanha não foi criada.'
        campanha_sem_etiqueta: 'Nenhuma das etiquetas escolhidas existe mais. A campanha não foi criada.'
        campanha_exclusao_apagada: 'Uma etiqueta que esta campanha deixa de fora não existe mais. Nada foi mandado, e ninguém dessa etiqueta recebeu. Edite a automação e escolha as etiquetas de novo.'
        campanha_recusada: 'A plataforma recusou a campanha como ela foi montada. Nada foi mandado.'
        campanha_modelo_fora_da_caixa: 'A caixa escolhida não tem o modelo escolhido. A campanha não foi criada.'
        campanha_modelo_nao_aprovado: 'O modelo escolhido não está aprovado pela Meta nesta caixa. A campanha não foi criada.'
        campanha_modelo_de_categoria_fora: 'O modelo escolhido não é de utilidade nem de propaganda. A campanha não foi criada.'
        campanha_modelo_mudou: 'O modelo pede outras variáveis que as do passo. Escolha o modelo de novo. A campanha não foi criada.'
        campanha_variavel_vazia: 'Uma variável do modelo está sem texto. Escreva o texto fixo de cada variável. A campanha não foi criada.'
        sem_contato: 'Aqui não há contato para marcar.'
        contato_ja_nao_recebe: 'O contato já estava marcado como "não recebe".'
