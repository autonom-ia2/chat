# Carteira de seguros (#1240): os textos que o servidor escreve. Arquivo próprio para não disputar o pt_BR.yml com as
# outras frentes.
pt_BR:
  carteira:
    renovacao:
      card:
        titulo: 'Renovação · %{seguradora}'
    palavras:
      oi: 'Oi, %{nome}!'
      oi_sem_nome: 'Oi!'
      vale: 'Vale o que está escrito na sua apólice.'
    cotacao:
      o_que_mudou: 'O que mudou? Conte aqui numa mensagem, e a nossa equipe atualiza a sua renovação.'
      nota_da_proposta: 'Proposta de renovação da cotação. Ela só vai ao cliente pelo modelo, com a proposta no anexo.'
      avisos:
        algo_mudou_nao_saiu: 'A mensagem "Algo mudou?" para %{nome} não saiu.'
        mudou: '%{nome} disse que algo mudou no seguro. A renovação não foi cotada: pergunte o que mudou.'
        cliente_respondeu: '%{nome} respondeu o que mudou no seguro.'
        faltou_dado: 'A renovação de %{nome} não foi cotada porque faltam dados.'
        conferencia_caiu: 'A renovação de %{nome} não foi cotada: a conferência da cotação não respondeu em 3 tentativas.'
        proposta_nao_saiu: 'A proposta de renovação de %{nome} não saiu.'
        sem_preco: 'A cotação da renovação de %{nome} voltou sem preço.'
        proposta_incerta: 'Não sabemos se a proposta de renovação de %{nome} chegou. Confira na conversa.'
        conversa_com_pessoa: 'A conversa da renovação de %{nome} ficou com %{pessoa}, então %{agente} não vai responder.'
        faltam: 'Falta: %{campos}.'
        motivos:
          contato_recusou: 'O cliente recusou mensagens ou está bloqueado.'
          sem_caixa: 'Nenhuma caixa do WhatsApp oficial foi escolhida nos ajustes da renovação.'
          sem_modelo: 'O modelo da renovação não está aprovado na caixa escolhida.'
          sem_telefone: 'O cliente não tem telefone.'
          campo_vazio: 'O cliente não tem nome para preencher o modelo.'
          sem_card: 'O card de renovação não existe mais.'
          sem_conexao: 'A conexão com o portal de cotação não está pronta.'
          sem_agente: 'A conta não tem o Agente de Cotação.'
          cotacao_falhou: 'A cotação não terminou no portal.'
          sem_pdf: 'O PDF da proposta não veio.'
          erro: 'Algo deu errado no envio.'
      campos:
        produto: 'ramo do seguro'
        quotation_previousInsurerCode: 'seguradora anterior'
        quotation_previousPolicyNumber: 'número da apólice'
        quotation_previousPolicyEndDate: 'fim da vigência'
        quotation_bonusClass: 'classe de bônus'
        insured_name: 'nome do segurado'
        insured_document: 'CPF ou CNPJ do segurado'
        insured_birthDate: 'nascimento do segurado'
        insured_gender: 'sexo do segurado'
        address_zipCode: 'CEP'
        vehicle_plate: 'placa do veículo'
        renovacao_seguradoraAnterior: 'seguradora anterior'
        renovacao_numeroApolice: 'número da apólice'
        renovacao_fimVigencia: 'fim da vigência'
        renovacao_bonus: 'classe de bônus'
        segurado_cpfCnpj: 'CPF ou CNPJ do segurado'
  notifications:
    notification_title:
      carteira_renovacao: 'Seguros entraram em renovação'
    carteira_renovacao:
      entraram:
        one: '1 seguro entrou em renovação hoje'
        other: '%{count} seguros entraram em renovação hoje'
