# Carteira de seguros (#1240): os textos que o servidor escreve. Arquivo próprio para não disputar o pt_BR.yml com as
# outras frentes.
pt_BR:
  carteira:
    renovacao:
      card:
        titulo: 'Renovação · %{seguradora}'
  notifications:
    notification_title:
      carteira_renovacao: 'Seguros entraram em renovação'
    carteira_renovacao:
      entraram:
        one: '1 seguro entrou em renovação hoje'
        other: '%{count} seguros entraram em renovação hoje'
