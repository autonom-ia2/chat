en:
  whatsapp_templates:
    errors:
      permission_denied: "This WhatsApp connection is not allowed to manage templates. Reconnect the inbox in Settings › Inboxes and try again."
      meta_failed: "Meta did not accept the request. Try again in a few minutes."
      not_found_or_no_access: "WhatsApp did not find this template or the number has no access to it. Refresh the list; if it continues, reconnect the number."
      meta_unreachable: "Meta did not answer. Try again in a few minutes."
      catalog_missing: "This WhatsApp account has no product catalog connected yet."
      catalog_not_found: "We could not find this WhatsApp account’s catalog, or the connection lost access to it. Check the catalog in Commerce Manager and reconnect the inbox in Settings › Inboxes."
      products_invalid: "Choose from 1 to 30 products."
      card_photo_invalid: "Use a JPG or PNG photo of up to 5 MB."
      catalog_permission_denied: "This WhatsApp connection is not allowed to read the product catalog. Reconnect the inbox in Settings › Inboxes and try again."
      products_disabled: "Campaigns with catalog products are not enabled for this account."
      sync_failed: "We could not update the template list right now. Try again in a few minutes."
      app_not_configured: "The WhatsApp app is not configured on this installation, so files cannot be sent to Meta."
      media_invalid: "Use a JPG or PNG up to 5 MB, an MP4 or MOV video up to 100 MB or a PDF up to 100 MB."
      video_too_large: "The video can have up to 100 MB."
      video_too_long: "This video is too long to fit in the 16 MB WhatsApp accepts. Use a shorter video."
      video_unreadable: "We could not read this video. Export it again as MP4 or MOV and try once more."
      media_required: "This template has a picture, video or document at the top. Pick the file again and send it."
      inbox_not_supported: "Templates can only be managed on official WhatsApp inboxes connected to a WhatsApp Business account."
      template_not_found: "This template was not found on this inbox's WhatsApp account."
      system_template: "This template is used by the platform. It cannot be changed or deleted here, but you can duplicate it."
      name_taken: "A template with this name and language already exists. Choose another name."
      name_held: "A template with this name was deleted recently, and WhatsApp holds the name for 30 days. Choose another name."
      in_use: "This template is scheduled to be sent. Remove it from what uses it before changing or deleting it."
      in_use_hidden: "This template is in use where you do not have access. Ask an administrator."
      invalid_profile: "Check the friendly name and the fields of this template."
      feature_disabled: "Template management is not enabled for this account."
      marketing_only: "The “Copy code” button, the carousel, the limited-time offer and the catalog only exist in promotion messages. Remove them or create a promotion template."
      button_text_missing: "Every button needs a text."
      url_missing: "Every website button needs the address."
      phone_missing: "Every call button needs the phone number."
      copy_code_example: "The “Copy code” button needs an example code: 1 to 15 letters and numbers, no spaces."
      carousel_cards: "The carousel needs 2 to 10 cards."
      carousel_card: "Every carousel card needs a picture or video, a text and a button."
      offer_title: "The offer needs a title of up to 16 characters."
      offer_buttons: "The offer needs its link and a coupon of 1 to 15 letters and numbers."
      button_order: "Quick reply buttons must stay together, before or after the other buttons."
      button_text_long: "A button text can have up to 25 characters."
      url_example: "The website button with a variable ending needs an example of that ending."
      stray_braces: "Double braces can only be in the message text, not in the footer, the buttons or the offer title."
      url_invalid: "The website button needs the full address, starting with https://."
      phone_invalid: "The call button needs the phone number with the country code, for example +55 11 4000-0000."
      carousel_media: "All carousel cards need the same kind of media: only photos or only videos."
      category_change_not_allowed: "WhatsApp does not let you change the type of a template that already exists. Create a new template with this text."
      meta_text: "WhatsApp did not accept the request. Check the text, the examples and the buttons and try again."
      suggestion_unavailable: "Could not write it right now. Try again in a moment or write it your own way."
      suggestion_invalid: "Check the request: say what the message needs to do, or send a text of up to 1024 characters."
      conversation_products: "This template shows catalog products, and the send did not say which ones. Choose the products when sending, or pick another template."
      conversation_carousel: "This template is a carousel, and the send did not bring every card with its photo and text. Fill in the cards when sending, or pick another template."
      conversation_products_disabled: "This account does not send catalog products yet. Pick another template."
      conversation_catalog_missing: "This WhatsApp has no product catalog connected. Connect the catalog on Meta, or pick another template."
      conversation_catalog_unreachable: "Could not read the catalog right now. Try again in a few minutes."
      conversation_product_unavailable: "Not sent: %{products} sold out or left the catalog. Swap the product and send again."
      conversation_carousel_media: "Could not find the photo of a card. Choose the photo again and send."
      conversation_coupon: "This template has a coupon, and the send did not bring the code (1 to 15 letters and numbers). Type the code and send again."
      conversation_offer_expiration: "This offer shows a countdown, and the send did not say until when it is valid. Choose the date and time and send again."
      conversation_offer_expired: "The validity of this offer has already passed. Choose a later date and time and send again."
      conversation_url_parameter: "This template has a link that ends with a value of this customer, and the send did not bring it. Fill in the end of the link and send again."
    # Owner's permission for the system to create templates (#1586). The turn on/off text is what the screen shows in
    # the confirmation and what the record stores: when it changes, bump VERSAO in Whatsapp::Templates::AvisoDeConsentimento.
    consent:
      formato_da_data: "%m/%d/%Y"
      separador_decimal: "."
      separador_milhar: ","
      ligar:
        utility: "You allow %{marca} to create Service notice templates on its own and send them to your customers, such as the payment reminder. The templates you already have stay as they are. Meta charges for every delivered message, even while the conversation is open: %{preco} per Service notice (Meta rate card for Brazil, in effect since %{vigencia}). Example: %{envios} notices cost %{exemplo}."
        marketing: "You also allow %{marca} to create and send Promotion templates: offers, promotions and invitations for the customer to buy again. Meta charges %{preco} per delivered Promotion message (Meta rate card for Brazil, in effect since %{vigencia}) and limits how many promotions each person receives: some may not be delivered."
      desligar:
        utility: "%{marca} stops creating templates on its own, both Service notice and Promotion. The templates you already have stay as they are."
        marketing: "%{marca} stops creating and sending Promotion templates. Service notice stays on."
      errors:
        acao_invalida: "Choose turn on or turn off."
        marca_invalida: "Choose Service notice or Promotion."
        aviso_mudou: "Meta prices changed while you were reading. Check the notice again and confirm."
        utility_desligada: "Promotion can only be turned on with Service notice on."
        somente_administrador: "Only account administrators, or roles with Finance in Edit, can change this."
    # Resending the same template to another conversation (#1767, Whatsapp::Templates::ReenvioDoModelo): why it did not go.
    reenvio:
      motivos:
        conta_diferente: "This conversation belongs to another account."
        caixa_nao_oficial: "This conversation is not on an official WhatsApp inbox, which is the only one that can send templates."
        nao_e_modelo: "This message is not a WhatsApp template, so it cannot be sent again as a template."
        sem_parametros: "We could not find the data of this campaign send to rebuild the message."
        modelo_indisponivel: "This template is not approved on the inbox of this conversation anymore."
        modelo_mudou: "This template was edited after the send and the original values no longer fit it."
        oferta_vencida: "The validity of this offer has already passed."
        produto_indisponivel: "A product of this template is out of stock or no longer in the catalog."
        formato_nao_suportado: "This template uses a format we cannot send yet."
        midia_indisponivel: "The file of this template (top or card) is no longer available."
        produtos_desligados: "Templates with catalog products are not turned on for this account."
        nao_aceito_pela_meta: "WhatsApp does not accept an authentication template for this contact, who has no phone number."
        erro: "Could not send it right now. Try again in a moment."
