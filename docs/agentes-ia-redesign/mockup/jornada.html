<title>Agentes Chat2You — jornada</title>
<style>
/* Layout: o painel real do Chat2You (menu azul-marinho à esquerda, conteúdo max-w-6xl) com uma faixa de protótipo no topo.
   Tokens = os n-* do painel (_next-colors.scss) + azul-marinho dos heróis (#0D2344). */
:root{
  --bg:#F7F7F7; --surface:#FEFEFE; --solid:#FFFFFF; --weak:#EAEAEA; --strong:#E2E3E7; --alpha:rgba(196,197,198,.22);
  --s9:#8B8D98; --s10:#80838D; --s11:#60646C; --s12:#1C2024; --s3:#F0F0F3; --s2:#F9F9FB;
  --brand:#2781F6; --brandh:#1073E9; --b2:#F5F9FF; --b3:#E9F3FF; --b6:#B5D5FF; --b7:#8EC0FF; --b11:#086DE0;
  --t2:#F3FBF9; --t3:#E0F8F3; --t9:#12A594; --t11:#008573;
  --a3:#FFF7C2; --a9:#FFC53D; --a11:#AB6400;
  --r3:#FEEAED; --r9:#E54666; --r11:#CA244D;
  --v3:#F4F0FE; --v11:#6555B7;
  --navy:#0D2344; --navy2:#163A6B; --side:#0E1D38; --sidefg:#E6ECF5; --sidemuted:#9FB0C8;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadowlg:0 12px 32px rgba(13,35,68,.14);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1D20; --surface:#141517; --solid:#17171A; --weak:#1F1F25; --strong:#2E2D32; --alpha:rgba(147,153,176,.12);
  --s9:#696E77; --s10:#777B84; --s11:#B0B4BA; --s12:#EDEEF0; --s3:#212225; --s2:#18191B;
  --b2:#0F1826; --b3:#0F2748; --b6:#1D5486; --b7:#2870BD; --b11:#7EB6FF;
  --t2:#111C1B; --t3:#0D2D2A; --t11:#0BD8B6; --a3:#302008; --a11:#FFCA16; --r3:#3A141E; --r11:#FF949D; --v3:#291F43; --v11:#A999EC;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadowlg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1D20; --surface:#141517; --solid:#17171A; --weak:#1F1F25; --strong:#2E2D32; --alpha:rgba(147,153,176,.12);
  --s9:#696E77; --s10:#777B84; --s11:#B0B4BA; --s12:#EDEEF0; --s3:#212225; --s2:#18191B;
  --b2:#0F1826; --b3:#0F2748; --b6:#1D5486; --b7:#2870BD; --b11:#7EB6FF;
  --t2:#111C1B; --t3:#0D2D2A; --t11:#0BD8B6; --a3:#302008; --a11:#FFCA16; --r3:#3A141E; --r11:#FF949D; --v3:#291F43; --v11:#A999EC;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadowlg:0 12px 32px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--s12);font-family:var(--font);font-size:15px;line-height:1.5}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ico{width:1.25rem;height:1.25rem;flex:none;stroke-width:2}

/* faixa do protótipo */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;
  padding:.55rem 16px;background:#111827;color:#E5E7EB;font-size:13px}
.proto b{color:#fff}
.proto nav{display:flex;flex-wrap:wrap;gap:.35rem}
.proto button{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#E5E7EB;border-radius:999px;padding:.2rem .7rem;font-size:12.5px}
.proto button[aria-current="true"]{background:#fff;color:#111827}
.proto .note{margin-left:auto;color:#9CA3AF}

/* moldura do painel */
.app{display:flex;min-height:calc(100% - 40px)}
.side{width:15.5rem;flex:none;background:var(--side);color:var(--sidefg);padding:1rem .75rem;display:flex;flex-direction:column;gap:.25rem}
.side .acct{display:flex;align-items:center;gap:.6rem;padding:.25rem .5rem 1rem;font-weight:600}
.side .logo{width:2rem;height:2rem;border-radius:999px;background:conic-gradient(from 200deg,#2781F6,#7EB6FF,#0D2344,#2781F6)}
.side a{display:flex;align-items:center;gap:.7rem;padding:.55rem .65rem;border-radius:.6rem;color:var(--sidefg);text-decoration:none;font-size:14.5px}
.side a.on{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);font-weight:600}
.side a .ico{color:var(--sidemuted)}
.side a.on .ico{color:#fff}
.side .tag{margin-left:auto;font-size:11px;background:var(--brand);color:#fff;border-radius:999px;padding:0 .45rem}
.main{flex:1;min-width:0;background:var(--surface);overflow-x:hidden}
.main:focus{outline:none}
@media (max-width:860px){.side{display:none}}

/* página */
.page{max-width:72rem;margin:0 auto;padding-block:2.5rem 4rem;padding-inline:2rem;display:flex;flex-direction:column;gap:2rem}
@media (max-width:640px){.page{padding-inline:16px;padding-block:1.5rem 3rem}}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1.25rem}
.h1{font-size:clamp(1.9rem,3vw,2.25rem);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sub{margin-top:.5rem;font-size:1.0625rem;color:var(--s11);max-width:42rem}
.h2{font-size:1.5rem;font-weight:600;letter-spacing:-.01em}
.muted{color:var(--s11)}
.small{font-size:13px;color:var(--s11)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;padding:0 1.1rem;border-radius:.75rem;border:0;font-weight:600;font-size:15px;white-space:nowrap}
.btn.lg{min-height:3rem;padding:0 1.35rem;font-size:15.5px}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brandh)}
.btn.primary[disabled]{background:var(--s3);color:var(--s9);cursor:not-allowed}
.btn.soft{background:var(--s3);color:var(--s12)}
.btn.soft:hover{background:var(--strong)}
.btn.outline{background:transparent;box-shadow:inset 0 0 0 1px var(--strong);color:var(--s12)}
.btn.outline:hover{background:var(--s2)}
.btn.danger{background:var(--r3);color:var(--r11)}
.btn.link{background:none;color:var(--b11);padding:0 .25rem;min-height:2.75rem}
.back{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;background:none;border:0;color:var(--s11);font-size:15px;padding:0}
.back:hover{color:var(--s12)}

.chips{display:flex;flex-wrap:wrap;gap:.6rem}
.count{display:inline-flex;align-items:center;gap:.6rem;padding:.6rem 1rem;border-radius:.75rem;border:1px solid var(--weak);background:var(--solid);font-size:15px}
.dot{width:.6rem;height:.6rem;border-radius:999px;background:var(--t9)}
.dot.amber{background:var(--a9)} .dot.slate{background:var(--s9)}

.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .65rem;border-radius:999px;font-size:13px;font-weight:600}
.pill.on{background:var(--t3);color:var(--t11)} .pill.off{background:var(--s3);color:var(--s11)}
.pill.todo{background:var(--a3);color:var(--a11)} .pill.ready{background:var(--b3);color:var(--b11)}
.pill .dot{width:.45rem;height:.45rem}

/* cartões de agente */
.list{display:flex;flex-direction:column;gap:1rem}
.agent{display:flex;flex-wrap:wrap;align-items:center;gap:1.25rem;padding:1.25rem 1.5rem;border-radius:1rem;border:1px solid var(--weak);background:var(--solid);box-shadow:var(--shadow);transition:border-color .15s}
.agent:hover{border-color:var(--b6)}
.av{width:3.25rem;height:3.25rem;border-radius:1rem;display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.av.blue{background:var(--b3);color:var(--b11)} .av.teal{background:var(--t3);color:var(--t11)} .av.violet{background:var(--v3);color:var(--v11)} .av.amber{background:var(--a3);color:var(--a11)}
.agent .body{flex:1;min-width:14rem;display:flex;flex-direction:column;gap:.35rem}
.agent .name{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;font-size:1.125rem;font-weight:600}
.agent .line{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .9rem;color:var(--s11)}
.agent .line span{display:inline-flex;align-items:center;gap:.35rem}
.agent .acts{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.kind{font-size:12.5px;font-weight:500;color:var(--s11);background:var(--s3);border-radius:.4rem;padding:.05rem .45rem}

/* interruptor */
.sw{display:inline-flex;align-items:center;gap:.6rem;min-height:2.75rem;background:none;border:0;padding:0 .25rem;font-size:14.5px;font-weight:500;color:var(--s11)}
.sw .track{width:2.75rem;height:1.6rem;border-radius:999px;background:var(--strong);position:relative;transition:background .15s}
.sw .track::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.2rem;height:1.2rem;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"] .track{background:var(--t9)}
.sw[aria-checked="true"] .track::after{transform:translateX(1.15rem)}
.sw[aria-checked="true"]{color:var(--t11)}

/* herói */
.hero{position:relative;overflow:hidden;border-radius:1.5rem;background:var(--navy);color:#fff;padding:3rem 3rem 2.75rem}
@media (max-width:640px){.hero{padding:2rem 1.25rem}}
.hero .ring{position:absolute;border-radius:999px;border:3rem solid #2781F6;opacity:.14;pointer-events:none}
.hero .eyebrow{display:inline-flex;align-items:center;gap:.4rem;font-size:13px;font-weight:600;color:#9CC8FF}
.hero h1{margin-top:.75rem;font-size:clamp(1.9rem,3.4vw,2.6rem);font-weight:700;letter-spacing:-.02em;line-height:1.12;color:#fff;max-width:36rem}
.hero p{margin-top:.75rem;color:rgba(255,255,255,.78);font-size:1.0625rem;max-width:36rem}
.hero .row{margin-top:1.75rem;display:flex;flex-wrap:wrap;gap:.75rem}
.hero .ghost{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);color:#fff}

/* grade de modelos */
.grid{display:grid;gap:1rem;grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.pair{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid,.grid.pair{grid-template-columns:1fr}}
.model.row{flex-direction:row;align-items:center}
.model.row .txt{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.model{display:flex;flex-direction:column;gap:.9rem;text-align:left;padding:1.4rem;border-radius:1rem;border:0;background:var(--solid);box-shadow:inset 0 0 0 1px var(--weak),var(--shadow);transition:transform .15s,box-shadow .15s}
.model:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--b7),var(--shadowlg)}
.model[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--brand),var(--shadowlg)}
.model .tile{width:3.25rem;height:3.25rem;border-radius:1rem;display:grid;place-items:center}
.model .tile .ico{width:1.6rem;height:1.6rem}
.model b{font-size:1.0625rem}
.model .d{color:var(--s11);font-size:14.5px}
.model .ex{margin-top:auto;padding-top:.8rem;border-top:1px dashed var(--weak);font-size:13.5px;color:var(--s11)}
.t-blue{background:var(--b3);color:var(--b11)} .t-teal{background:var(--t3);color:var(--t11)} .t-amber{background:var(--a3);color:var(--a11)}
.t-ruby{background:var(--r3);color:var(--r11)} .t-violet{background:var(--v3);color:var(--v11)} .t-slate{background:var(--s3);color:var(--s11)}
.check{position:absolute}

/* etapas */
.steps{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:.5rem;font-size:14.5px;color:var(--s11)}
.step .n{width:2rem;height:2rem;border-radius:999px;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--s3);color:var(--s11)}
.step.cur{color:var(--s12);font-weight:600} .step.cur .n{background:var(--b3);color:var(--b11)}
.step.past .n{background:var(--t3);color:var(--t11)}
.step + .bar{width:1.75rem;height:2px;background:var(--strong);border-radius:2px}
.bar.past{background:var(--b7)}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem}

/* construtor */
.two{display:grid;gap:1.75rem;grid-template-columns:minmax(0,1fr) minmax(0,25rem);align-items:start}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.panel{display:flex;flex-direction:column;gap:1.25rem;padding:1.5rem;border-radius:1.5rem;border:1px solid var(--weak);background:var(--solid);box-shadow:var(--shadow)}
.panel h3{font-size:1.125rem;font-weight:600}
.chat{display:flex;flex-direction:column;gap:1rem;min-height:24rem}
.msg{max-width:36rem;padding:.85rem 1.1rem;border-radius:1.1rem;font-size:15.5px;line-height:1.55}
.msg.bot{background:var(--s3);border-top-left-radius:.35rem;align-self:flex-start}
.msg.me{background:var(--brand);color:#fff;border-top-right-radius:.35rem;align-self:flex-end}
.who{display:flex;align-items:center;gap:.5rem;font-size:13px;color:var(--s11);font-weight:600}
.who .mini{width:1.6rem;height:1.6rem;border-radius:.5rem;background:var(--navy);display:grid;place-items:center;color:#9CC8FF}
.who .mini .ico{width:.95rem;height:.95rem}
.quick{display:flex;flex-wrap:wrap;gap:.5rem}
.quick button{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:0 1rem;border-radius:.75rem;border:0;background:var(--b2);box-shadow:inset 0 0 0 1px var(--b6);color:var(--b11);font-weight:500;font-size:14.5px;text-align:left}
.quick button:hover{background:var(--b3)}
.composer{display:flex;align-items:flex-end;gap:.5rem;padding:.5rem;border-radius:1rem;background:var(--solid);box-shadow:inset 0 0 0 1px var(--strong)}
.composer textarea{flex:1;min-width:0;border:0;resize:none;background:transparent;color:var(--s12);font:inherit;font-size:15.5px;padding:.6rem .5rem;min-height:2.75rem;max-height:10rem;outline:none}
.iconbtn{width:2.75rem;height:2.75rem;border-radius:.75rem;border:0;background:transparent;color:var(--s11);display:grid;place-items:center}
.iconbtn:hover{background:var(--s3);color:var(--s12)}
.send{background:var(--brand);color:#fff}
.send:hover{background:var(--brandh);color:#fff}

.know{display:flex;flex-direction:column;gap:.9rem;padding:0;margin:0;list-style:none}
.know li{display:flex;gap:.75rem;align-items:flex-start}
.know .st{width:1.6rem;height:1.6rem;border-radius:999px;display:grid;place-items:center;flex:none;background:var(--s3);color:var(--s9)}
.know .st .ico{width:.95rem;height:.95rem}
.know li.ok .st{background:var(--t3);color:var(--t11)}
.know .k{font-size:13px;color:var(--s11);font-weight:600}
.know .v{font-size:15px}
.know li:not(.ok) .v{color:var(--s9)}
.progress{height:.4rem;border-radius:999px;background:var(--alpha);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.drop{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:1.25rem;border-radius:1rem;border:1.5px dashed var(--strong);text-align:center;color:var(--s11)}
.file{display:flex;align-items:center;gap:.75rem;padding:.75rem .9rem;border-radius:.85rem;background:var(--s2);border:1px solid var(--weak)}
.file .fi{width:2.4rem;height:2.4rem;border-radius:.6rem;display:grid;place-items:center;background:var(--r3);color:var(--r11);flex:none}
.file .fn{flex:1;min-width:0;font-size:14px;font-weight:500;overflow-wrap:anywhere}
.tip{display:flex;gap:.75rem;padding:1rem 1.1rem;border-radius:1rem;background:var(--b2);border:1px solid var(--b6);font-size:14.5px}
.tip .ico{color:var(--b11)}

/* teste */
.phone{border-radius:1.75rem;border:1px solid var(--weak);background:var(--s2);padding:1rem;display:flex;flex-direction:column;gap:.85rem;min-height:30rem}
.phone .bar2{display:flex;align-items:center;gap:.6rem;padding-bottom:.75rem;border-bottom:1px solid var(--weak)}
.src{display:flex;align-items:center;gap:.4rem;margin-top:.5rem;font-size:12.5px;color:var(--s11)}
.flag{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;border-radius:.75rem;background:var(--a3);color:var(--a11);font-size:13.5px;font-weight:500;align-self:flex-start}

/* ligar */
.opt{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;padding:1rem 1.15rem;border-radius:1rem;border:0;background:var(--solid);box-shadow:inset 0 0 0 1px var(--weak)}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--brand);background:var(--b2)}
.opt[disabled]{opacity:.62;cursor:not-allowed}
.opt .radio{width:1.35rem;height:1.35rem;border-radius:999px;box-shadow:inset 0 0 0 2px var(--strong);flex:none}
.opt[aria-checked="true"] .radio{box-shadow:inset 0 0 0 6px var(--brand)}
.field{display:flex;flex-direction:column;gap:.45rem}
.field label{font-weight:600;font-size:14.5px}
.field input,.field textarea{font:inherit;font-size:15.5px;color:var(--s12);background:var(--solid);border:0;box-shadow:inset 0 0 0 1px var(--strong);border-radius:.75rem;padding:.7rem .9rem;min-height:2.9rem;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--brand)}
.sentence{padding:1.1rem 1.25rem;border-radius:1rem;background:var(--s2);border:1px solid var(--weak);font-size:15.5px}

.done{display:flex;align-items:center;gap:1rem;padding:1.25rem 1.4rem;border-radius:1rem;background:var(--t3)}
.done .c{width:2.75rem;height:2.75rem;border-radius:999px;background:var(--t9);color:#fff;display:grid;place-items:center;flex:none}

/* painel do agente */
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--weak);overflow-x:auto}
.tabs button{border:0;background:none;padding:.85rem 1rem;min-height:2.75rem;font-weight:500;color:var(--s11);border-bottom:2px solid transparent;white-space:nowrap;font-size:15px}
.tabs button[aria-selected="true"]{color:var(--s12);border-bottom-color:var(--brand);font-weight:600}
.stats{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,14rem),1fr))}
.stat{padding:1.25rem 1.4rem;border-radius:1rem;border:1px solid var(--weak);background:var(--solid)}
.stat .num{font-size:2rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .lab{color:var(--s11);font-size:14.5px}
.rows{display:flex;flex-direction:column;border:1px solid var(--weak);border-radius:1rem;background:var(--solid);overflow:hidden}
.rowi{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1rem;padding:1rem 1.25rem}
.rowi + .rowi{border-top:1px solid var(--weak)}
.rowi .grow{flex:1;min-width:12rem}
.rowi .k{font-size:13px;color:var(--s11);font-weight:600}
.danger{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem 1.4rem;border-radius:1rem;border:1px solid var(--r3)}

/* diálogo */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(13,35,68,.45);display:grid;place-items:center;padding:16px}
.dlg{width:min(100%,30rem);background:var(--solid);border-radius:1.25rem;padding:1.6rem;box-shadow:var(--shadowlg);display:flex;flex-direction:column;gap:1rem}
.dlg h2{font-size:1.25rem;font-weight:600}
.dlg .acts{display:flex;justify-content:flex-end;gap:.6rem;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:70;background:#111827;color:#fff;padding:.75rem 1.1rem;border-radius:.85rem;font-size:14.5px;box-shadow:var(--shadowlg);display:flex;gap:.6rem;align-items:center}
.callout{display:flex;gap:.7rem;align-items:flex-start;padding:.85rem 1rem;border-radius:.85rem;background:var(--s2);border:1px solid var(--weak);font-size:14px;color:var(--s11)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide-sm{}
@media (max-width:640px){.hide-sm{display:none}}

/* ===== v2 ===== */
.proto .sep{width:1px;height:1.2rem;background:rgba(255,255,255,.18)}
.proto .seg{display:inline-flex;gap:.25rem;align-items:center}
.proto .lbl{color:#9CA3AF}

function toast(text, tone = 'ok') {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = icon(tone === 'ok' ? 'check' : 'alert-triangle') + esc(text);
  document.body.appendChild(t); paint();
  setTimeout(() => t.remove(), 3400);
}

// Diálogo com foco preso, Esc e clique fora devolvem o foco ao gatilho.
function dialog({ title, body, confirm, danger, onOk, wide, html, okDisabled }) {
  const layer = $('#layer');
  const prev = document.activeElement;
  layer.innerHTML = `<div class="scrim" data-scrim><div class="dlg ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <h2 id="dlgT">${esc(title)}</h2>${body ? `<p class="muted">${body}</p>` : ''}${html || ''}
    <div class="acts"><button class="btn outline" data-dlg-close>${confirm ? 'Cancelar' : 'Fechar'}</button>
    ${confirm ? `<button class="btn ${danger ? 'danger' : 'primary'}" id="dlgOk" ${okDisabled ? 'disabled' : ''}>${esc(confirm)}</button>` : ''}</div></div></div>`;
  paint();
  const dlg = layer.querySelector('.dlg');
  const close = () => { layer.innerHTML = ''; document.removeEventListener('keydown', onKey); prev && prev.focus && prev.focus(); };
  const onKey = (e) => {
    if (e.key === 'Escape') close();
    if (e.key === 'Tab') {
      const f = [...dlg.querySelectorAll('button,input,textarea,[tabindex="0"]')].filter((x) => !x.disabled);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  };
  document.addEventListener('keydown', onKey);
  layer.querySelector('[data-scrim]').addEventListener('click', (e) => { if (e.target.hasAttribute('data-scrim')) close(); });
  layer.querySelector('[data-dlg-close]').addEventListener('click', close);
  const ok = $('#dlgOk');
  if (ok) ok.addEventListener('click', () => { if (onOk && onOk(dlg) === false) return; close(); });
  (dlg.querySelector('input,textarea') || ok || layer.querySelector('[data-dlg-close]')).focus();
  return dlg;
}

function meter(label, pct) {

function testBubble(q, b, idx, internal) {
  const r = TEST_ANSWERS[q];
  const shown = b.chunks[idx] ?? r.a.length;
  const typing = shown < r.a.length;
  const parts = r.a.slice(0, shown).map((t, i) => `<div class="msg bot">${esc(t)}${i === r.a.length - 1 && !typing ? `
      <div class="conf"><span>Certeza</span><div class="progress ${r.conf >= 70 ? 'teal' : r.conf >= 40 ? 'amber' : 'red'}"><i style="width:${r.conf}%"></i></div><b>${r.conf}%</b></div>
      ${r.used && b.files.length ? `<details class="used"><summary>${icon('book-open')}Material usado (1)</summary><blockquote>${esc(b.files[0].name)}<br>"Chat2You é a plataforma de atendimento da Hub2You…"</blockquote></details>` : ''}` : ''}</div>`).join('');
  return `<div class="msg me">${esc(q)}</div>${parts}${typing ? '<div class="think" aria-label="Digitando"><i></i><i></i><i></i></div>' : ''}
    ${!typing && r.flag && !internal ? `<div class="flag">${icon('user-round')}Aqui ${isInternal() ? 'ele' : 'ela'} passaria para a equipe. ${esc(r.flag)}</div>` : ''}`;
}

const OUT_LABELS = [['handled', 'Conversas atendidas'], ['resolved', 'Resolvidas sem ninguém da equipe'], ['handed', 'Passadas para a equipe'], ['reopened', 'Voltaram depois de resolvidas'], ['wrong', 'Respostas marcadas como erradas']];
function tabResumo(a) {
  const st = viewState('resumo', 'normal');
  const bar = stateBar('resumo', [['normal', 'Com dados'], ['carregando', 'Carregando'], ['erro', 'Erro'], ['vazio', 'Sem conversas ainda']]);
  const p = S.period;
  const s = a.stats[p];
  const period = `<div class="seg2" role="group" aria-label="Período"><button aria-pressed="${p === 7}" data-period="7">Últimos 7 dias</button><button aria-pressed="${p === 30}" data-period="30">Últimos 30 dias</button></div>`;
  if (a.actuation === 'internal') {
    return `<div class="errorbox"><span class="tile t-violet">${icon('users')}</span><div><b style="font-size:1.125rem">O ${esc(a.name)} ajuda a equipe dentro das conversas</b><p class="muted">Os números de uso ainda não aparecem aqui.</p></div><button class="btn outline" data-go="conversa">Ver numa conversa</button></div>`;
  }
  if (st === 'carregando') return `${bar}${period}<div class="stats">${'<div class="skel" style="height:6.5rem"></div>'.repeat(4)}</div><div class="skel" style="height:14rem"></div>`;
  if (st === 'erro') return `${bar}<div class="errorbox" role="alert"><span class="tile t-ruby">${icon('cloud-off')}</span><b>Não deu para carregar os números</b><button class="btn soft" data-state="resumo:normal">${icon('refresh-cw')}Tentar de novo</button></div>`;
  if (st === 'vazio' || (!s.replies && !s.handed)) {
    return `${bar}${period}<div class="errorbox"><span class="tile t-blue">${icon('sparkles')}</span>
      <div><b style="font-size:1.125rem">${p === 7 && a.stats[30].replies ? 'Nenhuma conversa nesta semana' : `${artigo(a).toUpperCase()} ${esc(a.name)} está pront${artigo(a)}`}</b>
      <p class="muted">${p === 7 && a.stats[30].replies ? `Nos últimos 30 dias foram ${a.stats[30].replies} respostas. Confira se o canal está recebendo mensagens.` : 'Os números aparecem aqui depois das primeiras conversas. Enquanto isso, teste.'}</p></div>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap">${p === 7 && a.stats[30].replies ? '<button class="btn soft" data-period="30">Ver 30 dias</button>' : ''}<button class="btn outline" data-go="agente-${a.id}-testar">Testar</button></div></div>`;
  }
  const rate = Math.round((s.handed / (s.replies + s.handed)) * 100);
  const days = serie(a.serie, p);
  const max = Math.max(1, ...days.map((d) => d.r + d.h));
  const fmt = (k) => k.slice(8, 10) + '/' + k.slice(5, 7);
  const out = { handled: s.conv, resolved: a.id === 'lia' && p === 30 ? 26 : 0, handed: s.handed, reopened: 0, wrong: 0 };
  const maxR = Math.max(1, ...s.reasons.map((r) => r[1]));
  const insight = rate >= 40 ? ['Muitas conversas estão indo para a equipe', 'Veja os motivos abaixo e ensine o que faltou.']
    : s.know !== null && s.know <= 30 ? ['Poucas respostas vieram dos seus materiais', 'Adicione material sobre o que os clientes mais perguntam.'] : null;
  return `${bar}<div class="top">${period}<span class="small">Dados reais da conta, até 05/10</span></div>
    <div class="stats">
      <div class="stat"><div class="num">${s.conv}</div><div class="lab">conversas atendidas</div></div>
      <div class="stat"><div class="num">${s.replies}</div><div class="lab">respostas enviadas</div></div>
      <div class="stat"><div class="num">${rate}%</div><div class="lab">passaram para a equipe (${s.handed})</div></div>
      <div class="stat"><div class="num">${s.conf === null ? 'Sem dados' : s.conf + '%'}</div><div class="lab">certeza média nas respostas</div></div>
      ${a.type === 'insurance_quote' ? '' : `<div class="stat"><div class="num">${s.know === null ? 'Sem dados' : s.know + '%'}</div><div class="lab">respostas que usaram seus materiais</div></div>`}
    </div>
    ${insight ? `<div class="banner amber">${icon('lightbulb')}<span class="grow"><b>${insight[0]}</b>. ${insight[1]}</span>${a.type === 'insurance_quote' ? '' : `<button class="btn soft" data-go="agente-${a.id}-sabe">Ensinar</button>`}</div>` : ''}
    <div class="sect"><header><div><h3>Resultado das conversas</h3><p class="desc">Toque num número para ver as conversas.</p></div></header>
      <div class="outcomes">${OUT_LABELS.map(([k, l]) => `<button class="outcome" data-drill="${a.id}:${k}"><b>${out[k]}</b><span>${l}</span></button>`).join('')}</div></div>
    <div class="sect"><header><div><h3>Dia a dia</h3></div><div class="legend"><span><i style="background:var(--brand)"></i>Respostas</span><span><i style="background:var(--a9)"></i>Passadas para a equipe</span></div></header>
      <div class="chart" role="img" aria-label="Respostas e passagens por dia">${days.map((d) => `<div class="day" title="${fmt(d.date)}: ${d.r} respostas, ${d.h} para a equipe">
        <span class="r" style="height:${(d.r / max) * 100}%"></span><span class="h" style="height:${(d.h / max) * 100}%"></span></div>`).join('')}</div>
      <div class="axis"><span>${fmt(days[0].date)}</span><span>${fmt(days[days.length - 1].date)}</span></div></div>
    <div class="sect"><header><div><h3>Por que passou para a equipe</h3></div></header>
      ${s.reasons.length ? `<ul class="reasons">${s.reasons.map(([l, n]) => `<li><span>${l}</span><div class="progress amber"><i style="width:${(n / maxR) * 100}%"></i></div><b>${n}</b></li>`).join('')}</ul>`
    : '<p class="muted">Nenhuma conversa foi para a equipe neste período.</p>'}</div>`;
}

// ----- O que sabe -----

      <div class="rows">${a.ramos.map((r) => `<div class="rowi"><span class="tile t-teal" style="width:2.5rem;height:2.5rem;border-radius:.75rem;display:grid;place-items:center">${icon('shield-check')}</span><div class="grow"><b>${esc(r)}</b><div class="small">Ligado</div></div></div>`).join('')}</div></div>`;
  }
  const st = viewState('sabe', 'normal');
  const bar = stateBar('sabe', [['normal', 'Como está'], ['estados', 'Materiais em todos os estados'], ['vazio', 'Sem material'], ['limite', 'Limite de 30']]);
  S.sabeTab = S.sabeTab || 'knowledge';
  let files = a.files;
  if (st === 'estados') files = [a.files[0] || PDF_CLARA,
    { id: 'x1', name: 'tabela-planos-2026.xlsx', type: 'xlsx', state: 'analyzing' },
    { id: 'x2', name: 'hub2you.ai/chat2you', type: 'link', state: 'sending' },
    { id: 'x3', name: 'contrato-escaneado.pdf', type: 'pdf', state: 'failed' },
    { id: 'x4', name: 'faq-antigo.docx', type: 'docx', state: 'resend' },
    { id: 'x5', name: 'politica-de-cancelamento.md', type: 'md', state: 'review' },
    { id: 'x6', name: 'cardapio-restaurante.pdf', type: 'pdf', state: 'offscope' }];
  if (st === 'vazio') files = [];
  const count = st === 'limite' ? 30 : files.length;
  const limit = count >= 30;
  const media = false; // D20: sem aba "Para enviar"
  const faqOn = a.faqOn;
  const faqItems = st === 'estados' ? [{ q: 'Vocês atendem corretora com só uma pessoa?', ans: 'Sim. O Chat2You funciona para corretoras de qualquer tamanho.', conv: 412 }] : a.faq;
  return `${bar}
    <div class="sect"><header><div><h3>Materiais</h3><p class="desc">${media ? 'Fotos, vídeos e arquivos que o agente manda para o cliente quando faz sentido.' : 'O que o agente lê para responder. Quanto mais completo, melhor ele responde.'}</p></div>
      <span class="counter">${count} de 30</span></header>
      ${!media && files.length && a.base ? meter('Base de conhecimento', a.base) : ''}
      ${media ? ''
    : files.length ? files.map((m) => matCard(m, { agentId: a.id })).join('') : `<p class="muted">Nenhum material ainda. Sem material, ${ela(a)} responde só com o que você contou na montagem.</p>`}
      ${limit && !media ? `<div class="banner amber">${icon('alert-triangle')}<span class="grow">Chegou ao limite de 30 materiais. Tire um para colocar outro.</span></div>` : ''}
      <div style="display:flex;flex-wrap:wrap;gap:.6rem;align-items:center">
        <button class="btn primary" data-act="add-material" ${limit && !media ? 'disabled' : ''}>${icon('plus')}${media ? 'Adicionar mídia' : 'Adicionar material'}</button>
        ${!media ? `<span class="counter">${count} de 30 materiais</span>` : ''}</div></div>
    <div class="sect"><header><div><h3>Perguntas que a equipe respondeu</h3>
      <p class="desc">Quando uma conversa é resolvida, as perguntas que alguém da equipe respondeu aparecem aqui. Aprove e ${ela(a)} passa a saber.</p></div>
      <button class="sw" role="switch" aria-checked="${faqOn}" data-faqon="${a.id}"><span class="track"></span>${faqOn ? 'Ligado' : 'Desligado'}</button></header>
      ${!faqOn ? '<p class="muted">Ligue para receber sugestões a partir das conversas resolvidas.</p>'
    : faqItems.length ? faqItems.map((f, i) => `<div class="mat"><b>${esc(f.q)}</b><div class="why">${esc(f.ans)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center"><button class="btn primary" data-faq="ok:${i}">Aprovar</button><button class="btn outline" data-faq="edit:${i}">Mudar e aprovar</button><button class="btn link" data-faq="no:${i}">Ignorar</button>
        <span class="small" style="margin-left:auto">Da conversa #${f.conv}</span></div></div>`).join('')
      : `<p class="muted">Nenhuma pergunta nova. Elas aparecem depois que conversas com resposta da equipe são resolvidas.</p>`}</div>`;
}

// ---------- ações ----------
function answer(text) {
  const b = S.build; const s = script()[b.turn];
  if (!text.trim() || !s) return;
  b.answers[s.key] = text.trim(); b.turn += 1;
  if (text.includes('hub2you.ai')) b.linkHint = true;
  render();
}
function progressMaterial(list, m, done = 'accepted') {
  list.push(m); render();
  setTimeout(() => { m.state = 'analyzing'; render(); }, 900);
  setTimeout(() => { m.state = done; render(); }, 2300);
}
function playTest(holder, q) {
  const idx = holder.tested.length;
  holder.tested.push(q); holder.chunks[idx] = 0; holder.stale = false; render();
  const total = TEST_ANSWERS[q].a.length; // perguntas genéricas por trabalho (D28)
  const tick = () => { holder.chunks[idx] += 1; render(); if (holder.chunks[idx] < total) setTimeout(tick, 800); };
  setTimeout(tick, 900);
}
function toggleAgent(id) {
  const a = agentById(id);

  if (a.status === 'on') {

      body: internal ? `O ${a.name} some do painel das conversas até você ligar de novo.` : `As conversas que estão com ${ela(a)} vão para a equipe agora. As novas mensagens chegam direto para as pessoas até você ligar de novo.`,
      confirm: 'Pausar', onOk: () => { a.status = 'off'; render(); toast(internal ? `${a.name} pausado.` : `${a.name} pausad${artigo(a)}. As conversas foram para a equipe.`); } });
  } else { a.status = 'on'; render(); toast(`${a.name} voltou a atender.`); }
}

  const a = { id: 'novo', name: nome, color: 'violet', type: b.model, actuation: internal ? 'internal' : 'external', status: on ? 'on' : 'ready', mode: 'guided',
    channels: on && !internal ? [b.channel] : [], card: internal ? 'Ajuda a equipe: resume a conversa e sugere a próxima resposta.' : `Conversa com donos e gestores de corretoras que chegam pelo site e chama a equipe quando pedem preço ou demonstração.`,
    greeting: bGreeting(), fallback: 'Não sei responder isso com segurança. Vou chamar alguém da equipe.', tone: '', handoff: 'low_confidence', threshold: 0.6,
    window: b.window, audience: null, starters: b.starters || [], base: b.files.some((f) => f.state === 'accepted') ? 71 : null, faqOn: false, faq: [], versions: [],
    files: b.files, media: b.media, stats: { 7: zero, 30: zero }, serie: {}, stepName: 'Ligue' };
  S.agents.push(a);
  if (on && !internal) channelById(b.channel).busyBy = 'novo';
  if (on) { S.build = null; go('pronto'); } else { b.answers.nome = nome; go('lista'); toast(`${nome} guardad${artigo(a)}. Ligue quando quiser.`); }
}

const ACTIONS = {
  mapa: openMap,
  sair() {
    const b = S.build; const r = current();
    const stepName = { conte: 'Conte', teste: 'Teste', ligue: 'Teste' }[r] || 'Conte';
    S.agents = S.agents.filter((x) => x.id !== 'novo' || x.status === 'on' || x.status === 'off');
    if (r === 'escolha') { go('lista'); return; } // o rascunho só nasce depois da Escolha (§6.6)
    if (b && b.model) {
      const zero = { conv: 0, replies: 0, handed: 0, conf: null, know: null, reasons: [] };
      const tested = b.tested.some((q, i) => (b.chunks[i] ?? 99) >= TEST_ANSWERS[q].a.length) && !b.stale; // §6.6: E4 com teste válido
      S.agents.push({ id: 'novo', name: b.answers.nome || 'Novo agente', color: 'violet', type: b.model, actuation: isInternal() ? 'internal' : 'external', status: (r === 'ligue' || (r === 'teste' && tested)) ? 'ready' : 'todo', stepName, empty: !Object.keys(b.answers).length, channels: [], card: 'Montagem pela metade.', greeting: b.greeting || '', fallback: '', tone: '', handoff: 'low_confidence', threshold: 0.6, window: 'always', audience: null, starters: [], base: null, faqOn: false, faq: [], versions: [], files: b.files, media: b.media, stats: { 7: zero, 30: zero }, serie: {} });
      toast('Guardado. Continue quando quiser.');
    }
    go('lista');
  },
  anexar() {
    const b = S.build;
    if (!b || current() !== 'conte') { toast('No produto abre a escolha de arquivo.'); return; }
    if (b.images.length >= 4) { toast('Até 4 imagens por mensagem.', 'warn'); return; }
    b.images.push(`print-${b.images.length + 1}.png`); render();
  },
  'link-sim'() { const b = S.build; b.linkAdded = true; progressMaterial(b.files, { id: 'l' + Date.now(), kind: 'knowledge', name: 'hub2you.ai/chat2you', type: 'link', state: 'sending', nota: 7, label: 'Boa', conf: 'média', resumo: 'Página do Chat2You: canais, agentes e planos.' }); toast('Link adicionado. Lendo agora.'); },
  'link-nao'() { S.build.linkAdded = true; render(); },
  'usar-pdf'() { const b = S.build; if (b.files.some((f) => f.id === 's1')) return; progressMaterial(b.files, { ...PDF_CLARA, state: 'sending' }); },
  'demo-falha'() { const b = S.build; progressMaterial(b.files, { id: 'f' + Date.now(), kind: 'knowledge', name: 'contrato-escaneado.pdf', type: 'pdf', state: 'sending' }, 'failed'); },
  'add-media'() { const b = S.build; b.media.push({ id: 'm' + Date.now(), kind: 'media', name: 'tela-do-chat2you.png', type: 'png', state: 'accepted' }); render(); },
  'add-link'() { addMaterialDialog(S.build.files, true); },
  'add-material'() { const a = agentById(current().split('-')[1]); addMaterialDialog(S.sabeTab === 'media' ? a.media : a.files, false, S.sabeTab === 'media'); },
  'limpar-teste'() { const h = current() === 'teste' ? S.build : S.ptest; h.tested = []; h.chunks = {}; render(); },
  ligar() { saveNewAgent(true); },
  'ligar-depois'() { saveNewAgent(false); },
  reconversar() {
    const a = agentById(current().split('-')[1]);
    dialog({ title: `Mudar ${artigo(a)} ${a.name} conversando`, wide: true, confirm: 'Concluir',
      html: `<div class="chat" style="min-height:12rem"><div class="who"><span class="mini">${icon('sparkles')}</span>Construtor</div><div class="msg bot">O que você quer mudar ${a.name.endsWith('a') ? 'na' : 'no'} ${esc(a.name)}? Ex.: "passe a perguntar o número de atendentes antes de falar de preço".</div></div>
        <form class="composer" onsubmit="event.preventDefault()"><button type="button" class="iconbtn" aria-label="Anexar">${icon('paperclip')}</button><label for="rc" class="sr">Mudança</label><textarea id="rc" rows="2" placeholder="Escreva o que mudar"></textarea><button class="iconbtn send" aria-label="Enviar">${icon('arrow-up')}</button></form>
        <p class="small">A conversa continua de onde parou na montagem. Toda mudança vira uma versão nova, e dá para voltar.</p>`,
      onOk: () => toast('Mudanças salvas.') });
  },
  'tool-new'() { toolDialog(); },
  'tool-model'() { const a = agentById(current().split('-')[1]); a.tools = [{ name: 'Consulta de estoque', slug: 'consultar_estoque', method: 'POST', when: 'Quando o cliente perguntar se um item tem em estoque.', on: true }]; render(); },
  wrong() {
    S.open = null; render();
    const opts = ['Informação errada', 'Resposta inadequada', 'Resposta incompleta', 'Informação desatualizada', 'Outro'];
    const dlg = dialog({ title: 'Marcar esta resposta como errada', confirm: 'Marcar como errada', okDisabled: true,
      body: 'Conte o que saiu errado. Só a equipe vê. Ajuda quem cuida do agente a corrigir.',
      html: `<div class="field"><label>O que houve</label><div class="chipsel" role="radiogroup">${opts.map((o) => `<button role="radio" aria-pressed="false" data-wr="${o}">${o}</button>`).join('')}</div></div>
        <div class="field"><label for="wrd">Qual seria a resposta certa? (se souber)</label><textarea id="wrd" rows="3"></textarea></div>`,
      onOk: () => toast('Obrigado. A resposta foi marcada como errada.') });
    dlg.querySelectorAll('[data-wr]').forEach((b) => b.addEventListener('click', () => { dlg.querySelectorAll('[data-wr]').forEach((x) => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); $('#dlgOk').disabled = false; }));
  },
};

function addMaterialDialog(list, linkOnly, media) {
  let mode = linkOnly ? 'link' : media ? 'file' : 'link';
  const html = () => `${linkOnly || media ? '' : `<div class="seg2" role="group" aria-label="Tipo"><button aria-pressed="${mode === 'link'}" data-mm="link">Um link</button><button aria-pressed="${mode === 'file'}" data-mm="file">Um arquivo</button></div>`}
    ${mode === 'link' ? '<div class="field"><label for="mlink">Link</label><input id="mlink" type="url" placeholder="https://exemplo.com/pagina" value="https://hub2you.ai/protege"></div>'
    : `<div class="drop">${icon('upload')}<span>${media ? 'Foto, vídeo ou PDF para enviar ao cliente' : 'PDF, Word, Excel, TXT, MD ou JSON · até 25 MB'}</span><button class="btn link">Escolher arquivo</button></div>`}
    <p class="small">${media ? 'O agente manda quando fizer sentido na conversa.' : 'Word e Excel ainda podem perder parte do conteúdo. Depois de enviar, ele lê e confere cada material.'}</p>`;
  const dlg = dialog({ title: media ? 'Adicionar mídia' : linkOnly ? 'Colar um link' : 'Adicionar material', confirm: 'Adicionar', html: `<div id="mmb">${html()}</div>`,
    onOk: () => {
      if (media) { list.push({ id: 'm' + Date.now(), kind: 'media', name: 'catalogo-planos.pdf', type: 'pdf', state: 'accepted' }); render(); toast('Mídia adicionada.'); return true; }
      const name = mode === 'link' ? ($('#mlink').value || 'link').replace('https://', '') : 'tabela-planos-2026.xlsx';
      progressMaterial(list, { id: 'n' + Date.now(), kind: 'knowledge', name, type: mode === 'link' ? 'link' : 'xlsx', state: 'sending', nota: 7, label: 'Boa', conf: 'média', resumo: 'Conteúdo novo lido e conferido.' });
      toast('Adicionado. Lendo agora.');
      return true;
    } });
  dlg.addEventListener('click', (e) => { const t = e.target.closest('[data-mm]'); if (!t) return; mode = t.dataset.mm; $('#mmb').innerHTML = html(); paint(); });
}

function toolDialog() {
  const a = agentById(current().split('-')[1]);
  dialog({ title: 'Nova ferramenta', wide: true, confirm: 'Salvar ferramenta',
    html: `<div class="field"><label for="tn">Nome</label><input id="tn" value="Consulta de estoque"></div>
      <div class="field"><label for="ts">Identificador</label><input id="ts" class="mono" value="consultar_estoque"><span class="small">Só letras, números e _. Até 64.</span></div>
      <div class="field"><label for="tw">Quando usar</label><textarea id="tw" rows="2">Quando o cliente perguntar se um item tem em estoque.</textarea></div>
      <div class="field"><label>Método</label><div class="chipsel" role="radiogroup"><button role="radio" aria-pressed="false">GET</button><button role="radio" aria-pressed="true">POST</button></div></div>
      <div class="field"><label for="tu">Endereço</label><input id="tu" class="mono" value="https://api.exemplo.com/estoque"></div>
      <div class="field"><label for="tb">Corpo (JSON)</label><textarea id="tb" class="mono" rows="3">{ "q": "{{q}}", "limit": 5 }</textarea></div>
      <div class="field"><label>Cabeçalhos</label><div class="kv"><input aria-label="Nome" class="mono" value="x-api-key"><input aria-label="Valor" value="••••••••"><label class="check2"><input type="checkbox" checked>Segredo</label><button class="iconbtn" aria-label="Tirar">${icon('trash-2')}</button></div><button class="btn link" style="justify-self:start">${icon('plus')}Mais um</button></div>
      <div class="field"><label>Informações que ela pede ao cliente</label><div class="kv"><input aria-label="Nome" class="mono" value="q"><input aria-label="Para que serve" value="O que o cliente está procurando"><label class="check2"><input type="checkbox" checked>Obrigatório</label><button class="iconbtn" aria-label="Tirar">${icon('trash-2')}</button></div></div>
      <button class="sw" role="switch" aria-checked="true"><span class="track"></span>Ligada</button>`,
    onOk: () => { a.tools = a.tools || []; if (a.tools.length >= 10) { toast('Limite de 10 ferramentas por agente.', 'warn'); return false; } a.tools.push({ name: $('#tn').value, slug: $('#ts').value, method: 'POST', when: $('#tw').value, on: true }); render(); toast('Ferramenta salva.'); return true; } });
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button,a'); if (!t) return;
  const d = t.dataset;
  if (t.closest('#layer') && !d.mapgo && !d.wr && !d.mm) return;
  if (d.go) { e.preventDefault(); if (d.go === 'escolha' && !S.build) S.build = newBuild(null); go(d.go); return; }
  if (d.back !== undefined) { go(lastRoute); return; }
  if (d.profile) { S.profile = d.profile; render(); return; }
  if (d.open) { go(`agente-${d.open}-resumo`); return; }
  if (d.state) { const [k, v] = d.state.split(':'); S.view[k] = v; render(); return; }
  if (d.menu) { S.open = S.open === d.menu ? null : d.menu; render(); return; }
  if (d.model) { S.build = S.build && current() === 'escolha' ? S.build : newBuild(null); S.build.model = d.model; if (current() !== 'escolha') go('escolha'); else render(); return; }
  if (d.ans) { answer(d.ans); return; }
  if (d.q) { playTest(current() === 'teste' ? S.build : S.ptest, d.q); return; }
  if (d.ch) { S.build.channel = Number(d.ch); render(); return; }
  if (d.bwin) { S.build.window = d.bwin; render(); return; }
  if (d.btab) { S.build.tab = d.btab; render(); return; }
  if (d.rmimg) { S.build.images.splice(Number(d.rmimg), 1); render(); return; }
  if (d.rmstarter) { S.build.starters.splice(Number(d.rmstarter), 1); render(); return; }
  if (d.rmmat) {
    const [aid, mid] = d.rmmat.split(':');
    const list = aid === 'build' ? null : agentById(aid);
    const arr = aid === 'build' ? (S.build.tab === 'media' ? S.build.media : S.build.files) : (S.sabeTab === 'media' ? list.media : list.files);
    const m = arr.find((x) => x.id === mid);
    if (!m) { toast('Material de exemplo.'); return; }
    dialog({ title: `Tirar "${m.name}"?`, body: 'O agente deixa de usar este material. Não dá para desfazer.', confirm: 'Tirar', danger: true,
      onOk: () => { arr.splice(arr.indexOf(m), 1); render(); toast('Material tirado.'); } });
    return;
  }
  if (d.resend) { const [aid, mid] = d.resend.split(':'); const arr = aid === 'build' ? S.build.files : agentById(aid).files; const m = arr.find((x) => x.id === mid); if (m) { arr.splice(arr.indexOf(m), 1); progressMaterial(arr, { ...m, state: 'sending', nota: 7, label: 'Boa', conf: 'média', resumo: 'Versão nova lida.' }); } else toast('Enviando de novo.'); return; }
  if (d.continue) {
    const a = agentById(d.continue);
    if (!S.build) { S.build = newBuild(a.type === 'internal' ? 'internal' : 'sdr'); S.build.files = a.files; }
    go(a.status === 'ready' ? 'ligue' : ({ Escolha: 'escolha', Conte: 'conte', Teste: 'teste', Ligue: 'ligue' }[a.stepName] || 'conte'));
    return;
  }
  if (d.toggle) { toggleAgent(d.toggle); return; }
  if (d.del) {
    S.open = null;
    const a = agentById(d.del);
    dialog({ title: `Excluir ${a.name}?`, body: a.status !== 'on' && a.status !== 'off' ? 'O rascunho sai da lista.' : a.actuation === 'internal' ? `O ${a.name} sai da lista e some do painel das conversas.` : `${artigo(a).toUpperCase()} ${a.name} sai da lista e para de atender. As conversas com ${ela(a)} vão para a equipe.`, // D34 (#1063)
      confirm: 'Excluir', danger: true, onOk: () => { S.agents = S.agents.filter((x) => x.id !== a.id); CHANNELS.forEach((c) => { if (c.busyBy === a.id) c.busyBy = null; }); go('lista'); toast(`${a.name} foi excluíd${artigo(a)}.`); } });
    return;
  }
  if (d.period) { S.period = Number(d.period); render(); return; }
  if (d.drill) { const [aid, k] = d.drill.split(':'); openDrill(aid, k); return; }
  if (d.sabetab) { S.sabeTab = d.sabetab; render(); return; }
  if (d.faqon) { const a = agentById(d.faqon); a.faqOn = !a.faqOn; render(); toast(a.faqOn ? 'Ligado. As próximas conversas resolvidas viram sugestões.' : 'Desligado.'); return; }
  if (d.faq) {
    const [k] = d.faq.split(':');
    if (k === 'edit') dialog({ title: 'Mudar e aprovar', confirm: 'Salvar e aprovar', html: '<div class="field"><label for="fq">Pergunta</label><input id="fq" value="Vocês atendem corretora com só uma pessoa?"></div><div class="field"><label for="fa">Resposta</label><textarea id="fa" rows="3">Sim. O Chat2You funciona para corretoras de qualquer tamanho.</textarea></div>', onOk: () => toast('Adicionada ao que ela sabe.') });
    else toast(k === 'ok' ? 'Adicionada ao que ela sabe.' : 'Sugestão ignorada.');
    return;
  }
  if (d.disc) {
    const [aid, cid] = d.disc.split(':'); const a = agentById(aid); const c = channelById(Number(cid));
    dialog({ title: `Tirar ${artigo(a)} ${a.name} do ${c.name}?`, body: `As conversas com ${ela(a)} neste canal vão para a equipe agora. Quem escrever depois fala direto com as pessoas.`, confirm: 'Tirar do canal', danger: true,
      onOk: () => { a.channels = a.channels.filter((x) => x !== c.id); c.busyBy = null; render(); toast(`${a.name} saiu do ${c.name}.`); } });
    return;
  }
  if (d.conn) { const [aid, cid] = d.conn.split(':'); const a = agentById(aid); const c = channelById(Number(cid)); a.channels.push(c.id); c.busyBy = a.id; render(); toast(`${a.name} agora atende no ${c.name}.`); return; }
  if (d.actMode) { const [aid, k] = d.actMode.split(':'); const a = agentById(aid); if (k === 'internal' && a.channels.length) { toast(`Tire ${artigo(a)} ${a.name} dos canais antes.`, 'warn'); return; } a.actuation = k; render(); return; }
  if (d.voice) { const [aid, k] = d.voice.split(':'); agentById(aid).voice = k; render(); return; }
  if (d.handoff) { const [aid, k] = d.handoff.split(':'); agentById(aid).handoff = k; render(); return; }
  if (d.target) { const [aid, k] = d.target.split(':'); agentById(aid).target = k; render(); return; }
  if (d.aud) { const [aid, k] = d.aud.split(':'); agentById(aid).audienceOpen = k === 'some'; render(); return; }
  if (d.win) { const [aid, k] = d.win.split(':'); agentById(aid).window = k; render(); return; }
  if (d.manual) {
    const a = agentById(d.manual);
    if (a.mode === 'manual') {
      dialog({ title: 'Voltar ao modo guiado?', body: `O texto que você escreveu deixa de valer e ${ela(a)} volta para a última versão montada pela conversa. O seu texto fica guardado em Versões anteriores.`, confirm: 'Voltar ao modo guiado', onOk: () => { a.mode = 'guided'; render(); toast('Voltou ao modo guiado.'); } });
      return;
    }
    dialog({ title: 'Escrever as instruções você mesmo?', body: 'O campo abre vazio. Enquanto você não salvar, ' + ela(a) + ' continua atendendo como hoje. Ao salvar, o seu texto passa a valer; a versão atual fica guardada.', confirm: 'Escrever eu mesmo', onOk: () => { a.mode = 'manual'; render(); } });
    return;
  }
  if (d.behavior) { agentById(current().split('-')[1]).behavior = d.behavior; render(); return; }
  if (d.restore) { dialog({ title: 'Voltar para esta versão?', body: 'A versão atual fica guardada. Você pode voltar para ela depois.', confirm: 'Voltar para esta', onOk: () => toast('Versão restaurada.') }); return; }
  if (d.save) { toast('Salvo.'); return; }
  if (d.tooltest) { S.toolResult = '{\n  "itens": [{ "nome": "Pastilha de freio dianteira", "estoque": 12 }]\n}  (exemplo)'; render(); toast('Ferramenta executada.'); return; }
  if (d.tooldel) { const [aid, i] = d.tooldel.split(':'); const a = agentById(aid); dialog({ title: `Excluir "${a.tools[i].name}"?`, confirm: 'Excluir', danger: true, onOk: () => { a.tools.splice(Number(i), 1); render(); toast('Ferramenta excluída.'); } }); return; }
  if (d.act && ACTIONS[d.act]) { ACTIONS[d.act](); }
});
document.addEventListener('submit', (e) => { if (e.target.id === 'composer') { e.preventDefault(); answer($('#answer').value); } });
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'answer' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); answer(e.target.value); }
  if (e.key === 'Escape' && S.open) { S.open = null; render(); }
});
document.addEventListener('input', (e) => {
  if (e.target.dataset.bfield && S.build) { // D29: mudar como se apresenta invalida o teste anterior
    const f = e.target.dataset.bfield; if (f === 'nome') S.build.answers.nome = e.target.value; else S.build.greeting = e.target.value;
    S.build.stale = true;
  }
});
document.addEventListener('change', (e) => { // D29: ao terminar a edição, a conversa de teste recomeça
  if (e.target.dataset.bfield && S.build && S.build.tested.length) { S.build.tested = []; S.build.chunks = {}; render(); }
  if (e.target.dataset.thr) { const a = agentById(e.target.dataset.thr); a.threshold = Number(e.target.value) / 100; const l = e.target.previousElementSibling.querySelector('span'); if (l) l.textContent = e.target.value + '%'; }
});

function boot() { shell(); render(); }
if (document.body) boot(); else document.addEventListener('DOMContentLoaded', boot);

</script>
