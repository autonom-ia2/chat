   - --primary #086DE0 (n-blue-11) com branco = 4,9:1  (#2781F6 com branco = 3,6:1, reprovado)

:root {

  /* borda de controle (campo, rádio, interruptor): 3,3:1 sobre branco (1.4.11) */
  --control-border: #8b8d98;
  /* navy (token novo n-navy, hoje #0D2344 solto) */

  --navy-deep: #081830;

  --primary-text: #ffffff;
  --cta: #008573;
  --cta-hover: #00705f;
  --cta-text: #ffffff;
  --focus: #2781f6;
  /* escalas */
  --blue-2: #f5f9ff;
  --blue-3: #e9f3ff;
  --blue-6: #b5d5ff;
  --blue-7: #9bc3fc;
  --blue-text: #0a5fc2;
  --teal-2: #f3fbf9;
  --teal-3: #e0f8f3;
  --teal-6: #a1ded2;
  --teal-9: #12a594;
  --teal-text: #00705f;
  --amber-2: #fefbe9;
  --amber-3: #fff7c2;
  --amber-6: #f3d673;
  --amber-9: #ffc53d;
  --amber-text: #8a4f00;
  --warn: #8a4f00;
  --warn-hover: #723f00;
  --ruby-2: #fff7f8;
  --ruby-3: #feeaed;
  --ruby-6: #f8bfc8;
  --ruby-text: #ca244d;
  --danger: #ca244d;
  --danger-hover: #ad1d41;
  --iris-3: #f0f1fe;
  --iris-text: #5753c6;
  /* celular estilo WhatsApp */
  --chat-bg: #eef7f4;
  --chat-dots: rgba(0, 112, 95, 0.07);
  --chat-head: #0d4a43;
  --chat-head-text: #ffffff;
  --bubble-agent: #ffffff;
  --bubble-client: #d6f5e9;

  --bubble-meta: #5b6a66;

  --proto-bg: #22262b;
  --proto-bg-2: #2e3339;
  --proto-text: #edeef0;
  --proto-text-2: #b6bbc2;
  --proto-accent: #ffc53d;

  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.06);
  --shadow-md: 0 4px 12px rgba(16, 24, 40, 0.08);

  --r-2xl: 16px;

  --fs-xs: 0.8125rem;
  --fs-sm: 0.875rem;

  --fs-lg: 1.125rem;
  --fs-xl: 1.25rem;
  --fs-2xl: 1.5rem;

  --model-border: transparent;
  --hero-ring: none;

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { letter-spacing: -0.01em; line-height: 1.2; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue-text); }
img, svg { display: block; max-width: 100%; }
ul, ol { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.on-navy :focus-visible, .hero :focus-visible { outline-color: #ffffff; }
.hero .model :focus-visible, .hero .card :focus-visible, .hero .review :focus-visible, .hero .phone :focus-visible { outline-color: var(--focus); }
::placeholder { color: var(--text-3); opacity: 1; }
/* pular para o conteúdo (visível só no foco) */
.skip {
  position: fixed; top: 8px; left: 8px; z-index: 200; min-height: 44px; padding: 0 16px; border-radius: 12px;
  background: var(--primary); color: #fff; border: 0; font-weight: 600; transform: translateY(-200%);
}
.skip:focus, .skip:focus-visible { transform: none; outline-color: var(--text); }
/* página sem a casca do produto (mapa e T17, que não são telas do produto) */
body.is-bare .side, body.is-bare .topbar { display: none; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.small { font-size: var(--fs-sm); }
.xsmall { font-size: var(--fs-xs); }
.stack { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.wrap { flex-wrap: wrap; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; } .gap-8 { gap: 32px; }
.grow { flex: 1 1 auto; min-width: 0; }
.mt-2 { margin-top: 8px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; } .mt-8 { margin-top: 32px; }
.hide-mobile { }
.only-mobile { display: none !important; }
@media (max-width: 767px) {
  .hide-mobile { display: none !important; }
  .only-mobile { display: revert !important; }
}
.icon { width: 20px; height: 20px; flex: none; }
.icon-sm { width: 16px; height: 16px; flex: none; }
.icon-lg { width: 24px; height: 24px; flex: none; }

/* ---------- faixa do protótipo (separada do produto) ---------- */
.proto {
  position: sticky; top: 0; z-index: 60;
  background: var(--proto-bg); color: var(--proto-text);
  border-bottom: 2px dashed var(--proto-accent);
  font-size: var(--fs-sm);
}
.proto-inner {
  display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap;
  padding: 6px 16px; min-height: var(--proto-h);
}
.proto-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-weight: 700; color: var(--proto-accent); font-size: var(--fs-xs);
}
.proto-btn {
  min-height: 44px; padding: 0 12px; border-radius: 10px;
  background: var(--proto-bg-2); color: var(--proto-text);
  border: 1px solid rgba(255, 255, 255, 0.14);
  display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: var(--fs-sm);
  text-decoration: none; white-space: nowrap;
}
.proto-btn:hover { background: #3a4048; }
.proto-btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.proto-btn[aria-pressed="true"] { background: var(--proto-accent); color: #22262b; border-color: transparent; }
.proto :focus-visible { outline-color: var(--proto-accent); }
.proto-step { color: var(--proto-text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (min-width: 768px) {
  .proto-inner { flex-wrap: nowrap; }
  .proto-step { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .proto-inner > * { flex-shrink: 0; }
  .proto-inner > .proto-step { flex-shrink: 1; }
}
.proto-spacer { flex: 1 1 auto; }
.proto-note {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 8px 16px 10px; border-top: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--proto-text-2); font-size: var(--fs-sm); line-height: 1.45;
}
.proto-note b { color: var(--proto-text); font-weight: 600; white-space: nowrap; }
.proto-note p { max-width: 110ch; }
.proto-states { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
.proto-states a {
  min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px;
  border-radius: 999px; color: var(--proto-text); background: var(--proto-bg-2);
  text-decoration: none; font-size: var(--fs-xs); border: 1px solid rgba(255, 255, 255, 0.12);
}
.proto-states a[aria-current="page"] { background: var(--proto-accent); color: #22262b; font-weight: 600; }
@media (max-width: 767px) {
  .proto { position: relative; }
  .proto-inner { padding: 2px 12px; min-height: 48px; }
  .proto-more { display: none; }
  .proto-more.is-open { display: block; }
  .proto-note { padding: 6px 12px 8px; }
  .proto-inner { gap: 6px; flex-wrap: nowrap; }
  .proto-btn { padding: 0 10px; min-width: 44px; justify-content: center; }
  .proto-spacer { display: none; }
  .proto-step { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .proto-note { display: block; }
  .proto-note b { display: block; }
  .proto-states { padding: 0 12px 8px; flex-wrap: nowrap; overflow-x: auto; }
  .proto-states a { flex: none; }
  .proto-label-long { display: none; }
}
.proto-label-short { display: none; }
@media (max-width: 767px) { .proto-label-short { display: inline; } }
@media (min-width: 768px) { .agent-card .week .part { white-space: nowrap; } }

/* seletor próprio (select-only combobox, sem <select> nativo) */
.combo { position: relative; }
.combo-btn {
  min-height: 44px; padding: 0 12px; border-radius: 10px; max-width: 70vw;
  background: var(--proto-bg-2); color: var(--proto-text);
  border: 1px solid rgba(255, 255, 255, 0.18);
  display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: var(--fs-sm);
}
.combo-btn span.v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.combo-list {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 80; min-width: 280px; max-width: calc(100vw - 24px);
  background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);
  border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px;
}
.combo-opt {
  min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-radius: 10px; cursor: pointer; font-size: var(--fs-md);
}
.combo-opt[aria-selected="true"] { font-weight: 600; color: var(--blue-text); }
.combo-opt.is-active { background: var(--blue-3); }
.combo-opt .k { font-variant-numeric: tabular-nums; color: var(--text-2); font-weight: 600; min-width: 22px; }

/* ---------- layout do produto ---------- */
.app { display: flex; min-height: calc(100vh - var(--proto-h)); }
.app-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.side {
  width: var(--side-w); flex: none; background: var(--surface); border-right: 1px solid var(--border);
  padding: 16px 12px; display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: var(--proto-top, 52px); height: calc(100vh - var(--proto-top, 52px)); overflow-y: auto;
}
.side-logo { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; font-weight: 700; font-size: var(--fs-lg); color: var(--text); text-decoration: none; }
.side-logo svg { width: 28px; height: 28px; }
.side-link {
  display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px;
  border-radius: 10px; color: var(--text-2); text-decoration: none; font-weight: 500; font-size: var(--fs-md);
}
.side-link:hover { background: var(--surface-3); color: var(--text); }
.side-link[aria-current="page"] { background: var(--blue-3); color: var(--blue-text); font-weight: 600; }
.side-foot { margin-top: auto; padding: 12px; display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); color: var(--text-2); }
#main.main { flex: 1 1 auto; min-width: 0; padding: 32px 32px 64px; }
.topbar { display: none; }
@media (max-width: 1023px) { #main.main { padding: 24px 20px 64px; } }
@media (max-width: 767px) {
  .app { display: block; }
  .side { display: none; }
  .topbar {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; min-height: 56px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .topbar .side-logo { padding: 0; font-size: var(--fs-base); }
  #main.main { padding: 16px 16px 96px; }
}
.page { margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 24px; }
.w-4xl { max-width: 896px; } .w-880 { max-width: 880px; } .w-5xl { max-width: 1024px; } .w-6xl { max-width: 1152px; }
.back-link {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 4px;
  color: var(--text-2); text-decoration: none; font-weight: 500; font-size: var(--fs-md); align-self: flex-start;
}
.back-link:hover { color: var(--text); }
.hero .back-link { color: var(--navy-text-2); }
.hero .back-link:hover { color: #fff; }
.page-title { font-size: var(--fs-2xl); font-weight: 700; }

/* ---------- herói navy com anéis ---------- */
.hero {
  position: relative; overflow: hidden; border-radius: var(--r-3xl);
  background: var(--navy); color: var(--navy-text); padding: 48px;
  border: 1px solid var(--navy-line); box-shadow: var(--hero-ring);
}
.hero-ring { position: absolute; border-radius: 50%; pointer-events: none; }
.hero-ring.r1 { right: -64px; top: -96px; width: 320px; height: 320px; border: 48px solid var(--ring-1); opacity: 0.15; }
.hero-ring.r2 { right: 128px; bottom: -144px; width: 224px; height: 224px; border: 32px solid var(--ring-2); opacity: 0.1; }
.hero > *:not(.hero-ring) { position: relative; }
.hero h1 { font-size: var(--fs-hero); font-weight: 700; line-height: 1.12; letter-spacing: -0.02em; color: #fff; }
.hero .lead { font-size: var(--fs-lg); line-height: 1.55; color: var(--navy-text-2); max-width: 60ch; }
.hero-compact { padding: 28px 32px; min-height: 140px; display: flex; align-items: center; gap: 24px; }
.hero-compact h1 { font-size: var(--fs-3xl); }
.hero-link { color: #fff; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }
.hero-line { border-top: 1px solid var(--navy-line); padding-top: 16px; color: var(--navy-text-2); }
@media (max-width: 767px) {
  .hero { padding: 28px 20px; border-radius: 20px; }
  .hero h1 { font-size: 1.75rem; }
  .hero .lead { font-size: var(--fs-base); }
  .hero-compact { flex-direction: column; align-items: stretch; padding: 24px 20px; }
  .hero-ring.r1 { width: 220px; height: 220px; border-width: 32px; right: -80px; top: -90px; }
  .hero-ring.r2 { display: none; }
}

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent;
  font-weight: 600; font-size: var(--fs-md); text-decoration: none; white-space: nowrap;
  transition: background-color .15s, box-shadow .15s, transform .15s; position: relative;
}
.btn-lg { min-height: 48px; font-size: var(--fs-base); padding: 0 20px; }
.btn-xl { min-height: 56px; font-size: var(--fs-lg); padding: 0 24px; border-radius: 14px; }
.btn-block { width: 100%; }
.btn-primary { background: var(--primary); color: var(--primary-text); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-cta { background: var(--cta); color: var(--cta-text); }
.btn-cta:hover { background: var(--cta-hover); }
.btn-white { background: var(--on-navy-btn); color: var(--on-navy-btn-text); }
.btn-white:hover { background: var(--on-navy-btn-hover); }
.btn-outline { background: var(--surface); color: var(--blue-text); border-color: var(--primary); }
.btn-outline:hover { background: var(--blue-2); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--control-border); }
.btn-secondary:hover { background: var(--surface-3); }
.btn-ghost { background: transparent; color: var(--blue-text); }
.btn-ghost:hover { background: var(--blue-3); }
.btn-ghost-navy { background: rgba(255, 255, 255, 0.08); color: #fff; border-color: rgba(255, 255, 255, 0.2); }
.btn-ghost-navy:hover { background: rgba(255, 255, 255, 0.16); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: var(--danger-hover); }
.btn-warn { background: var(--warn); color: #fff; }
.btn-warn:hover { background: var(--warn-hover); }
.btn-icon { width: 44px; padding: 0; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.btn.is-loading { pointer-events: none; opacity: 1; }
.spinner {
  width: 18px; height: 18px; border-radius: 50%; flex: none;
  border: 2.5px solid currentColor; border-right-color: transparent;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.link-btn {
  background: none; border: 0; padding: 0 4px; min-height: 44px; color: var(--blue-text);
  font-weight: 600; display: inline-flex; align-items: center; gap: 6px; text-decoration: underline; text-underline-offset: 3px;
}
.link-btn.plain { text-decoration: none; }
.link-danger { color: var(--ruby-text); }
.link-quiet { color: var(--text-2); font-weight: 500; }
@media (max-width: 767px) {
  .btn-mobile-xl { min-height: 56px; font-size: var(--fs-lg); width: 100%; }
}
/* rodapé fixo no celular (CTA de 56 px) */
.mobile-dock { display: contents; }
@media (max-width: 767px) {
  .mobile-dock {
    display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .mobile-dock .btn { width: 100%; min-height: 56px; font-size: var(--fs-lg); }
}

/* ---------- cartões ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2xl);
  box-shadow: var(--shadow-sm); padding: 20px;
}
.card-link { display: block; color: inherit; text-decoration: none; transition: transform .15s, box-shadow .15s, border-color .15s; }
.card-link:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--blue-7); }
.card-link:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--r-2xl); }
.grid-cards { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 768px) { .grid-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .grid-cards.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 767px) { .grid-cards { gap: 12px; } }
.avatar {
  width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-weight: 700; color: #fff; font-size: var(--fs-lg); background: var(--primary);
}
.avatar.sm { width: 32px; height: 32px; font-size: var(--fs-sm); }
.avatar.lg { width: 64px; height: 64px; font-size: var(--fs-2xl); }
.avatar.xl { width: 96px; height: 96px; font-size: 2rem; }
.av-muted { background: var(--surface-3); color: var(--text-2); }
.av-teal { background: #00705f; } .av-amber { background: #8a4f00; } .av-iris { background: #5753c6; } .av-blue { background: #086de0; } .av-ruby { background: #ad1d41; }
.skeleton { background: var(--skeleton); border-radius: 12px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.divider { height: 1px; background: var(--border); border: 0; margin: 0; }

/* ---------- pílulas de estado (com ponto) ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px;
  font-size: var(--fs-xs); font-weight: 600; line-height: 1.4; white-space: nowrap;
}
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.no-dot::before { display: none; }
.pill-on { background: var(--teal-3); color: var(--teal-text); }
.pill-off { background: var(--amber-3); color: var(--amber-text); }
.pill-draft { background: var(--amber-3); color: var(--amber-text); }
.pill-neutral { background: var(--surface-3); color: var(--text-2); }
.pill-blue { background: var(--blue-3); color: var(--blue-text); }
.pill-ruby { background: var(--ruby-3); color: var(--ruby-text); }
.hero .pill-on { background: rgba(18, 165, 148, 0.22); color: #7ef0d8; }
.hero .pill-off, .hero .pill-draft { background: rgba(255, 197, 61, 0.18); color: #ffd56b; }
/* pílula-frase (Onde → Quando) */
.phrase { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: var(--fs-md); }
.phrase .chip-when { padding: 4px 10px; border-radius: 8px; background: var(--blue-3); color: var(--blue-text); font-weight: 500; }
.phrase .chip-do { padding: 4px 10px; border-radius: 8px; background: var(--teal-3); color: var(--teal-text); font-weight: 500; }

/* ---------- interruptor 44×24 acessível ---------- */
.switch {
  display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 6px;
  background: none; border: 0; font-weight: 600; font-size: var(--fs-md);
}
.switch .track {
  width: 44px; height: 24px; border-radius: 999px; background: var(--control-border); position: relative; flex: none;
  transition: background-color .15s;
}
.switch .track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
}
.switch[aria-checked="true"] .track { background: var(--cta); }
.switch[aria-checked="true"] .track::after { transform: translateX(20px); }
.hero .switch { color: #fff; }
.hero .switch .track { background: rgba(255, 255, 255, 0.5); }
.hero .switch[aria-checked="true"] .track { background: var(--teal-9); }

/* ---------- stepper Conte · Confira · Ligue ---------- */
.steps { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.steps .sep { width: 28px; height: 2px; border-radius: 2px; background: var(--border-strong); }
.steps .sep.on { background: var(--blue-7); }
.step { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: var(--fs-md); color: var(--text-2); }
.step .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-sm); font-weight: 700; background: var(--surface-3); }
.step.done { color: var(--teal-text); } .step.done .dot { background: var(--teal-3); }
.step.now { color: var(--blue-text); } .step.now .dot { background: var(--blue-3); }
.steps-compact { display: none; align-items: center; gap: 10px; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.steps-compact .dots { display: flex; gap: 6px; }
.steps-compact .d { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
.steps-compact .d.done { background: var(--teal-9); } .steps-compact .d.now { background: var(--brand); }
@media (max-width: 767px) { .steps { display: none; } .steps-compact { display: flex; } }

/* ---------- celular estilo WhatsApp ---------- */
.phone {
  width: 360px; max-width: 100%; border-radius: 40px; padding: 10px; background: var(--device);
  box-shadow: var(--shadow-lg); flex: none;
}
.phone-screen {
  border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; height: 620px;
  background-color: var(--chat-bg);
  background-image: radial-gradient(var(--chat-dots) 1.2px, transparent 1.3px);
  background-size: 14px 14px;
}
.phone-head {
  display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px;
  background: var(--chat-head); color: var(--chat-head-text);
}
.phone-head .nm { font-weight: 600; font-size: var(--fs-md); line-height: 1.2; }
.phone-head .st { font-size: var(--fs-xs); opacity: .85; }
.phone-head .avatar { width: 36px; height: 36px; font-size: var(--fs-sm); background: rgba(255,255,255,.18); }
.phone-head .act { margin-left: auto; color: #fff; }
.phone-head .act.link-btn { color: #fff; font-size: var(--fs-sm); }
.phone-body { flex: 1 1 auto; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.phone-foot { padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.phone-badge {
  position: absolute; top: 16px; left: 18px; z-index: 2; background: var(--amber-9); color: #3d2a00;
  font-weight: 700; font-size: var(--fs-xs); padding: 3px 10px; border-radius: 999px;
}
.phone-wrap { position: relative; }
.phone.mini { width: 100%; border-radius: 28px; padding: 6px; box-shadow: none; }
.phone.mini .phone-screen { height: auto; min-height: 150px; border-radius: 22px; }
.phone.mini .phone-body { padding: 12px 10px; }
.phone-wrap.has-badge .phone.mini .phone-body { padding-top: 40px; }
.phone-wrap.has-badge .phone:not(.mini) .phone-head { padding-top: 40px; }
.phone.sm { width: 280px; } .phone.sm .phone-screen { height: 460px; }
.phone.xs { width: 220px; } .phone.xs .phone-screen { height: 360px; }
.phone.fit { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 32px; padding: 8px; box-shadow: var(--shadow-md); }
.phone.fit .phone-screen { border-radius: 24px; height: clamp(380px, calc(100vh - var(--proto-top, 0px) - 260px), 620px); }
.phone.flat { width: 100%; padding: 0; border-radius: 0; box-shadow: none; background: transparent; }
.phone.flat .phone-screen { border-radius: 0; height: auto; min-height: 60vh; }
.day-tag { align-self: center; font-size: var(--fs-xs); color: var(--bubble-meta); background: var(--surface); padding: 2px 10px; border-radius: 8px; }
.bubble {
  max-width: 82%; padding: 8px 12px 6px; border-radius: 14px; font-size: var(--fs-md); line-height: 1.45;
  color: var(--bubble-text); box-shadow: 0 1px 1px rgba(0,0,0,.06); word-wrap: break-word;
}
.bubble .meta { display: block; text-align: right; font-size: 0.6875rem; color: var(--bubble-meta); margin-top: 2px; }
.bubble.agent { align-self: flex-start; background: var(--bubble-agent); border-top-left-radius: 4px; }
.bubble.client { align-self: flex-end; background: var(--bubble-client); border-top-right-radius: 4px; }
.bubble.typing { display: inline-flex; gap: 4px; align-items: center; padding: 12px 14px; }
.typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bubble-meta); animation: blink 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: .2s; } .typing-dot:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.sys-bubble {
  align-self: center; margin: auto 0; max-width: 86%; text-align: center; padding: 8px 14px; border-radius: 10px;
  background: var(--surface); color: var(--text-2); font-size: var(--fs-sm); box-shadow: 0 1px 1px rgba(0,0,0,.06);
}
.used-line { align-self: flex-start; font-size: var(--fs-xs); color: var(--bubble-meta); padding-left: 6px; }
.handoff-band {
  align-self: stretch; display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px;
  background: var(--amber-3); color: var(--amber-text); font-size: var(--fs-sm); font-weight: 600;
}
.phone-input { display: flex; gap: 8px; align-items: flex-end; }
.phone-input textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 22px; }
.phone-input input, .phone-input textarea {
  flex: 1 1 auto; min-width: 0; min-height: 44px; border-radius: 22px; border: 1px solid var(--control-border);
  background: var(--surface); padding: 10px 16px; font-size: var(--fs-md); resize: none;
}
.phone-send {
  width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--cta); color: #fff; flex: none;
}
.phone-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.phone-chips .chip { flex: none; background: var(--surface); }
@media (max-width: 400px) { .phone { width: 100%; } }

/* ---------- conversa do Construtor (dono × montador) ---------- */
.convo { display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; gap: 10px; align-items: flex-start; max-width: 88%; }
.msg .bub { padding: 12px 16px; border-radius: 16px; font-size: var(--fs-base); line-height: 1.5; }
.msg.bot .bub { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 4px; }
.msg.owner { align-self: flex-end; flex-direction: row-reverse; }
.msg.owner .bub { background: var(--owner-bubble); border-top-right-radius: 4px; }
.bot-av { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--teal-3); color: var(--teal-text); }
.material {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; font-size: var(--fs-md);
  background: var(--surface); border: 1px solid var(--border);
}
.material.attn { background: var(--amber-2); border-color: var(--amber-6); }
.material.ok .st { color: var(--teal-text); }
.material.attn .st { color: var(--amber-text); }
.state-word { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: var(--fs-sm); }
.state-word.ok { color: var(--teal-text); } .state-word.attn { color: var(--amber-text); } .state-word.reading { color: var(--text-2); }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); font-size: var(--fs-md); font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; text-align: left;
}
.chip:hover { background: var(--blue-2); border-color: var(--blue-7); }
.chip[aria-pressed="true"], .chip[aria-selected="true"] { background: var(--blue-3); border-color: var(--blue-7); color: var(--blue-text); font-weight: 600; }
.chip[disabled], .chip[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.hero .chip { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.2); color: #fff; }

/* ---------- compositor ---------- */
.composer {
  display: flex; align-items: flex-end; gap: 8px; padding: 8px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--control-border); box-shadow: var(--shadow-sm);
}
.composer textarea {
  flex: 1 1 auto; min-width: 0; border: 0; outline: none; background: transparent; resize: none;
  min-height: 44px; max-height: 160px; padding: 10px 8px; font-size: var(--fs-base);
}
.composer:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.composer textarea[readonly] { color: var(--text-2); }
@media (max-width: 767px) {
  .composer { padding: 4px; gap: 4px; }
  .composer textarea { padding: 10px 4px; }
  .composer textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .composer .btn { padding: 0 12px; }
}
.composer .tool { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--text-2); display: grid; place-items: center; flex: none; }
.composer .tool:hover { background: var(--surface-3); color: var(--text); }
.field-hint { font-size: var(--fs-sm); color: var(--text-2); }

/* ---------- campos ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: var(--fs-md); }
.input {
  min-height: 48px; border-radius: 12px; border: 1px solid var(--control-border); background: var(--surface);
  padding: 10px 14px; font-size: var(--fs-base); width: 100%;
}
.input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: 12px; }
textarea.input { min-height: 120px; resize: vertical; line-height: 1.5; }
.field-error { color: var(--ruby-text); font-size: var(--fs-sm); font-weight: 500; }

/* ---------- cartões-rádio (radiogroup WAI-ARIA, sem <select>) ---------- */
.radios { display: flex; flex-direction: column; gap: 8px; }
.radio-card {
  min-height: 56px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  border-radius: 14px; border: 1px solid var(--border-strong); background: var(--surface); text-align: left;
}
.radio-card .mark { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--control-border); flex: none; display: grid; place-items: center; }
.radio-card[aria-checked="true"] { border-color: var(--brand); background: var(--blue-2); box-shadow: 0 0 0 1px var(--brand) inset; }
.radio-card[aria-checked="true"] .mark { border-color: var(--brand); }
.radio-card[aria-checked="true"] .mark::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
.radio-card[aria-disabled="true"] { cursor: not-allowed; background: var(--surface-2); color: var(--text-2); }
.radio-card.busy { border-color: var(--amber-6); background: var(--amber-2); }
.radio-card.busy .ttl { color: var(--amber-text); }
.radio-card.busy[aria-checked="true"] { border-color: var(--amber-text); box-shadow: 0 0 0 1px var(--amber-text) inset; background: var(--amber-2); }
.radio-card.busy[aria-checked="true"] .mark { border-color: var(--amber-text); }
.radio-card.busy[aria-checked="true"] .mark::after { background: var(--amber-text); }
.radio-card .ttl { font-weight: 600; }
.radio-card .sub { font-size: var(--fs-sm); color: var(--text-2); }

/* ---------- bloco StepReview com "Alterar" ---------- */
.review { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2xl); box-shadow: var(--shadow-sm); padding: 0 20px; }
.review-block { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--border); }
.review-block:last-child { border-bottom: 0; }
.review-block .lbl { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.review-block .main { font-size: var(--fs-base); font-weight: 600; color: var(--text); }
.review-block .det { font-size: var(--fs-md); color: var(--text-2); }
.review-block .btn { flex: none; }
.review-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2xl); box-shadow: var(--shadow-sm); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.review-card .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.review-card h2 { font-size: var(--fs-lg); font-weight: 600; }

/* ---------- faixa KPI (ResultKpiStrip) ---------- */
/* dois blocos claros iguais: o único momento escuro da página é o herói */
.kpi { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.kpi-cell { padding: 24px; display: flex; flex-direction: column; gap: 6px; text-align: left; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2xl); box-shadow: var(--shadow-sm); }
.kpi-cell .num { font-size: 2.25rem; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi-cell .lbl { font-size: var(--fs-md); font-weight: 600; }
.kpi-cell .note { font-size: var(--fs-sm); color: var(--text-2); }
button.kpi-cell { cursor: pointer; }
button.kpi-cell:hover { background: var(--surface-3); }
@media (max-width: 767px) {
  .kpi-cell { padding: 16px; } .kpi-cell .num { font-size: 1.75rem; }
  .kpi { grid-template-columns: 1fr 1fr; gap: 12px; }
}

/* ---------- cartão de erro padrão (T17) e faixas ---------- */
.err {
  display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: var(--r-xl);
  background: var(--ruby-2); border: 1px solid var(--ruby-6);
}
.err.amber { background: var(--amber-2); border-color: var(--amber-6); }
.err .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--ruby-3); color: var(--ruby-text); }
.err.amber .ic { background: var(--amber-3); color: var(--amber-text); }
.err .t { font-weight: 600; color: var(--text); }
.err .g { color: var(--text-2); font-size: var(--fs-md); }
.err .btn { margin-top: 8px; }
@media (max-width: 767px) { .err .btn { width: 100%; min-height: 56px; } }
.band { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-xl); font-size: var(--fs-md); }
.band-amber { background: var(--amber-2); border: 1px solid var(--amber-6); color: var(--text); }
.band-amber > .icon { color: var(--amber-text); }
.band-teal { background: var(--teal-2); border: 1px solid var(--teal-6); }
.band-teal > .icon { color: var(--teal-text); }
.band-blue { background: var(--blue-2); border: 1px solid var(--blue-6); }

/* ---------- camada: gaveta, folha, diálogo, menu ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 90; animation: fade .18s ease-out; }
@media (min-width: 768px) {
  .scrim { top: var(--proto-top, 0px); }
  .drawer { top: var(--proto-top, 0px) !important; }
}
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; width: 480px; max-width: 100vw;
  background: var(--surface); box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
  animation: slideIn .22s ease-out; border-left: 1px solid var(--border);
}
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 16px 16px 16px 24px; border-bottom: 1px solid var(--border); }
.drawer-head h2 { font-size: var(--fs-xl); font-weight: 700; flex: 1 1 auto; min-width: 0; }
.drawer-body { flex: 1 1 auto; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.drawer-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.drawer-foot.row-foot { flex-direction: row; justify-content: flex-end; }
.drawer .grab { display: none; }
.close-btn { min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: var(--surface-3); color: var(--text); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.close-btn:hover { background: var(--border-strong); }
@media (max-width: 767px) {
  .drawer { width: 100vw !important; border-left: 0; animation: slideUp .22s ease-out; }
  .drawer-head { padding: 12px 12px 12px 16px; }
  .drawer-body { padding: 16px; }
  .drawer-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .drawer-foot .btn { min-height: 56px; width: 100%; font-size: var(--fs-lg); }
  .drawer-foot.row-foot { flex-direction: column-reverse; }
  .drawer.as-sheet { top: 24px; border-radius: 20px 20px 0 0; }
  .drawer.as-sheet .grab { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 8px auto 0; }
}
.dialog {
  position: fixed; z-index: 110; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 400px; max-width: calc(100vw - 32px); background: var(--surface); border-radius: 20px;
  box-shadow: var(--shadow-lg); padding: 24px; display: flex; flex-direction: column; gap: 12px;
  animation: pop .18s ease-out; border: 1px solid var(--border);
}
.dialog h2 { font-size: var(--fs-xl); font-weight: 700; }
.dialog-ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); }
.dialog-ic.amber { background: var(--amber-3); color: var(--amber-text); }
.dialog-ic.ruby { background: var(--ruby-3); color: var(--ruby-text); }
.dialog p b { color: var(--text); }
.dialog .dlg-extra { font-size: var(--fs-md); }
.dialog .dlg-extra .link-btn { padding: 6px 0; margin-block: -6px; }
.dialog p { color: var(--text-2); }
.dialog .warn-box { background: var(--amber-2); border: 1px solid var(--amber-6); border-radius: 12px; padding: 12px 14px; color: var(--text); display: flex; gap: 10px; }
.dialog .warn-box .icon { color: var(--amber-text); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
@media (max-width: 767px) {
  .dialog { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: 100vw; max-width: 100vw; border-radius: 20px 20px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); animation: slideUp .22s ease-out; }
  .dialog-actions { flex-direction: column-reverse; }
  .dialog-actions .btn { width: 100%; min-height: 56px; font-size: var(--fs-lg); }
  /* excluir: "Cancelar" em cima e cheio; excluir embaixo, só contorno rubi */
  .dialog.safe-top .dialog-actions { flex-direction: column; }
  .dialog.safe-top .dialog-actions .btn-secondary { background: var(--surface-3); border-color: transparent; }
  .dialog.safe-top .dialog-actions .btn-danger { background: var(--surface); color: var(--ruby-text); border-color: var(--ruby-text); }
}
.menu {
  position: absolute; z-index: 85; min-width: 240px; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; animation: fade .12s ease-out;
}
.menu-item {
  width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 0; background: none;
  border-radius: 10px; text-align: left; font-size: var(--fs-md); color: var(--text);
}
.menu-item:hover, .menu-item:focus-visible { background: var(--surface-3); outline-offset: -2px; }
.menu-item.danger { color: var(--ruby-text); }
.menu-sep { height: 1px; background: var(--border); margin: 6px 4px; }
.toasts { position: fixed; z-index: 120; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast {
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 500; font-size: var(--fs-md);
  box-shadow: var(--shadow-lg); display: flex; gap: 10px; align-items: center; animation: rise .2s ease-out;
}
@media (max-width: 767px) { .toasts { bottom: 96px; } }
@keyframes fade { from { opacity: 0; } }
@keyframes slideIn { from { transform: translateX(24px); opacity: 0; } }
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.98); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.rise-in { animation: rise .3s ease-out; }
body.layer-open { overflow: hidden; }

/* ---------- T01 · modelos dentro do herói ---------- */
.models { display: grid; gap: 20px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 32px; }
@media (max-width: 1023px) { .models { grid-template-columns: 1fr; } }
.model {
  background: var(--model-bg); border: 1px solid var(--model-border); color: var(--text); border-radius: var(--r-2xl); box-shadow: var(--shadow-2xl);
  padding: 20px; display: flex; flex-direction: column; gap: 14px; position: relative;
}
/* cartão inteiro clicável: o botão "Usar este" estica sobre o cartão */
.model.is-pick { cursor: pointer; transition: transform .15s, box-shadow .15s; }
.model.is-pick .btn { position: static; }
.model.is-pick .btn::after { content: ''; position: absolute; inset: 0; border-radius: inherit; }
.model.is-pick:hover { transform: translateY(-2px); }
.model.is-pick:hover .btn-outline { background: var(--blue-2); }
.model.is-pick:has(.btn:focus-visible) { outline: 3px solid var(--focus); outline-offset: 3px; }
.model.is-pick .btn:focus-visible { outline: none; box-shadow: none; }
.model .err { position: relative; z-index: 1; }
.hero .model.is-pick:has(.btn:focus-visible) { outline-color: #ffffff; }
.model h2 { font-size: var(--fs-lg); font-weight: 600; }
.model .txt { color: var(--text-2); font-size: var(--fs-md); line-height: 1.5; }
.model .btn { margin-top: auto; }
.model .phone.mini .phone-screen { background-size: 12px 12px; }
.model.is-locked { opacity: .55; pointer-events: none; }
@media (max-width: 767px) {
  .models { gap: 16px; margin-top: 24px; }
  .model .btn { min-height: 56px; font-size: var(--fs-lg); }
  .model .phone .bubble.extra { display: none; }
}
.drawer .models { grid-template-columns: 1fr; margin-top: 0; }
.drawer .model { box-shadow: var(--shadow-sm); border: 1px solid var(--border); }

/* ---------- T02 · cartão de agente ---------- */
.agent-card { display: flex; flex-direction: column; gap: 12px; padding: 20px; position: relative; height: 100%; }
.agent-card .nm { font-size: var(--fs-lg); font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.agent-card .where { color: var(--text); font-size: var(--fs-md); }
.agent-card .week { color: var(--text-2); font-size: var(--fs-md); font-variant-numeric: tabular-nums; }
.agent-card .week b { color: var(--text); font-weight: 600; }
.agent-card .week b.big { font-size: var(--fs-lg); }
.quote-card { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.agent-card .stretch { position: absolute; inset: 0; border-radius: var(--r-2xl); z-index: 1; }
.agent-card .above { position: relative; z-index: 2; }
.card.is-draft { background: var(--surface); }
.card.is-off { background: var(--surface); }
.more-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--text-2); display: grid; place-items: center; flex: none; }
.more-btn:hover { background: var(--surface-3); color: var(--text); }
.hero .more-btn { color: #fff; background: rgba(255,255,255,.08); }
.hero .more-btn:hover { background: rgba(255,255,255,.16); }
@media (max-width: 767px) {
  .agent-card .week .sep-dot { display: none; }
  .agent-card .week span.part { display: block; }
  .agent-card .btn-cont { width: 100%; min-height: 48px; }
  .list-pad { padding-bottom: 88px; }
}

/* ---------- mapa de telas ---------- */
.map-group { display: flex; flex-direction: column; gap: 12px; }
.map-group h2 { font-size: var(--fs-xl); font-weight: 700; }
.map-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.map-card { display: flex; flex-direction: column; gap: 10px; padding: 12px; text-decoration: none; color: inherit; }
.thumb { height: 104px; border-radius: 10px; background: var(--surface-3); position: relative; overflow: hidden; border: 1px solid var(--border); }
.thumb i { position: absolute; display: block; border-radius: 4px; }
.thumb .t-side { left: 0; top: 0; bottom: 0; width: 18%; background: var(--surface); border-right: 1px solid var(--border); }
.thumb .t-hero { left: 24%; right: 6%; top: 10%; height: 40%; background: var(--navy); border-radius: 6px; }
.thumb .t-card { background: var(--surface); border: 1px solid var(--border); }
.thumb .t-phone { background: var(--chat-bg); border: 3px solid var(--device); border-radius: 8px; }
.thumb .t-drawer { right: 0; top: 0; bottom: 0; width: 38%; background: var(--surface); border-left: 1px solid var(--border-strong); border-radius: 0; box-shadow: var(--shadow-md); }
.thumb .t-scrim { inset: 0; background: var(--scrim); border-radius: 0; }
.thumb .t-dialog { left: 30%; right: 30%; top: 28%; bottom: 28%; background: var(--surface); border-radius: 6px; }
.thumb .t-err { background: var(--ruby-3); border: 1px solid var(--ruby-6); }
.thumb .t-cta { background: var(--cta); height: 10%; border-radius: 4px; }
.map-card .id { font-weight: 500; font-size: var(--fs-xs); color: var(--text-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.map-card .nm { font-weight: 600; font-size: var(--fs-md); line-height: 1.3; }
.thumb .t-check { width: 18px; height: 18px; border-radius: 50%; background: var(--teal-9); }
.thumb .t-radio { right: 4%; width: 30%; height: 12%; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 4px; }
.thumb .t-radio-on { border: 2px solid var(--brand); }
.thumb .t-radio-busy { background: var(--amber-3); border-color: var(--amber-6); }
.thumb .t-line { right: 4%; width: 30%; height: 8%; background: var(--surface-3); border-radius: 3px; }

/* ---------- placeholder (tela ainda não montada) ---------- */
.todo { border: 2px dashed var(--border-strong); border-radius: var(--r-2xl); padding: 40px 24px; text-align: center; color: var(--text-2); }

/* ---------- movimento reduzido ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  .card-link:hover { transform: none; }
}

/* =====================================================================
   styles-extra.css · T14 editor, T17 catálogo de erros
   Só usa tokens de styles.css (claro e escuro já cobertos lá).

/* ---------- T14 · editor de instruções ---------- */
.x-editor { position: relative; }
.x-editor textarea.input {
  min-height: calc(20 * 1.5em + 56px); resize: vertical; padding-bottom: 40px;
  font-size: var(--fs-base); line-height: 1.5;
}
.x-editor textarea.input[aria-invalid="true"] { border-color: var(--ruby-text); }
.x-editor textarea.input[readonly] { background: var(--surface-2); }
.x-count {
  position: absolute; right: 12px; bottom: 10px; pointer-events: none;
  font-size: var(--fs-xs); font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums;
  background: var(--surface); padding: 2px 8px; border-radius: 6px;
}
.x-foot { display: flex; flex-direction: column; gap: 12px; }
.x-foot-row { display: flex; justify-content: flex-end; gap: 8px; }
.x-foot .err .btn { margin-top: 8px; }
@media (max-width: 767px) {
  .x-editor textarea.input { min-height: calc(14 * 1.5em + 56px); }
  .x-foot-row { flex-direction: column-reverse; }
  .x-foot-row .btn { width: 100%; }
}

/* ---------- T17 · página "Quando algo dá errado" ---------- */
.x-lead { max-width: 64ch; font-size: var(--fs-base); }
.x-h2 { font-size: var(--fs-lg); font-weight: 600; }
.x-anat { display: flex; flex-direction: column; gap: 20px; padding: 24px; }
.x-anat-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.x-anat-card { padding: 20px; border-radius: var(--r-2xl); background: var(--surface-2); border: 1px dashed var(--border-strong); }
.x-fake-btn { margin-top: 8px; align-self: flex-start; cursor: default; }
.x-num {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; flex: none;
  background: var(--navy); color: var(--navy-text); font-size: 0.75rem; font-weight: 700; margin-right: 8px;
  font-variant-numeric: tabular-nums; vertical-align: 1px;
}
.x-anat-list { display: flex; flex-direction: column; gap: 14px; }
.x-anat-list li { display: flex; gap: 4px; align-items: flex-start; }
.x-anat-list .x-num { margin-top: 1px; }
.x-anat-list .t { font-weight: 600; }
.x-keys { display: flex; flex-wrap: wrap; gap: 8px 24px; padding-top: 16px; border-top: 1px solid var(--border); }
.x-key { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--text-2); }
.x-dot { width: 10px; height: 10px; border-radius: 50%; }
.x-dot.ruby { background: var(--ruby-text); }
.x-dot.amber { background: var(--amber-9); }

.x-apps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.x-eyebrow { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
body.is-bare #main.main { background: var(--surface-2); }
.x-app { display: flex; flex-direction: column; gap: 14px; transition: box-shadow .2s, border-color .2s; }
.x-app.is-focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--blue-3), var(--shadow-md); }
.x-app-head { display: flex; align-items: flex-start; gap: 12px; }
.x-app-head h2 { font-size: var(--fs-lg); font-weight: 600; }
.x-app-head h2:focus { outline: none; }
.x-app-head h2:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
.x-app-head .link-btn { flex: none; font-size: var(--fs-sm); }
.x-ctx {
  display: flex; flex-direction: column; gap: 10px; padding: 16px;
  border-radius: var(--r-xl); background: var(--surface-2); border: 1px solid var(--border);
}
.x-ctx .phone.flat .phone-screen { min-height: 0; border-radius: var(--r-xl); }
.x-ctx .phone.flat .phone-body { min-height: 200px; }
.x-in-phone { align-self: stretch; }
.x-ctx .review { padding: 0 16px; }
.x-ctx .review-block { padding: 12px 0; }
.x-sheet-title { font-size: var(--fs-lg); font-weight: 700; }
.x-mini-list { display: flex; flex-direction: column; gap: 8px; }
.x-mini-list li {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-xl);
  background: var(--surface); border: 1px solid var(--border);
}
.x-mini-list .nm { font-weight: 600; }
.x-lig-ok {
  display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r-xl);
  background: var(--surface); border: 1px solid var(--border);
}
.x-lig-ok .nm { font-weight: 600; }
.x-again { align-self: flex-start; font-size: var(--fs-sm); }

.x-cat { display: flex; flex-direction: column; margin-top: 12px; }
.x-row {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto minmax(0, 200px); gap: 14px; align-items: center;
  padding: 14px 0; border-top: 1px solid var(--border);
}
.x-row:first-child { border-top: 0; }
.x-row-ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--ruby-3); color: var(--ruby-text); }
.x-row.amber .x-row-ic { background: var(--amber-3); color: var(--amber-text); }
.x-row-txt .t { font-weight: 600; }
.x-row-txt .g { color: var(--text-2); font-size: var(--fs-md); }
.x-row-btn {
  display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 10px; white-space: nowrap;
  border: 1px solid var(--border-strong); background: var(--surface); font-weight: 600; font-size: var(--fs-sm);
}
.x-row-where { font-size: var(--fs-sm); color: var(--text-2); }
.x-row-where a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; }
.x-hint { display: flex; flex-direction: column; gap: 14px; }

@media (max-width: 1023px) {
  .x-apps { grid-template-columns: 1fr; }
}
@media (max-width: 767px) {
  .x-anat { padding: 20px 16px; }
  .x-anat-grid { grid-template-columns: 1fr; gap: 20px; }
  .x-anat-card { padding: 14px; }
  .x-ctx { padding: 12px; }
  .x-row { grid-template-columns: 36px minmax(0, 1fr); gap: 8px 12px; align-items: start; }
  .x-row-btn, .x-row-where { grid-column: 2; justify-self: start; }

/* botão do cartão de erro: largura do texto no desktop (56 px e largura total no celular, via .err) */
@media (min-width: 768px) {
  .x-ctx .err .btn, .dialog .err .btn, .x-foot .err .btn { align-self: flex-start; }
}

/* ---------- cabeçalho da criação ---------- */
.cr-head { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.cr-page { gap: 16px; }

/* ---------- duas colunas: conversa 7/12 · celular 5/12 ---------- */
.cr-grid { display: grid; gap: 32px; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: start; }
@media (max-width: 1023px) { .cr-grid { grid-template-columns: 1fr; } }

.cr-convo {
  padding: 0; display: flex; flex-direction: column; overflow: hidden;
  /* cresce com a conversa (o campo encosta na última mensagem) até a altura da tela */
  max-height: calc(100vh - var(--proto-top, 52px) - 230px); min-height: 360px;
}
.cr-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 12px; }
.cr-quiet-hint { font-size: var(--fs-sm); color: var(--text-2); padding: 0 4px; }
.cr-log:focus { outline: none; }
.msg .bub:focus { outline: none; }
.msg .bub:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.cr-foot { padding: 12px 16px 14px; border-top: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.cr-intro {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-xl);
  background: var(--surface-2); color: var(--text-2); font-size: var(--fs-md); border: 1px solid var(--border);
}
.cr-intro .icon { color: var(--blue-text); margin-top: 2px; }
.cr-log { display: flex; flex-direction: column; gap: 12px; }
.msg.bot .bot-av { background: var(--teal-9); color: #062b26; }
.msg .bub.thinking { display: inline-flex; align-items: center; gap: 10px; color: var(--text-2); }
.msg .bub.thinking .typing-dot { background: var(--text-3); }
.cr-slow { font-size: var(--fs-sm); color: var(--text-2); margin-left: 42px; }
.cr-chips { margin-left: 42px; }
.cr-chips .chip { background: var(--surface); }
.cr-err { margin-left: 42px; }
.cr-attach-line {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0 6px; color: var(--text-2); font-size: var(--fs-sm);
  padding: 4px 2px 0;
}
.cr-attach-line .icon-sm { color: var(--text-3); }
.cr-attach-line .link-btn { min-height: 44px; padding: 6px 2px; margin-block: -6px; font-size: var(--fs-sm); }

/* material juntado vira balão do lado do dono */
.cr-mat { align-self: flex-end; max-width: 88%; flex-wrap: wrap; }
.cr-mat .nm { font-weight: 600; overflow-wrap: anywhere; }
.cr-mat .ic { color: var(--text-2); display: grid; place-items: center; }
.cr-mat.attn .ic { color: var(--amber-text); }
.cr-mat .attn-txt { flex-basis: 100%; color: var(--text); font-size: var(--fs-sm); }
.cr-mat .acts { flex-basis: 100%; display: flex; gap: 4px 16px; flex-wrap: wrap; }
.cr-mat .acts .link-btn { font-size: var(--fs-sm); }
.cr-mat .queued { color: var(--text-2); font-size: var(--fs-sm); }

/* ---------- coluna do celular ---------- */
.cr-side { position: sticky; top: calc(var(--proto-top, 52px) + 24px); display: flex; flex-direction: column; align-items: center; gap: 12px; }
@media (max-width: 1023px) { .cr-side { position: static; } }
.cr-side-head { width: 360px; max-width: 100%; display: flex; flex-direction: column; gap: 4px; }
.cr-side-head h2 { font-size: var(--fs-lg); font-weight: 700; }
.cr-side-head p { color: var(--text-2); font-size: var(--fs-md); }
.cr-under { width: 360px; max-width: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 8px; text-align: center; }
.cr-under .muted { font-size: var(--fs-md); }
.cr-under .link-btn { align-self: center; }
.cr-caption { color: var(--text-2); font-size: var(--fs-md); text-align: center; }
.cr-side .phone .phone-screen { height: clamp(380px, calc(100vh - var(--proto-top, 52px) - 300px), 560px); }
.cr-side .has-test-wrap .phone .phone-screen { height: clamp(380px, calc(100vh - var(--proto-top, 52px) - 400px), 560px); }
.phone-head .act .link-btn { color: #fff; min-height: 44px; font-size: var(--fs-sm); }
.cta-sub { font-size: var(--fs-sm); color: var(--text-2); text-align: center; }
.phone-note {
  align-self: center; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px;
  background: var(--teal-3); color: var(--teal-text); font-size: var(--fs-sm); font-weight: 600;
}
.phone-foot .chips.wrap-chips { flex-wrap: wrap; overflow: visible; }
.phone-foot .chip { min-height: 44px; padding: 0 10px; font-size: var(--fs-xs); }
.phone-input .btn { flex: none; }
.phone .err { padding: 12px; }
.phone .err .ic { width: 30px; height: 30px; }

/* ---------- celular (≤767px) ---------- */
.cr-page-m { gap: 16px; padding-bottom: 200px; }
.cr-page-m .page-title { font-size: var(--fs-2xl); }
.cr-dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
  background: var(--bg); border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 8px;
}
.cr-dock .ex-bar {
  min-height: 44px; width: 100%; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface);
  display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: var(--fs-md); color: var(--text);
}
.cr-dock .ex-bar .icon { color: var(--teal-text); }
.cr-dock .btn-xl { width: 100%; }
.cr-dock .composer { box-shadow: none; padding: 4px; gap: 4px; }
.cr-dock .composer textarea { padding: 10px 4px; }
.cr-dock .composer textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cr-dock .composer .btn { padding: 0 12px; }
.cr-dock .field-hint { padding: 0 4px; }
.cr-test-m { gap: 12px; padding-bottom: 170px; }
.cr-test-m.has-cta { padding-bottom: 270px; }
.cr-test-m .phone.flat { margin: 0 -16px; width: calc(100% + 32px); max-width: none; }
.cr-test-m .phone.flat .phone-screen { min-height: 36vh; }
.cr-test-m .phone-body { min-height: 36vh; }
.cr-test-dock .phone-chips { display: flex; flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 2px; }
.cr-test-dock .phone-chips .chip { flex: none; white-space: nowrap; scroll-snap-align: start; font-size: var(--fs-sm); }
.cr-test-dock .muted.small { text-align: center; }
.cr-sheet-phone { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.cr-sheet-phone .phone { width: 100%; }
.cr-sheet-phone .phone .phone-screen { height: auto; min-height: 320px; }

/* ---------- juntar arquivo ou site ---------- */
.cr-proto-box { border: 2px dashed var(--border-strong); border-radius: var(--r-xl); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.cr-proto-box .xsmall { color: var(--text-2); font-weight: 600; }
.cr-file-opt {
  min-height: 48px; width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px;
  border: 1px solid var(--border-strong); background: var(--surface); text-align: left; font-size: var(--fs-md);
}
.cr-file-opt:hover { background: var(--surface-3); }
.cr-file-opt .sz { margin-left: auto; color: var(--text-2); font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }

/* ---------- T05 · Comece (começar a atender) ---------- */
.lig-review { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-2xl); padding: 0 16px; }
.lig-sec { padding: 16px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
.lig-sec:last-child { border-bottom: 0; }
.lig-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.lig-row .lbl { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.lig-row .lig-main { font-size: var(--fs-base); font-weight: 600; color: var(--text); }
.lig-row .lig-det { font-size: var(--fs-sm); color: var(--text-2); }
.lig-row .btn { flex: none; }
.lig-busy {
  display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px;
  border: 1px solid var(--amber-6); background: var(--amber-2);
}
.lig-busy .ttl { font-weight: 600; }
.lig-busy .btn { align-self: flex-start; }
.lig-busy.chosen { box-shadow: 0 0 0 2px var(--amber-text) inset; }
.lig-confirm { display: flex; gap: 8px; align-items: flex-start; font-size: var(--fs-md); color: var(--text); padding: 10px 12px; border-radius: 10px; background: var(--amber-2); border: 1px solid var(--amber-6); }
.lig-confirm .icon-sm { color: var(--amber-text); margin-top: 3px; }
.lig-ext {
  min-height: 56px; display: flex; align-items: center; padding: 10px 14px; border-radius: 14px;
  border: 1px dashed var(--border-strong); background: var(--surface-2); color: var(--text-2); font-weight: 500;
}
.lig-hint { font-size: var(--fs-sm); color: var(--text-2); }
.lig-hint .link-btn { font-size: var(--fs-sm); min-height: 44px; padding-block: 6px; margin-block: -6px; }
.lig-note { font-size: var(--fs-sm); color: var(--text-2); }
.is-locked-area { pointer-events: none; opacity: .7; }

/* ---------- T06 · Pronto ---------- */
.cr-done { padding: 48px; min-height: min(640px, calc(100vh - var(--proto-top, 52px) - 200px)); display: grid; align-content: center; }
.cr-done-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 40px; align-items: center; }
.cr-done-grid.one { grid-template-columns: 1fr; }
.cr-done-check {
  position: relative; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
  background: var(--teal-9); color: #062b26; box-shadow: 0 0 0 8px rgba(18, 165, 148, 0.18);
}
.cr-done-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--teal-9); animation: doneRing 1.1s ease-out .15s both; pointer-events: none; }
@keyframes doneRing { from { transform: scale(1); opacity: .9; } to { transform: scale(2.1); opacity: 0; } }
.cr-done-check .icon { width: 36px; height: 36px; stroke-width: 3; }
.cr-done .lead + .lead { margin-top: -4px; }
.cr-done .extra { color: #fff; font-weight: 600; }
.cr-done .acts { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 8px; }
.cr-done .phone.sm .phone-screen { height: 400px; }
.cr-done-pop { animation: donePop .5s cubic-bezier(.2, .9, .3, 1.3); }
@keyframes donePop { from { transform: scale(.6); opacity: 0; } }
@media (max-width: 767px) {
  .cr-done { padding: 28px 16px; min-height: calc(100vh - 56px - 32px - 110px); }
  .cr-done-grid { grid-template-columns: 1fr; gap: 24px; justify-items: start; }
  .cr-done-phone { order: -1; justify-self: center; }
  .cr-done h1 { font-size: 1.75rem; }
  .cr-done .phone-wrap { justify-self: center; }
  .cr-done .phone.xs .phone-screen { height: 300px; }
  .cr-done-dock { background: var(--navy); border-top: 1px solid var(--navy-line); }
  .cr-done-dock .btn { width: 100%; min-height: 56px; font-size: var(--fs-lg); }
  .cr-done-dock .hero-link { width: 100%; justify-content: center; }
  .cr-done-dock :focus-visible { outline-color: #fff; }
}

/* foco programático no título da tela (não é controle) */
#cr-h1:focus:not(:focus-visible), #t06-h1:focus:not(:focus-visible) { outline: none; }
#cr-h1[tabindex="-1"]:focus, #t06-h1[tabindex="-1"]:focus { outline: none; }
/* "Respondeu errado?" logo abaixo da última resposta do teste, no celular */
.cr-wrong { align-self: flex-start; font-size: var(--fs-sm); min-height: 44px; display: inline-flex; align-items: center; }

/* =====================================================================
   styles-agente.css · T07 página do agente, gavetas T08–T13, T11
   Só usa tokens de styles.css (tema claro e escuro já cobertos lá).
   ===================================================================== */

/* ---------- T07 · herói ---------- */
.ag-hero { padding: 28px 40px 36px; display: flex; flex-direction: column; gap: 12px; }
.ag-hero-grid {
  display: grid; align-items: center; gap: 12px 16px;
  grid-template-columns: minmax(0, 1fr) auto auto;
  grid-template-areas: "id act more" "sw . .";
}
/* desktop: o interruptor fica logo abaixo do nome e de onde responde (alinhado ao texto) */
@media (min-width: 1024px) {
  .ag-hero-grid > .ag-switch { padding-left: 80px; }
  .ag-hero-grid:not(:has(.ag-switch)) { grid-template-areas: "id act more"; }
}
.ag-id { grid-area: id; display: flex; align-items: center; gap: 16px; min-width: 0; }
.ag-hero .ag-id h1 { font-size: var(--fs-3xl); font-weight: 700; color: #fff; overflow-wrap: anywhere; }
.ag-hero .ag-where { color: var(--navy-text-2); font-size: var(--fs-md); }
.ag-switch { grid-area: sw; }
.ag-main-act { grid-area: act; display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.ag-more { grid-area: more; }
.ag-hero .ag-more { min-height: 44px; }
.ag-sub { color: var(--navy-text-2); font-size: var(--fs-sm); text-align: center; }
.ag-photo { overflow: hidden; background: var(--surface-3); }
.avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

.ag-band-txt { font-weight: 600; }
@media (max-width: 1023px) {
  .ag-hero-grid { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id more" "sw act"; }
  .ag-switch { justify-self: start; }
}
@media (max-width: 767px) {
  .ag-hero { padding: 16px 16px 20px; }
  .ag-hero-grid { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "id id" "sw more" "act act"; }
  .ag-hero .avatar.lg { width: 48px; height: 48px; font-size: var(--fs-lg); }
  .ag-hero .ag-id h1 { font-size: 1.5rem; }
  .ag-id { gap: 12px; align-items: flex-start; }
  .ag-switch .switch { padding-left: 0; }
  .ag-main-act .btn { width: 100%; min-height: 56px; font-size: var(--fs-lg); }
  .ag-more { align-self: center; }
}

/* ---------- T07 · números e blocos ---------- */
.ag-kpi-empty { display: flex; gap: 12px; align-items: flex-start; color: var(--text-2); padding: 20px 24px; }
.ag-kpi-empty .icon { color: var(--text-3); margin-top: 2px; }
.ag-page .kpi-cell .lbl { font-size: var(--fs-base); }
.ag-page .kpi-cell { min-height: 132px; }
.ag-blocks { display: flex; flex-direction: column; gap: 16px; }
.ag-block { padding: 20px 24px; }
.ag-block-title { display: flex; gap: 14px; align-items: flex-start; }
.ag-block-ic {
  width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: var(--blue-3); color: var(--blue-text);
}
.ag-block-body { padding-left: 54px; display: flex; flex-direction: column; gap: 8px; }
.ag-ask { display: flex; gap: 8px; }
.ag-ask .input { flex: 1 1 auto; min-width: 0; }
.ag-meta { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: var(--fs-md); }
.ag-flag {
  display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
  padding: 6px 12px; border-radius: 10px; background: var(--amber-2); border: 1px solid var(--amber-6);
  color: var(--text); font-size: var(--fs-md); font-weight: 500;
}
.ag-flag .icon-sm { color: var(--amber-text); }
.ag-handoff { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
/* cartão-resumo (StepReview): O que sabe · Onde e quando · Nome e jeito */
.ag-summary { padding: 0 24px; gap: 0; }
.ag-row { display: flex; align-items: flex-start; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--border); }
.ag-row:last-child { border-bottom: 0; }
.ag-row-ic { width: 36px; height: 36px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); }
.ag-row .lbl { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); letter-spacing: 0; }
.ag-row .main { font-size: var(--fs-base); color: var(--text); }
.ag-row > .btn { flex: none; min-height: 44px; }
.ag-skel-block { background: var(--skeleton); border-radius: var(--r-2xl); padding: 20px 24px; min-height: 96px; display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 767px) {
  .ag-block { padding: 16px; }
  .ag-block .head { flex-direction: column; align-items: stretch; }
  .ag-block .head > .btn { width: 100%; }
  .ag-block-body { padding-left: 0; }
  .ag-ask { flex-direction: column; }
  .ag-ask .btn { width: 100%; }
  .ag-page .kpi-cell { min-height: 0; }
  .ag-summary { padding: 0 16px; }
  .ag-row { flex-wrap: wrap; padding: 16px 0; }
  .ag-row-ic { display: none; }
  .ag-row > .btn { width: 100%; border: 1px solid var(--primary); }
}

/* ---------- listas dentro das gavetas ---------- */
.ag-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--r-2xl); background: var(--surface); }
.ag-week-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 6px 6px 14px; border-bottom: 1px solid var(--border); }
.ag-week-row:last-child { border-bottom: 0; }
.ag-week-nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-empty {
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  padding: 28px 20px; border: 1px dashed var(--border-strong); border-radius: var(--r-2xl); color: var(--text-2);
}
.ag-busy { pointer-events: none; opacity: .7; }

/* ---------- T08 · celular de teste na gaveta ---------- */
.ag-test { display: flex; flex-direction: column; gap: 12px; flex: 1 1 auto; min-height: 0; }
.ag-test .phone-body { min-height: 0; }
.phone-head .ag-clear { color: #fff; font-size: var(--fs-sm); }
.ag-updated {
  align-self: stretch; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px;
  background: var(--teal-3); color: var(--teal-text); font-weight: 600; font-size: var(--fs-sm);
}
.ag-wrong { align-self: flex-start; font-size: var(--fs-sm); }
.ag-phone-err .err { background: var(--surface); }
@media (max-width: 767px) {
  .ag-test .phone-wrap { min-height: 0; }
  .drawer .ag-test { min-height: calc(100vh - 140px); }
}

/* ---------- T09 · arquivos e sites ---------- */
.ag-src-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--r-2xl); background: var(--surface); overflow: hidden; }
.ag-src { border-bottom: 1px solid var(--border); }
.ag-src:last-child { border-bottom: 0; }
.ag-src.attn { background: var(--amber-2); }
.ag-src-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 6px 6px 12px; }
.ag-src-ic { width: 36px; height: 36px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); }
.ag-src-txt { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; }
.ag-src-nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.ag-src-txt .state-word { flex: none; }
.ag-src-attn { padding: 0 14px 14px 60px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; font-size: var(--fs-md); }
.ag-add { display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: var(--r-2xl); background: var(--surface-2); border: 1px solid var(--border); }
.ag-add-opt {
  width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 10px 14px; border-radius: 14px; border: 1px solid var(--border-strong); background: var(--surface);
}
.ag-add-opt:hover { border-color: var(--blue-7); background: var(--blue-2); }
.ag-add-opt .ttl, .ag-site .ttl { font-weight: 600; }
.ag-add-opt .sub { font-size: var(--fs-sm); color: var(--text-2); }
.ag-site { display: flex; flex-direction: column; gap: 6px; }
.ag-site .ttl { display: inline-flex; align-items: center; gap: 8px; }
.ag-site-lbl { font-size: var(--fs-sm); color: var(--text-2); font-weight: 500; }
.ag-site-row { display: flex; gap: 8px; }
.ag-site-row .input { flex: 1 1 auto; min-width: 0; }
.ag-sugs { display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid var(--border); }
.ag-sugs h3 { font-size: var(--fs-lg); font-weight: 700; }
.ag-sug { padding: 16px; border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.ag-sug .q { font-weight: 600; }
.ag-sug .a { color: var(--text-2); }
.ag-sug-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding-top: 4px; }
@media (max-width: 767px) {
  .ag-src-txt { flex-direction: column; align-items: flex-start; gap: 2px; }
  .ag-src-nm { width: 100%; }
  .ag-src-attn { padding-left: 14px; }
  .ag-src-attn .btn, .ag-sug-acts .btn { width: 100%; }
  .ag-sug-acts .link-btn { flex: 1 1 auto; justify-content: center; }
  .ag-site-row { flex-direction: column; }
  .ag-site-row .btn { width: 100%; }
}

/* ---------- T10 · onde e quando ---------- */
.ag-where { display: flex; flex-direction: column; gap: 20px; }
.ag-sec { display: flex; flex-direction: column; gap: 10px; }
.ag-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.ag-sec-head h3 { font-size: var(--fs-base); font-weight: 700; }
.ag-ro { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-2); }
.ag-ro .ttl { font-weight: 600; }
.ag-note-box .link-btn { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
.ag-note-box p + p { margin-top: 4px; }

/* ---------- T12 · foto e nome ---------- */
.ag-photo-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.ag-note { color: var(--text-2); font-size: var(--fs-md); }

/* ---------- T13 · versões ---------- */
.ag-vers { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--r-2xl); background: var(--surface); }
.ag-ver { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.ag-ver:last-child { border-bottom: 0; }
.ag-ver-dt { font-weight: 600; font-variant-numeric: tabular-nums; }
.ag-ver-what { font-size: var(--fs-md); color: var(--text-2); }
.ag-ver-act { flex: none; min-width: 156px; display: flex; justify-content: flex-end; }
@media (max-width: 767px) {
  .ag-ver { flex-direction: column; align-items: stretch; padding: 12px; gap: 8px; }
  .ag-ver-act { min-width: 0; justify-content: flex-start; }
  .ag-ver .btn, .ag-ver-act { width: 100%; }
}

/* ---------- T11 · Mudar conversando ---------- */
.ag-t11-head { display: flex; align-items: center; gap: 16px; justify-content: space-between; flex-wrap: wrap; }
.ag-split { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 32px; align-items: start; }
.ag-chat { display: flex; flex-direction: column; gap: 20px; min-height: 560px; padding: 24px; }
.ag-chat .convo { flex: 1 1 auto; }
.ag-chat .msg .chips { max-width: 100%; }
.ag-compose { display: flex; flex-direction: column; gap: 8px; }

/* =====================================================================
   kit.js · fundação do protótipo "Agentes · nova jornada"
   =====================================================================

   ORDEM DE CARGA (build.sh concatena num único <script>, mesmo escopo):
     kit.js → data.js → screens-list.js → screens-create.js →
     screens-agent.js → screens-extra.js → main.js
   Cada screens-*.js DEVE vir embrulhado em  (() => { ... })();  para não
   colidir nome de const/function com os outros arquivos. Só se comunica
   pelos globais abaixo.

   ---------------------------------------------------------------------
   1. ESTADO GLOBAL  ·  S
   ---------------------------------------------------------------------
     S.role       'manage' | 'view'   (a faixa do protótipo alterna)
     S.agents     cópia mutável de DATA.agents (main.js preenche no boot)
     S.channels   cópia mutável de DATA.channels
     S.agentId    agente aberto em #t07 e gavetas (curAgent() o devolve)
     S.builder    conversa de criar/mudar (makeBuilder() em data.js)
     S.flags      cenário da rota. O ROTEADOR ZERA S.flags (= {...DEFAULT_FLAGS})
                  a cada troca de rota, ANTES de chamar def.setup().
                  Variantes (#t05-ocupado etc.) ligam flags no setup().
                  Flags conhecidas: l1, l2 (leituras ligadas), loading, error,
                  noChannel. Cada construtor pode inventar as suas.
     S.ui         rascunho de UI que sobrevive a render() (ex.: S.ui.starting)
                  — também é zerado a cada troca de rota.

   ---------------------------------------------------------------------
   2. ROTAS  ·  route(id, def)
   ---------------------------------------------------------------------
     Hash = token simples (letras, dígitos, - _ .), nunca key=value.
     route('t07', {
       title:  'Página do agente',     // aparece no <title> e na faixa
       active: 'agentes',              // item do menu lateral (padrão 'agentes')
       setup(ctx)  { S.flags.x = 1 },  // 1x ao ENTRAR na rota (antes do 1º render)
       render(ctx) { return h`...` },  // HTML da página (string ou h``) — puro
       mount(root, ctx) { },           // depois de cada render (foco, timers)
     });
     Rota de GAVETA/DIÁLOGO sobre uma página:
     route('t08', { base: 't07', setup(){...}, open(ctx){ openDrawer({...}) } });
       → o roteador desenha a página de 't07' (render+mount da base, SEM o
         setup da base) e chama open(). Ao fechar essa camada, o hash volta
         sozinho para '#t07' (sem redesenhar).
     Hash desconhecido → #t01. Navegar: go('t07') ou <a href="#t07">.
     render() redesenha a rota atual preservando foco (por id) e rolagem.
     later(fn, ms) / every(fn, ms): timers que morrem na troca de rota.
     Use-os SEMPRE para roteiro, "Pensando…", respostas em partes etc.

   ---------------------------------------------------------------------
   3. HTML SEGURO  ·  h`...`  raw()  esc()  fmt()
   ---------------------------------------------------------------------
     h`<p>${texto}</p>`  escapa string interpolada; aceita arrays,
     outros h``, raw(html), null/false (vira vazio). Devolve Raw.
     fmt('{nome} já está atendendo no {canal}', {nome, canal}) troca chaves.
     plural(n, 'Nenhum atendendo', '1 atendendo', '{n} atendendo').

   ---------------------------------------------------------------------
   4. AÇÕES (delegação de eventos; sobrevive a render())
   ---------------------------------------------------------------------
     on('nome', (el, ev) => {...})     clique em [data-act="nome"]
     <form data-submit="nome">         submit → on('nome', (form, ev)) (preventDefault já feito)
     <textarea data-input="nome">      input  → on('nome', (el, ev))
     data-* extras ficam em el.dataset (ex.: data-id="bia").
     [role=radiogroup] com [role=radio]: setas/Home/End movem e "clicam"
     (o clique dispara o data-act do rádio) — teclado WAI-ARIA pronto.
     Se a ação devolver false num <a>, a navegação é cancelada.

   ---------------------------------------------------------------------
   5. CAMADAS (foco preso, Esc fecha, foco volta a quem abriu)
   ---------------------------------------------------------------------
     openDrawer({ title, body, foot, width: 440|480|520|640, sheet:false,
                  footRow:false, label, onClose, returnFocus })
        body/foot: h`` OU função () => h`` (refreshLayer() redesenha).
        Desktop = gaveta à direita; ≤767px = tela cheia com "Fechar" no topo;
        sheet:true no celular = folha de baixo com alça.

        kind: 'danger'|'warn'|'primary'|'cta'|'secondary'. ≤767px vira folha
