          <div class="convo" id="ag-convo" tabindex="-1" aria-label="Conversa">
            ${st.turns.map((t, i) => turnHtml(t, i, st, a))}
            ${st.thinking ? h`<div class="msg bot"><span class="bot-av" aria-hidden="true">${icon('star', 'icon-sm')}</span><div class="bub ag-thinking"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>Pensando…</div></div>` : ''}
          </div>
          <div class="ag-compose">
            ${st.closed ? '' : h`<p class="ag-live-line">${icon('info', 'icon-sm')}<span>Quando você terminar, ${nome} já responde do jeito novo.</span></p>`}
            <div class="only-mobile">${btn({ label: `Testar ${nome}`, kind: 'secondary', icon: 'flask', block: true, act: 'agT11Sheet', id: 'ag-t11-sheet' })}</div>
            ${composer({ id: 'ag-t11-in', act: 'agT11Send', inputAct: 'agT11Draft', placeholder: 'Escreva sua resposta', clipAct: 'agT11Clip', micAct: 'agT11Mic', disabled: st.thinking, value: st.draft, sendKind: st.closed ? 'ghost' : 'primary' })}
          </div>
        </section>
        <aside class="ag-phone-col hide-mobile" aria-labelledby="ag-t11-ph">
          <h2 class="ag-phone-title" id="ag-t11-ph">Teste como se fosse seu cliente</h2>
          <p class="muted small">Ninguém recebe estas mensagens. É só um teste.</p>
          ${testPhone(a, 'p')}
        </aside>
      </div>
    </div>`;
  }
  function focusDraftEnd() {
    later(() => {
      const ta = document.getElementById('ag-t11-in');
      if (!ta) return;
      ta.focus({ preventScroll: true });
      ta.setSelectionRange(ta.value.length, ta.value.length);
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
    }, 30);
  }
  function mountT11(root, ctx) {
    scrollPhones(root);
    const draftTa = root.querySelector('#ag-t11-in');
    if (draftTa && draftTa.value) { draftTa.style.height = 'auto'; draftTa.style.height = Math.min(draftTa.scrollHeight, 160) + 'px'; }
    const st = S.ui.t11;
    if (st.focusDraft && !ctx.rerender) { st.focusDraft = false; focusDraftEnd(); }
    // No celular a conversa rola a página e o rodapé fica fixo: acompanha o fim, como na criação.
    if (isMobile() && (st.scrollConvo || (!ctx.rerender && st.turns.length > 2))) {
      st.scrollConvo = false;
      requestAnimationFrame(() => window.scrollTo(0, document.documentElement.scrollHeight));
      return;
    }
    if (ctx.rerender && st.scrollConvo) {
      st.scrollConvo = false;
      requestAnimationFrame(() => {
        const last = root.querySelector('#ag-convo > :last-child');
        if (last) last.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' });
      });
    }
  }
  function t11Paint() { S.ui.t11.scrollConvo = true; render(); }
  function t11Owner(text) {
    const st = S.ui.t11;
    const clean = (text || '').trim();
    if (st.thinking || !clean) return;
    st.turns.forEach((t) => { t.chips = null; });
    st.turns.push({ from: 'owner', text: clean });
    st.draft = '';
    st.closed = false;
    st.thinking = true;
    t11Paint();
    later(() => t11Reply(clean), reducedMotion() ? 200 : 1200);
  }
  function t11Close(a, o) {
    const st = S.ui.t11;
    st.thinking = false;
    st.closed = true;
    st.pending = null;
    let oldName = null;
    let newName = null;
    if (o.newName && o.newName !== a.name) {
      oldName = a.name;
      newName = o.newName;
      a.name = newName;
    }
    st.turns.push({ from: 'done', oldName, newName, style: !!o.style });
    const T = testOf(a);
    T.msgs = [];
    T.busy = false;
    T.updated = true;
    S.ui.focusAfter = '#ag-done';
    t11Paint();
    announce(`Pronto. ${nm(a)} já usa o que você contou.${newName ? ` O nome agora é ${newName}.` : ''}${o.style ? ' O jeito de falar também mudou.' : ''}`);
  }
  function t11Reply(text) {
    const st = S.ui.t11;
    const a = agentById(st.agentId) || A();
    const nome = nm(a);
    if (S.flags.builderFail && !st.failedOnce) {
      st.failedOnce = true;
      st.thinking = false;
      st.turns.push({ from: 'err', retry: text });
      S.ui.focusAfter = '#ag-t11-retry';
      t11Paint();
      announce(`Não consegui responder agora. Nada mudou em ${nome}.`, true);
      return;
    }
    const ch = DATA.script.change;
    const key = Object.keys(ch.replies).find((k) => fmt(k, { nome }) === text);
    const r = key ? ch.replies[key] : null;
    if (!r && st.pending === 'Trocar o nome') { t11Close(a, { newName: text }); return; }
    if (r && r.close) { t11Close(a, { style: r.styleChanged }); return; }
    st.thinking = false;
    if (r) {
      if (r.say) st.turns.push({ from: 'bot', text: `Hoje, ${nome} ${lowerFirst(a.summary) || 'responde o que você contou na conversa.'} Quando não sabe, passa a conversa para a equipe.` });
      st.turns.push({ from: 'bot', text: fmt(r.ask, { nome }), chips: r.chips || null });
      st.pending = key;
      t11Paint();
      announce(`Assistente de criação: ${fmt(r.ask, { nome })}`);
      return;
    }
    if (text === 'Está bom assim') { st.turns.push({ from: 'bot', text: `Combinado. Nada muda em ${nome}.` }); st.pending = null; t11Paint(); return; }
    if (text === 'Quero mudar uma coisa') { st.turns.push({ from: 'bot', text: 'Me conta o que você quer mudar.' }); st.pending = 'livre'; t11Paint(); return; }
    t11Close(a, {});
  }
  on('agT11Chip', (el) => { S.ui.focusAfter = isMobile() ? '#ag-convo' : '#ag-t11-in'; t11Owner(el.dataset.value); if (!isMobile()) focusDraftEnd(); });
  on('agT11Send', (form) => { t11Owner(form.querySelector('textarea').value); });
  on('agT11Draft', (el) => { S.ui.t11.draft = el.value; });
  on('agT11Retry', (el) => {
    const st = S.ui.t11;
    st.turns = st.turns.filter((t) => t.from !== 'err');
    st.thinking = true;
    t11Paint();
    later(() => t11Reply(el.dataset.text), reducedMotion() ? 200 : 1000);
  });
  on('agT11Clip', (el) => {
    const add = (kind) => {
      const st = S.ui.t11;
      const up = kind === 'photo' ? DATA.uploads.photo : DATA.uploads.file;
      const t = { from: 'material', kind, name: up.name, state: 'reading' };
      st.turns.push(t);
      t11Paint();
      later(() => { t.state = 'ok'; render(); }, reducedMotion() ? 300 : 2500);
    };
    openMenu(el, [
      { label: 'Foto', icon: 'image', onClick: () => add('photo') },
      { label: 'Arquivo ou site', icon: 'file', onClick: () => add('file') },
    ]);
  });
  on('agT11Mic', () => { toast('No produto, aqui você fala e o texto aparece no campo.'); });
  on('agT11Sheet', () => {
    const a = A();
    openDrawer({ title: `Testar ${nm(a)}`, width: 480, sheet: true, agKind: 'test', body: () => h`<div class="ag-test">${testPhone(a, 's')}</div>`, mount: scrollPhones, initialFocus: '#agq-s' });
  });
  function midConversation() {
    const st = S.ui.t11;
    return st.thinking || (!st.closed && st.turns.some((t) => t.from === 'owner' || t.from === 'material'));
  }
  function askLeave() {
    const a = A();
    openDialog({
      title: 'Sair sem terminar?',
      text: `Nada muda em ${nm(a)}.`,
      actions: [
        { label: 'Continuar aqui', kind: 'secondary', focus: true },
        { label: 'Sair', kind: 'primary', onClick: () => go('t07') },
      ],
    });
  }
  on('agT11Leave', () => {
    if (!midConversation()) return undefined;
    askLeave();
    return false;
  });
  on('agT11Done', () => {
    if (midConversation()) { askLeave(); return; }
    go('t07');
  });
  on('agBackName', (el) => {
    pendingName = el.dataset.name;
    go('t12');
    return false;
  });

  const t11Route = (id, title, source, fn) => route(id, {
    title: `Mudar conversando${title ? ' · ' + title : ''}`,
    setup(ctx) { setupT11(ctx, source); if (fn) fn(); },
    render: renderT11,
    mount: mountT11,
  });
  t11Route('t11', '', 'geral');
  t11Route('t11-jeito', 'nome e jeito de falar', 'jeito');
  t11Route('t11-passa', 'quando passa para a equipe', 'passa');
  t11Route('t11-teste', 'vindo do teste', 'teste');
  t11Route('t11-erro', 'Construtor indisponível', 'geral', () => { S.flags.builderFail = true; });
  /* nome mudou: conversa já fechada, só para ver o aviso (não grava o nome) */
  t11Route('t11-nome', 'o nome mudou', 'jeito', () => {
    const st = S.ui.t11;
    const a = A();
    st.turns[0].chips = null;
    st.turns.push({ from: 'owner', text: 'Trocar o nome' });
    st.turns.push({ from: 'bot', text: 'Qual nome você quer?' });
    st.turns.push({ from: 'owner', text: 'Rosa' });
    st.closed = true;
    st.turns.push({ from: 'done', oldName: nm(a), newName: 'Rosa', style: false });
    // só nesta âncora: mostra o nome novo em toda a tela sem gravar no agente
    st.shownName = 'Rosa';
    testOf(a).updated = true;
  });
})();

/* ===== screens-extra.js ===== */
/* =====================================================================
   screens-extra.js · T14 Escrever com suas palavras · T15 Parar de atender
                      (e voltar a atender)
                      T16 Excluir · T17 Erros transversais (padrão único)
   Rotas: #t14 #t14-editor #t14-vazio #t14-erro
          #t15 #t15-erro
          #t16 #t16-erro
          #t17 #t17-lista #t17-teste #t17-construtor #t17-comecar
   T14/T15/T16 abrem sobre a página do agente (#t07). Enquanto #t07 não
   estiver registrada, a base cai na lista (#t02).

   API para os outros construtores (ações globais, prefixo "x-" para não
   colidir; data-id = id do agente, opcional — sem ele vale curAgent()):
     data-act="x-parar"      abre o diálogo de T15 (parar de atender)
     data-act="x-voltar"     voltar a atender: prepara S.builder e vai para #t05
     data-act="x-excluir"    abre o diálogo de T16
     data-act="x-escrever"   T14: aviso (1ª vez) ou editor (já escrito à mão)
   Também em window.AgentesExtra.{pararDeAtender, voltarAAtender, excluir, escrever}(id, opener).
   Modo escrito à mão: agent.mode === 'manual' (o padrão dos dados é 'conversa').
   ===================================================================== */
(() => {
  const BUSY_MS = 1000;
  const MAX_CHARS = 50000;
  const MAX_LABEL = MAX_CHARS.toLocaleString('pt-BR');

  /* ---------- agente da vez ---------- */
  function restoreFromData(id) {
    const src = DATA.agents.find((x) => x.id === id);
    if (!src) return null;
    const copy = JSON.parse(JSON.stringify(src));
    S.agents.unshift(copy);
    return copy;
  }
  /* Agente já criado (não rascunho). Se o aberto sumiu, volta para a Bia. */
  function pickAgent(id) {
    let a = agentById(id || S.agentId);
    if (!a || a.status === 'draft') a = agentById('bia') || restoreFromData('bia');
    S.agentId = a.id;
    return a;
  }
  /* T15 precisa de um agente atendendo: o aberto, senão o 1º que atende, senão a Bia. */
  function pickOnAgent() {
    const cur = agentById(S.agentId);
    if (cur && cur.status === 'on') return cur;
    const firstOn = S.agents.find((x) => x.status === 'on');
    if (firstOn) { S.agentId = firstOn.id; return firstOn; }
    const a = pickAgent('bia');
    a.status = 'on';
    if (!a.channels.length) a.channels = ['wa-centro'];
    return a;
  }
  const manage = () => S.role === 'manage';
  /* página de fundo: a do agente quando existir */
  const agentBase = () => (ROUTES.t07 ? 't07' : 't02');

  /* ---------- diálogo de confirmação com espera e erro no lugar ---------- */
  let flow = null; // { layer, run, cfg }

  function setBtnBusy(id, busy, label) {
    const b = document.getElementById(id);
    if (!b) return;
    // aria-disabled (não disabled): o foco fica no botão enquanto espera
    if (busy) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    b.classList.toggle('is-loading', busy);
    b.setAttribute('aria-busy', busy ? 'true' : 'false');
    b.innerHTML = String(busy ? h`<span class="spinner" aria-hidden="true"></span><span>${label}</span>` : h`<span>${label}</span>`);
  }
  function layerAlive(layer) { return LAYERS.includes(layer); }

  /* cfg: { title, text, warn, confirm, kind, busyLabel, fail, err:{title, sub}, onSuccess, opener } */
  function confirmFlow(cfg) {
    const state = { failed: false };
    const confirmAct = { label: cfg.confirm, kind: cfg.kind, close: false, onClick: () => run() };
    const cancelAct = { label: 'Cancelar', kind: 'secondary', focus: true };
    const layer = openDialog({
      title: cfg.title,
      text: cfg.text,
      warn: cfg.warn,
      icon: cfg.icon,
      tone: cfg.tone,
      safeTop: cfg.safeTop,
      body: h`${cfg.extra ? h`<p class="dlg-extra">${cfg.extra}</p>` : ''}<div class="x-slot"></div>`,
      returnFocus: cfg.opener,
      actions: [confirmAct, cancelAct],
    });
    flow = { layer, run: () => run(true), cfg };

    function finish() {
      if (layerAlive(layer)) closeLayer();
      cfg.onSuccess();
    }
    function run(fromCard) {
      const busyId = fromCard ? 'x-flow-retry' : confirmAct._id;
      const label = fromCard ? 'Tentar de novo' : cfg.confirm;
      setBtnBusy(busyId, true, fromCard ? label : (cfg.busyLabel || label));
      const cancel = document.getElementById(cancelAct._id);
      if (cancel) cancel.disabled = true;
      const willFail = cfg.fail && !state.failed;
      later(() => {
        if (!willFail) { finish(); return; }
        state.failed = true;
        if (!layerAlive(layer)) return;
        if (cancel) cancel.disabled = false;
        const slot = layer.el.querySelector('.x-slot');
        slot.innerHTML = String(errorCard({ title: cfg.err.title, sub: cfg.err.sub, action: { label: 'Tentar de novo', act: 'x-flow-retry', id: 'x-flow-retry' } }));
        setBtnBusy(confirmAct._id, false, cfg.confirm);
        const main = document.getElementById(confirmAct._id);
        if (main) { main.hidden = true; main.style.display = 'none'; } // 1 ação: o cartão leva o "Tentar de novo"
        const retry = document.getElementById('x-flow-retry');
        if (retry) retry.focus();
        announce(`${cfg.err.title} ${cfg.err.sub}`, true);
      }, BUSY_MS);
    }
    return layer;
  }
  on('x-flow-retry', () => { if (flow && layerAlive(flow.layer)) flow.run(); });

  /* ---------- T15 · Parar de atender ---------- */
  function askTurnOff(a, opts = {}) {
    if (!manage() || !a) return;
    const nome = a.name;
    confirmFlow({
      title: fmt('Parar {nome}?', { nome }),
      text: 'As conversas novas vão direto para a equipe. Dá para voltar quando quiser.',
      icon: 'power',
      tone: 'amber',
      // parar é reversível: sem cor de alerta
      confirm: 'Parar de atender',
      kind: 'primary',
      busyLabel: 'Parando…',
      fail: !!opts.fail,
      err: { title: 'Não deu para parar agora.', sub: fmt('{nome} continua atendendo.', { nome }) },
      opener: opts.opener,
      onSuccess: () => {
        a.status = 'off';
        render();
        toast(fmt('{nome} parou de atender. Dá para voltar quando quiser.', { nome }));
      },
    });
  }

  /* Voltar a atender: a confirmação é a folha de T05, com o canal atual marcado.
     Com canal ainda vinculado, T05 só faz o PATCH active (sem POST channel). */
  function turnOn(a) {
    if (!manage() || !a) return;
    S.agentId = a.id;
    S.builder = makeBuilder(a.model, {
      agentId: a.id,
      name: a.name,
      tone: a.tone,
      niche: 'roupas',
      closed: true,
      testAnswered: 1,
      channelId: a.channels[0] || null,
      when: a.when || 'sempre',
      /* o T05 regrava sources a partir de materials: leva os atuais junto */
      materials: (a.sources || []).map((s) => ({ id: s.id, kind: s.kind, name: s.name, state: s.state, target: s.state })),
      lastTest: a.lastTest || null,
      relink: true,          // voltar a atender: canal atual já marcado, CTA "Voltar a atender"
      keepChannel: a.channels.length > 0,
    });
    go('t05');
  }

  /* ---------- T16 · Excluir ---------- */
  function askDelete(a, opts = {}) {
    if (!manage() || !a) return;
    const nome = a.name || 'Novo agente';
    confirmFlow({
      title: fmt('Excluir {nome}?', { nome }),
      text: h`<b>${nome}</b> para de responder agora e some da lista. As conversas abertas voltam para a equipe. Não dá para desfazer.`,
      extra: a.status === 'on' ? h`Se quiser só parar por um tempo, use <a class="link-btn" href="#t15">Parar de atender</a>.` : '',
      icon: 'trash',
      tone: 'ruby',
      // celular: "Cancelar" em cima (onde o polegar cai primeiro), excluir embaixo
      safeTop: true,
      confirm: 'Excluir agente',
      kind: 'danger',
      busyLabel: 'Excluindo…',
      fail: !!opts.fail,
      err: { title: 'Não deu para excluir.', sub: 'Nada mudou.' },
      opener: opts.opener,
      onSuccess: () => {
        S.agents = S.agents.filter((x) => x.id !== a.id);
        const next = S.agents.find((x) => x.status !== 'draft');
        if (next) S.agentId = next.id;
        go(S.agents.length ? 't02' : 't01');
        toast(fmt('{nome} saiu da lista.', { nome }));
      },
    });
  }

  /* ---------- T14 · Escrever as instruções com suas palavras ---------- */
  function askWriteSelf(a, opts = {}) {
    if (!manage() || !a) return;
    if (a.mode === 'manual') { openEditor(a, { text: a.instructions || '' }); return; }
    const nome = a.name;
    openDialog({
      title: 'Escrever as instruções com suas palavras?',
      warn: fmt('O que foi montado conversando deixa de valer, e não dá mais para usar Mudar conversando com {nome}. Não dá para voltar atrás.', { nome }),
      returnFocus: opts.opener,
      actions: [
        { label: 'Escrever do meu jeito', kind: 'warn', onClick: () => openEditor(a, { text: '' }) },
        { label: 'Cancelar', kind: 'secondary', focus: true },
      ],
    });
  }

  function edBody(a) {
    const ed = S.ui.xEd;
    const nome = a.name;
    const n = ed.text.length.toLocaleString('pt-BR');
    const describedBy = ['x-instr-hint', 'x-count', ed.err === 'empty' ? 'x-instr-err' : ''].filter(Boolean).join(' ');
    return h`<p class="muted" id="x-instr-hint">${fmt('Escreva o que {nome} deve fazer e o que não deve, em frases simples.', { nome })}</p>
      <div class="x-editor">
        <label class="sr-only" for="x-instr">${fmt('Instruções de {nome}', { nome })}</label>
        <textarea id="x-instr" class="input" rows="20" maxlength="${MAX_CHARS}" aria-describedby="${describedBy}"${ed.err === 'empty' ? raw(' aria-invalid="true"') : ''}${ed.busy ? raw(' readonly') : ''}>${ed.text}</textarea>
        <span class="x-count" id="x-count">${n} de ${MAX_LABEL}</span>
      </div>
      ${ed.err === 'empty' ? h`<p class="field-error" id="x-instr-err" role="alert">Escreva pelo menos uma frase.</p>` : ''}`;
  }
  function edFoot() {
    const ed = S.ui.xEd;
    return h`<div class="x-foot">
      ${ed.err === 'save' ? errorCard({ title: 'Não deu para salvar.', sub: 'Nada mudou.', action: { label: 'Tentar de novo', act: 'x-ed-save', id: 'x-ed-retry', loading: ed.busy } }) : ''}
      <div class="x-foot-row">
        ${btn({ label: 'Cancelar', kind: 'secondary', size: 'lg', act: 'closeLayer', disabled: ed.busy, id: 'x-ed-cancel' })}
        ${ed.err === 'save' ? '' : btn({ label: 'Salvar', kind: 'primary', size: 'lg', act: 'x-ed-save', id: 'x-ed-save', loading: ed.busy })}
      </div>
    </div>`;
  }
  function openEditor(a, o = {}) {
    S.ui.xEd = { agentId: a.id, text: o.text || '', err: o.err || null, busy: false, fail: !!o.fail };
    openDrawer({
      title: fmt('Instruções de {nome}', { nome: a.name }),
      width: 640,
      body: () => edBody(a),
      foot: () => edFoot(a),
      initialFocus: '#x-instr',
      returnFocus: o.opener,
      mount(el) {
        const ta = el.querySelector('#x-instr');
        if (!ta) return;
        ta.addEventListener('input', () => {
          S.ui.xEd.text = ta.value;
          const c = el.querySelector('#x-count');
          if (c) c.textContent = `${ta.value.length.toLocaleString('pt-BR')} de ${MAX_LABEL}`;
          if (S.ui.xEd.err === 'empty' && ta.value.trim()) {
            S.ui.xEd.err = null;
            ta.removeAttribute('aria-invalid');
            const msg = el.querySelector('#x-instr-err');
            if (msg) msg.remove();
          }
        });
      },
    });
  }
  on('x-ed-save', () => {
    const ed = S.ui.xEd;
    if (!ed || ed.busy) return;
    const a = agentById(ed.agentId);
    if (!a) return;
    if (!ed.text.trim()) {
      ed.err = 'empty';
      refreshLayer();
      const ta = document.getElementById('x-instr');
      if (ta) ta.focus();
      return;
    }
    const fromCard = ed.err === 'save';
    ed.busy = true;
    refreshLayer();
    later(() => {
      ed.busy = false;
      if (ed.fail) {
        ed.fail = false;
        ed.err = 'save';
        refreshLayer();
        const r = document.getElementById('x-ed-retry');
        if (r) r.focus();
        return;
      }
      ed.err = null;
      a.mode = 'manual';
      a.instructions = ed.text;
      a.hasInstruction = true;
      closeLayer();
      render();
      toast('Instruções salvas.');
    }, fromCard ? BUSY_MS : BUSY_MS - 200);
  });

  /* ---------- ações globais para os outros construtores ---------- */
  const agentFrom = (el) => (el && el.dataset && el.dataset.id ? agentById(el.dataset.id) : null) || curAgent();
  on('x-parar', (el) => { askTurnOff(agentFrom(el), { opener: el }); return false; });
  on('x-voltar', (el) => { turnOn(agentFrom(el)); return false; });
  on('x-excluir', (el) => { askDelete(agentFrom(el), { opener: el }); return false; });
  on('x-escrever', (el) => { askWriteSelf(agentFrom(el), { opener: el }); return false; });
  window.AgentesExtra = {

    () => { const a = curAgent(); openEditor(a, { text: a.instructions }); });

    t08: { name: 'Gaveta · Testar', kind: 'drawer', note: 'O teste perde a confiança, o motivo técnico e o clipe que gravava arquivo na base real sem avisar.' },
    't08-incompleto': { name: 'Testar · ainda não sabe o suficiente', kind: 'err', note: 'Se a instrução ainda não existe (422), o celular diz em âmbar: "ainda não sabe o suficiente. Use Mudar conversando."' },
    t09: { name: 'Gaveta · O que sabe', kind: 'drawer', note: '"Base de conhecimento", nota, rótulo ótima/boa/fraca, barra de confiança e "Sincronizar" dão lugar a 3 estados em palavras e "Ler de novo".' },
    t10: { name: 'Gaveta · Onde e quando responde', kind: 'radios', note: 'A aba Canais e o formulário de público, ambos com lista nativa, viram cartões-rádio. Cada opção de Quando mostra o horário do canal. "Para quem responde" sai da jornada do dono. A nota de Atribuição é clara, com "Escolher quem recebe".' },
    't10-ocupado': { name: 'Onde e quando · canal ocupado', kind: 'drawer' },
    't11-erro': { name: 'Mudar conversando · Construtor indisponível', kind: 'err', note: 'Toque numa opção ou escreva: no lugar da resposta aparece "Não consegui responder agora. Nada mudou em Bia." com "Tentar de novo".' },
    't12-erro': { name: 'Foto e nome · erro ao salvar', kind: 'err', note: 'Toque em "Salvar": a falha aparece na gaveta, "Não deu para salvar. Nada mudou.", com "Tentar de novo".' },
    't13-erro': { name: 'Jeitos anteriores · erro ao voltar', kind: 'err', note: 'Toque em "Voltar para esta": a falha aparece no topo, "Não deu para voltar agora. Nada mudou.", com "Tentar de novo".' },
    't10-erro': { name: 'Onde e quando · erro ao salvar', kind: 'err', note: 'Toque em "Salvar": a falha aparece no topo da gaveta, dizendo que nada mudou, com "Tentar de novo".' },
    't09-falha': { name: 'O que sabe · falha ao salvar', kind: 'err', note: 'Mande um arquivo ou site (ou ensine uma pergunta): a primeira gravação falha com "Não deu para salvar agora. Nada mudou." e "Tentar de novo".' },
    t11: { name: 'Mudar conversando', kind: 'split', note: '"Ajustar com IA" vira "Mudar conversando", na mesma tela da criação. Saem os formulários de tom, primeira mensagem e transferência.' },
    t12: { name: 'Gaveta · Foto e nome', kind: 'drawer', note: 'Nome e foto saem do meio de "Ajustar" e ganham uma gaveta pequena, com aviso honesto de que conversar pode mudar o nome.' },
    t13: { name: 'Gaveta · Jeitos anteriores de responder', kind: 'dates', note: 'A lista técnica com autor fixo e código vira uma lista de datas, cada uma com uma frase do que mudou, e uma ação com confirmação.' },
    't12-comfoto': { name: 'Foto e nome · com foto', kind: 'drawer' },
    t14: { name: 'Escrever as instruções com suas palavras', kind: 'dialog', note: 'O modo manual sai de "Ajustar" e fica atrás de um aviso que diz que não tem volta.' },
    t15: { name: 'Parar de atender', kind: 'dialog', note: '"Pausar" sem aviso vira "Parar de atender" com confirmação. "Voltar a atender" passa pela mesma confirmação de canal.' },
    t16: { name: 'Excluir agente', kind: 'dialog', note: 'O "Excluir" vermelho sempre visível no cartão sai da lista e vai para "Mais opções". O diálogo lembra que dá para só parar de atender.' },
    t17: { name: 'Erros · padrão único', kind: 'err', note: 'Página de referência (fora do produto). "Tente novamente" genérico e avisos que somem viram um cartão no lugar do erro, com o que continua igual e uma ação.' },
    mapa: { name: 'Todas as telas', kind: 'map', note: 'Mapa do protótipo. Cada cartão abre a tela pela âncora própria.' },
  };

  const JOURNEYS = [
    { key: 'J1', name: 'Criar o primeiro agente', steps: ['t01', 't03', 't04', 't04-respondida', 't05', 't06', 't07'] },
    { key: 'J2', name: 'Cuidar de um agente que já atende', steps: ['t02', 't07', 't08', 't09', 't10', 't12', 't13'] },
    { key: 'J3', name: 'Mudar conversando', steps: ['t07', 't11', 't07'] },
    { key: 'J4', name: 'Quando algo dá errado', steps: ['t05-semcanal', 't05-ocupado', 't05-troca', 't04-falha', 't04-incompleto', 't03-erro', 't15', 't16', 't14', 't17'] },
  ];
  const P = { j: 0, step: 0, noteOpen: false, comboOpen: false, comboActive: 0 };

  const baseOf = (id) => id.split('-')[0];
  const screenName = (id) => (SCREENS[id] && SCREENS[id].name) || (ROUTES[id] && ROUTES[id].title) || id;
  const noteOf = (id) => (SCREENS[id] && SCREENS[id].note) || (SCREENS[baseOf(id)] && SCREENS[baseOf(id)].note) || '';
  const familyOf = (id) => {
    const base = baseOf(id);
    return Object.keys(ROUTES).filter((k) => baseOf(k) === base && k !== 'mapa').sort((a, b) => (a === base ? -1 : b === base ? 1 : a.localeCompare(b)));
  };

  /* ---------- sincroniza jornada/etapa com o hash ---------- */
  // Âncora aberta direto (sem navegação antes): a página do agente abre com a Bia, que já atende;
  // por isso cai na J2. Na J1 a T07 só aparece vindo da T06, já com o agente recém-criado.
  const FRESH_PREF = { t07: 1 };
  let firstSync = true;
  function syncStep(id) {
    P.variant = false;
    if (firstSync) {
      firstSync = false;
      const pref = FRESH_PREF[baseOf(id)];
      if (pref !== undefined) { P.j = pref; P.step = 0; }
    }
    const steps = JOURNEYS[P.j].steps;
    if (steps[P.step] === id) return;
    if (steps[P.step + 1] === id) { P.step += 1; return; }
    if (steps[P.step - 1] === id) { P.step -= 1; return; }
    const here = steps.indexOf(id);
    if (here >= 0) { P.step = here; return; }
    const other = JOURNEYS.findIndex((j) => j.steps.includes(id));
    if (other >= 0) { P.j = other; P.step = JOURNEYS[other].steps.indexOf(id); return; }
    // variante fora das jornadas: fica na jornada da tela-mãe, na etapa da mãe
    const MOTHER = { t11: 2, t05: 3, t17: 3, t04: 3, t03: 0 };
    const cur = JOURNEYS[P.j].steps.findIndex((k) => baseOf(k) === baseOf(id));
    if (cur >= 0) { P.step = cur; P.variant = true; return; }
    const m = MOTHER[baseOf(id)];
    if (m !== undefined) {
      P.j = m;
      P.step = JOURNEYS[m].steps.findIndex((k) => baseOf(k) === baseOf(id));
      P.variant = P.step >= 0;
      return;
    }
    // qualquer outra variante: a primeira jornada que passa pela tela-mãe
    const any = JOURNEYS.findIndex((j) => j.steps.some((k) => baseOf(k) === baseOf(id)));
    if (any >= 0) { P.j = any; P.step = JOURNEYS[any].steps.findIndex((k) => baseOf(k) === baseOf(id)); P.variant = true; return; }
    P.step = -1;
  }

  /* ---------- faixa do protótipo ---------- */
  function comboList() {
    return h`<ul class="combo-list" role="listbox" id="jr-list" aria-label="Jornadas" tabindex="-1">${JOURNEYS.map((j, i) => h`<li role="option" id="jr-opt-${i}" class="combo-opt ${P.comboActive === i ? 'is-active' : ''}" aria-selected="${P.j === i ? 'true' : 'false'}" data-act="pickJourney" data-i="${i}"><span class="k">${j.key}</span>${j.name}</li>`)}</ul>`;
  }
  function renderBar() {
    const bar = document.getElementById('proto');
    const id = S.route || 't01';
    syncStep(id);
    const J = JOURNEYS[P.j];
    const inJ = P.step >= 0;
    const prevDisabled = !inJ || P.step === 0;
    const nextDisabled = !inJ || P.step === J.steps.length - 1;
    const fam = familyOf(id);
    const note = noteOf(id);
    bar.innerHTML = String(h`<div class="proto-inner">
      <span class="proto-tag hide-mobile">${icon('eye', 'icon-sm')}Protótipo</span>
      <div class="combo">
        <button type="button" class="combo-btn" id="jr-btn" role="combobox" aria-haspopup="listbox" aria-controls="jr-list" aria-expanded="${P.comboOpen ? 'true' : 'false'}" aria-label="Jornada" ${P.comboOpen ? raw(`aria-activedescendant="jr-opt-${P.comboActive}"`) : ''} data-act="toggleCombo">
          <span class="v">${J.key}<span class="proto-label-long"> · ${J.name}</span></span>${icon('chevron-down', 'icon-sm')}
        </button>
        ${P.comboOpen ? comboList() : ''}
      </div>
      <button type="button" class="proto-btn" data-act="jrPrev" ${prevDisabled ? raw('disabled') : ''} aria-label="Etapa anterior da jornada">${icon('chevron-left', 'icon-sm')}<span class="proto-label-long">Anterior</span></button>
      <span class="proto-step" aria-live="polite"><span class="proto-label-long">${inJ ? `Etapa ${P.step + 1} de ${J.steps.length}${P.variant ? ' (outro estado)' : ''}` : 'Fora da jornada'} · </span><span class="proto-label-short" aria-hidden="true">${inJ ? `${P.step + 1}/${J.steps.length} · ` : ''}</span><b>${id.toUpperCase()}</b><span class="proto-label-long"> ${screenName(id)}</span></span>
      <button type="button" class="proto-btn" data-act="jrNext" ${nextDisabled ? raw('disabled') : ''} aria-label="Próxima etapa da jornada"><span class="proto-label-long">Próxima</span>${icon('chevron-right', 'icon-sm')}</button>
      <span class="proto-spacer"></span>
      <button type="button" class="proto-btn" data-act="toggleRole" aria-label="Só pode ver" aria-pressed="${S.role === 'view' ? 'true' : 'false'}">${icon('lock', 'icon-sm')}<span class="proto-label-long">Só pode ver</span></button>
      <a class="proto-btn" href="#mapa" aria-label="Todas as telas">${icon('grid', 'icon-sm')}<span class="proto-label-long">Todas as telas</span></a>
      ${note || fam.length > 1 ? h`<button type="button" class="proto-btn only-mobile proto-info" data-act="toggleNote" aria-expanded="${P.noteOpen ? 'true' : 'false'}" aria-controls="proto-more" aria-label="O que muda e outros estados desta tela">${icon('info', 'icon-sm')}</button>` : ''}
    </div>
    <div id="proto-more" class="proto-more ${P.noteOpen ? 'is-open' : ''}">
    ${note ? h`<div class="proto-note"><b>O que muda em relação a hoje:</b><p>${note}</p></div>` : ''}
    ${fam.length > 1 ? h`<nav class="proto-states" aria-label="Estados desta tela">${fam.map((k) => h`<a href="#${k}"${k === id ? raw(' aria-current="page"') : ''}>${k === baseOf(k) ? 'Padrão' : screenName(k).split(' · ').pop()}</a>`)}</nav>` : ''}
    </div>`);
    const top = bar.getBoundingClientRect().height;
    document.documentElement.style.setProperty('--proto-top', (isMobile() ? 0 : Math.round(top)) + 'px');
  }
  onRouteChange(() => { P.comboOpen = false; renderBar(); });

  on('jrPrev', () => { const J = JOURNEYS[P.j]; if (P.step > 0) { P.step -= 1; go(J.steps[P.step]); } });
  on('jrNext', () => { const J = JOURNEYS[P.j]; if (P.step < J.steps.length - 1) { P.step += 1; go(J.steps[P.step]); } });
  on('toggleNote', () => { P.noteOpen = !P.noteOpen; renderBar(); });
  on('toggleRole', () => {
    S.role = S.role === 'manage' ? 'view' : 'manage';
    closeAllLayers();
    renderBar();
    render();
    toast(S.role === 'view' ? 'Agora você vê como quem só pode ver.' : 'Agora você vê como quem administra.');
    const b = document.querySelector('[data-act="toggleRole"]');
    if (b) b.focus();
  });
  function openCombo(open) {
    P.comboOpen = open;
    P.comboActive = P.j;
    renderBar();
    const b = document.getElementById('jr-btn');
    if (b) b.focus();
  }
  function pickJourney(i) {
    P.j = i;
    P.step = 0;
    P.comboOpen = false;
    go(JOURNEYS[i].steps[0]);
    renderBar();
    const b = document.getElementById('jr-btn');
    if (b) b.focus();
  }
  on('toggleCombo', () => openCombo(!P.comboOpen));
  on('pickJourney', (el) => pickJourney(Number(el.dataset.i)));
  document.addEventListener('keydown', (ev) => {
    if (!ev.target.closest || !ev.target.closest('#jr-btn')) return;
    const n = JOURNEYS.length;
    if (!P.comboOpen && ['ArrowDown', 'ArrowUp', 'Enter', ' ', 'Home', 'End'].includes(ev.key)) { ev.preventDefault(); openCombo(true); return; }
    if (!P.comboOpen) return;
    if (ev.key === 'ArrowDown') { ev.preventDefault(); P.comboActive = Math.min(n - 1, P.comboActive + 1); renderBar(); document.getElementById('jr-btn').focus(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); P.comboActive = Math.max(0, P.comboActive - 1); renderBar(); document.getElementById('jr-btn').focus(); }
    else if (ev.key === 'Home') { ev.preventDefault(); P.comboActive = 0; renderBar(); document.getElementById('jr-btn').focus(); }
    else if (ev.key === 'End') { ev.preventDefault(); P.comboActive = n - 1; renderBar(); document.getElementById('jr-btn').focus(); }
    else if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pickJourney(P.comboActive); }
    else if (ev.key === 'Escape' || ev.key === 'Tab') { if (ev.key === 'Escape') ev.preventDefault(); P.comboOpen = false; renderBar(); if (ev.key === 'Escape') document.getElementById('jr-btn').focus(); }
  });
  document.addEventListener('click', (ev) => {
    if (P.comboOpen && !ev.target.closest('.combo')) { P.comboOpen = false; renderBar(); }
  });

  /* ---------- mapa de todas as telas ---------- */
  function thumb(kind) {
    const side = raw('<i class="t-side"></i>');
    const parts = {
      hero: raw('<i class="t-hero"></i><i class="t-card" style="left:28%;top:30%;width:18%;height:36%"></i><i class="t-card" style="left:50%;top:30%;width:18%;height:36%"></i><i class="t-card" style="left:72%;top:30%;width:18%;height:36%"></i>'),
      list: raw('<i class="t-hero" style="height:22%"></i><i class="t-card" style="left:24%;top:42%;width:22%;height:24%"></i><i class="t-card" style="left:50%;top:42%;width:22%;height:24%"></i><i class="t-card" style="left:24%;top:70%;width:22%;height:24%"></i>'),
      split: raw('<i class="t-card" style="left:24%;top:12%;width:40%;height:76%"></i><i class="t-phone" style="left:70%;top:8%;width:20%;height:84%"></i><i class="t-cta" style="left:70%;top:94%;width:20%;height:5%"></i>'),
      page: raw('<i class="t-hero" style="height:28%"></i><i class="t-card" style="left:24%;top:44%;width:70%;height:12%"></i><i class="t-card" style="left:24%;top:60%;width:70%;height:12%"></i><i class="t-card" style="left:24%;top:76%;width:70%;height:12%"></i>'),
      drawer: raw('<i class="t-hero" style="height:28%"></i><i class="t-card" style="left:24%;top:44%;width:70%;height:12%"></i><i class="t-scrim"></i><i class="t-drawer"></i>'),
      dialog: raw('<i class="t-hero" style="height:28%"></i><i class="t-card" style="left:24%;top:44%;width:70%;height:12%"></i><i class="t-scrim"></i><i class="t-dialog"></i>'),
      err: raw('<i class="t-card" style="left:24%;top:12%;width:70%;height:30%"></i><i class="t-err" style="left:24%;top:50%;width:70%;height:22%"></i>'),
      map: raw('<i class="t-card" style="left:24%;top:12%;width:20%;height:30%"></i><i class="t-card" style="left:48%;top:12%;width:20%;height:30%"></i><i class="t-card" style="left:72%;top:12%;width:20%;height:30%"></i>'),
      done: raw('<i class="t-hero" style="height:80%"></i><i class="t-check" style="left:30%;top:24%"></i><i class="t-phone" style="left:66%;top:16%;width:18%;height:66%"></i>'),
      radios: raw('<i class="t-hero" style="height:28%"></i><i class="t-scrim"></i><i class="t-drawer"></i><i class="t-radio" style="top:22%"></i><i class="t-radio t-radio-on" style="top:40%"></i><i class="t-radio t-radio-busy" style="top:58%"></i>'),
      dates: raw('<i class="t-hero" style="height:28%"></i><i class="t-scrim"></i><i class="t-drawer"></i><i class="t-line" style="top:22%"></i><i class="t-line" style="top:36%"></i><i class="t-line" style="top:50%"></i><i class="t-line" style="top:64%"></i>'),
    };
    return h`<span class="thumb" aria-hidden="true">${side}${parts[kind] || parts.page}</span>`;
  }
  function mapCard(id) {
    return h`<li><a class="card card-link map-card" href="#${id}">${thumb((SCREENS[id] || {}).kind)}<span class="nm">${screenName(id)}</span><span class="id">#${id}</span></a></li>`;
  }
  function renderMap() {
    const inJourney = new Set(JOURNEYS.flatMap((j) => j.steps));
    const rest = Object.keys(SCREENS).filter((k) => k !== 'mapa' && !inJourney.has(k));
    const extraRoutes = Object.keys(ROUTES).filter((k) => k !== 'mapa' && !SCREENS[k] && !inJourney.has(k));
    return h`<div class="page w-6xl">
      <div class="stack gap-2"><h1 class="page-title" id="map-h1">Todas as telas</h1>
        <p class="muted">Cada cartão abre a tela pela âncora própria. As jornadas seguem a ordem em que o dono passa por elas.</p></div>
      ${JOURNEYS.map((j) => h`<section class="map-group" aria-labelledby="mg-${j.key}"><h2 id="mg-${j.key}">${j.key} · ${j.name}</h2>
        <ul class="map-grid">${[...new Set(j.steps)].map(mapCard)}</ul></section>`)}
      <section class="map-group" aria-labelledby="mg-x"><h2 id="mg-x">Outros estados</h2>
        <ul class="map-grid">${[...rest, ...extraRoutes].map(mapCard)}</ul></section>
      <p>${btn({ label: 'Recomeçar o protótipo do zero', kind: 'secondary', icon: 'refresh', act: 'resetProto' })}</p>
    </div>`;
  }
  route('mapa', { title: 'Todas as telas', active: 'none', bare: true, render: renderMap });
  on('resetProto', () => { resetData(); toast('Dados do protótipo recomeçados.'); });

  /* ---------- boot ---------- */
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function resetData() {
    S.agents = clone(DATA.agents);
    S.channels = clone(DATA.channels);
    S.agentId = 'bia';
    S.builder = null;
  }
  function boot() {
    document.documentElement.lang = 'pt-BR';
    resetData();
    renderShell();
    handleRoute();
    window.addEventListener('resize', () => {
      const bar = document.getElementById('proto');
      document.documentElement.style.setProperty('--proto-top', (isMobile() ? 0 : Math.round(bar.getBoundingClientRect().height)) + 'px');
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>

</body></html>
