     toast('Pronto.')  (nunca usar toast para erro — use errorCard)

   ---------------------------------------------------------------------

     avatar(agent, 'sm'|''|'lg'|'xl')         (.avatar)
     heroRings()                                anéis do herói (.hero-ring)
     backLink(href, label)                      (.back-link 44 px)
     stepper(atual 1..3 | 4 = tudo feito)       (.steps + .steps-compact)

     chips(lista, act, {cls, data})             (.chips .chip 44 px)

   --cta #008573 4,6:1 · --danger #CA244D 5,4:1 · --warn #8A4F00 6,5:1.
   ===================================================================== */

class Raw {
  constructor(s) { this.s = s; }
  toString() { return this.s; }

const raw = (s) => new Raw(String(s));
function esc(s) {
  return String(s)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');

function val(v) {
  if (v === null || v === undefined || v === false) return '';
  if (v instanceof Raw) return v.s;
  if (Array.isArray(v)) return v.map(val).join('');
  return esc(v);
}
function h(strings, ...vals) {
  let out = strings[0];
  vals.forEach((v, i) => { out += val(v) + strings[i + 1]; });
  return new Raw(out);
}
function fmt(text, vars = {}) {
  let out = String(text);
  Object.keys(vars).forEach((k) => { out = out.replaceAll('{' + k + '}', vars[k]); });
  return out;
}
function plural(n, zero, one, many) {
  if (n === 0) return fmt(zero, { n });
  if (n === 1) return fmt(one, { n });
  return fmt(many, { n: n.toLocaleString('pt-BR') });
}

  const out = {};
  Object.keys(obj).forEach((k) => { out['data-' + k] = obj[k]; });
  return attrs(out);
};

  const ta = ev.target.closest && ev.target.closest('.composer textarea, .phone-input textarea');
  if (!ta) return;
  ev.preventDefault();
  const form = ta.closest('form');
  if (form) form.requestSubmit();
});

/* ---------- roteador ---------- */
function route(id, def) { ROUTES[id] = def; }
function onRouteChange(fn) { ROUTE_HOOKS.push(fn); }
function go(id) {
  if (location.hash === '#' + id) handleRoute();
  else location.hash = id;
}
function replaceHash(id) {
  history.replaceState(null, '', '#' + id);
  S.route = id;
  ROUTE_HOOKS.forEach((fn) => fn(id));
}
function currentId() {
  const raw0 = decodeURIComponent(location.hash.slice(1));
  return raw0 || 't01';
}
function paintPage(def, ctx) {
  const main = document.getElementById('main');
  const page = def.base ? ROUTES[def.base] : def;
  main.innerHTML = String(page && page.render ? page.render(ctx) : h`<div class="todo">Esta tela ainda não foi montada.</div>`);
  if (page && page.mount) page.mount(main, ctx);
  document.body.classList.toggle('is-bare', !!(page && page.bare));
  const active = (page && page.active) || 'agentes';
  document.querySelectorAll('[data-nav]').forEach((a) => {
    if (a.dataset.nav === active) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
}
function handleRoute() {
  let id = currentId();
  if (!ROUTES[id]) { id = 't01'; history.replaceState(null, '', '#t01'); }
  closeAllLayers();
  clearRouteTimers();
  const prev = S.route;
  S.route = id;
  S.flags = { ...DEFAULT_FLAGS };
  S.ui = {};
  const def = ROUTES[id];
  const ctx = { id, prev };
  if (def.setup) def.setup(ctx);
  paintPage(def, ctx);
  const title = def.title || (def.base && ROUTES[def.base] && ROUTES[def.base].title) || '';
  document.title = title ? `${title} · Agentes · nova jornada` : 'Agentes · nova jornada';
  ROUTE_HOOKS.forEach((fn) => fn(id));
  if (def.open) {
    // Gaveta aberta por âncora: se a página de fundo mudou, ela começa do topo.
    const pageOf = (r) => (r && ROUTES[r] ? (ROUTES[r].base || r) : null);
    if (pageOf(prev) !== pageOf(id)) window.scrollTo(0, 0);
    routeOpening = true;
    try { def.open(ctx); } finally { routeOpening = false; }
  } else if (prev !== null) {
    window.scrollTo(0, 0);
    const h1 = document.querySelector('#main h1');
    if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
  }
}
function render() {
  const def = ROUTES[S.route];
  if (!def) return;
  const active = document.activeElement;
  const activeId = active && active.id;
  const sel = active && 'selectionStart' in active ? [active.selectionStart, active.selectionEnd] : null;
  const y = window.scrollY;
  paintPage(def, { id: S.route, rerender: true });
  window.scrollTo(0, y);
  if (LAYERS.length) return;
  const again = activeId && document.getElementById(activeId);
  if (again) {
    again.focus({ preventScroll: true });
    if (sel && 'setSelectionRange' in again) { try { again.setSelectionRange(sel[0], sel[1]); } catch (e) { /* campo sem seleção */ } }
    return;
  }
  const wasInMain = active && active !== document.body && !document.contains(active);
  // S.ui.focusAfter: seletor que a ação deixa antes de redesenhar (consumido uma vez)
  if (wasInMain || (S.ui.focusAfter && document.activeElement === document.body)) {
    const fb = S.ui.focusAfter && document.querySelector(S.ui.focusAfter);
    S.ui.focusAfter = null;
    const target = fb || document.querySelector('#main h1');
    if (target) {
      if (!target.matches(FOCUSABLE)) target.setAttribute('tabindex', '-1');
      target.focus({ preventScroll: true });
    }
  }
}
window.addEventListener('hashchange', handleRoute);
let lastMobile = isMobile();
MOBILE_Q.addEventListener('change', () => {
  if (isMobile() !== lastMobile) { lastMobile = isMobile(); render(); }
});

  const t = document.querySelector('#main h1');
  if (!t) return;
  t.setAttribute('tabindex', '-1');
  t.focus();
});

  const hasAny = S.agents.length > 0;
  closeAllLayers();

/* ---------- helpers de dados ---------- */
const WHEN_LABEL = {
  sempre: 'sempre',
  dentro: 'só no horário de atendimento',
  fora: 'só fora do horário de atendimento',
};
const WHEN_OPTION = {
  sempre: 'Sempre',
  dentro: 'Só no horário de atendimento',
  fora: 'Só fora do horário de atendimento',
};
/* linha de apoio de cada opção de Quando: mostra o horário real do canal */
function whenSub(key, ch) {
  if (key === 'sempre') return 'A qualquer hora, todos os dias';
  if (!ch || !ch.hours || !ch.hoursText) return '';
  return key === 'dentro' ? `Horário do canal: ${ch.hoursText}` : `Fora de: ${ch.hoursText}`;
}
function nicheKey(label) {
  const found = DATA.niches.find((n) => n.label === label);
  return found ? found.key : 'roupas';
}
function modelOf(key) {
  const m = DATA.models[key] || DATA.models.support;
  if (key !== 'custom') return m;
  return { ...m, example: DATA.models.support.example, testChips: DATA.models.support.testChips };
}
/* Resposta de teste: pergunta exata de chip → por negócio → default → __free */
function testReply(model, niche, question, o = {}) {
  if (o.noPrices && question === 'Quanto custa?') return testReply(model, niche, '__noPrices');
  const byQ = DATA.replies[question] || DATA.replies.__free;
  const r = byQ[niche] || byQ.default || byQ.roupas || DATA.replies.__free.default;
  return { chunks: r.chunks.slice(), handoff: !!r.handoff, used: r.used || null };
}
/* Estado inicial da conversa de criar (S.builder). extra sobrescreve. */
function makeBuilder(model, extra = {}) {
  const m = modelOf(model);
  return {
    model,
    name: m.defaultName,
    tone: m.tone,
    niche: 'roupas',
    step: 0,              // índice em DATA.script[model].steps
    picked: {},           // resposta do dono por key do roteiro (onlyIf usa)
    noPrices: false,      // escolheu "Depois" na tabela de preços
    turns: [],            // [{from:'bot'|'owner', text, kind?}]
    answers: 0,           // respostas do dono (libera "Testar agora" com 2)
    closed: false,        // conversa fechou (needs_more_info false)
    thinking: false,
    agentId: null,        // nasce na 1ª geração
    materials: [],        // [{id, kind, name, state:'reading'|'ok'|'attn'}]
    test: [],             // [{from:'client'|'agent', text}] — teste no celular
    testAnswered: 0,      // respostas concluídas (libera "Começar a atender")
    channelId: null,      // canal escolhido em T05
    when: 'sempre',
    ...extra,
  };
}

/* ===== screens-create.js ===== */
/* =====================================================================
   screens-create.js · T03 Conte · T04 Confira · T05 Comece · T06 Pronto
   Rotas: #t03 #t03-fechada #t03-erro
          #t04 #t04-respondida #t04-falha
          #t05 #t05-ocupado #t05-todos #t05-falha #t05-semcanal
          #t06 #t06-horario #t06-troca
   Estado: S.builder (makeBuilder em data.js) + campos deste arquivo:
     firstMessage, asked (índice da pergunta feita), forced ("Testar agora"),
     awaiting ('wrong-ask' | 'wrong-answer' | 'info'), draft, testDraft,
     testTyping, testNotice, lastQ, lastTest {q, a}, launched {channelId,
     when, swappedFrom}.
   Desktop: uma tela só; ao fechar a conversa o celular vira teste no lugar.
   Celular: conversa (T03) e teste (T04) são telas próprias, sem troca
   automática; barra fixa "Ver o exemplo" → CTA "Ver como {nome} responde".
   "Respondeu errado?" fica no celular, logo abaixo da última resposta do
   teste; tocar nele leva o pedido para a conversa ao lado (celular: volta
   para a tela da conversa).
   ===================================================================== */
(() => {
  const THINK_MS = 1400;
  const READ_MS = 2600;
  const WRONG = 'Respondeu errado';
  const CTA_TYPE = { whatsapp: 'WhatsApp', instagram: 'Instagram', site: 'chat do site', email: 'e-mail' };
  const INTRO = 'Vou te fazer umas perguntas curtas. O agente só começa a atender quando você mandar.';
  const SAMPLE_FILES = [
    { name: 'Tabela de preços.pdf', size: '1,2 MB', target: 'ok' },
    { name: 'Política de trocas.docx', size: '300 KB', target: 'attn' },
    { name: 'Catálogo completo.pdf', size: '38 MB', tooBig: true },
  ];

  const ms = (n) => (reducedMotion() ? Math.min(n, 250) : n);
  const B = () => S.builder;
  const nameOf = (b) => b.name || modelOf(b.model).defaultName;
  const scriptOf = (b) => DATA.script[b.model] || DATA.script.support;
  const isConfira = (b) => !!(b.closed || b.forced);
  const t = (text, b, extra = {}) => fmt(text, { nome: nameOf(b), ...extra });
  const PRICE_PHOTO = 'Foto da tabela de preços.jpg';
  const LIGAR_SUB = '{nome} passa a responder as mensagens dos seus clientes.';
  /* passo vale? (onlyIf: { key: resposta }) */
  const stepOk = (b, st) => !st.onlyIf || Object.keys(st.onlyIf).every((k) => (b.picked || {})[k] === st.onlyIf[k]);
  function nextStep(b, from) {
    const steps = scriptOf(b).steps;
    for (let i = from; i < steps.length; i += 1) if (stepOk(b, steps[i])) return i;
    return -1;
  }

  /* ---------- canais ---------- */
  function channelPool() {
    if (S.flags.noChannel) return [];
    if (S.flags.allBusy) return S.channels.filter((c) => c.busy);
    return S.channels;
  }
  /* canal do próprio agente (voltar a atender) conta como livre para o próprio agente */
  const mine = (c) => !!(c.busy && c.busy.agent && S.builder && c.busy.agent === S.builder.agentId);
  const freeChannels = () => channelPool().filter((c) => !c.busy || mine(c));
  const agentBusyChannels = () => channelPool().filter((c) => c.busy && c.busy.agent && !mine(c));
  const externalChannels = () => channelPool().filter((c) => c.busy && c.busy.external);
  function defaultChannel() {
    const free = freeChannels();
    return free.find((c) => c.type === 'whatsapp') || free[0] || null;
  }
  function ctaChannel(b) {
    const chosen = b.channelId && channelById(b.channelId);
    if (chosen && channelPool().includes(chosen)) return chosen;
    const busy = agentBusyChannels();
    return defaultChannel() || busy.find((c) => c.type === 'whatsapp') || busy[0] || null;
  }
  const busyAgentName = (c) => {
    const a = c && c.busy && c.busy.agent && agentById(c.busy.agent);
    return (a && (a.name || 'Novo agente')) || 'outro agente';
  };

  /* ---------- estado da conversa ---------- */
  function newModelBuilder(model = 'support', extra = {}) {
    return makeBuilder(model, { firstMessage: modelOf(model).title, asked: -1, ...extra });
  }
  /* conversa já respondida (para as âncoras de estado) */
  function demoBuilder(model = 'support', o = {}) {
    const b = newModelBuilder(model);
    const sc = scriptOf(b);
    b.turns.push({ from: 'owner', text: b.firstMessage });
    let answers = 0;
    sc.steps.forEach((st, i) => {
      if (!stepOk(b, st)) return;
      const answer = st.key === 'hours' ? st.chips[1] : st.chips[0];
      b.turns.push({ from: 'bot', text: st.ask, step: i });
      b.turns.push({ from: 'owner', text: answer });
      b.picked[st.key] = answer;
      answers += 1;
      if (st.key === 'niche') b.niche = nicheKey(answer);
      if (st.key === 'prices' && answer === 'Mandar foto') {
        const m = { id: 'm' + uid(), kind: 'photo', name: PRICE_PHOTO, target: 'ok', state: 'ok' };
        b.materials.push(m);
        b.turns.push({ kind: 'material', id: m.id });
      }
    });
    b.asked = sc.steps.length - 1;
    b.answers = answers;
    b.agentId = 'ag-' + uid();
    b.closed = true;
    b.turns.push({ from: 'bot', text: t(sc.close, b) });
    if (o.tested) {
      const q = 'Vocês abrem no sábado?';
      const r = testReply(b.model, b.niche, q, { noPrices: b.noPrices });
      b.test.push({ from: 'client', text: q });
      r.chunks.forEach((c) => b.test.push({ from: 'agent', text: c }));
      b.testAnswered = 1;
      b.lastTest = { q, a: r.chunks.join(' ') };
    }
    return b;
  }
  function ensureFields(b) {
    if (b.asked === undefined) b.asked = -1;
    return b;
  }

  /* começa ou retoma a conversa ao entrar na rota (timers morrem na troca) */
  function kick() {
    const b = ensureFields(B());
    const sc = scriptOf(b);
    if (!b.turns.length) {
      if (b.continuing && !b.hasInstruction) {
        b.asked = 0;
        b.answers = Math.max(b.answers, 1);
        b.turns.push({ from: 'bot', text: 'Vamos continuar de onde paramos.' });
        b.turns.push({ from: 'bot', text: sc.steps[0].ask, step: 0 });
        b.picked = b.picked || {};
      } else if (b.model === 'custom') {
        b.turns.push({ from: 'bot', text: sc.opener, opener: true });
      } else {
        b.turns.push({ from: 'owner', text: b.firstMessage || modelOf(b.model).title });
        think();
      }
    } else if (b.thinking) {
      think();
    }
    b.materials.forEach((m) => {
      if (m.state === 'reading') m.state = m.target;
      if (m.state === 'queued' && b.agentId) m.state = m.target;
    });
    if (b.testTyping) b.testTyping = false;
  }

  function think() {
    const b = B();
    b.thinking = true;
    b.slow = false;
    later(() => { if (B() === b && b.thinking) { b.slow = true; render(); } }, 60000);
    later(resolveThink, ms(THINK_MS));
  }

  function resolveThink() {
    const b = B();
    if (!b) return;
    b.thinking = false;
    b.slow = false;
    if (S.flags.builderFail && !S.ui.builderFailed) {
      S.ui.builderFailed = true;
      b.turns.push({ kind: 'error' });
      S.ui.focusAfter = '#b-retry';
      render();
      announce('Não consegui responder agora. O que você contou está guardado.', true);
      return;
    }
    if (!b.agentId) {
      b.agentId = 'ag-' + uid();
      b.materials.forEach((m) => { if (m.state === 'queued') { m.state = 'reading'; progress(m); } });
    }
    const sc = scriptOf(b);
    let said;
    if (b.closed) {
      if (b.awaiting === 'wrong-ask') {
        said = t(DATA.script.change.replies[WRONG].ask, b);
        b.awaiting = 'wrong-answer';
      } else {
        b.awaiting = null;
        said = t(DATA.script.change.close, b);
        markUpdated(b);
      }
      b.turns.push({ from: 'bot', text: said });
    } else {
      const next = nextStep(b, b.asked + 1);
      if (next >= 0) {
        b.asked = next;
        said = sc.steps[next].ask;
        b.turns.push({ from: 'bot', text: said, step: next });
      } else {
        b.closed = true;
        said = t(sc.close, b);
        b.turns.push({ from: 'bot', text: said });
        if (b.test.length) markUpdated(b);
      }
    }
    b.refocus = true;
    render();
    announce(`Assistente de criação: ${said}`);
  }
  function markUpdated(b) {
    b.test = [];
    b.testNotice = true;
  }

  function ownerSays(text) {
    const b = B();
    const value = String(text || '').trim();
    if (!b || b.thinking || !value) return;
    b.turns.push({ from: 'owner', text: value });
    b.draft = '';
    if (b.closed) {
      b.awaiting = value === WRONG && b.awaiting !== 'wrong-answer' ? 'wrong-ask' : 'info';
    } else {
      b.answers += 1;
      const st = scriptOf(b).steps[b.asked];
      if (st) {
        b.picked = b.picked || {};
        b.picked[st.key] = value;
        if (st.key === 'niche') b.niche = nicheKey(value);
        if (st.key === 'prices' && value === 'Depois') b.noPrices = true;
        if (st.key === 'prices' && value === 'Mandar foto') {
          const m = { id: 'm' + uid(), kind: 'photo', name: PRICE_PHOTO, target: 'ok', state: 'reading' };
          b.materials.push(m);
          b.turns.push({ kind: 'material', id: m.id });
          progress(m);
        }
      }
    }
    // o chip some ao responder: o foco fica na conversa (nunca no body)
    S.ui.focusAfter = isMobile() ? '#cr-log' : '#b-input';
    think();
    render();
  }

  function currentChips(b) {
    if (b.thinking || b.turns.some((x) => x.kind === 'error')) return null;
    // conversa fechada: "Respondeu errado?" mora no celular, junto da resposta
    if (b.closed) return null;
    const last = [...b.turns].reverse().find((x) => x.from === 'bot');
    if (last && last.step === b.asked && b.asked >= 0) return scriptOf(b).steps[b.asked].chips;
    return null;
  }

  /* ---------- materiais (sempre opcionais) ---------- */
  function progress(m) {
    if (m.state !== 'reading') return;
    later(() => { m.state = m.target; render(); }, ms(READ_MS));
  }
  function attach(kind, name, target) {
    const b = B();
    const m = { id: 'm' + uid(), kind, name, target, state: kind !== 'photo' && !b.agentId ? 'queued' : 'reading' };
    b.materials.push(m);
    b.turns.push({ kind: 'material', id: m.id });
    render();
    progress(m);
  }
  function removeMaterial(id) {
    const b = B();
    b.materials = b.materials.filter((m) => m.id !== id);
    b.turns = b.turns.filter((x) => !(x.kind === 'material' && x.id === id));
    render();
    const f = document.getElementById('b-input');
    if (f && !isMobile()) f.focus();
  }

  /* ---------- teste no celular ---------- */
  function okMaterial(b) { return b.materials.find((m) => m.state === 'ok'); }
  function testAsk(q) {
    const b = B();
    const value = String(q || '').trim();
    if (!b || !isConfira(b) || b.testTyping || !value) return;
    b.testNotice = false;
    b.test.push({ from: 'client', text: value });
    b.testDraft = '';
    b.lastQ = value;
    runTest(value);
  }
  function runTest(q) {
    const b = B();
    b.testTyping = true;
    render();
    const fail = S.flags.failTest && !S.ui.testFailed;
    const inc = S.flags.testIncomplete && !S.ui.incShown;
    const slow = S.flags.testSlow && !S.ui.slowShown;
    later(() => {
      if (fail || inc || slow) {
        if (fail) S.ui.testFailed = true;
        if (inc) S.ui.incShown = true;
        if (slow) S.ui.slowShown = true;
        b.testTyping = false;
        b.test.push({ kind: fail ? 'error' : inc ? 'incomplete' : 'slow' });
        if (!inc) S.ui.focusAfter = '#test-retry';
        render();
        announce(fail ? t('{nome} não respondeu agora. Isso não afeta seus clientes.', b) : inc ? incompleteText(b) : 'Está demorando. Tente de novo.', true);
        return;
      }
      const r = testReply(b.model, b.niche, q, { noPrices: b.noPrices });
      playChunks(r.chunks, (i) => {
        b.test.push({ from: 'agent', text: r.chunks[i] });
        if (i === r.chunks.length - 1) b.testTyping = false;
        render();
      }, () => {
        const used = r.used && okMaterial(b);
        if (used) b.test.push({ kind: 'used', text: `Usou: ${shownName(used.name)}` });
        if (r.handoff) b.test.push({ kind: 'handoff' });
        if (!b.testAnswered) S.ui.riseCta = true;
        b.testAnswered += 1;
        b.lastTest = { q, a: r.chunks.join(' ') };
        render();
        announce(`${nameOf(b)} respondeu: ${r.chunks.join(' ')}${r.handoff ? ` Aqui ${nameOf(b)} passaria a conversa para a equipe.` : ''}`);
      }, 900);
    }, ms(900));
  }

  /* ---------- rascunho e agente ---------- */
  function upsertAgent(b, patch) {
    const id = b.agentId || 'ag-' + uid();
    b.agentId = id;
    let a = agentById(id);
    if (!a) {
      a = {
        id, name: nameOf(b), tone: b.tone || 'blue', status: 'draft', model: b.model, mode: 'conversa',
        channels: [], when: 'sempre', hasInstruction: false, week: null,
        summary: modelOf(b.model).text, sources: [], lastTest: null,
      };
      S.agents.push(a);
    }
    Object.assign(a, {
      name: nameOf(b),
      sources: b.materials.map((m) => ({ id: m.id, kind: m.kind === 'site' ? 'site' : 'file', name: m.name, state: m.state === 'queued' ? 'reading' : m.state })),
      ...patch,
    });
    S.agentId = id;
    return a;
  }
  function leaveToList(b) {
    upsertAgent(b, { status: 'draft', hasInstruction: !!(b.closed || b.answers >= 2) });
    go('t02');
    toast(t('{nome} ficou na lista como Falta terminar.', b));
  }

  /* =====================================================================
     RENDER · pedaços
     ===================================================================== */
  function botMsg(inner, extraCls = '') {
    return h`<div class="msg bot"><span class="bot-av" aria-hidden="true">${icon('star', 'icon-sm')}</span><div class="bub ${extraCls}" tabindex="-1"><span class="sr-only">Assistente de criação: </span>${inner}</div></div>`;
  }
  function ownerMsg(text) {
    return h`<div class="msg owner"><div class="bub"><span class="sr-only">Você: </span>${text}</div></div>`;
  }
  function materialMsg(b, m) {
    const ic = m.kind === 'photo' ? 'image' : m.kind === 'site' ? 'globe' : 'file';
    if (m.state === 'attn') {
      return h`<div class="material cr-mat attn" role="group" aria-label="${shownName(m.name)}">
        <span class="ic">${icon('alert-triangle')}</span><span class="nm">${shownName(m.name)}</span><span aria-hidden="true">·</span>${stateWord('attn', m.kind === 'site')}
        <p class="attn-txt">Mande outro arquivo ou conte na conversa.</p>
        <span class="acts"><button type="button" class="link-btn" data-act="bFileSheet" id="again-${m.id}">Mandar outro</button>
        <button type="button" class="link-btn link-danger" data-act="bRemoveMat" data-id="${m.id}" aria-label="Tirar ${shownName(m.name)}">Tirar</button></span>
      </div>`;
    }
    const st = m.state === 'queued'
      ? h`<span class="queued">Vou ler assim que começarmos</span>`
      : stateWord(m.state === 'ok' ? 'ok' : 'reading');
    return h`<div class="material cr-mat ${m.state === 'ok' ? 'ok' : ''}"><span class="sr-only">Você mandou: </span><span class="ic">${icon(ic)}</span><span class="nm">${shownName(m.name)}</span><span aria-hidden="true">·</span>${st}</div>`;
  }
  function turnsHtml(b) {
    return b.turns.map((x) => {
      if (x.kind === 'material') {
        const m = b.materials.find((y) => y.id === x.id);
        return m ? materialMsg(b, m) : '';
      }
      if (x.kind === 'error') {
        return h`<div class="cr-err">${errorCard({ title: 'Não consegui responder agora.', sub: 'O que você contou está guardado.', action: { label: 'Tentar de novo', act: 'bRetry', id: 'b-retry' } })}</div>`;
      }
      return x.from === 'owner' ? ownerMsg(x.text) : botMsg(x.text, '', x.step);
    });
  }
  function convoBody(b) {
    const chipList = currentChips(b);
    return h`<p class="cr-intro">${icon('info')}<span>${INTRO}</span></p>
      <div class="cr-log" id="cr-log" tabindex="-1" aria-label="Conversa">
        ${turnsHtml(b)}
        ${b.thinking ? botMsg(h`<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span><span>Pensando…</span>`, 'thinking') : ''}
        ${b.thinking && b.slow ? h`<p class="cr-slow" role="status">Está demorando mais que o normal. Pode esperar aqui.</p>` : ''}
      </div>
      ${chipList ? chips(chipList, 'bChip', { cls: 'cr-chips' }) : ''}
      ${b.answers >= 1 && !b.closed ? h`<p class="cr-attach-line">${icon('paperclip', 'icon-sm')}<span>Tem um cardápio, uma tabela ou o seu site?</span> <button type="button" class="link-btn" data-act="bClip" id="attach-line" aria-haspopup="menu">Mande aqui.</button> <span>Não é obrigatório.</span></p>` : ''}`;
  }
  function composerHtml(b) {
    const firstCustom = b.model === 'custom' && b.answers === 0 && !b.continuing;
    const quiet = isConfira(b) && !isMobile();
    return h`${quiet ? h`<p class="cr-quiet-hint">Quer contar mais alguma coisa? Escreva aqui.</p>` : ''}${composer({
      id: 'b-input', act: 'bSend', clipAct: 'bClip', micAct: 'bMic', inputAct: 'bDraft',
      placeholder: S.ui.writePrices ? 'Ex.: blusas a partir de R$ 59,90' : firstCustom ? DATA.script.custom.openerHint : 'Escreva sua resposta',
      disabled: b.thinking, value: b.draft || '', sendKind: quiet ? 'ghost' : 'primary',
      hint: b.thinking ? 'Espere a resposta anterior.' : '',
    })}`;
  }
  function backToList() {
    return h`<a class="back-link" href="#t02" data-act="bLeave">${icon('arrow-left')}Voltar para Agentes</a>`;
  }

  /* celular de exemplo (antes de fechar) */
  function examplePhone(b, size = '') {
    const m = modelOf(b.model);
    // depois que o dono diz o negócio, o exemplo passa a responder do jeito dele
    const picked = b.picked && b.picked.niche;
    const q = m.example[0].text;
    const messages = picked
      ? [m.example[0], { from: 'agent', text: testReply(b.model, b.niche, q).chunks.join(' '), time: m.example[1].time }]
      : m.example;
    return phone({
      size, badge: 'Exemplo', name: DATA.business, status: 'online', bodyId: 'ex-body',
      srLabel: 'Exemplo de conversa, não é um agente de verdade',
      messages: messages.map((x) => ({ ...x, who: x.from === 'client' ? 'Cliente' : nameOf(b) })),
    });
  }
  function testMessages(b) {
    const out = [];
    if (b.testNotice) out.push(h`<p class="phone-note" role="status">${icon('refresh', 'icon-sm')}Atualizado. Teste de novo.</p>`);
    b.test.forEach((x) => {
      if (x.kind === 'used') out.push(h`<p class="used-line">${x.text}</p>`);
      else if (x.kind === 'handoff') out.push(h`<p class="handoff-band">${icon('users', 'icon-sm')}<span>${t('Aqui {nome} passaria a conversa para a equipe.', b)}</span></p>`);
      else if (x.kind === 'error') out.push(errorCard({ title: t('{nome} não respondeu agora.', b), sub: 'Isso não afeta seus clientes.', action: { label: 'Tentar de novo', act: 'testRetry', id: 'test-retry' } }));
      else if (x.kind === 'slow') out.push(errorCard({ tone: 'amber', icon: 'clock', title: 'Está demorando. Tente de novo.', action: { label: 'Tentar de novo', act: 'testRetry', id: 'test-retry' } }));
      else if (x.kind === 'incomplete') out.push(errorCard({ tone: 'amber', title: incompleteText(b) }));
      else out.push(bubble({ from: x.from, text: x.text, who: x.from === 'client' ? 'Cliente' : nameOf(b) }));
    });
    if (b.testTyping) out.push(typingBubble(t('{nome} está escrevendo…', b)));
    else if (canSayWrong(b)) out.push(h`<button type="button" class="link-btn cr-wrong" data-act="testWrong" id="test-wrong">Respondeu errado?</button>`);
    return out;
  }
  /* "Respondeu errado?" logo abaixo da última resposta do teste (conversa já fechada) */
  function canSayWrong(b) {
    const last = b.test[b.test.length - 1];
    const answered = b.test.some((x) => x.from === 'agent');
    return b.closed && !b.thinking && answered && last && last.kind !== 'error' && last.kind !== 'slow' && b.awaiting !== 'wrong-answer' && b.awaiting !== 'wrong-ask';
  }
  /* 422: texto da spec por lugar (T04 desktop tem a conversa "ao lado") */
  const incompleteText = (b) => t(isMobile() ? '{nome} ainda não sabe o suficiente. Conte mais um pouco.' : '{nome} ainda não sabe o suficiente. Conte mais um pouco ao lado.', b);
  function testFoot(b, flat) {
    const m = modelOf(b.model);
    return h`${chips(m.testChips, 'testChip', { cls: flat ? 'phone-chips' : 'phone-chips wrap-chips', disabled: b.testTyping })}
      <form class="phone-input" data-submit="testSend">
        <label class="sr-only" for="test-input">Escreva uma pergunta</label>
        <textarea id="test-input" rows="1" placeholder="Escreva uma pergunta" data-input="testDraft">${b.testDraft || ''}</textarea>
        <button type="submit" class="btn btn-primary btn-md"${b.testTyping ? raw(' aria-disabled="true"') : ''}><span>Enviar</span></button>
      </form>`;
  }
  function testPhone(b, size = '', o = {}) {
    return h`<div class="has-test-wrap">${phone({
      size, name: DATA.business, letter: DATA.business,
      status: b.testTyping ? t('{nome} está escrevendo…', b) : t('Atendido por {nome}', b), bodyId: 'test-body',
      headAction: b.test.length || b.testNotice ? h`<button type="button" class="link-btn" data-act="testClear" id="test-clear">Limpar teste</button>` : '',
      messages: testMessages(b), empty: isMobile() ? 'Toque numa pergunta abaixo para testar.' : 'Toque numa pergunta ou escreva a sua.',
      foot: o.noFoot ? '' : testFoot(b, size === 'flat'),
    })}</div>`;
  }
  /* CTA de começar a atender (ou conectar canal) — só depois de 1 resposta */
  function ligarArea(b) {
    if (!b.testAnswered) return h`<p class="muted">${t('Faça uma pergunta para ver como {nome} responde.', b)}</p>`;
    const rise = S.ui.riseCta ? 'rise-in' : '';
    const ch = ctaChannel(b);
    if (!ch) {
      return h`<div class="stack gap-2 ${rise}"><p class="muted">${t('{nome} já pode atender. Falta escolher onde.', b)}</p>
        ${btn({ label: 'Conectar seu WhatsApp ou outro canal', kind: 'cta', size: 'xl', block: true, iconRight: 'external', act: 'bConnect', id: 'cta-ligar' })}</div>`;
    }
    return h`<div class="stack gap-1 ${rise}">${btn({ label: `Começar a atender no ${CTA_TYPE[ch.type]}`, kind: 'cta', size: 'xl', block: true, act: 'ligOpen', id: 'cta-ligar', describedBy: 'cta-ligar-sub' })}
      <p class="cta-sub" id="cta-ligar-sub">${t(LIGAR_SUB, b)}</p></div>`;
  }
  const laterLink = () => h`<button type="button" class="link-btn" data-act="bLater" id="b-later">Agora não, terminar depois</button>`;

  function sideColumn(b) {
    if (!isConfira(b)) {
      return h`<aside class="cr-side" aria-labelledby="cr-phone-t">
        <div class="cr-side-head"><h2 id="cr-phone-t">Assim seus clientes vão ver</h2></div>
        ${examplePhone(b)}
        <div class="cr-under">
          <p class="cr-caption">${t('Depois de você contar, {nome} responde do jeito do seu negócio.', b)}</p>
          ${b.answers >= 2 ? h`<button type="button" class="link-btn" data-act="bForce" id="b-force">Testar agora</button><p class="small muted">Dá para contar mais depois.</p>` : ''}
        </div>
      </aside>`;
    }
    return h`<aside class="cr-side" aria-labelledby="cr-phone-t">
      <div class="cr-side-head"><h2 id="cr-phone-t">Teste como se fosse seu cliente</h2><p>Ninguém recebe estas mensagens. É só um teste.</p></div>
      ${testPhone(b)}
      <div class="cr-under">${ligarArea(b)}${laterLink()}</div>
    </aside>`;
  }

  /* ---------- telas ---------- */
  function renderDesktop(b) {
    const step = isConfira(b) ? 2 : 1;
    return h`<div class="page w-6xl cr-page">
      ${backToList()}
      <div class="cr-head"><h1 class="page-title" id="cr-h1">Criar agente</h1>${stepper(step)}</div>
      <div class="cr-grid">
        <section class="card cr-convo" aria-label="Conversa para criar o agente">
          <div class="cr-scroll" id="cr-scroll">${convoBody(b)}</div>
          <div class="cr-foot">${composerHtml(b)}</div>
        </section>
        ${sideColumn(b)}
      </div>
    </div>`;
  }
  function renderConvoMobile(b) {
    const bar = isConfira(b)
      ? btn({ label: t('Ver como {nome} responde', b), kind: 'cta', size: 'xl', block: true, act: 'bSeeTest', id: 'b-see', iconRight: 'arrow-right' })
      : h`<button type="button" class="ex-bar" data-act="bExample" id="b-example">${icon('eye')}Ver o exemplo</button>`;
    return h`<div class="page cr-page-m">
      ${backToList()}
      <div class="stack gap-2"><h1 class="page-title" id="cr-h1">Criar agente</h1>${stepper(1)}</div>
      ${convoBody(b)}
      <div class="cr-dock">${bar}${composerHtml(b)}</div>
    </div>`;
  }
  function renderTestMobile(b) {
    return h`<div class="page cr-test-m ${b.testAnswered ? 'has-cta' : ''}">
      <a class="back-link" href="#t03">${icon('arrow-left')}Voltar à conversa</a>
      <div class="stack gap-2"><h1 class="page-title" id="cr-h1">Teste como se fosse seu cliente</h1>${stepper(2)}<p class="muted">Ninguém recebe estas mensagens. É só um teste.</p></div>
      ${testPhone(b, 'flat', { noFoot: true })}
      <p>${laterLink()}</p>
      <div class="cr-dock cr-test-dock">
        ${b.testAnswered ? '' : h`<p class="muted small">${t('Faça uma pergunta para ver como {nome} responde.', b)}</p>`}
        ${testFoot(b, true)}
        ${b.testAnswered ? ligarArea(b) : ''}
      </div>
    </div>`;
  }
  function renderCreate() {
    const b = B();
    if (!b) return h`<div class="todo">Sem conversa.</div>`;
    if (!isMobile()) return renderDesktop(b);
    const testRoute = S.route && (S.route.startsWith('t04') || S.route.startsWith('t05'));
    return testRoute && isConfira(b) ? renderTestMobile(b) : renderConvoMobile(b);
  }
  function mountCreate(root) {
    const b = B();
    const sc = root.querySelector('#cr-scroll');
    if (sc) { sc.scrollTop = sc.scrollHeight; requestAnimationFrame(() => { sc.scrollTop = sc.scrollHeight; }); }
    const tb = root.querySelector('#test-body');
    if (tb) tb.scrollTop = tb.scrollHeight;
    S.ui.riseCta = false;
    if (!b) return;
    // Só a conversa acompanha o fim; o teste no celular abre no topo (título + celular à vista).
    if (isMobile() && root.querySelector('.cr-page-m') && (S.ui.followBottom || b.turns.length > 2)) {
      requestAnimationFrame(() => window.scrollTo(0, document.documentElement.scrollHeight));
    }
    S.ui.followBottom = true;
    if (b.refocus && !LAYERS.length) {
      b.refocus = false;
      const lost = !document.activeElement || document.activeElement === document.body || document.activeElement.id === 'cr-log';
      if (lost) {
        // desktop: volta ao campo; celular: vai à última pergunta (sem abrir o teclado)
        const f = isMobile() ? root.querySelector('#cr-log .msg.bot:last-of-type .bub') : root.querySelector('#b-input');
        if (f) f.focus({ preventScroll: true });
      }
    }
  }

  /* ---------- ações da conversa ---------- */
  on('bSend', (form) => { const ta = form.querySelector('textarea'); ownerSays(ta && ta.value); });
  on('bChip', (el) => {
    const v = el.dataset.value;
    if (v === 'Escrever agora') {
      // não envia: só prepara o campo para o dono escrever os preços
      S.ui.writePrices = true;
      render();
      const f = document.getElementById('b-input');
      if (f) f.focus();
      return;
    }
    S.ui.writePrices = false;
    ownerSays(v);
  });
  on('bDraft', (el) => { const b = B(); if (b) b.draft = el.value; });
  on('bRetry', () => {
    const b = B();
    b.turns = b.turns.filter((x) => x.kind !== 'error');
    think();
    render();
  });
  on('bMic', () => toast('No produto, o microfone grava e escreve por você.'));
  on('bClip', (el) => {
    openMenu(el, [
      { label: 'Foto', icon: 'image', onClick: () => attach('photo', B().picked && B().picked.topics === 'Preços' ? PRICE_PHOTO : DATA.uploads.photo.name, 'ok') },
      { label: 'Arquivo ou site', icon: 'file', onClick: () => openFileSheet(el) },
    ]);
  });
  on('bFileSheet', (el) => openFileSheet(el));
  on('bRemoveMat', (el) => removeMaterial(el.dataset.id));
  on('bForce', () => {
    const b = B();
    b.forced = true;
    if (isMobile()) { go('t04'); return; }
    render();
    const f = document.getElementById('test-input');
    if (f) f.focus({ preventScroll: true });
  });
  on('bSeeTest', () => { go('t04'); });
  on('bExample', (el) => {
    const b = B();
    openDrawer({
      title: 'Assim seus clientes vão ver', sheet: true, width: 440, returnFocus: el,
      body: () => h`<div class="cr-sheet-phone">${examplePhone(b)}
        <p class="cr-caption">${t('Depois de você contar, {nome} responde do jeito do seu negócio.', b)}</p>
        ${b.answers >= 2 ? h`<button type="button" class="link-btn" data-act="bForce" id="b-force-s">Testar agora</button><p class="small muted">Dá para contar mais depois.</p>` : ''}</div>`,
    });
  });
  on('bLeave', () => {
    const b = B();
    if (!b || !b.agentId) { go(S.agents.length ? 't02' : 't01'); return false; }
    openDialog({
      title: 'Sair agora?',
      text: t('{nome} fica na lista como Falta terminar.', b),
      alert: false,
      actions: [
        { label: 'Continuar aqui', kind: 'primary', focus: true },
        { label: 'Sair', kind: 'secondary', onClick: () => leaveToList(b) },
      ],
    });
    return false;
  });
  on('bLater', () => leaveToList(B()));
  on('bConnect', () => { toast('Abriria Canais numa nova aba. Ao voltar, os canais recarregam.'); });

  /* ---------- mandar arquivo ou site ---------- */
  function openFileSheet(anchor) {
    S.ui.fileErr = '';
    S.ui.siteErr = '';
    openDrawer({
      title: 'Mandar arquivo ou site', sheet: true, width: 440, returnFocus: anchor,
      body: () => h`<p class="muted">Mande um arquivo ou o endereço do seu site. Não é obrigatório.</p>
        ${btn({ label: 'Escolher arquivo', kind: 'secondary', size: 'lg', block: true, icon: 'file', act: 'pickFile', data: { i: 0 }, id: 'pick-0' })}
        <div class="cr-proto-box"><p class="xsmall">No protótipo, escolha um exemplo:</p>
          ${SAMPLE_FILES.map((f, i) => h`<button type="button" class="cr-file-opt" data-act="pickFile" data-i="${i}" id="pick-s${i}">${icon('file')}<span>${f.name}</span><span class="sz">${f.size}</span></button>`)}
        </div>
        ${S.ui.fileErr ? errorCard({ tone: 'amber', title: S.ui.fileErr }) : ''}
        <hr class="divider">
        <form class="stack gap-2" data-submit="siteJoin">
          <div class="field"><label for="site-input">Endereço do site</label>
            <input id="site-input" class="input" type="text" inputmode="url" autocomplete="url" placeholder="www.seusite.com.br"${S.ui.siteErr ? raw(' aria-invalid="true" aria-describedby="site-err"') : ''}>
            ${S.ui.siteErr ? h`<p class="field-error" id="site-err">${S.ui.siteErr}</p>` : ''}</div>
          ${btn({ label: 'Mandar site', kind: 'primary', size: 'lg', type: 'submit', icon: 'globe' })}
        </form>`,
    });
  }
  on('pickFile', (el) => {
    const f = SAMPLE_FILES[Number(el.dataset.i) || 0];
    if (f.tooBig) { S.ui.fileErr = 'Este arquivo passa de 25 MB. Tente um menor.'; refreshLayer(); return; }
    if (B().materials.length >= 30) { S.ui.fileErr = t('{nome} já tem 30 arquivos e sites. Tire um para mandar outro.', B()); refreshLayer(); return; }
    closeLayer();
    attach('file', f.name, f.target);
  });
  on('siteJoin', (form) => {
    const v = form.querySelector('input').value.trim();
    if (!v) { S.ui.siteErr = 'Escreva o endereço do site.'; refreshLayer(); const i = document.getElementById('site-input'); if (i) i.focus(); return; }
    closeLayer();
    attach('site', v, v.includes('.') && !v.includes(' ') ? 'ok' : 'attn');
  });

  /* ---------- ações do teste ---------- */
  on('testChip', (el) => { S.ui.focusAfter = '#test-input'; testAsk(el.dataset.value); });
  on('testSend', (form) => { const ta = form.querySelector('textarea'); testAsk(ta && ta.value); });
  on('testDraft', (el) => { const b = B(); if (b) b.testDraft = el.value; });
  on('testRetry', () => {
    const b = B();
    b.test = b.test.filter((x) => x.kind !== 'error' && x.kind !== 'slow');
    S.ui.focusAfter = '#test-input';
    runTest(b.lastQ || 'Vocês abrem no sábado?');
  });
  on('testWrong', () => {
    const b = B();
    if (!b || !canSayWrong(b)) return;
    ownerSays(WRONG);
    // celular: o pedido segue na tela da conversa; desktop: a conversa está ao lado
    if (isMobile()) go('t03');
  });
  on('testClear', () => {
    const b = B();
    b.test = [];
    b.testNotice = false;
    render();
    const f = document.getElementById('test-input');
    if (f) f.focus({ preventScroll: true });
  });

  /* =====================================================================
     T05 · Comece: começar a atender (gaveta à direita; folha de baixo no celular)
     ===================================================================== */
  function openLigue(o = {}) {
    const b = B();
    const def = defaultChannel();
    const chosen = b.channelId && channelById(b.channelId);
    // voltar a atender: o canal que ainda é do agente vem marcado
    const own = chosen && chosen.busy && chosen.busy.agent === b.agentId;
    let where = chosen && (freeChannels().includes(chosen) || own) ? chosen.id : (def ? def.id : null);
    let swap = null;
    if (o.swapTo) { where = o.swapTo; swap = o.swapTo; }
    S.ui.lig = {
      where, when: b.when || 'sempre', swap, busy: false, error: null,
      openWhere: !!o.expandWhere || !where, openWhen: false, ret: o.ret || null,
    };
    openDrawer({
      title: t('Onde e quando {nome} atende', b), width: 480, sheet: true, returnFocus: '#cta-ligar',
      body: ligBody, foot: ligFoot,
      mount(el) {
        if (S.ui.lig && S.ui.lig.error) { const bd = el.querySelector('.drawer-body'); if (bd) bd.scrollTop = bd.scrollHeight; }
      },
      onClose: () => {
        const L = S.ui.lig;
        if (S.route && S.route.startsWith('t05') && L && L.ret) replaceHash(L.ret);
      },
    });
  }
  /* Canal ocupado = cartão-rádio âmbar no mesmo grupo (padrão de T10).
     Ao escolher, aparece a confirmação e o CTA vira "Trocar e começar a atender".
     Uma ação cheia só: o CTA do rodapé. */
  function whereOptions(b) {
    const nome = nameOf(b);
    const free = freeChannels().map((c) => ({ value: c.id, title: channelLabel(c) }));
    const busy = S.flags.l2 ? agentBusyChannels().map((c) => ({
      value: c.id, title: `${c.name} · Já tem ${busyAgentName(c)} respondendo aqui`, sub: `Colocar ${nome} no lugar`, busy: true,
    })) : [];
    const ext = S.flags.l2 ? externalChannels().map((c) => ({
      value: c.id, title: `${c.name} · Já tem outro atendimento automático`, sub: 'Outro sistema já responde aqui. Para usar, pare o outro sistema antes.', disabled: true,
    })) : [];
    return [...free, ...busy, ...ext];
  }
  /* troca de canal: neutro em gênero, sem "apagado" nem "dele" */
  const swapText = (outro, canal) => fmt('{outro} para de responder no {canal}, mas continua na sua lista. As conversas abertas no {canal} voltam para a equipe.', { outro, canal });
  function whereSection(b, L) {
    const free = freeChannels();
    const ch = channelById(L.where);
    const allBusy = !free.length && !L.swap;
    const main = ch ? channelLabel(ch) : t('Todos os seus canais já têm um agente. Coloque {nome} no lugar de um deles ou conecte outro canal.', b);
    const open = L.openWhere || allBusy;
    const swapCh = L.swap && channelById(L.swap);
    const confirmTxt = swapCh ? swapText(busyAgentName(swapCh), swapCh.name) : '';
    return h`<div class="lig-sec">
      <div class="lig-row"><div class="stack gap-1 grow"><p class="lbl">Onde atende</p><p class="lig-main">${main}</p></div>
        ${allBusy ? '' : h`<button type="button" class="btn btn-ghost btn-md" data-act="ligToggle" data-which="where" id="lig-alt-where" aria-expanded="${open ? 'true' : 'false'}" aria-controls="lig-where" aria-label="${open ? 'Pronto, fechar a lista de onde atende' : 'Alterar onde atende'}">${open ? 'Pronto' : 'Alterar'}</button>`}</div>
      ${allBusy ? h`<p><a class="link-btn" href="#t05-todos" data-act="ligConnect">Conectar seu WhatsApp ou outro canal ${icon('external', 'icon-sm')}<span class="sr-only"> (abre em nova aba)</span></a></p>` : ''}
      ${swapCh ? h`<p class="lig-confirm" id="lig-confirm">${icon('alert-triangle', 'icon-sm')}<span>${confirmTxt}</span></p>` : ''}
      ${open ? h`<div id="lig-where" class="stack gap-2">
        ${radios({ label: 'Onde atende', name: 'where', value: L.where, act: 'ligWhere', options: whereOptions(b) })}
        ${S.flags.l2 ? '' : h`<p class="lig-note">Canais que já têm um agente não aparecem aqui.</p>`}
      </div>` : ''}
    </div>`;
  }
  function whenSection(b, L) {
    const ch = channelById(L.where);
    const noHours = ch && !ch.hours;
    return h`<div class="lig-sec">
      <div class="lig-row"><div class="stack gap-1 grow"><p class="lbl">Quando atende</p><p class="lig-main">${WHEN_OPTION[L.when]}</p>
          ${whenSub(L.when, ch) ? h`<p class="lig-det">${whenSub(L.when, ch)}</p>` : ''}</div>
        <button type="button" class="btn btn-ghost btn-md" data-act="ligToggle" data-which="when" id="lig-alt-when" aria-expanded="${L.openWhen ? 'true' : 'false'}" aria-controls="lig-when" aria-label="${L.openWhen ? 'Pronto, fechar a lista de quando atende' : 'Alterar quando atende'}">${L.openWhen ? 'Pronto' : 'Alterar'}</button></div>
      ${L.openWhen ? h`<div id="lig-when" class="stack gap-2">
        ${radios({ label: 'Quando atende', name: 'when', value: L.when, act: 'ligWhen', options: ['sempre', 'dentro', 'fora'].map((k) => ({ value: k, title: WHEN_OPTION[k], sub: whenSub(k, ch), disabled: noHours && k !== 'sempre' })) })}
        ${noHours ? h`<p class="lig-hint">Este canal ainda não tem horário de atendimento. <a class="link-btn" href="#t05" data-act="ligHours">Definir horário ${icon('external', 'icon-sm')}<span class="sr-only"> (abre em nova aba)</span></a></p>` : ''}
      </div>` : ''}
    </div>`;
  }
  function ligErr(b, L) {
    if (!L.error) return '';
    if (L.error === 'patch') return errorCard({ title: 'Não deu para começar a atender.', sub: t('Nada mudou: {nome} ainda não está atendendo.', b), action: { label: 'Tentar de novo', act: 'ligGo', id: 'lig-retry' } });
    return '';
  }
  function ligBody() {
    const b = B();
    const L = S.ui.lig;
    return h`<div class="stack gap-4 ${L.busy ? 'is-locked-area' : ''}"${L.busy ? raw(' aria-busy="true"') : ''}>
      <div class="lig-review">${whereSection(b, L)}${whenSection(b, L)}</div>
      <div class="ag-note-box">${band('blue', h`<p>${t('Quando não souber, {nome} passa a conversa para a equipe. Quem recebe é definido em Atribuição.', b)}</p>
        <p><a href="#t05" data-act="ligAssign" class="link-btn">Escolher quem recebe ${icon('external', 'icon-sm')}<span class="sr-only"> (abre em nova aba)</span></a></p>`, 'users')}</div>
      ${ligErr(b, L)}
    </div>`;
  }
  function ligFoot() {
    const b = B();
    const L = S.ui.lig;
    const ch = channelById(L.where);
    const label = L.swap ? 'Trocar e começar a atender' : b.relink ? 'Voltar a atender' : 'Começar a atender';
    return h`${btn({ label, kind: 'cta', size: 'xl', block: true, act: 'ligGo', id: 'lig-go', loading: L.busy, loadingLabel: 'Começando…', disabled: !ch, describedBy: L.swap ? 'lig-confirm lig-go-sub' : 'lig-go-sub' })}
      <p class="cta-sub" id="lig-go-sub">${t(LIGAR_SUB, b)}</p>
      ${btn({ label: 'Voltar ao teste', kind: 'ghost', size: 'md', block: true, act: 'closeLayer', disabled: L.busy })}`;
  }

  on('ligOpen', () => {
    const ret = S.route;
    replaceHash('t05');
    openLigue({ ret });
  });
  on('ligToggle', (el) => {
    const L = S.ui.lig;
    if (el.dataset.which === 'where') L.openWhere = !L.openWhere; else L.openWhen = !L.openWhen;
    refreshLayer();
  });
  on('ligWhere', (el) => {
    const L = S.ui.lig;
    L.where = el.dataset.value;
    const ch = channelById(L.where);
    L.swap = ch && ch.busy && ch.busy.agent && !mine(ch) ? ch.id : null;
    if (ch && !ch.hours) L.when = 'sempre';
    refreshLayer();
    if (L.swap) announce(swapText(busyAgentName(ch), ch.name));
  });
  on('ligWhen', (el) => { S.ui.lig.when = el.dataset.value; refreshLayer(); });
  on('ligConnect', () => { toast('Abriria Canais numa nova aba.'); return false; });
  on('ligHours', () => { toast('Abriria o horário de atendimento numa nova aba.'); return false; });
  on('ligAssign', () => { toast('Abriria Atribuição numa nova aba.'); return false; });
  on('ligGo', () => {
    const L = S.ui.lig;
    if (!L || L.busy || !L.where) return;
    L.busy = true;
    L.error = null;
    refreshLayer();
    const fail = S.flags.failLigar && !S.ui.ligFailed;
    later(() => {
      L.busy = false;
      if (fail) {
        S.ui.ligFailed = true;
        L.error = 'patch';
        refreshLayer();
        const r = document.getElementById('lig-retry');
        if (r) r.focus();
        announce(t('Não deu para começar a atender. Nada mudou: {nome} ainda não está atendendo.', B()), true);
        return;
      }
      launch(L);
    }, ms(1300));
  });
  function launch(L) {
    const b = B();
    const ch = channelById(L.where);
    let swappedFrom = null;
    if (L.swap && ch.busy && ch.busy.agent) {
      const other = agentById(ch.busy.agent);
      if (other) {
        swappedFrom = other.name || 'Novo agente';
        other.channels = other.channels.filter((x) => x !== ch.id);
      }
    }
    b.channelId = ch.id;
    b.when = L.when;
    const a = upsertAgent(b, {
      status: 'on', channels: [ch.id], when: L.when, hasInstruction: true,
      week: { answered: 0, handed: 0 }, lastTest: b.lastTest || null,
    });
    ch.busy = { agent: a.id };
    b.launched = { channelId: ch.id, when: L.when, swappedFrom };
    closeAllLayers();
    go('t06');
  }

  /* =====================================================================
     T06 · Pronto
     ===================================================================== */
  function renderDone() {
    const b = B();
    const L = b.launched;
    const ch = channelById(L.channelId) || S.channels[0];
    const nome = nameOf(b);
    const mob = isMobile();
    const p1 = L.when === 'sempre'
      ? t('Quem mandar mensagem no {canal} agora fala com {nome}.', b, { canal: ch.name })
      : t(`{nome} responde no {canal} ${WHEN_LABEL[L.when]}.`, b, { canal: ch.name });
    const test = b.lastTest;
    const acts = h`${btn({ label: `Ver ${nome}`, kind: 'white', size: 'xl', act: 'doneSee', id: 'done-see', iconRight: 'arrow-right' })}
      <a class="hero-link" href="#t02" data-act="navAgents">Voltar para Agentes</a>`;
    return h`<div class="page w-4xl ${mob ? 'cr-page-m' : ''}">
      ${stepper(4)}
      <section class="hero cr-done" aria-labelledby="t06-h1">
        ${heroRings()}
        <div class="cr-done-grid ${test ? '' : 'one'}">
          <div class="stack gap-4 cr-done-txt">
            <span class="cr-done-check cr-done-pop" aria-hidden="true"><span class="cr-done-ring"></span>${icon('check')}</span>
            <h1 id="t06-h1">${t('{nome} já está atendendo no {canal}', b, { canal: ch.name })}</h1>
            <div class="stack gap-2">
              <p class="lead">${p1}</p>
              <p class="lead">${t('Quando não souber, {nome} passa a conversa para a equipe.', b)}</p>
              ${L.swappedFrom ? h`<p class="extra">${fmt('{outro} parou de responder no {canal}.', { outro: L.swappedFrom, canal: ch.name })}</p>` : ''}
            </div>
            ${mob ? '' : h`<div class="acts">${acts}</div>`}
          </div>
          ${test ? h`<div class="cr-done-phone">${phone({ size: mob ? 'xs' : 'sm', name: DATA.business, letter: DATA.business, status: `Atendido por ${nome}`, messages: [{ from: 'client', text: test.q, who: 'Cliente' }, { from: 'agent', text: test.a, who: nome }] })}</div>` : ''}
        </div>
      </section>
      ${mob ? h`<div class="cr-dock cr-done-dock">${acts}</div>` : ''}
    </div>`;
  }
  on('doneSee', () => {
    const b = B();
    if (b && b.agentId) S.agentId = b.agentId;
    go('t07');
  });
  function setupDone(variant) {
    return () => {
      const cur = B();
      if (cur && cur.launched && !variant) return;
      const b = demoBuilder('support', { tested: true });
      b.agentId = 'duda';
      const chId = variant === 'troca' ? 'wa-centro' : 'wa-jardins';
      b.channelId = chId;
      b.when = variant === 'horario' ? 'dentro' : 'sempre';
      b.launched = { channelId: chId, when: b.when, swappedFrom: variant === 'troca' ? 'Bia' : null };
      S.builder = b;
      if (!agentById('duda')) {
        upsertAgent(b, { status: 'on', channels: [chId], when: b.when, hasInstruction: true, week: { answered: 0, handed: 0 }, lastTest: b.lastTest });
      } else {
        S.agentId = 'duda';
      }
    };
  }

  /* =====================================================================
     ROTAS
     ===================================================================== */
  const page = { render: renderCreate, mount: mountCreate };
  function setupConte() {
    const b = B();
    if (!b || b.launched) S.builder = newModelBuilder('support');
    kick();
  }
  function setupConfira() {
    const b = B();
    if (b && !b.launched && isConfira(b)) { kick(); return; }
    if (b && !b.launched && b.continuing && b.hasInstruction) {
      const sc = scriptOf(b);
      ensureFields(b);
      b.closed = true;
      b.asked = sc.steps.length - 1;
      b.answers = Math.max(b.answers, sc.steps.length);
      if (!b.turns.length) {
        b.turns.push({ from: 'bot', text: 'Vamos continuar de onde paramos.' });
        b.turns.push({ from: 'bot', text: t(sc.close, b) });
      }
      kick();
      return;
    }
    S.builder = demoBuilder('support');
  }
  function setupTested() {
    const b = B();
    if (b && !b.launched && isConfira(b) && b.testAnswered) { kick(); return; }
    S.builder = demoBuilder('support', { tested: true });
  }

  route('t03', { title: 'Criar · Conte', setup: setupConte, ...page });
  route('t03-fechada', { title: 'Criar · conversa fechada', setup() { S.builder = demoBuilder('support'); }, ...page });
  route('t03-erro', {
    title: 'Criar · Construtor indisponível',
    setup() { S.flags.builderFail = true; S.builder = newModelBuilder('support'); kick(); },
    ...page,
  });
  route('t04', { title: 'Criar · Confira', setup: setupConfira, ...page });
  route('t04-respondida', { title: 'Criar · Confira respondida', setup() { S.builder = demoBuilder('support', { tested: true }); }, ...page });
  /* 422: ainda não sabe o suficiente (Testar agora com só 2 respostas) */
  route('t04-incompleto', {
    title: 'Criar · teste incompleto',
    setup() {
      S.flags.testIncomplete = true;
      S.ui.incShown = true;
      const b = newModelBuilder('support');
      const sc = scriptOf(b);
      b.turns.push({ from: 'owner', text: b.firstMessage });
      [[0, 'Loja de roupas'], [1, 'Horário e endereço']].forEach(([i, ans]) => {
        b.turns.push({ from: 'bot', text: sc.steps[i].ask, step: i });
        b.turns.push({ from: 'owner', text: ans });
        b.picked[sc.steps[i].key] = ans;
      });
      b.asked = 1;
      b.answers = 2;
      b.agentId = 'ag-' + uid();
      b.forced = true;
      b.lastQ = 'Vocês abrem no sábado?';
      b.test = [{ from: 'client', text: b.lastQ }, { kind: 'incomplete' }];
      S.builder = b;
    },
    ...page,
  });
  /* demora (TTL): "Está demorando. Tente de novo." */
  route('t04-demora', {
    title: 'Criar · teste demorando',
    setup() {
      S.flags.testSlow = true;
      S.ui.slowShown = true;
      const b = demoBuilder('support');
      b.lastQ = 'Vocês abrem no sábado?';
      b.test = [{ from: 'client', text: b.lastQ }, { kind: 'slow' }];
      S.builder = b;
    },
    ...page,
  });
  route('t04-falha', {
    title: 'Criar · falha ao testar',
    setup() {
      S.flags.failTest = true;
      S.ui.testFailed = true;
      const b = demoBuilder('support');
      b.lastQ = 'Vocês abrem no sábado?';
      b.test = [{ from: 'client', text: b.lastQ }, { kind: 'error' }];
      S.builder = b;
    },
    ...page,
  });
  route('t05', { title: 'Criar · Comece', base: 't04-respondida', setup: setupTested, open() { openLigue({ ret: 't04-respondida' }); } });
  route('t05-ocupado', { title: 'Comece · canal ocupado, com troca', base: 't04-respondida', setup: setupTested, open() { openLigue({ ret: 't04-respondida', expandWhere: true }); } });
  route('t05-troca', { title: 'Comece · trocar o agente de um canal', base: 't04-respondida', setup: setupTested, open() { openLigue({ ret: 't04-respondida', expandWhere: true, swapTo: 'wa-centro' }); } });
  route('t05-todos', { title: 'Comece · todos os canais ocupados', base: 't04-respondida', setup() { S.flags.allBusy = true; setupTested(); }, open() { openLigue({ ret: 't04-respondida' }); } });
  route('t05-falha', { title: 'Comece · falha ao começar a atender', base: 't04-respondida', setup() { S.flags.failLigar = true; setupTested(); }, open() { openLigue({ ret: 't04-respondida' }); } });
  route('t05-semcanal', { title: 'Comece · nenhum canal conectado', setup() { S.flags.noChannel = true; setupTested(); }, ...page });
  route('t06', { title: 'Pronto · agente atendendo', setup: setupDone(null), render: renderDone });
  route('t06-horario', { title: 'Pronto · atendendo só no horário', setup: setupDone('horario'), render: renderDone });
  route('t06-troca', { title: 'Pronto · atendendo no lugar de outro', setup: setupDone('troca'), render: renderDone });
})();

/* ===== screens-agent.js ===== */
/* =====================================================================
   screens-agent.js · T07 página do agente · gavetas T08 Testar, T09 O que
   sabe, T10 Onde e quando, T12 Foto e nome, T13 Jeitos anteriores de
   responder, a gaveta dos
   números da semana · T11 Mudar conversando (página própria)
   Rotas: #t07 #t07-parado #t07-semcanal #t07-manual #t07-semnumeros
          #t07-semconversas #t07-carregando #t07-erro #t07-naoexiste
          #t07-conversas
          #t08 #t08-falha · #t09 #t09-vazio #t09-falha
          #t10 #t10-ocupado #t10-parado #t10-semcanal #t10-semleitura #t10-erro
          #t11 #t11-jeito #t11-passa #t11-teste #t11-nome #t11-erro
          #t12 #t12-erro · #t13 #t13-vazio #t13-erro
   Gaveta aberta por clique na página troca o hash no lugar (replaceHash),
   para a faixa do protótipo acompanhar, e devolve o hash ao fechar.
   Parar de atender, voltar a atender, escrever com suas palavras e excluir
   usam window.AgentesExtra
   (screens-extra.js).
   ===================================================================== */
(() => {
  const WORK_MS = 1000;
  const READ_MS = 4000;
  const MAX_SOURCES = 30;
  const MAX_FILE = 25 * 1024 * 1024;
  const MAX_PHOTO = 5 * 1024 * 1024;
  const WEEK_LIMIT = 50;
  const ATTRIB = 'Quem recebe é definido em Atribuição.';
  const MONTHS = ['jan.', 'fev.', 'mar.', 'abr.', 'maio', 'jun.', 'jul.', 'ago.', 'set.', 'out.', 'nov.', 'dez.'];

  /* ---------- agente da vez ---------- */
  const A = () => curAgent();
  const nm = (a) => (a && a.name) || 'Novo agente';
  const manage = () => S.role === 'manage';
  const isManual = (a) => a.mode === 'manual' || !!S.flags.manual;
  const whenOf = (a) => a.when || 'sempre';
  const chansOf = (a) => (S.flags.noChannel ? [] : a.channels.map(channelById).filter(Boolean));
  const lowerFirst = (s) => (s ? s.charAt(0).toLowerCase() + s.slice(1) : '');
  const firstLive = () => agentById('bia') || S.agents.find((a) => a.status !== 'draft') || S.agents[0];
  /* Mantém o agente aberto quando se vem de um fluxo (lista, começar a atender, gavetas).
     Vindo de outra variante ou do mapa, volta para o agente padrão (Bia). */
  const FLOW = ['t02', 't05', 't06', 't07', 't08', 't09', 't10', 't11', 't12', 't13', 't14', 't15', 't16'];
  function pickAgent(ctx) {
    const prev = (ctx && ctx.prev) || '';
    // vindo de um fluxo (lista, criação, começar a atender, gavetas, inclusive variantes como t06-horario): mantém o agente aberto
    const keep = FLOW.includes(prev.split('-')[0]);
    const cur = agentById(S.agentId);
    if (!keep || !cur || cur.status === 'draft') {
      const a = firstLive();
      if (a) S.agentId = a.id;
    }
  }
  function useAgent(id) { if (agentById(id)) S.agentId = id; }
  function offAgent() { return S.agents.find((a) => a.status === 'off') || agentById('leo'); }
  // variantes de estado precisam de um agente que mostre o que o estado muda (atendendo; com conversas quando o estado é sobre números)
  function liveAgent(needWeek) {
    const cur = A();
    const ok = (x) => x && x.status === 'on' && (!needWeek || (x.week && x.week.answered));
    if (ok(cur)) return;
    const pick = S.agents.find(ok);
    if (pick) useAgent(pick.id);
  }

  const extra = () => window.AgentesExtra;
  function callExtra(fn, a, opener) {
    const x = extra();
    if (x && x[fn]) { x[fn](a.id, opener); return; }
    toast('Esta parte do protótipo ainda não foi montada.');
  }

  /* foto: avatar com imagem quando houver */
  function agAvatar(a, size = '') {
    if (a.photo) return h`<span class="avatar ${size} ag-photo" aria-hidden="true"><img src="${a.photo}" alt=""></span>`;
    return avatar(a, size);
  }
  const attribLink = (cls = 'link-btn') => h`<a class="${cls}" href="#" data-act="agNewTab" data-what="Atribuição" target="_blank" rel="noopener">Escolher quem recebe ${icon('external', 'icon-sm')}<span class="sr-only"> (abre em nova aba)</span></a>`;
  on('agNewTab', (el) => { toast(`Abriria ${el.dataset.what} numa nova aba.`); return false; });

  /* ---------- camada aberta pela página: hash acompanha ---------- */
  const FALLBACK = { 't07-conversas': '#ag-kpi-answered', t08: '#ag-ask-in', t09: '#ag-b-know-act', t10: '#ag-b-where-act', t12: '#ag-more', t13: '#ag-more' };
  function layerOpts(id, fromRoute, extraClose) {
    const act = document.activeElement;
    const rf = !fromRoute && act && act.id ? '#' + act.id : undefined;
    const back = S.route;
    if (!fromRoute) replaceHash(id);
    return {
      returnFocus: rf,
      fallbackFocus: FALLBACK[id.split('-')[0] === 't07' ? id : id.split('-')[0]] || '#ag-h1',
      onClose: () => {
        if (!fromRoute && S.route === id) replaceHash(back);
        if (extraClose) extraClose();
        render();
      },
    };
  }
  function topKind() { const t = LAYERS[LAYERS.length - 1]; return t && t.o && t.o.agKind; }
  function refreshKind(kind) { if (topKind() === kind) refreshLayer(); }
  function focusInLayer(sel) {
    const t = LAYERS[LAYERS.length - 1];
    const el = t && t.el.querySelector(sel);
    if (el) el.focus();
  }
  function pickFile(accept, cb) {
    const inp = document.createElement('input');
    inp.type = 'file';
    if (accept) inp.accept = accept;
    inp.addEventListener('change', () => { if (inp.files && inp.files[0]) cb(inp.files[0]); });
    inp.click();
  }
  function nowLabel() {
    const d = new Date();
    return { date: `${d.getDate()} de ${MONTHS[d.getMonth()]}`, time: `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` };
  }

  /* =====================================================================
     T07 · página do agente
     ===================================================================== */
  function heroT07(a) {
    const nome = nm(a);
    const on = a.status === 'on';
    const ch = chansOf(a);
    const man = manage();
    const manual = isManual(a);
    // parado não "responde": a linha só diz onde está (a faixa âmbar diz o estado)
    const where = !ch.length ? 'Ainda não está em nenhum canal.'
      : on ? `Responde no ${ch[0].name} · ${WHEN_LABEL[whenOf(a)]}` : `No ${ch[0].name} · ${WHEN_LABEL[whenOf(a)]}`;
    const mainAct = manual
      ? h`${btn({ label: 'Editar instruções', kind: 'white', size: 'lg', icon: 'pencil', act: 'agWrite', id: 'ag-edit' })}<p class="ag-sub">Você escreve o que ${nome} faz.</p>`
      : btn({ label: 'Mudar conversando', kind: 'white', size: 'lg', icon: 'chat', act: 'agChange', data: { source: 'geral' }, id: 'ag-change' });
    return h`<section class="hero ag-hero" aria-labelledby="ag-h1">
      ${heroRings()}
      ${backLink('#t02', 'Voltar para Agentes')}
      <div class="ag-hero-grid">
        <div class="ag-id">${agAvatar(a, 'lg')}
          <div class="stack gap-2 grow">
            <div class="row gap-3 wrap"><h1 id="ag-h1">${nome}</h1>${man ? '' : (on ? pill('on', 'Atendendo') : pill('off', 'Parado'))}</div>
            <p class="ag-where">${where}</p>
          </div>
        </div>
        ${man ? h`<div class="ag-switch">${switchCtl({ on, id: 'ag-switch', act: 'agSwitch', aria: `${nome} atendendo os clientes` })}</div>` : ''}
        ${man ? h`<div class="ag-main-act">${mainAct}</div>` : ''}
        <button type="button" class="btn btn-ghost-navy btn-md ag-more" id="ag-more" data-act="agMore" aria-haspopup="menu" aria-expanded="false">${icon('more')}<span>Mais opções</span></button>
      </div>
    </section>`;
  }

  function kpiT07(a) {
    if (!S.flags.l1 || !a.week) return '';
    const n = S.flags.zeroWeek ? 0 : a.week.answered;
    const m = S.flags.zeroWeek ? 0 : a.week.handed;
    const nome = nm(a);
    if (!n && !m) {
      return h`<section class="card ag-kpi-empty" aria-label="Números desta semana">${icon('clock')}<p>Ainda sem conversas esta semana. Os números aparecem aqui assim que ${nome} responder alguém.</p></section>`;
    }
    const act = manage() ? 'agWeek' : undefined;
    return kpiStrip([
      { num: n.toLocaleString('pt-BR'), label: 'conversas respondidas', note: `Esta semana, ${nome} respondeu ${n.toLocaleString('pt-BR')} conversas e passou ${m} para a equipe.`, act, data: { tab: 'answered' }, id: 'ag-kpi-answered' },
      { num: m.toLocaleString('pt-BR'), label: 'passadas para a equipe', note: 'Quando não soube responder.', act, data: { tab: 'handed' }, id: 'ag-kpi-handed' },
    ]);
  }

  function agBlock(o) {
    return h`<section class="review-card ag-block" id="${o.id}" aria-labelledby="${o.id}-t">
      <div class="head">
        <div class="ag-block-title grow"><span class="ag-block-ic">${icon(o.icon)}</span>
          <div class="stack gap-1 grow"><h2 id="${o.id}-t">${o.title}</h2>${o.text ? h`<p class="muted">${o.text}</p>` : ''}</div></div>
        ${o.action ? btn({ kind: 'secondary', size: 'md', id: `${o.id}-act`, ...o.action }) : ''}
      </div>
      ${o.body ? h`<div class="ag-block-body">${o.body}</div>` : ''}
    </section>`;
  }

  /* linha do cartão-resumo (padrão StepReview: rótulo, valor e "Alterar" à direita) */
  function sumRow(o) {
    return h`<div class="ag-row" id="${o.id}" role="group" aria-labelledby="${o.id}-t">
      <span class="ag-row-ic" aria-hidden="true">${icon(o.icon)}</span>
      <div class="stack gap-1 grow"><h3 class="lbl" id="${o.id}-t">${o.title}</h3><p class="main">${o.text}</p>${o.body || ''}</div>
      ${o.action ? btn({ kind: o.action.kind || 'ghost', size: 'md', id: `${o.id}-act`, ...o.action }) : ''}
    </div>`;
  }
  function blocksT07(a) {
    const nome = nm(a);
    const man = manage();
    const manual = isManual(a);
    const ch = chansOf(a);
    const nSrc = srcs(a).length;
    const nSug = man ? sugsOf(a).length : 0;
    const test = agBlock({
      id: 'ag-b-test', icon: 'flask', title: 'Testar', text: 'Pergunte como se fosse seu cliente.',
      body: h`<form class="ag-ask" data-submit="agAsk">
        <label class="sr-only" for="ag-ask-in">Pergunte algo para ${nome}</label>
        <input class="input" id="ag-ask-in" name="q" autocomplete="off" placeholder="Pergunte algo para ${nome}">
        ${btn({ label: 'Enviar', kind: 'outline', size: 'lg', type: 'submit', id: 'ag-ask-send' })}
      </form>`,
    });
    const know = sumRow({
      id: 'ag-b-know', icon: 'book', title: 'O que sabe', text: a.summary || `${nome} sabe o que você contou na conversa.`,
      action: man ? { label: 'Alterar', act: 'agKnow', aria: 'Alterar o que sabe' } : { label: 'Ver', act: 'agKnow', aria: 'Ver o que sabe' },
      body: h`<p class="ag-meta">${icon(nSrc ? 'file' : 'chat', 'icon-sm')}${nSrc ? plural(nSrc, '', '1 arquivo ou site', '{n} arquivos e sites') : 'Só o que você contou na conversa'}</p>
        ${nSug ? h`<p class="ag-flag">${icon('info', 'icon-sm')}${plural(nSug, '', 'Há 1 pergunta de cliente para conferir.', 'Há {n} perguntas de clientes para conferir.')}</p>` : ''}`,
    });
    const where = ch.length
      ? sumRow({ id: 'ag-b-where', icon: 'pin', title: 'Onde e quando responde', text: `No ${ch[0].name}, ${WHEN_LABEL[whenOf(a)]}.`, action: man ? { label: 'Alterar', act: 'agWhere', aria: 'Alterar onde e quando responde' } : null })
      : sumRow({ id: 'ag-b-where', icon: 'pin', title: 'Onde e quando responde', text: 'Ainda não está em nenhum canal.', action: man ? { label: 'Escolher canal', act: 'agTurnOn', kind: 'outline' } : null });
    const style = sumRow({
      id: 'ag-b-style', icon: 'smile', title: 'Nome e jeito de falar',
      text: `Chama-se ${nome}. Para ouvir como fala, faça um teste.`,
      action: man ? (manual ? { label: 'Editar instruções', act: 'agWrite' } : { label: 'Alterar', act: 'agChange', data: { source: 'jeito' }, aria: 'Alterar nome e jeito de falar' }) : null,
      body: manual ? h`<p class="ag-meta">${icon('pencil', 'icon-sm')}Para mudar o jeito de falar, edite as instruções.</p>` : '',
    });
    const summary = h`<section class="review-card ag-summary" aria-label="Resumo de ${nome}">${know}${where}${style}</section>`;
    const handoff = agBlock({
      id: 'ag-b-handoff', icon: 'users', title: 'Quando passa para a equipe',
      text: `Quando não souber, ${nome} passa a conversa para a equipe. ${ATTRIB}`,
      body: h`<div class="ag-handoff">${attribLink()}
        ${man ? h`<p class="muted small">${manual ? `Para mudar quando ${nome} passa, use Editar instruções.` : `Para mudar quando ${nome} passa, use Mudar conversando.`}</p>` : ''}
      </div>`,
    });
    return h`<div class="ag-blocks">${test}${summary}${handoff}</div>`;
  }

  function loadingT07() {
    return h`<div class="page w-880" aria-busy="true"><h1 class="sr-only">Página do agente</h1><p class="sr-only" role="status">Carregando o agente</p>
      <section class="hero ag-hero" aria-hidden="true">${heroRings()}
        <div class="row gap-4">${skeleton('64px', '64px')}<div class="stack gap-2 grow">${skeleton('38%', '30px')}${skeleton('62%', '16px')}</div></div>
      </section>
      <div class="ag-blocks" aria-hidden="true">${[0, 1, 2, 3, 4].map(() => h`<div class="ag-skel-block">${skeleton('30%', '18px')}${skeleton('72%', '14px')}</div>`)}</div>
    </div>`;
  }

  function renderT07() {
    const f = S.flags;
    if (f.loading) return loadingT07();
    const a = A();
    if (f.notFound || !a) {
      return h`<div class="page w-880"><h1 class="page-title">Agentes</h1>
        ${errorCard({ tone: 'amber', title: 'Este agente não existe mais.', action: { label: 'Voltar para Agentes', act: 'navAgents', icon: 'arrow-left' } })}</div>`;
    }
    const nome = nm(a);
    if (f.error) {
      return h`<div class="page w-880">${backLink('#t02', 'Voltar para Agentes')}<h1 class="page-title">${nome}</h1>
        ${errorCard({ title: `Não deu para abrir ${nome} agora.`, sub: 'Nada foi mudado.', action: { label: 'Tentar de novo', act: 'agRetryPage' } })}</div>`;
    }
    const man = manage();
    return h`<div class="page w-880 ag-page">
      ${heroT07(a)}
      ${a.status !== 'on' ? band('amber', h`<p class="ag-band-txt">${nome} não está respondendo ninguém agora.</p>`) : ''}
      ${man ? '' : band('blue', h`<p>Você pode ver e testar. Quem administra a conta decide quando atender e o que mudar.</p>`, 'lock')}
      ${kpiT07(a)}
      ${blocksT07(a)}
    </div>`;
  }

  on('agRetryPage', () => {
    S.flags.error = false;
    S.flags.loading = true;
    render();
    later(() => { S.flags.loading = false; replaceHash('t07'); render(); }, 900);
  });
  on('agSwitch', () => {
    const a = A();
    if (a.status === 'on') callExtra('pararDeAtender', a, '#ag-switch');
    else turnOn(a);
  });
  function turnOn(a) {
    const x = extra();
    if (x && x.voltarAAtender) { x.voltarAAtender(a.id); return; }
    toast('Esta parte do protótipo ainda não foi montada.');
  }
  on('agTurnOn', () => { turnOn(A()); });
  on('agWrite', (el) => { callExtra('escrever', A(), el.id ? '#' + el.id : '#ag-more'); });
  on('agChange', (el) => { startT11(el.dataset.source || 'geral'); });
  on('agMore', (el) => {
    const a = A();
    if (!manage()) {
      openMenu(el, [{ label: 'Jeitos anteriores de responder', icon: 'history', onClick: () => openVersions(false) }]);
      return;
    }
    openMenu(el, [
      { label: 'Foto e nome', icon: 'image', onClick: () => openPhoto(false) },
      { label: 'Jeitos anteriores de responder', icon: 'history', onClick: () => openVersions(false) },
      { label: isManual(a) ? 'Editar instruções' : 'Escrever as instruções com suas palavras', icon: 'pencil', onClick: () => callExtra('escrever', a, '#ag-more') },
      { sep: true },
      { label: 'Excluir agente', icon: 'trash', danger: true, onClick: () => callExtra('excluir', a, '#ag-more') },
    ]);
  });
  on('agAsk', (form) => {
    const inp = form.querySelector('input');
    const q = inp.value.trim();
    if (!q) { inp.focus(); return; }
    inp.value = '';
    openTest(false, q);
  });
  on('agKnow', () => openKnow(false));
  on('agWhere', () => openWhere(false));
  on('agWeek', (el) => openWeek(false, el.dataset.tab));

  route('t07', { title: 'Página do agente', setup: pickAgent, render: renderT07 });
  const variant = (id, title, fn) => route(id, { title: `Página do agente · ${title}`, setup(ctx) { pickAgent(ctx); fn(); }, render: renderT07 });
  variant('t07-parado', 'parado', () => { const a = offAgent(); if (a) useAgent(a.id); });
  variant('t07-semcanal', 'sem canal', () => { const a = offAgent(); if (a) useAgent(a.id); S.flags.noChannel = true; });
  variant('t07-manual', 'escrito à mão', () => { liveAgent(false); S.flags.manual = true; });
  variant('t07-semnumeros', 'sem os números', () => { liveAgent(true); S.flags.l1 = false; });
  variant('t07-semconversas', 'sem conversas na semana', () => { liveAgent(true); S.flags.zeroWeek = true; });
  variant('t07-carregando', 'carregando', () => { S.flags.loading = true; });
  variant('t07-erro', 'erro ao abrir', () => { S.flags.error = true; });
  variant('t07-naoexiste', 'não existe mais', () => { S.flags.notFound = true; });

  /* ---------- gaveta dos números: Conversas desta semana ---------- */
  const FILL = ['Beatriz Lima', 'Gustavo Rocha', 'Camila Duarte', 'Thiago Nunes', 'Larissa Melo', 'Bruno Faria', 'Renata Dias', 'Felipe Gomes', 'Aline Barros', 'Marcos Vieira', 'Sofia Ramos', 'Vítor Campos'];
  const DAYS = ['Seg.', 'Dom.', 'Sáb.', 'Sex.'];
  function weekRows(a, tab) {
    const total = tab === 'handed' ? a.week.handed : a.week.answered;
    const given = ((DATA.week[a.id] || {})[tab]) || [];
    const n = Math.min(total, WEEK_LIMIT);
    const rows = given.slice(0, n);
    for (let i = rows.length; i < n; i += 1) {
      const day = DAYS[Math.min(DAYS.length - 1, Math.floor(i / 14))];
      rows.push({ contact: FILL[i % FILL.length], when: `${day}, ${String(18 - (i % 10)).padStart(2, '0')}:${String((i * 17) % 60).padStart(2, '0')}` });
    }
    return { rows, total };
  }
  function weekBody(a) {
    const tab = S.ui.weekTab || 'answered';
    const { rows, total } = weekRows(a, tab);

  function testOf(a) {

      else if (m.from === 'incomplete') msgs.push(h`<div class="ag-phone-err">${errorCard({ tone: 'amber', title: `${nome} ainda não sabe o suficiente. Use Mudar conversando.` })}</div>`);

        }
      }
    });
    const foot = h`${chips(modelOf(a.model).testChips, 'agTestChip', { cls: 'phone-chips', data: { ctx }, disabled: T.busy, idPrefix: `agch-${ctx}` })}

      name: DATA.business, letter: DATA.business, status: T.busy ? `${nome} está escrevendo…` : `Atendido por ${nome}`, bodyId: `agpb-${ctx}`,
      size: ctx === 'p' ? '' : 'fit',

  function scrollPhones(root) {

  function testSend(a, q, ctx) {
    const T = testOf(a);
    const text = (q || '').trim();
    if (T.busy || !text) return;
    T.updated = false;
    T.msgs.push({ from: 'client', text });
    T.msgs.push({ from: 'typing' });
    T.busy = true;
    repaint(ctx);
    const fail = S.flags.testFail && !S.ui.testFailedOnce;
    const slow = S.flags.testSlow && !S.ui.testSlowOnce;
    const inc = S.flags.testIncomplete && !S.ui.testIncOnce;
    later(() => {
      T.msgs = T.msgs.filter((m) => m.from !== 'typing');
      if (fail || slow || inc) {
        if (fail) S.ui.testFailedOnce = true;
        if (slow) S.ui.testSlowOnce = true;
        if (inc) S.ui.testIncOnce = true;
        T.busy = false;
        T.msgs.push({ from: fail ? 'err' : slow ? 'slow' : 'incomplete', q: text });
        repaint(ctx);
        if (!inc) focusInLayer(`#agr-${ctx}`);

        if (i < r.chunks.length - 1) T.msgs.push({ from: 'typing' });

      }, () => {
        T.msgs.push({ from: 'meta', used: r.used, handoff: r.handoff, q: text, a: r.chunks.join(' ') });
        T.busy = false;
        repaint(ctx);
        announce(`${nm(a)} respondeu: ${r.chunks.join(' ')}${r.handoff ? ` Aqui ${nm(a)} passaria a conversa para a equipe.` : ''}`);
      }, 800);
    }, reducedMotion() ? 150 : 900);
