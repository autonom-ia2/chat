  - pergunta: "aceita cachorro grande?"
    tipo: parafrase
    esperado: "Só até 15 kg, e apenas nos Chalés 1 a 6. Cão de assistência é exceção: aceito de qualquer peso."
    ancoras: ["aceita apenas cães e gatos de até 15 kg"]
  - pergunta: "meu amigo pode vir dar um mergulho na piscina comigo?"
    tipo: parafrase
    esperado: "Não. Visitantes não podem usar a piscina nem entrar nos quartos; ficam só na varanda do salão, entre 9h e 18h."
    ancoras: ["Visitantes não podem entrar nos quartos nem usar a piscina"]
  - pergunta: "se eu quiser ficar mais um pouco no quarto no dia da saida, dá?"
    tipo: parafrase
    esperado: "Há tolerância até as 12h30. Depois disso, a saída tardia, pedida na véspera, vai até as 15h por 30% da diária; depois das 15h cobra-se diária inteira."
    ancoras: ["saída tardia custa 30% do valor da diária"]
  - pergunta: "criança pequena paga hospedagem?"
    tipo: parafrase
    esperado: "Até 5 anos completos não paga, se ocupar a cama dos pais ou o berço e o quarto não passar da capacidade."
    ancoras: ["Crianças de até 5 anos completos não pagam hospedagem"]
  - pergunta: "cancelei 10 dias antes do check in, quanto devolvem?"
    tipo: secao_longa
    esperado: "Na baixa temporada, cancelamento de 14 a 7 dias antes devolve 70% do valor pago."
    ancoras: ["14 a 7 dias antes do check-in, a pousada devolve 70% do valor pago"]
  - pergunta: "vou em janeiro (alta temporada) e cancelei com 20 dias, tem reembolso?"
    tipo: secao_longa
    esperado: "Sim, 50%: na alta temporada, de 29 a 15 dias de antecedência devolve-se 50% do valor pago."
    ancoras: ["de 29 a 15 dias de antecedência, a 50% do valor pago"]
  - pergunta: "tenho um cão guia, aceitam? tem taxa?"
    tipo: secao_longa
    esperado: "Aceitam. Cães de assistência não pagam a taxa de animal, qualquer peso, em qualquer acomodação e em todas as áreas, inclusive café e piscina, com identificação e vacinação em dia."
    ancoras: ["são aceitos sem a taxa de animal, qualquer que seja o"]
