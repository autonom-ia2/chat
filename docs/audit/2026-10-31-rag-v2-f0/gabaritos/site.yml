    tipo: valor
    esperado: "R$ 289,00 com óleo sintético 5W30 em até 4 litros e filtro de óleo novo."
    ancoras: ["Troca de óleo sintético 5W30 em até 4 litros"]
  - pergunta: "qnto custa o alinhamento?"
    tipo: valor
    esperado: "R$ 90,00. O combo com balanceamento das 4 rodas sai por R$ 150,00."
    ancoras: ["Alinhamento de direção: R$ 90,00."]
  - pergunta: "o scanner é quanto?"
    tipo: valor
    esperado: "O diagnóstico com scanner custa R$ 110,00, valor abatido do serviço se você aprovar o conserto no mesmo dia."
    ancoras: ["O diagnóstico com scanner custa R$ 110,00"]
