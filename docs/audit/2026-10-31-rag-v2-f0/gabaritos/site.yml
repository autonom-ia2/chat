perguntas:
  - pergunta: "vcs abrem sabado?"
    tipo: fato_simples
    esperado: "Abrimos, das 8h às 13h."
    ancoras: ["Sábado: das 8h às 13h."]
  - pergunta: "tem estacionamento aí?"
    tipo: fato_simples
    esperado: "Tem, 6 vagas gratuitas na frente da oficina para quem aguarda o serviço."
    ancoras: ["temos 6 vagas gratuitas na frente da oficina"]
  - pergunta: "aceita cheque?"
    tipo: fato_simples
    esperado: "Não. Aceitamos Pix, dinheiro, débito e crédito."
    ancoras: ["Não aceitamos cheque."]
  - pergunta: "vcs cobram pra fazer orçamento?"
    tipo: fato_simples
    esperado: "Não, o orçamento é gratuito e vale por 7 dias."
    ancoras: ["O orçamento é gratuito e vale por 7 dias"]
  - pergunta: "atendem caminhão tb?"
    tipo: fato_simples
    esperado: "Não. Atendemos veículos leves e utilitários de até 3,5 toneladas; caminhões e veículos pesados não."
    ancoras: ["Caminhões e veículos pesados não são atendidos"]
  - pergunta: "tem leva e traz?"
    tipo: fato_simples
    esperado: "Tem, de graça, em até 5 km da oficina, de segunda a sexta, com agendamento de 1 dia de antecedência."
    ancoras: ["gratuitamente, em até 5 km da oficina, de segunda a sexta-feira"]
  - pergunta: "fecha na hora do almoço?"
    tipo: fato_simples
    esperado: "Sim, de segunda a sexta há pausa para almoço das 12h às 13h30."
    ancoras: ["com pausa para almoço das 12h às 13h30"]
  - pergunta: "vcs mexem em carro da ford?"
    tipo: fato_simples
    esperado: "Sim, Ford está entre as marcas atendidas."
    ancoras: ["Chevrolet, Volkswagen, Fiat, Ford, Hyundai, Toyota"]
