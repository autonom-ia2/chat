    tipo: parafrase
    esperado: "Pode ser desbalanceamento das rodas ou desgaste de peças da suspensão; vale passar para avaliação."
    ancoras: ["pode ser desbalanceamento das rodas ou desgaste de peças da suspensão"]
  - pergunta: "trabalho de uber, vcs tem algum desconto?"
    tipo: parafrase
    esperado: "Motoristas de aplicativo têm 10% de desconto na mão de obra, de segunda a quinta, com comprovação do cadastro."
    ancoras: ["Motoristas de aplicativo têm 10% de desconto na mão de obra"]
  - pergunta: "se eu levar a peça de fora a garantia vale?"
    tipo: parafrase
    esperado: "Só para a mão de obra; a peça trazida de fora fica sem a garantia da oficina."
    ancoras: ["a garantia de 90 dias vale somente para o serviço"]
  - pergunta: "acendeu a luz da injeção, posso continuar andando?"
    tipo: parafrase
    esperado: "Se a luz estiver fixa e o carro normal, dá para ir até a oficina com cuidado. Se estiver piscando, pare e chame, porque pode danificar o catalisador."
    ancoras: ["Se estiver piscando, o motor falha e pode danificar o catalisador"]
