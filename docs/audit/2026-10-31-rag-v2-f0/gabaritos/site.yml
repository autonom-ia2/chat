    tipo: parafrase
    esperado: "Seguem o plano de manutenção do manual e entregam relatório e nota fiscal, que são os comprovantes para a garantia de fábrica."
    ancoras: ["Seguimos o plano de manutenção do manual, com peças e fluidos"]
