    tipo: secao_longa
    esperado: "Leva o dia inteiro, com o carro na oficina das 8h até o fim da tarde, e por isso precisa de agendamento."
    ancoras: ["levam o dia inteiro, e o carro fica conosco das 8h até o fim da tarde"]
