- pergunta: como faço pra cancelar? preciso pagar multa?
  tipo: secao_longa
  esperado: Precisa avisar por escrito na secretaria com 30 dias de antecedência; as mensalidades seguem nesse período, mas não há multa de rescisão. Nos primeiros 7 dias após assinar dá para desistir e
    receber de volta (exceto matrícula e material retirado).
  ancoras:
  - o cancelamento exige aviso por escrito entregue na secretaria
  - A CONTRATADA não cobra multa de rescisão
  - Nos primeiros 7 dias corridos depois da assinatura
- pergunta: eu e minha irma pagando em dia ganha os 15 e mais os 10?
  tipo: secao_longa
  esperado: Não. O desconto de 15% de irmãos não se acumula com o de pontualidade de 10%; vale só o maior, o de 15%.
  ancoras:
  - não se acumula com o de pontualidade de 10%
  - aplica-se apenas o maior, ou seja, o de 15%
- pergunta: e se a turma nao fechar o minimo de gente?
  tipo: secao_longa
  esperado: A escola avisa com 15 dias de antecedência e oferece outro horário ou a devolução integral do que foi pago, inclusive a matrícula. A turma só abre com 6 alunos.
  ancoras:
  - A turma só abre com pelo menos 6 alunos matriculados
  - oferece outro horário ou a devolução integral do que foi pago
