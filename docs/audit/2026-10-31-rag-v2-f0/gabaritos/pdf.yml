perguntas:
  - pergunta: "O seguro vale se eu viajar de carro pra Argentina?"
    tipo: fato_simples
    esperado: "Sim. A cobertura vale no Brasil e também na Argentina, no Uruguai e no Paraguai."
    ancoras: ["território brasileiro e nos países Argentina"]
  - pergunta: "Se o carro pegar fogo eu pago franquia?"
    tipo: fato_simples
    esperado: "Não. A franquia não se aplica em sinistro de incêndio (nem raio, explosão acidental ou indenização integral)."
    ancoras: ["explosão acidental, incêndio e indenização integral do veículo"]
  - pergunta: "Bati o carro agora, pra qual número eu ligo pra avisar?"
    tipo: fato_simples
    esperado: "Avisar a seguradora imediatamente: 3003-0335 em São Paulo e Rio de Janeiro, 0800-784-2410 nas demais regiões."
    ancoras: ["São Paulo e Rio de Janeiro 3003-0335"]
  - pergunta: "Depois que eu mando tudo, em quanto tempo vocês pagam a indenização?"
    tipo: valor
    esperado: "A seguradora tem até 30 dias para pagar a indenização, contados da entrega dos documentos."
    ancoras: ["30 (trinta) dias para pagar a indenização"]
  - pergunta: "Posso fazer um acordo direto com o outro motorista depois da batida?"
    tipo: fato_simples
    esperado: "Não. O segurado não pode fazer acordo com os envolvidos sem autorização da seguradora."
    ancoras: ["NÃO FAZER NENHUM ACORDO COM OS DEMAIS ENVOLVIDOS"]
  - pergunta: "Se eu parcelar o seguro vou pagar alguma taxa a mais?"
    tipo: parafrase
    esperado: "Não há cobrança de custo administrativo de fracionamento no parcelamento (se houver juros, pode antecipar parcelas com redução proporcional)."
    ancoras: ["custo administrativo de fracionamento"]
  - pergunta: "O boleto vence num domingo, posso pagar na segunda?"
    tipo: parafrase
    esperado: "Sim. Se o vencimento cair em dia sem expediente bancário, pode pagar no primeiro dia útil seguinte."
    ancoras: ["dia útil subsequente a esta data"]
  - pergunta: "Quero cancelar o seguro, recebo alguma coisa de volta?"
    tipo: secao_longa
    esperado: "Pode cancelar a qualquer tempo; a seguradora retém o prêmio pela Tabela de Prazo Curto e devolve o restante."
    ancoras: ["a qualquer tempo, por iniciativa do Segurado", "Prêmio calculado de acordo com a Tabela de Prazo Curto"]
  - pergunta: "Quanto tempo vocês têm pra aceitar ou recusar minha proposta?"
    tipo: valor
    esperado: "A seguradora tem 15 dias para analisar a proposta (o prazo fica suspenso se pedir documentos ou vistoria)."
    ancoras: ["o prazo de 15 (quinze) dias"]
  - pergunta: "Perdi a chave do carro, a assistência manda chaveiro?"
    tipo: parafrase
    esperado: "Sim. A assistência envia chaveiro para abrir o veículo ou retirar chave quebrada."
    ancoras: ["um chaveiro para a abertura do veículo"]
  - pergunta: "Acabou a gasolina no meio da estrada, vocês ajudam?"
    tipo: parafrase
    esperado: "Sim. A assistência 24 horas atende pane seca (falta de combustível)."
    ancoras: ["Pane Seca (Falta de Combustível)"]
  - pergunta: "Se eu trocar do plano de 200 km pro de 500 km já vale na hora?"
    tipo: valor
    esperado: "Não. A mudança do Plano 1 (200 km) para o Plano 2 (500 km) tem carência de 3 dias úteis."
    ancoras: ["carência de 3 (três) dias úteis"]
  - pergunta: "Quais coberturas básicas eu posso contratar pro meu carro?"
    tipo: secao_longa
    esperado: "Cobertura 1 Compreensiva (colisão, incêndio e roubo/furto), Cobertura 2 (só roubo/furto total) ou Cobertura 4 (roubo/furto e colisão total)."
    ancoras: ["Colisão, Incêndio e Roubo/Furto (Compreensiva)"]
  - pergunta: "Roubaram meu carro e ele tem rastreador, o que eu faço?"
    tipo: secao_longa
    esperado: "Registrar na polícia e acionar logo a empresa do rastreador pelos telefones da seguradora para bloquear e localizar o veículo."
    ancoras: ["ACIONAR, TÃO LOGO POSSÍVEL, A EMPRESA PRESTADORA"]
  - pergunta: "O seguro cobre se eu bater no carro de outra pessoa?"
    tipo: parafrase
    esperado: "Sim, se tiver contratado a RCF-V (responsabilidade civil), que cobre danos materiais, corporais e morais a terceiros."
    ancoras: ["para danos causados a terceiros"]
  - pergunta: "Meu carro foi pro pátio e não teve cobertura, quanto tempo eu tenho pra tirar ele de lá?"
    tipo: valor
    esperado: "Até 7 dias da comunicação; depois a seguradora pode mandar o veículo para pátio público."
    ancoras: ["prazo de até 7 (sete) dias da comunicação"]
  - pergunta: "Se o carro quebrar longe, vocês pagam um táxi pra eu voltar pra casa?"
    tipo: parafrase
    esperado: "Sim. A assistência disponibiliza táxi para o retorno do segurado, dentro do limite do plano."
    ancoras: ["será disponibilizado serviço de taxi"]
  - pergunta: "Quanto fica o seguro de um Onix 2022 pra mim?"
    tipo: fora
    fora: true
  - pergunta: "Vocês fazem seguro residencial também?"
    tipo: fora
    fora: true
  - pergunta: "Qual o horário de atendimento da loja de vocês?"
    tipo: fora
    fora: true
  - pergunta: "Vocês fazem seguro pra celular?"
    tipo: fora
    fora: true
  - pergunta: "Qual o endereço da corretora em Campinas?"
    tipo: fora
    fora: true
  - pergunta: "Se eu bater o carro bêbado o seguro paga?"
    tipo: secao_longa
    esperado: "Não, se ficar provado que a embriaguez ou o efeito de substâncias tóxicas do condutor causou o acidente. Vale para qualquer pessoa que estiver dirigindo, com ou sem o consentimento do segurado."
    ancoras: ["Se for comprovado que o veículo segurado foi conduzido", "abrange não só os atos praticados diretamente pelo Segurado"]
  - pergunta: "Mandei arrumar o carro na oficina do meu cunhado antes de avisar vocês, tem problema?"
    tipo: parafrase
    esperado: "Tem. Fazer reparos no veículo ou acordos com terceiros sem a avaliação e aprovação prévia da seguradora faz o segurado perder o direito à indenização."
    ancoras: ["Se forem efetuados reparos no veículo segurado ou acordos"]
  - pergunta: "e se eu esconder alguma coisa na hora de fazer o seguro?"
    tipo: secao_longa
    esperado: "Se for de propósito (declaração inexata ou omissão), perde a indenização, a apólice é cancelada sem devolução do prêmio e ainda paga o prêmio vencido. Se for sem querer (culpa), a garantia é reduzida proporcionalmente ao prêmio que seria devido."
    ancoras: ["fizer declarações inexatas ou omitir circunstâncias", "Se o descumprimento do dever de informar se der de forma culposa"]
  - pergunta: "No roubo, preciso levar mais algum papel da polícia além do BO?"
    tipo: fato_simples
    esperado: "Sim. Em caso de roubo/furto também é pedido o Auto de entrega, além do Boletim de Ocorrência e demais documentos listados."
    ancoras: ["Em caso de roubo/furto: Auto de entrega"]
  - pergunta: "O guincho me levou mais longe que o plano cobre, quem paga o resto?"
    tipo: secao_longa
    esperado: "A diferença é por conta do segurado, que combina o valor e paga direto ao prestador. A quilometragem extra conta ida e volta."
    ancoras: ["o valor adicional será de inteira responsabilidade do Segurado", "considera percurso adicional de ida e volta"]
  - pergunta: "O táxi da assistência vale se eu quebrar a 200 km de casa?"
    tipo: valor
    esperado: "Não. O serviço de táxi vale para pane, acidente ou manutenção na cidade de domicílio ou em raio de até 50 km, e é limitado ao valor da apólice."
    ancoras: ["em raio de até 50KM, será disponibilizado serviço de taxi"]
  - pergunta: "Meu som e a tela multimídia que instalei no carro estão cobertos?"
    tipo: secao_longa
    esperado: "Por padrão não: bens e acessórios instalados no veículo ficam excluídos. Só entram se contratar a cobertura adicional de carroçarias, acessórios e/ou equipamentos, com prêmio adicional, e estiverem identificados na apólice."
    ancoras: ["Quaisquer bens ou acessórios no interior ou instalados no veículo", "acessórios e/ou equipamentos identificados na apólice"]
  - pergunta: "A partir de quanto de estrago o carro vira perda total?"
    tipo: valor
    esperado: "A partir de 75% (dano igual ou maior que 75% do valor determinado ou do valor de mercado referenciado, com o fator de ajuste; o documento também fala em 75% do Limite Máximo de Indenização) a indenização é integral."
    ancoras: ["menor que 75% (setenta e cinco por cento) do Valor Determinado"]
  - pergunta: "se eu ficar surdo de um ouvido quanto da indenização eu levo?"
    tipo: tabela_linha
    esperado: "Surdez total incurável de um dos ouvidos paga 20% do capital segurado (tabela de invalidez permanente por acidente)."
    ancoras: ["Surdez total incurável de um dos ouvidos"]
  - pergunta: "Se eu perder o movimento de um braço inteiro, quanto % do capital eu recebo?"
    tipo: tabela_linha
    esperado: "Perda total do uso de um dos membros superiores paga 70% do capital segurado na tabela de invalidez permanente por acidente."
    ancoras: ["Perda total do uso de um dos membros superiores"]
  - pergunta: "Se eu travar o ombro e não mexer mais, é quanto % do capital?"
    tipo: tabela_linha
    esperado: "Anquilose total de um dos ombros paga 25% do capital segurado."
    ancoras: ["Anquilose total de um dos ombros"]
  - pergunta: "Fraturei a mandíbula e não colou, quanto pagam?"
    tipo: tabela_linha
    esperado: "Fratura não consolidada do maxilar inferior paga 20% do capital segurado."
    ancoras: ["Fratura não consolidada do maxilar inferior"]
  - pergunta: "O seguro paga carro reserva enquanto o meu fica na oficina?"
    tipo: fora
    fora: true
  - pergunta: "Quebrou o parabrisa, vocês trocam? Quanto custa?"
    tipo: fora
    fora: true
  - pergunta: "Qual é o valor da minha franquia?"
    tipo: fora
    fora: true
